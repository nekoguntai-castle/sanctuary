# Sanctuary Alert Rules
#
# Prometheus alerting rules for the Sanctuary Bitcoin wallet application.
# These rules detect common problems and trigger notifications.

groups:
  - name: sanctuary.http
    interval: 30s
    rules:
      # High error rate (5xx responses)
      - alert: HighErrorRate
        expr: |
          sum(rate(sanctuary_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(sanctuary_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Very high error rate - critical
      - alert: CriticalErrorRate
        expr: |
          sum(rate(sanctuary_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(sanctuary_http_requests_total[5m])) > 0.20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical HTTP error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 20%)"

      # High latency (P95 > 2s)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(sanctuary_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "P95 latency is {{ $value | humanizeDuration }}"

  - name: sanctuary.wallet
    interval: 30s
    rules:
      # Wallet sync failures
      - alert: WalletSyncFailures
        expr: |
          sum(rate(sanctuary_wallet_syncs_total{status="failure"}[10m]))
          / clamp_min(sum(rate(sanctuary_wallet_syncs_total[10m])), 1e-9) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated wallet sync failure rate"
          description: "{{ $value | humanizePercentage }} of wallet syncs are failing"

      # Transaction broadcast failures
      - alert: TransactionBroadcastFailures
        expr: |
          sum(rate(sanctuary_transaction_broadcasts_total{status="failure"}[10m]))
          / sum(rate(sanctuary_transaction_broadcasts_total[10m])) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Transaction broadcast failures detected"
          description: "{{ $value | humanizePercentage }} of broadcasts are failing"

  - name: sanctuary.infrastructure
    interval: 30s
    rules:
      # Electrum pool unhealthy
      - alert: ElectrumPoolUnhealthy
        expr: sum(sanctuary_electrum_server_healthy) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No healthy Electrum connections"
          description: "No Electrum servers report healthy. Current healthy count: {{ $value }}"

      # Electrum pool degraded
      - alert: ElectrumPoolDegraded
        expr: |
          sum(sanctuary_electrum_server_healthy) / count(sanctuary_electrum_server_healthy) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Electrum pool degraded"
          description: "{{ $value | humanizePercentage }} of Electrum servers are healthy (threshold: 50%)"

      # High database query latency
      - alert: HighDatabaseLatency
        expr: |
          histogram_quantile(0.95, sum(rate(sanctuary_db_query_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database query latency"
          description: "P95 database query time is {{ $value | humanizeDuration }}"

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          sum(rate(sanctuary_cache_operations_total{result="hit"}[10m]))
          / sum(rate(sanctuary_cache_operations_total{type="get"}[10m])) < 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"

  - name: sanctuary.sync
    interval: 30s
    rules:
      # Sync service fell back to in-process polling (worker unhealthy)
      - alert: SyncInProcessFallback
        expr: |
          increase(sanctuary_sync_polling_mode_transitions_total{to="in-process"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sync service running in-process fallback mode"
          description: "Worker appears unhealthy — API server is handling polling directly. Check worker health."

  # Remote-heavy stages have a five-minute budget plus 30 seconds of grace.
  # Every other stage is bounded by the 30-minute attempt maximum plus the same grace.
  - name: sanctuary.wallet-sync-execution
    interval: 30s
    rules:
      - alert: WalletSyncActiveStageOverBudget
        expr: |
          max by (stage, mode, network) (
            sanctuary_wallet_sync_active_stage_oldest_seconds{
              stage=~"initial_network|address_history|candidate_fetch|parent_fetch|timestamp_fetch"
            }
          ) > 330
          or
          max by (stage, mode, network) (
            sanctuary_wallet_sync_active_stage_oldest_seconds{
              stage!~"initial_network|address_history|candidate_fetch|parent_fetch|timestamp_fetch"
            }
          ) > 1830
        labels:
          severity: warning
        annotations:
          summary: "Wallet sync stage exceeded its execution budget"
          description: "Stage {{ $labels.stage }} has remained active for {{ $value | humanizeDuration }}."

      - alert: WalletSyncAbortGraceExhausted
        expr: increase(sanctuary_wallet_sync_abort_grace_exhausted_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Wallet sync did not settle during abort grace"
          description: "At least one wallet sync remained unsettled after cancellation grace."

      - alert: WalletSyncLockOwnershipLost
        expr: sum by (scope, loss) (increase(sanctuary_wallet_sync_lock_loss_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Wallet sync lock ownership was lost"
          description: "A {{ $labels.scope }} lock reported {{ $labels.loss }}."

      - alert: WalletSyncCleanupError
        expr: increase(sanctuary_wallet_sync_cleanup_total{outcome="error"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Wallet sync cleanup failed"
          description: "Stale wallet reconciliation reported a cleanup error."

      # Conservative until canary evidence supports a tighter timeout threshold.
      - alert: WalletSyncRepeatedTimeouts
        expr: sum(increase(sanctuary_wallet_sync_terminal_total{outcome="timeout"}[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Repeated wallet sync timeouts"
          description: "At least three wallet sync attempts timed out within 15 minutes."

  - name: sanctuary.websocket
    interval: 30s
    rules:
      # WebSocket connection spike
      - alert: WebSocketConnectionSpike
        expr: |
          sanctuary_websocket_connections > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket connection count"
          description: "{{ $value }} concurrent WebSocket connections"

      # No WebSocket connections (potential issue)
      - alert: NoWebSocketConnections
        expr: sanctuary_websocket_connections == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "No active WebSocket connections"
          description: "No clients connected via WebSocket for 10 minutes"
