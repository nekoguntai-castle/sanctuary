# =============================================
# Sanctuary - Monitoring Stack
# =============================================
#
# Optional monitoring services for production deployments.
# Provides centralized logging, metrics, alerting, and distributed tracing.
#
# Usage:
#   ./start.sh --with-monitoring
#
# Access:
#   - Monitoring ports bind to 127.0.0.1 by default. Set
#     MONITORING_BIND_ADDR=0.0.0.0 only behind a firewall or authenticated proxy.
#   - Grafana: http://127.0.0.1:3000 (admin / GRAFANA_PASSWORD)
#   - Prometheus: http://127.0.0.1:9090 (no auth)
#   - Jaeger UI: http://127.0.0.1:16686 (no auth)
#   - Loki: http://127.0.0.1:3100 (internal, no auth)
#   - Promtail: Collects logs automatically
#
# Environment Variables:
#   - MONITORING_BIND_ADDR: Host interface for monitoring ports (default: 127.0.0.1)
#   - GRAFANA_PASSWORD: Required independent Grafana admin password
#   - GRAFANA_ANONYMOUS_ENABLED: Set to "true" to allow viewing dashboards without login
#   - GRAFANA_PORT, PROMETHEUS_PORT, ALERTMANAGER_PORT, JAEGER_UI_PORT, LOKI_PORT:
#     Override host ports when defaults are already allocated.
#   - JAEGER_OTLP_GRPC_PORT, JAEGER_OTLP_HTTP_PORT:
#     Override Jaeger OTLP ingestion host ports when defaults are already allocated.
#   - *_CONTAINER_NAME:
#     Override monitoring container names when multiple monitoring-enabled stacks
#     need to run on the same host.
#
# =============================================

services:
  # ============================================
  # Jaeger - Distributed Tracing
  # ============================================
  # Collects and visualizes distributed traces.
  # Receives traces via OTLP protocol from backend.
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:1.53@sha256:60e65bfffe1f66aee96d6fc8b6bf65afd42016be5dcc09d2e15d8462f7d9409c
    container_name: ${JAEGER_CONTAINER_NAME:-sanctuary-jaeger}
    restart: "${SANCTUARY_RESTART_POLICY:-unless-stopped}"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"    # Jaeger UI
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${JAEGER_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${JAEGER_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    networks:
      - sanctuary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ============================================
  # Loki - Log Aggregation
  # ============================================
  # Stores and indexes logs from all containers.
  # Query logs via Grafana or Loki API.
  # ============================================
  loki:
    image: grafana/loki:2.9.0@sha256:b025a0220f390baaab01578aea2fe0ba677584d9f248c3fe5af15f84dd1de60d
    container_name: ${LOKI_CONTAINER_NAME:-sanctuary-loki}
    restart: "${SANCTUARY_RESTART_POLICY:-unless-stopped}"
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
      - ${SANCTUARY_MONITORING_CONFIG_DIR:-./docker/monitoring}/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sanctuary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Promtail - Log Collection Agent
  # ============================================
  # Collects logs from Docker containers and ships to Loki.
  # Automatically discovers containers via Docker socket.
  # ============================================
  promtail:
    image: grafana/promtail:3.5.0@sha256:507dfecd2f0949475d071c124bea1c26fc4f8c1cff0372eee57478d5b1c5fbff
    container_name: ${PROMTAIL_CONTAINER_NAME:-sanctuary-promtail}
    restart: "${SANCTUARY_RESTART_POLICY:-unless-stopped}"
    depends_on:
      - loki
    volumes:
      # promtail discovers containers through the Docker API (docker_sd_configs
      # against this socket) and streams their logs from it. It never reads
      # /var/lib/docker/containers, so that directory is not mounted: it served
      # nothing, and on a rootless host /var/lib/docker cannot be created, which
      # aborted the whole compose up.
      - ${SANCTUARY_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${SANCTUARY_MONITORING_CONFIG_DIR:-./docker/monitoring}/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sanctuary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "/bin/promtail", "-config.file=/etc/promtail/config.yml", "-check-syntax"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # Prometheus - Metrics Collection
  # ============================================
  # Scrapes metrics from backend /metrics endpoint.
  # Integrates with Grafana for visualization.
  # ============================================
  prometheus:
    image: prom/prometheus:v2.47.0@sha256:c5dd3503828713c4949ae1bccd1d8d69f382c33d441954674a6b78ebe69c3331
    container_name: ${PROMETHEUS_CONTAINER_NAME:-sanctuary-prometheus}
    restart: "${SANCTUARY_RESTART_POLICY:-unless-stopped}"
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${SANCTUARY_MONITORING_CONFIG_DIR:-./docker/monitoring}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SANCTUARY_MONITORING_CONFIG_DIR:-./docker/monitoring}/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - sanctuary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Grafana - Visualization & Dashboards
  # ============================================
  # Pre-configured with Loki datasource and Sanctuary dashboards.
  # Default login: admin / sanctuary
  # ============================================
  # ============================================
  # Alertmanager - Alert Routing & Deduplication
  # ============================================
  # Receives alerts from Prometheus and routes to
  # configured receivers (Telegram, email, webhook).
  # Configure receivers in alertmanager.yml.
  # ============================================
  alertmanager:
    image: prom/alertmanager:v0.26.0@sha256:361db356b33041437517f1cd298462055580585f26555c317df1a3caf2868552
    container_name: ${ALERTMANAGER_CONTAINER_NAME:-sanctuary-alertmanager}
    restart: "${SANCTUARY_RESTART_POLICY:-unless-stopped}"
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ${SANCTUARY_MONITORING_CONFIG_DIR:-./docker/monitoring}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - sanctuary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # Backend Extension - Enable Tracing
  # ============================================
  # Extends the backend service with OpenTelemetry config
  # when monitoring stack is enabled.
  # ============================================
  backend:
    environment:
      # OpenTelemetry Tracing Configuration
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: sanctuary-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http
    depends_on:
      jaeger:
        condition: service_healthy

  grafana-password-migration:
    image: sanctuary-grafana-migration:${SANCTUARY_IMAGE_TAG:-local}
    build:
      context: ${SANCTUARY_PROJECT_DIR:-.}
      dockerfile: docker/grafana-migration/Dockerfile
      args:
        SANCTUARY_SOURCE_COMMIT: ${SANCTUARY_SOURCE_COMMIT:-unknown}
        SANCTUARY_IMAGE_LOCK_SHA256: ${SANCTUARY_IMAGE_LOCK_SHA256:-unknown}
    restart: "no"
    environment:
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      SANCTUARY_GRAFANA_CONTROL_DIR: /var/lib/sanctuary-grafana-control
      SANCTUARY_GRAFANA_QUIESCENCE_TOKEN: ${SANCTUARY_GRAFANA_QUIESCENCE_TOKEN:-}
      SANCTUARY_GRAFANA_QUIESCENCE_PROJECT: ${SANCTUARY_GRAFANA_QUIESCENCE_PROJECT:-}
      SANCTUARY_GRAFANA_DATA_VOLUME: ${SANCTUARY_GRAFANA_DATA_VOLUME:-}
      SANCTUARY_GRAFANA_CONTROL_VOLUME: ${SANCTUARY_GRAFANA_CONTROL_VOLUME:-}
      SANCTUARY_GRAFANA_QUIESCENCE_CONTAINER_ID: ${SANCTUARY_GRAFANA_QUIESCENCE_CONTAINER_ID:-}
      SANCTUARY_GRAFANA_QUIESCENCE_GENERATION: ${SANCTUARY_GRAFANA_QUIESCENCE_GENERATION:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_quiescence:/var/lib/sanctuary-grafana-control

  grafana:
    image: grafana/grafana:10.2.0@sha256:1ee0c54286b8ca09a3dd1419ff8653e7780a148a006ac088544203bb0affe550
    container_name: ${GRAFANA_CONTAINER_NAME:-sanctuary-grafana}
    restart: "${SANCTUARY_RESTART_POLICY:-unless-stopped}"
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      grafana-password-migration:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      # Anonymous access - allows viewing dashboards without login
      # Set GRAFANA_ANONYMOUS_ENABLED=true in .env to enable
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${MONITORING_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ${SANCTUARY_MONITORING_CONFIG_DIR:-./docker/monitoring}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${SANCTUARY_MONITORING_CONFIG_DIR:-./docker/monitoring}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - sanctuary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  loki_data:
    driver: local
  grafana_data:
    driver: local
  grafana_quiescence:
    driver: local
  promtail_positions:
    driver: local
  prometheus_data:
    driver: local
  jaeger_data:
    driver: local
