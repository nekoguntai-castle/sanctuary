# =============================================
# Sanctuary - Docker Compose for Testing
# =============================================
#
# Run tests in Docker for environment consistency.
# This ensures tests run the same way locally as in CI.
#
# Usage:
#   # Run all tests
#   npm run test:docker
#
#   # Run backend tests only
#   npm run test:docker:backend
#
#   # Run frontend tests only
#   npm run test:docker:frontend
#
#   # Run with coverage
#   npm run test:docker:coverage
#
#   # Clean up
#   The package commands above use the signed cleanup coordinator; do not run
#   direct Compose teardown commands for these resources.
#
# =============================================

x-sanctuary-container-ownership: &sanctuary-container-ownership
  io.sanctuary.project: ${SANCTUARY_PROJECT:?SANCTUARY_PROJECT is required}
  io.sanctuary.deployment-id: ${SANCTUARY_DEPLOYMENT_ID:?SANCTUARY_DEPLOYMENT_ID is required}
  io.sanctuary.owner-id: ${SANCTUARY_OWNER_ID:?SANCTUARY_OWNER_ID is required}
  io.sanctuary.resource-class: compose_container
  io.sanctuary.lifecycle: test
  io.sanctuary.cleanup-policy: exact_delete
  io.sanctuary.created-at: ${SANCTUARY_CLEANUP_CREATED_AT:?SANCTUARY_CLEANUP_CREATED_AT is required}
  io.sanctuary.created-by-release: ${SANCTUARY_RELEASE:?SANCTUARY_RELEASE is required}
  io.sanctuary.created-by-commit: ${SANCTUARY_COMMIT:?SANCTUARY_COMMIT is required}
  io.sanctuary.creation-run-id: ${SANCTUARY_OPERATION_RUN_ID:?SANCTUARY_OPERATION_RUN_ID is required}
  # sanctuary#1036 / runner-infra#37: see docker-compose.yml for the contract.
  io.runner-infra.owner-container: ${SANCTUARY_CI_OWNER_CONTAINER:-}

x-sanctuary-network-ownership: &sanctuary-network-ownership
  <<: *sanctuary-container-ownership
  io.sanctuary.resource-class: compose_network

services:
  # ============================================
  # Test Database
  # ============================================
  test-db:
    labels: *sanctuary-container-ownership
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: sanctuary_test
    ports:
      - "${TEST_POSTGRES_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d sanctuary_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      test-network:
        aliases: [postgres]
    # tmpfs for faster tests (data doesn't persist)
    tmpfs:
      - /var/lib/postgresql/data

  # ============================================
  # Backend Tests
  # ============================================
  backend-test:
    labels: *sanctuary-container-ownership
    image: sanctuary-backend-test:${SANCTUARY_IMAGE_TAG:-unprepared}
    build:
      context: .
      dockerfile: docker/test/backend.Dockerfile
      args:
        SANCTUARY_SOURCE_COMMIT: ${SANCTUARY_SOURCE_COMMIT:-}
        SANCTUARY_IMAGE_LOCK_SHA256: ${SANCTUARY_IMAGE_LOCK_SHA256:-}
        SANCTUARY_BUILD_VERSION: ${SANCTUARY_VERSION:-}
        SANCTUARY_BUILD_ID: ${SANCTUARY_BUILD_ID:-}
    working_dir: /repo/server
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/sanctuary_test?schema=public
      TEST_DATABASE_URL: postgresql://test:test@postgres:5432/sanctuary_test?schema=public
      JWT_SECRET: test-jwt-secret-for-docker-testing
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!
      NODE_ENV: test
      SANCTUARY_BACKEND_SOURCE_SHA: ${SANCTUARY_BACKEND_SOURCE_SHA:-unprepared}
    volumes:
      - type: bind
        source: ${SANCTUARY_BACKEND_GIT_OBJECTS:-/nonexistent-sanctuary-git-objects}
        target: /git-objects
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SANCTUARY_BACKEND_TEST_OUTPUT:-/nonexistent-sanctuary-test-output}
        target: /test-output
        bind:
          create_host_path: false
    command: [bash, /repo/scripts/ci/backend-docker-test.sh, full]
    networks:
      - test-network

  backend-coverage:
    labels: *sanctuary-container-ownership
    image: sanctuary-backend-test:${SANCTUARY_IMAGE_TAG:-unprepared}
    build:
      context: .
      dockerfile: docker/test/backend.Dockerfile
      args:
        SANCTUARY_SOURCE_COMMIT: ${SANCTUARY_SOURCE_COMMIT:-}
        SANCTUARY_IMAGE_LOCK_SHA256: ${SANCTUARY_IMAGE_LOCK_SHA256:-}
        SANCTUARY_BUILD_VERSION: ${SANCTUARY_VERSION:-}
        SANCTUARY_BUILD_ID: ${SANCTUARY_BUILD_ID:-}
    working_dir: /repo/server
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/sanctuary_test?schema=public
      TEST_DATABASE_URL: postgresql://test:test@postgres:5432/sanctuary_test?schema=public
      JWT_SECRET: test-jwt-secret-for-docker-testing
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!
      NODE_ENV: test
      SANCTUARY_BACKEND_SOURCE_SHA: ${SANCTUARY_BACKEND_SOURCE_SHA:-unprepared}
    volumes:
      - type: bind
        source: ${SANCTUARY_BACKEND_GIT_OBJECTS:-/nonexistent-sanctuary-git-objects}
        target: /git-objects
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SANCTUARY_BACKEND_TEST_OUTPUT:-/nonexistent-sanctuary-test-output}
        target: /test-output
        bind:
          create_host_path: false
    command: [bash, /repo/scripts/ci/backend-docker-test.sh, unit-coverage]
    networks:
      - test-network

  # ============================================
  # Frontend Tests
  # ============================================
  frontend-test:
    labels: *sanctuary-container-ownership
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run test:run
    networks:
      - test-network

  # ============================================
  # Frontend Tests with Coverage
  # ============================================
  frontend-coverage:
    labels: *sanctuary-container-ownership
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run test:coverage
    networks:
      - test-network

  # ============================================
  # Run All Tests
  # ============================================
  test-all:
    labels: *sanctuary-container-ownership
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    depends_on:
      backend-test:
        condition: service_completed_successfully
      frontend-test:
        condition: service_completed_successfully
    command: echo "All tests passed!"
    networks:
      - test-network

networks:
  test-network:
    labels: *sanctuary-network-ownership
    driver: bridge
