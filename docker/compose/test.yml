# =============================================
# Sanctuary - Docker Compose for Testing
# =============================================
#
# Run tests in Docker for environment consistency.
# This ensures tests run the same way locally as in CI.
#
# Usage:
#   # Run all tests
#   docker compose --project-directory . -f docker/compose/test.yml run --rm test-all
#
#   # Run backend tests only
#   docker compose --project-directory . -f docker/compose/test.yml run --rm backend-test
#
#   # Run frontend tests only
#   docker compose --project-directory . -f docker/compose/test.yml run --rm frontend-test
#
#   # Run with coverage
#   docker compose --project-directory . -f docker/compose/test.yml run --rm backend-coverage
#   docker compose --project-directory . -f docker/compose/test.yml run --rm frontend-coverage
#
#   # Clean up
#   docker compose --project-directory . -f docker/compose/test.yml down -v
#
# =============================================

services:
  # ============================================
  # Test Database
  # ============================================
  test-db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: sanctuary_test
    ports:
      - "${TEST_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d sanctuary_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network
    # tmpfs for faster tests (data doesn't persist)
    tmpfs:
      - /var/lib/postgresql/data

  # ============================================
  # Backend Tests
  # ============================================
  backend-test:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: deps
    working_dir: /app
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://test:test@test-db:5432/sanctuary_test?schema=public
      JWT_SECRET: test-jwt-secret-for-docker-testing
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!
      NODE_ENV: test
    volumes:
      - ./server/src:/app/src:ro
      - ./server/tests:/app/tests:ro
      - ./server/jest.config.js:/app/jest.config.js:ro
      - ./server/tsconfig.json:/app/tsconfig.json:ro
      - ./server/prisma:/app/prisma:ro
      - ./shared:/shared:ro
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm test -- --ci
      "
    networks:
      - test-network

  # ============================================
  # Backend Tests with Coverage
  # ============================================
  backend-coverage:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: deps
    working_dir: /app
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://test:test@test-db:5432/sanctuary_test?schema=public
      JWT_SECRET: test-jwt-secret-for-docker-testing
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!
      NODE_ENV: test
    volumes:
      - ./server/src:/app/src:ro
      - ./server/tests:/app/tests:ro
      - ./server/jest.config.js:/app/jest.config.js:ro
      - ./server/tsconfig.json:/app/tsconfig.json:ro
      - ./server/prisma:/app/prisma:ro
      - ./server/coverage:/app/coverage
      - ./shared:/shared:ro
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run test:coverage -- --ci
      "
    networks:
      - test-network

  # ============================================
  # Frontend Tests
  # ============================================
  frontend-test:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run test:run
    networks:
      - test-network

  # ============================================
  # Frontend Tests with Coverage
  # ============================================
  frontend-coverage:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run test:coverage
    networks:
      - test-network

  # ============================================
  # Run All Tests
  # ============================================
  test-all:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    depends_on:
      backend-test:
        condition: service_completed_successfully
      frontend-test:
        condition: service_completed_successfully
    command: echo "All tests passed!"
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
