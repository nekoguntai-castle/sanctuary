# Tor Payjoin ingress template (docker/compose/tor.yml). The frontend image's
# docker-entrypoint.sh renders it (NGINX_CONFIG_TEMPLATE), filling in the
# backend host and port and the container DNS resolver, so a recreated backend
# is re-resolved within seconds instead of pinned to its old IP (#967).
upstream payjoin_backend {
    zone payjoin_backend 64k;
    resolver ${NGINX_DNS_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${BACKEND_HOST}:${BACKEND_PORT} resolve;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    client_max_body_size 100k;
    error_page 413 = @payjoin_body_rejected;

    location @payjoin_body_rejected {
        default_type text/plain;
        return 413 "original-psbt-rejected";
    }

    location ~ "^/api/v1/payjoin/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        if ($request_method != POST) {
            return 404;
        }

        proxy_pass http://payjoin_backend;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host payjoin-ingress;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 404;
    }
}

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 404;
    }
}
