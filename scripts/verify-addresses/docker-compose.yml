# Five exact Bitcoin Core chain environments used by the address verifier.
# Keep the digest and VERIFY_ADDRESSES_CORE_IMAGE in verify-repeatable.sh in sync.

x-bitcoin-core: &bitcoin-core
  image: bitcoin/bitcoin:29.0@sha256:a6aa8a9e349b4108d13c558dbe43064057bd7b6474b858966884f9cb95b7ed78
  restart: "no"
  tmpfs:
    - /home/bitcoin/.bitcoin

services:
  core-mainnet:
    <<: *bitcoin-core
    command:
      - -server=1
      - -rpcport=18443
      - -rpcuser=${BITCOIN_RPC_USER:?}
      - -rpcpassword=${BITCOIN_RPC_PASS:?}
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -listen=0
      - -connect=0
      - -dnsseed=0
      - -discover=0
      - -printtoconsole=1
      - -uacomment=${VERIFY_ADDRESSES_CORE_IDENTITY:?}
      - -chain=main
    ports:
      - "${BITCOIN_RPC_PORT_MAINNET:-19440}:18443"
    healthcheck:
      test: [CMD, bitcoin-cli, -chain=main, -rpcport=18443, "-rpcuser=${BITCOIN_RPC_USER:?required}", "-rpcpassword=${BITCOIN_RPC_PASS:?required}", getblockchaininfo]
      interval: 5s
      timeout: 10s
      retries: 12

