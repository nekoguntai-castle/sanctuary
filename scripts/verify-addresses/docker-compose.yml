# Bitcoin Core container for address verification
# Used to generate reference addresses via deriveaddresses RPC
#
# See bitcoincore.ts for RPC configuration

services:
  bitcoind:
    image: bitcoin/bitcoin:27.0
    container_name: bitcoin-core-address-verify
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=verify
      - -rpcpassword=verify
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -fallbackfee=0.0001
      - -txindex=1
      - -printtoconsole=1
    ports:
      - "18443:18443"  # Regtest RPC
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=verify", "-rpcpassword=verify", "getblockchaininfo"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  bitcoind-data:
