# =============================================
# Sanctuary Bitcoin Wallet - Docker Compose (pre-built core images)
# =============================================
# Usage: Pull pre-built frontend/backend images from GHCR
#   IMAGE_TAG=v0.8.53 docker compose -f docker-compose.ghcr.yml up -d
#
# This is intentionally a reduced prebuilt-image overlay for the web
# core: frontend and backend. It does not include the source-built
# mobile gateway or llm-egress-proxy services; use docker-compose.yml
# or the offline bundle when those runtime isolation contracts are
# required.
#
# Required env:
#   IMAGE_TAG       e.g. v0.8.53. Pinned per release; no `:latest`.
#
# Optional env:
#   IMAGE_REGISTRY  default ghcr.io/nekoguntai-castle. Set to point
#                   at a private mirror or self-hosted Forgejo Packages.
# =============================================

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: sanctuary-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanctuary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-sanctuary}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sanctuary} -d ${POSTGRES_DB:-sanctuary}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sanctuary-network

  # ============================================
  # Redis (required for worker + backend coordination)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: sanctuary-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sanctuary-network

  # ============================================
  # Backend API Server (pre-built)
  # ============================================
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/nekoguntai-castle}/sanctuary-backend:${IMAGE_TAG:?IMAGE_TAG must be set, e.g. v0.8.53}
    container_name: sanctuary-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      API_URL: ${API_URL:-http://localhost:3001}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanctuary}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-sanctuary}?schema=public

      # Redis (required)
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379

      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # Encryption and internal auth (required)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (at least 32 chars)}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required}

      # Worker heartbeat (required)
      WORKER_HEALTH_URL: ${WORKER_HEALTH_URL:-http://worker:3002/ready}

      # Bitcoin Network
      BITCOIN_NETWORK: ${BITCOIN_NETWORK:-mainnet}

      # Electrum Server
      ELECTRUM_HOST: ${ELECTRUM_HOST:-electrum.blockstream.info}
      ELECTRUM_PORT: ${ELECTRUM_PORT:-50002}
      ELECTRUM_PROTOCOL: ${ELECTRUM_PROTOCOL:-ssl}

      # Price APIs
      MEMPOOL_API: ${MEMPOOL_API:-https://mempool.space/api/v1}
      COINGECKO_API: ${COINGECKO_API:-https://api.coingecko.com/api/v3}
      KRAKEN_API: ${KRAKEN_API:-https://api.kraken.com/0/public}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sanctuary-network

  # ============================================
  # Model Context Protocol Server (Optional)
  # ============================================
  # Read-only MCP endpoint for local LLM clients. Starts only with
  # the `mcp` Compose profile and is published to host loopback by default.
  # ============================================
  mcp:
    image: ${IMAGE_REGISTRY:-ghcr.io/nekoguntai-castle}/sanctuary-backend:${IMAGE_TAG:?IMAGE_TAG must be set, e.g. v0.8.53}
    container_name: sanctuary-mcp
    restart: unless-stopped
    profiles:
      - mcp
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATABASE_URL: postgresql://${POSTGRES_USER:-sanctuary}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-sanctuary}?schema=public&connection_limit=${DB_MCP_POOL_SIZE:-5}&pool_timeout=30&connect_timeout=10&statement_timeout=30000
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (at least 32 chars)}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required}

      BITCOIN_NETWORK: ${BITCOIN_NETWORK:-mainnet}
      MCP_ENABLED: "true"
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3003
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-120}
      MCP_DEFAULT_PAGE_SIZE: ${MCP_DEFAULT_PAGE_SIZE:-100}
      MCP_MAX_PAGE_SIZE: ${MCP_MAX_PAGE_SIZE:-500}
      MCP_MAX_DATE_RANGE_DAYS: ${MCP_MAX_DATE_RANGE_DAYS:-365}
    command: ["node", "dist/app/src/mcp-entry.js"]
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-3003}:3003"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3003/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sanctuary-network

  # ============================================
  # Background Worker (pre-built)
  # ============================================
  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/nekoguntai-castle}/sanctuary-backend:${IMAGE_TAG:?IMAGE_TAG must be set, e.g. v0.8.53}
    container_name: sanctuary-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATABASE_URL: postgresql://${POSTGRES_USER:-sanctuary}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-sanctuary}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379

      WORKER_HEALTH_PORT: 3002
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}

      BITCOIN_NETWORK: ${BITCOIN_NETWORK:-mainnet}
      ELECTRUM_HOST: ${ELECTRUM_HOST:-electrum.blockstream.info}
      ELECTRUM_PORT: ${ELECTRUM_PORT:-50002}
      ELECTRUM_PROTOCOL: ${ELECTRUM_PROTOCOL:-ssl}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (at least 32 chars)}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required}
    command: ["node", "dist/server/src/worker.js"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3002/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sanctuary-network

  # ============================================
  # Database Migrations & Seeding (one-time run)
  # ============================================
  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/nekoguntai-castle}/sanctuary-backend:${IMAGE_TAG:?IMAGE_TAG must be set, e.g. v0.8.53}
    container_name: sanctuary-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanctuary}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-sanctuary}?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    networks:
      - sanctuary-network
    restart: "no"

  # ============================================
  # Frontend (Nginx + React) (pre-built)
  # ============================================
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/nekoguntai-castle}/sanctuary-frontend:${IMAGE_TAG:?IMAGE_TAG must be set, e.g. v0.8.53}
    container_name: sanctuary-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 3001
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sanctuary-network

# ============================================
# Networks
# ============================================
networks:
  sanctuary-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
