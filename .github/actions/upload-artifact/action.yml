name: 'Upload artifact'
description: >-
  Provider-aware wrapper around the artifact-upload action. The inner `uses:`
  is currently pinned to the Forgejo artifact action because the workflows
  run on Forgejo Actions today.

  Porting back to GitHub Actions: change the inner `uses:` below to
  `actions/upload-artifact@v4` (one edit; every workflow callsite goes
  through this composite). GitHub Actions and Forgejo Actions disagree on
  the action URL format, so we cannot pick at runtime. Centralizing in this
  composite keeps the swap cost at one file.

  Forgejo 16 only supports its patched v4 artifact protocol. A live v6 canary
  on PR #642 reached blob upload but was rejected as unauthorized. Keep this
  exact v4 compatibility pin until Forgejo documents support for v6; do not
  replace the remaining Node 20 runtime exception with warning suppression.

  See also: tests/ci/check-provider-leaks.sh (Phase 7) which gates against
  re-introducing raw `uses: https://data.forgejo.org/...` lines outside of
  this directory.
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: A file, directory, or wildcard pattern that describes what to upload.
    required: true
  retention-days:
    description: 'Days to retain the artifact (provider default if unset).'
    required: false
    default: ''
  if-no-files-found:
    description: 'Behavior when no files match: warn | error | ignore.'
    required: false
    default: warn
  overwrite:
    description: 'Overwrite an existing artifact with the same name (true|false).'
    required: false
    default: 'false'
  include-hidden-files:
    description: 'Include hidden files (dotfiles, .npm-cache, etc.) in the artifact (true|false).'
    required: false
    default: 'false'
outputs:
  artifact-id:
    description: Unique identifier for the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Authenticated download URL for the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - name: Upload artifact
      id: upload
      uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
