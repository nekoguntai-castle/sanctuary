name: Verify cleanup receipt
description: Require and cryptographically verify signed planning and final cleanup upload receipts.
inputs:
  root:
    description: Cleanup artifact directory, or parent directory when children is true.
    required: true
  children:
    description: Verify every immediate child directory.
    required: false
    default: 'false'
  recursive:
    description: Verify every leaf directory beneath root.
    required: false
    default: 'false'
  require-cleanup-success:
    description: Require each final receipt to report cleaned, no_op, or recovered.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CLEANUP_RECEIPT_CHILDREN: ${{ inputs.children }}
        CLEANUP_RECEIPT_RECURSIVE: ${{ inputs.recursive }}
        CLEANUP_RECEIPT_REQUIRE_SUCCESS: ${{ inputs.require-cleanup-success }}
        CLEANUP_RECEIPT_ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        case "$CLEANUP_RECEIPT_CHILDREN" in
          true|false) ;;
          *) echo "children must be true or false" >&2; exit 1 ;;
        esac
        case "$CLEANUP_RECEIPT_RECURSIVE" in
          true|false) ;;
          *) echo "recursive must be true or false" >&2; exit 1 ;;
        esac
        if [ "$CLEANUP_RECEIPT_CHILDREN" = true ] && [ "$CLEANUP_RECEIPT_RECURSIVE" = true ]; then
          echo "children and recursive are mutually exclusive" >&2
          exit 1
        fi
        case "$CLEANUP_RECEIPT_REQUIRE_SUCCESS" in
          true|false) ;;
          *) echo "require-cleanup-success must be true or false" >&2; exit 1 ;;
        esac
        if [ "$CLEANUP_RECEIPT_RECURSIVE" = true ]; then
          artifact_mode=recursive
        elif [ "$CLEANUP_RECEIPT_CHILDREN" = true ]; then
          artifact_mode=children
        else
          artifact_mode=single
        fi
        node scripts/ownership/verify-ci-cleanup-upload.mjs \
          --artifact-root "$CLEANUP_RECEIPT_ROOT" \
          --artifact-mode "$artifact_mode" \
          --runtime-root "$RUNNER_TEMP/sanctuary-cleanup" \
          --checkout-root "$GITHUB_WORKSPACE" \
          --require-cleanup-success "$CLEANUP_RECEIPT_REQUIRE_SUCCESS"
