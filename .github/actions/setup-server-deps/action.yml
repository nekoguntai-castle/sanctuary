name: 'Setup server dependencies'
description: >-
  Installs server dependencies (npm ci with lifecycle scripts disabled) and
  runs Prisma generation through the repo-owned helper. Provider-agnostic.

  Caches `server/node_modules` keyed on the lockfile + Node version and
  `server/src/generated/prisma` keyed on the Prisma schema + lockfile so
  unrelated PRs skip both `npm ci` and `prisma generate` on cache hit.
runs:
  using: composite
  steps:
    # Cache key hashes BOTH package.json and package-lock.json. This way a
    # manual package.json edit without `npm install` (which would also update
    # the lockfile) still invalidates the cache, so `npm ci` re-runs and its
    # built-in package.json/package-lock.json desync validation can fire.
    # Without package.json in the key, a desync would slip through cache hit
    # and surface as a confusing "Cannot find module" at runtime instead of
    # the explicit npm ci error.
    # Phase B: under workspaces, npm hoists transitives to root node_modules.
    # Cache BOTH server/node_modules and root node_modules; cache key includes
    # root package.json + root package-lock.json so workspace dep changes
    # invalidate properly. Prefix bumped to -v3 to invalidate stale entries
    # captured before the workspace migration (which had a different layout).
    - name: Restore workspace node_modules cache
      id: cache-server-node-modules
      uses: ./.github/actions/cache
      with:
        path: |
          node_modules
          server/node_modules
          gateway/node_modules
          shared/dist
        key: ${{ runner.os }}-${{ runner.arch }}-workspace-node-modules-v3-node-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package.json', 'package-lock.json', 'server/package.json', 'gateway/package.json', 'shared/package.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-workspace-node-modules-v3-node-${{ hashFiles('.nvmrc') }}-

    - name: Restore server Prisma client cache
      id: cache-server-prisma
      uses: ./.github/actions/cache
      with:
        path: server/src/generated/prisma
        key: ${{ runner.os }}-${{ runner.arch }}-server-prisma-v3-${{ hashFiles('server/prisma/schema.prisma', 'package-lock.json', 'server/package.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-server-prisma-v3-

    - name: Setup server dependencies
      shell: bash
      env:
        SERVER_NODE_MODULES_CACHE_HIT: ${{ steps.cache-server-node-modules.outputs.cache-hit }}
        SERVER_PRISMA_CACHE_HIT: ${{ steps.cache-server-prisma.outputs.cache-hit }}
      run: ${{ github.workspace }}/scripts/ci/setup-server-dependencies.sh
