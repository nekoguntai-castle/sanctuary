name: 'Load test plan'
description: >-
  Runs scripts/ci/plan-test-run.sh and exposes the resulting JSON test plan
  to the calling job as step outputs. Replaces the legacy 19-output
  detect-changes job pattern with a single composite step.
inputs:
  event-name:
    description: 'Override the event name (defaults to provider-detected).'
    required: false
    default: ''
  base-sha:
    description: 'Override the base SHA passed to plan-test-run.sh.'
    required: false
    default: ''
  head-sha:
    description: 'Override the head SHA passed to plan-test-run.sh.'
    required: false
    default: ''
  pr-base-sha:
    description: 'Pull-request base SHA. Maps to PR_BASE_SHA.'
    required: false
    default: ''
  pr-head-sha:
    description: 'Pull-request head SHA. Maps to PR_HEAD_SHA.'
    required: false
    default: ''
  push-before-sha:
    description: 'Push event before-SHA. Maps to PUSH_BEFORE_SHA.'
    required: false
    default: ''
  merge-group-base-sha:
    description: 'Merge group base SHA. Maps to MERGE_GROUP_BASE_SHA.'
    required: false
    default: ''
  merge-group-head-sha:
    description: 'Merge group head SHA. Maps to MERGE_GROUP_HEAD_SHA.'
    required: false
    default: ''
  workflow-sha:
    description: 'Workflow SHA fallback. Maps to WORKFLOW_SHA.'
    required: false
    default: ''
  force-full:
    description: 'Force tier=full + coverage_required=true (overrides event).'
    required: false
    default: 'false'
outputs:
  path:
    description: 'Filesystem path to the rendered test-plan.json artifact.'
    value: ${{ steps.plan.outputs.path }}
  tier:
    description: 'Resolved tier (quick / full / nightly).'
    value: ${{ steps.plan.outputs.tier }}
  coverage_required:
    description: 'Whether coverage thresholds are enforced this run (true/false).'
    value: ${{ steps.plan.outputs.coverage_required }}
  full_scan:
    description: 'Whether every lane runs unconditionally (true/false).'
    value: ${{ steps.plan.outputs.full_scan }}
  lanes:
    description: 'JSON object: lane → { run, files }.'
    value: ${{ steps.plan.outputs.lanes }}
runs:
  using: composite
  steps:
    - name: Plan test run
      id: plan
      shell: bash
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        PR_BASE_SHA: ${{ inputs.pr-base-sha }}
        PR_HEAD_SHA: ${{ inputs.pr-head-sha }}
        PUSH_BEFORE_SHA: ${{ inputs.push-before-sha }}
        MERGE_GROUP_BASE_SHA: ${{ inputs.merge-group-base-sha }}
        MERGE_GROUP_HEAD_SHA: ${{ inputs.merge-group-head-sha }}
        WORKFLOW_SHA: ${{ inputs.workflow-sha }}
        SANCTUARY_PLAN_FORCE_FULL: ${{ inputs.force-full }}
        SANCTUARY_PLAN_BASE_SHA: ${{ inputs.base-sha }}
        SANCTUARY_PLAN_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        plan_dir="${RUNNER_TEMP:-/tmp}/sanctuary-test-plan-${GITHUB_RUN_ID:-local}"
        mkdir -p "$plan_dir"
        plan_path="$plan_dir/test-plan.json"

        cli_args=()
        if [ -n "${SANCTUARY_PLAN_BASE_SHA:-}" ]; then
          cli_args+=(--base "$SANCTUARY_PLAN_BASE_SHA")
        fi
        if [ -n "${SANCTUARY_PLAN_HEAD_SHA:-}" ]; then
          cli_args+=(--head "$SANCTUARY_PLAN_HEAD_SHA")
        fi
        if [ "${SANCTUARY_PLAN_FORCE_FULL:-false}" = "true" ]; then
          cli_args+=(--full)
        fi

        bash "${{ github.workspace }}/scripts/ci/plan-test-run.sh" "${cli_args[@]}" \
          | tee "$plan_path"

        # Extract scalar outputs the calling job can gate on.
        node - "$plan_path" >> "$GITHUB_OUTPUT" <<'NODE'
        const fs = require('node:fs');
        const path = process.argv[2];
        const plan = JSON.parse(fs.readFileSync(path, 'utf8'));
        function emit(k, v) { process.stdout.write(`${k}=${v}\n`); }
        emit('path', path);
        emit('tier', plan.tier);
        emit('coverage_required', plan.coverage_required);
        emit('full_scan', plan.full_scan);
        emit('lanes', JSON.stringify(plan.lanes));
        NODE
