name: 'Download artifact'
description: >-
  Provider-aware wrapper around the artifact-download action. The inner
  `uses:` is currently pinned to the Forgejo artifact action because the
  workflows run on Forgejo Actions today.

  Porting back to GitHub Actions: change the inner `uses:` below to
  `actions/download-artifact@v4`.

  Forgejo 16 only supports its patched v4 artifact protocol. The paired v7
  canary is blocked by the v6 upload incompatibility recorded on PR #642. Keep
  this exact v4 compatibility pin until Forgejo documents newer support.
inputs:
  name:
    description: 'Artifact name. Omit to download all artifacts.'
    required: false
    default: ''
  path:
    description: 'Destination directory.'
    required: false
    default: ''
  pattern:
    description: 'Glob pattern of artifact names to match (when name is omitted).'
    required: false
    default: ''
  merge-multiple:
    description: 'Merge all matched artifacts into a single directory (true|false).'
    required: false
    default: 'false'
outputs:
  download-path:
    description: Absolute path where artifacts were downloaded.
    value: ${{ steps.download.outputs.download-path }}
runs:
  using: composite
  steps:
    - name: Download artifact
      id: download
      uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
