name: 'Run command in an isolated workspace'
description: >-
  Wraps scripts/ci/run-in-isolated-workspace.sh so workflow YAML can express
  isolated runs as a composite step instead of a multi-line shell prologue.
  The source checkout stays immutable; the command runs from a per-job clone
  that is removed through a signed cleanup receipt after the command terminates.
inputs:
  label:
    description: 'Workspace label (letters, digits, dot, underscore, hyphen).'
    required: true
  command:
    description: 'Bash command to run inside the isolated clone.'
    required: true
  docker-visible:
    description: >-
      Place the clone under the workspace mount so Docker bind mounts can
      see it. Required for Docker-backed E2E and install jobs.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Run in isolated workspace
      shell: bash
      env:
        SANCTUARY_RUN_ISOLATED_LABEL: ${{ inputs.label }}
        SANCTUARY_RUN_ISOLATED_COMMAND: ${{ inputs.command }}
        SANCTUARY_RUN_ISOLATED_DOCKER_VISIBLE: ${{ inputs.docker-visible }}
      run: |
        set -euo pipefail
        args=()
        if [ "$SANCTUARY_RUN_ISOLATED_DOCKER_VISIBLE" = "true" ]; then
          args+=(--docker-visible)
        fi
        bash "${{ github.workspace }}/scripts/ci/run-in-isolated-workspace.sh" \
          "${args[@]}" \
          "$SANCTUARY_RUN_ISOLATED_LABEL" \
          bash -c "$SANCTUARY_RUN_ISOLATED_COMMAND"
