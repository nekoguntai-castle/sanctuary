name: 'Setup Node.js toolchain'
description: >-
  Verifies the Node.js toolchain matches the project version via the
  repo-owned ensure-node helper. Provider-agnostic; works on GitHub Actions
  and Forgejo Actions.
inputs:
  install-npm:
    description: Install exact npm when missing; disable for prebuilt proof runners.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install pinned npm toolchain
      if: inputs.install-npm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        expected="${SANCTUARY_NPM_VERSION:-${NPM_VERSION:-}}"
        if [[ ! "$expected" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
          echo "setup-node-toolchain: NPM_VERSION must be an exact numeric version" >&2
          exit 1
        fi
        if [ "$(npm --version)" != "$expected" ]; then
          npm install --global --audit=false --fund=false "npm@$expected"
        fi
    - name: Verify Node.js toolchain
      shell: bash
      run: bash ${{ github.workspace }}/scripts/ci/ensure-node.sh
