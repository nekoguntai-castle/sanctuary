name: 'Setup Node.js toolchain'
description: >-
  Selects a checksum-locked Node.js runtime from the shared runner cache,
  installs exact npm, and verifies both with repo-owned helpers.
inputs:
  install-npm:
    description: Install exact npm when missing; disable for prebuilt proof runners.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Select checksum-locked Node.js runtime
      if: inputs.install-npm == 'true'
      shell: bash
      env:
        SANCTUARY_INSTALL_NPM: ${{ inputs.install-npm }}
      run: bash ${{ github.workspace }}/scripts/ci/bootstrap-node.sh
    - name: Verify Node.js toolchain
      shell: bash
      run: bash ${{ github.workspace }}/scripts/ci/ensure-node.sh
