self-hosted-runner:
  labels:
    - ubuntu-20.04
    # Capability label: "runner that can expose a mountable Docker API socket
    # for the production docker-proxy service". Carried by every runner, which
    # is what lets the Docker-backed install and release lanes schedule on any
    # of them instead of pinning to one host.
    - docker-socket
    # Retained while nothing targets it; drop once a release gate has run green
    # through docker-socket. See #668.
    - x300-canary
    # Capability label: "runner carrying the Go toolchain the address
    # cross-verification lane needs", pinned by digest to
    # nexus.tabineko.dev/nekoguntai-castle/sanctuary-ci-go. Both runners carry
    # it, so verify-vectors stays schedulable on either. See #709.
    - go-1.25.12
