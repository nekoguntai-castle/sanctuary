name: Test Suite

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'components/**'
      - 'hooks/**'
      - 'contexts/**'
      - 'providers/**'
      - 'services/**'
      - 'themes/**'
      - 'utils/**'
      - 'shared/**'
      - 'tests/**'
      - '!tests/*.md'
      - '!tests/**/*.md'
      - 'ai-proxy/**'
      - '!ai-proxy/*.md'
      - '!ai-proxy/**/*.md'
      - '!ai-proxy/*.mdx'
      - '!ai-proxy/**/*.mdx'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
      - '!server/*.mdx'
      - '!server/**/*.mdx'
      - 'gateway/**'
      - '!gateway/*.md'
      - '!gateway/**/*.md'
      - '!gateway/*.mdx'
      - '!gateway/**/*.mdx'
      - 'e2e/**'
      - 'scripts/**'
      - 'package*.json'
      - 'server/package*.json'
      - 'gateway/package*.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'server/tsconfig*.json'
      - 'vitest.config.ts'
      - 'vitest.coverage-shard.config.ts'
      - 'server/vitest.config.ts'
      - 'gateway/vitest.config.ts'
      - 'playwright.config.ts'
      - 'Dockerfile'
      - 'server/Dockerfile'
      - '.github/mutation-baseline.json'
      - '.github/actions/**'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2

jobs:
  # ============================================
  # PR Quick Lane (changed-files based)
  # ============================================
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      full_scan: ${{ steps.classify.outputs.full_scan }}
      test_suite_changed: ${{ steps.classify.outputs.test_suite_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      frontend_files: ${{ steps.classify.outputs.frontend_files }}
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      backend_integration_changed: ${{ steps.classify.outputs.backend_integration_changed }}
      backend_files: ${{ steps.classify.outputs.backend_files }}
      critical_mutation_changed: ${{ steps.classify.outputs.critical_mutation_changed }}
      critical_mutation_files: ${{ steps.classify.outputs.critical_mutation_files }}
      gateway_changed: ${{ steps.classify.outputs.gateway_changed }}
      gateway_files: ${{ steps.classify.outputs.gateway_files }}
      ai_proxy_changed: ${{ steps.classify.outputs.ai_proxy_changed }}
      ai_proxy_files: ${{ steps.classify.outputs.ai_proxy_files }}
      e2e_changed: ${{ steps.classify.outputs.e2e_changed }}
      browser_smoke_changed: ${{ steps.classify.outputs.browser_smoke_changed }}
      render_changed: ${{ steps.classify.outputs.render_changed }}
      build_changed: ${{ steps.classify.outputs.build_changed }}
      test_files: ${{ steps.classify.outputs.test_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: scripts/ci/retry-command.sh "classify changed paths" bash scripts/ci/classify-test-changes.sh

  quick-test-hygiene:
    name: Quick Test Hygiene
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.test_files != ''
    runs-on: ubuntu-latest
    needs: [detect-changes]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/quick-test-hygiene
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Run quick hygiene checks in isolated workspace
        env:
          CHANGED_TEST_FILES: ${{ needs.detect-changes.outputs.test_files }}
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/quick-hygiene.log" scripts/ci/run-in-isolated-workspace.sh quick-hygiene bash -c '
            set -euo pipefail
            for attempt in 1 2 3; do
              echo "npm ci (quick hygiene), attempt $attempt"
              if npm ci --audit=false --fund=false --cache .tmp/npm-cache; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done

            if [ -z "${CHANGED_TEST_FILES:-}" ]; then
              echo "No changed test files."
              exit 0
            fi
            npm run test:hygiene -- $CHANGED_TEST_FILES
          '

      - name: Write quick hygiene diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Test Hygiene"

      - name: Upload quick hygiene diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-test-hygiene
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-frontend-tests:
    name: Quick Frontend Tests
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.frontend_changed == 'true' &&
      (needs.quick-test-hygiene.result == 'success' ||
       needs.quick-test-hygiene.result == 'skipped') &&
      (needs.quick-critical-mutation.result == 'success' ||
       needs.quick-critical-mutation.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [detect-changes, quick-test-hygiene, quick-critical-mutation]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/quick-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Run quick frontend checks in isolated workspace
        env:
          FRONTEND_FILES: ${{ needs.detect-changes.outputs.frontend_files }}
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/quick-frontend.log" scripts/ci/with-runner-lock.sh node-toolchain scripts/ci/retry-command.sh "quick frontend isolated checks" scripts/ci/run-in-isolated-workspace.sh --keep-on-failure quick-frontend bash -c '
            set -euo pipefail
            for attempt in 1 2 3; do
              echo "npm ci (quick frontend), attempt $attempt"
              if npm ci --audit=false --fund=false --cache .tmp/npm-cache; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
            npm run typecheck:app
            npm run typecheck:tests
            related_files=()
            if [ -n "$FRONTEND_FILES" ]; then
              read -r -a related_files <<< "$FRONTEND_FILES"
            fi
            npx vitest related --run --passWithNoTests --pool threads --maxWorkers=2 --no-file-parallelism "${related_files[@]}"
          '

      - name: Write quick frontend diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Frontend"

      - name: Upload quick frontend diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-frontend
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-backend-typecheck:
    name: Quick Backend Typecheck
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quick-backend-typecheck
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Run server test typecheck
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/server-test-typecheck.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-command.sh "quick backend typecheck"
          ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend typecheck"
          npm run typecheck:tests

      - name: Write quick backend typecheck diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Backend Typecheck"

      - name: Upload quick backend typecheck diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-backend-typecheck
          path: .tmp/ci-diagnostics/quick-backend-typecheck/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-backend-tests:
    name: Quick Backend Tests
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.backend_changed == 'true' &&
      needs.quick-backend-typecheck.result == 'success'
    runs-on: ubuntu-latest
    needs: [detect-changes, quick-backend-typecheck]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quick-backend-tests
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Resolve Postgres service host
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-postgres.log" bash -c '
            if getent hosts postgres >/dev/null 2>&1; then
              database_host=postgres
              database_port=5432
            else
              database_host=localhost
              database_port="${POSTGRES_PORT:-5432}"
            fi
            echo "DATABASE_URL=postgresql://test:test@${database_host}:${database_port}/sanctuary_test?schema=public" >> "$GITHUB_ENV"
          '

      - name: Run database migrations
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/prisma-migrate.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "quick backend prisma migrate"
          ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend prisma migrate"
          npx prisma migrate deploy

      - name: Run related backend tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/related-backend-tests.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "quick backend related tests"
          ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend related tests"
          npx vitest related --run --passWithNoTests
          --pool threads --maxWorkers=2 --no-file-parallelism
          --exclude "tests/integration/**"
          ${{ needs.detect-changes.outputs.backend_files }}

      - name: Write quick backend test diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Backend Tests"

      - name: Upload quick backend test diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-backend-tests
          path: .tmp/ci-diagnostics/quick-backend-tests/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-backend-integration-smoke:
    name: Quick Backend Integration Smoke
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.backend_integration_changed == 'true' &&
      needs.quick-backend-tests.result == 'success'
    runs-on: ubuntu-latest
    needs: [detect-changes, quick-backend-tests]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quick-backend-integration-smoke
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Resolve Postgres service host
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-postgres.log" bash -c '
            if getent hosts postgres >/dev/null 2>&1; then
              database_host=postgres
              database_port=5432
            else
              database_host=localhost
              database_port="${POSTGRES_PORT:-5432}"
            fi
            echo "DATABASE_URL=postgresql://test:test@${database_host}:${database_port}/sanctuary_test?schema=public" >> "$GITHUB_ENV"
          '

      - name: Run database migrations
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/prisma-migrate.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "quick backend smoke prisma migrate"
          ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend smoke prisma migrate"
          npx prisma migrate deploy

      - name: Run integration smoke tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/integration-smoke.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "quick backend integration smoke"
          ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend integration smoke"
          npm run test:run:ci --
          tests/integration/websocket/websocket.integration.test.ts
          tests/integration/flows/auth.integration.test.ts

      - name: Write quick backend integration smoke diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Backend Integration Smoke"

      - name: Upload quick backend integration smoke diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-backend-integration-smoke
          path: .tmp/ci-diagnostics/quick-backend-integration-smoke/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-critical-mutation:
    name: Quick Critical Mutation Gate
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.critical_mutation_changed == 'true' &&
      (needs.quick-backend-integration-smoke.result == 'success' ||
       needs.quick-backend-integration-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [detect-changes, quick-backend-integration-smoke]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quick-critical-mutation
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      # Stryker's `incremental: true` only helps when the cache file persists
      # across CI runs. The cache key hashes the mutated source files plus the
      # Stryker config; restore-keys lets unrelated PRs reuse the most recent
      # cache as a starting point.
      - name: Restore Stryker incremental cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: server/.stryker-cache
          key: stryker-critical-${{ hashFiles('server/src/services/bitcoin/addressDerivation.ts', 'server/src/services/bitcoin/addressDerivation/**', 'server/src/services/bitcoin/psbtValidation.ts', 'server/src/services/bitcoin/psbtInfo.ts', 'server/src/services/bitcoin/validationEvidenceContracts.ts', 'server/src/services/bitcoin/transactions/broadcastContracts.ts', 'server/src/services/bitcoin/blockchain/broadcastPreflight.ts', 'server/src/api/transactions/broadcastIntent.ts', 'server/src/middleware/auth.ts', 'server/src/services/accessControl.ts', 'server/stryker.critical.config.mjs') }}
          restore-keys: |
            stryker-critical-

      - name: Run critical mutation gate
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/critical-mutation-gate.log"
          npm run test:mutation:critical:gate

      - name: Upload critical mutation report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: critical-mutation-report-pr
          path: server/reports/mutation/
          retention-days: 14

      - name: Write quick critical mutation diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Critical Mutation"

      - name: Upload quick critical mutation diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-critical-mutation
          path: .tmp/ci-diagnostics/quick-critical-mutation/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-gateway-tests:
    name: Quick Gateway Tests
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.gateway_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quick-gateway
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          npm ci

      - name: Run related gateway tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/related-gateway-tests.log"
          npx vitest related --run --passWithNoTests ${{ needs.detect-changes.outputs.gateway_files }}

      - name: Write quick gateway diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Gateway"

      - name: Upload quick gateway diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-gateway
          path: .tmp/ci-diagnostics/quick-gateway/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-ai-proxy-tests:
    name: Quick AI Proxy Tests
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.ai_proxy_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/quick-ai-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install root test dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/root-install-dependencies.log"
          npm ci

      - name: Install AI proxy dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/ai-proxy-install-dependencies.log"
          npm --prefix ai-proxy ci

      - name: Build AI proxy
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/ai-proxy-build.log"
          npm --prefix ai-proxy run build

      - name: Run AI proxy tests
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/ai-proxy-tests.log"
          npm --prefix ai-proxy run test

      - name: Write quick AI proxy diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick AI Proxy"

      - name: Upload quick AI proxy diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-ai-proxy
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-browser-smoke:
    name: Quick Browser Smoke
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.browser_smoke_changed == 'true' &&
      (needs.quick-frontend-tests.result == 'success' ||
       needs.quick-frontend-tests.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [detect-changes, quick-frontend-tests]
    timeout-minutes: 30
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/quick-browser

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Cache Playwright browsers
        continue-on-error: true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run quick browser smoke
