      - name: Cleanup quick render artifacts
        if: always()
        run: rm -rf ".tmp/quick-render-artifacts/${{ github.run_id }}" || echo "::warning::Could not fully remove quick render artifacts"

  pr-required-checks:
    name: PR Required Checks
    # Runs on pull_request and merge_group. On pull_request it aggregates
    # the quick lane; on merge_group it's a no-op (Full Test Summary is
    # the authoritative gate there), but it must still report a
    # conclusion so branch protection doesn't rely on GitHub's
    # "skipped == success" semantics for merge-queue eligibility.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - quick-test-hygiene
      - quick-frontend-tests
      - quick-backend-typecheck
      - quick-backend-tests
      - quick-backend-integration-smoke
      - quick-critical-mutation
      - quick-gateway-tests
      - quick-ai-proxy-tests
      - quick-browser-smoke
      - quick-render-regression
    steps:
      - name: Merge group no-op
        if: github.event_name == 'merge_group'
        run: |
          echo "PR Required Checks aggregates the pull_request quick lane."
          echo "On merge_group events, Full Test Summary is the authoritative gate."
          echo "Reporting success so branch-protection required-checks are explicitly satisfied."

      - name: Check PR quick lane results
        if: github.event_name == 'pull_request'
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          QUICK_TEST_HYGIENE: ${{ needs.quick-test-hygiene.result }}
          QUICK_FRONTEND_TESTS: ${{ needs.quick-frontend-tests.result }}
          QUICK_BACKEND_TYPECHECK: ${{ needs.quick-backend-typecheck.result }}
          QUICK_BACKEND_TESTS: ${{ needs.quick-backend-tests.result }}
          QUICK_BACKEND_INTEGRATION_SMOKE: ${{ needs.quick-backend-integration-smoke.result }}
          QUICK_CRITICAL_MUTATION: ${{ needs.quick-critical-mutation.result }}
          QUICK_GATEWAY_TESTS: ${{ needs.quick-gateway-tests.result }}
          QUICK_AI_PROXY_TESTS: ${{ needs.quick-ai-proxy-tests.result }}
          QUICK_BROWSER_SMOKE: ${{ needs.quick-browser-smoke.result }}
          QUICK_RENDER_REGRESSION: ${{ needs.quick-render-regression.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          require_success "Detect Changed Files" "$DETECT_CHANGES"
          allow_success_or_skipped "Quick Test Hygiene" "$QUICK_TEST_HYGIENE"
          allow_success_or_skipped "Quick Frontend Tests" "$QUICK_FRONTEND_TESTS"
          allow_success_or_skipped "Quick Backend Typecheck" "$QUICK_BACKEND_TYPECHECK"
          allow_success_or_skipped "Quick Backend Tests" "$QUICK_BACKEND_TESTS"
          allow_success_or_skipped "Quick Backend Integration Smoke" "$QUICK_BACKEND_INTEGRATION_SMOKE"
          allow_success_or_skipped "Quick Critical Mutation Gate" "$QUICK_CRITICAL_MUTATION"
          allow_success_or_skipped "Quick Gateway Tests" "$QUICK_GATEWAY_TESTS"
          allow_success_or_skipped "Quick AI Proxy Tests" "$QUICK_AI_PROXY_TESTS"
          allow_success_or_skipped "Quick Browser Smoke" "$QUICK_BROWSER_SMOKE"
          allow_success_or_skipped "Quick Render Regression" "$QUICK_RENDER_REGRESSION"

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  full-lane-ready:
    name: Full Lane Ready
    if: always()
    runs-on: ubuntu-latest
    needs: [detect-changes, pr-required-checks]
    steps:
      - name: Check full lane prerequisites
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          PR_REQUIRED_CHECKS: ${{ needs.pr-required-checks.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          require_success "Detect Changed Files" "$DETECT_CHANGES"

          case "$EVENT_NAME" in
            pull_request|merge_group)
              require_success "PR Required Checks" "$PR_REQUIRED_CHECKS"
              ;;
            *)
              echo "PR Required Checks: $PR_REQUIRED_CHECKS"
              ;;
          esac

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  # ============================================
  # Full Lane (pull requests, merge queue, main, nightly, manual)
  # ============================================
  full-backend-typecheck:
    name: Full Backend Typecheck
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/backend-typecheck
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Run server test typecheck
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/server-test-typecheck.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-command.sh "server test typecheck"
          ${{ github.workspace }}/scripts/ci/time-command.sh "server test typecheck"
          npm run typecheck:tests

      - name: Write backend typecheck diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Backend Typecheck"

      - name: Upload backend typecheck diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-backend-typecheck
          path: .tmp/ci-diagnostics/backend-typecheck/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-backend-unit-coverage:
    name: Full Backend Unit Coverage
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      needs.full-backend-typecheck.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready, full-backend-typecheck]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/backend-unit-coverage
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Resolve Postgres service host
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-postgres.log" bash -c '
            if getent hosts postgres >/dev/null 2>&1; then
              database_host=postgres
              database_port=5432
            else
              database_host=localhost
              database_port="${POSTGRES_PORT:-5432}"
            fi
            echo "DATABASE_URL=postgresql://test:test@${database_host}:${database_port}/sanctuary_test?schema=public" >> "$GITHUB_ENV"
          '

      - name: Run database migrations
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/prisma-migrate.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "backend unit prisma migrate"
          ${{ github.workspace }}/scripts/ci/time-command.sh "backend unit prisma migrate"
          npx prisma migrate deploy

      - name: Run unit tests with coverage
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
          SANCTUARY_VITEST_INFRA_ATTEMPTS: '5'
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/unit-coverage.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-vitest-infrastructure-failure.sh "backend unit coverage"
          ${{ github.workspace }}/scripts/ci/time-command.sh "backend unit coverage"
          npm run test:run:ci -- tests/unit --coverage

      - name: Upload backend coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: backend-coverage
          path: |
            server/coverage/
            server/junit.xml
          retention-days: 14

      - name: Write backend unit coverage diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Backend Unit Coverage"

      - name: Upload backend unit coverage diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-backend-unit-coverage
          path: .tmp/ci-diagnostics/backend-unit-coverage/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-backend-integration-tests:
    name: Full Backend Integration Tests (${{ matrix.group }})
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_integration_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/backend-integration-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group:
          - flows
          - ops-workers
          - repositories-core
          - repositories-sharing
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Resolve Postgres service host
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-postgres.log" bash -c '
            if getent hosts postgres >/dev/null 2>&1; then
              database_host=postgres
              database_port=5432
            else
              database_host=localhost
              database_port="${POSTGRES_PORT:-5432}"
            fi
            echo "DATABASE_URL=postgresql://test:test@${database_host}:${database_port}/sanctuary_test?schema=public" >> "$GITHUB_ENV"
          '

      - name: Run database migrations
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/prisma-migrate.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "backend integration prisma migrate"
          ${{ github.workspace }}/scripts/ci/time-command.sh "backend integration prisma migrate"
          npx prisma migrate deploy

      - name: Run integration tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
          SANCTUARY_VITEST_INFRA_ATTEMPTS: '5'
          MATRIX_GROUP: ${{ matrix.group }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/integration-tests.log" bash -c '
            set -euo pipefail
            group="${MATRIX_GROUP:?}"
            mapfile -t specs < <("${{ github.workspace }}/scripts/ci/backend-integration-groups.sh" "$group")

            if [ "${#specs[@]}" -eq 0 ]; then
              echo "::error::No backend integration specs found for group ${group}"
              exit 1
            fi

            printf "Running backend integration group %s:\n" "$group"
            printf "  %s\n" "${specs[@]}"

            "${{ github.workspace }}/scripts/ci/with-runner-lock.sh" node-toolchain \
              "${{ github.workspace }}/scripts/ci/retry-vitest-infrastructure-failure.sh" \
              "backend integration ${group}" \
              "${{ github.workspace }}/scripts/ci/time-command.sh" \
              "backend integration ${group}" \
              npm run test:run:ci -- "${specs[@]}"
          '

      - name: Write backend integration diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Backend Integration (${{ matrix.group }})"

      - name: Upload backend integration diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-backend-integration-${{ matrix.group }}
          path: .tmp/ci-diagnostics/backend-integration-${{ matrix.group }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-backend-tests:
    name: Full Backend Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_changed == 'true' ||
       needs.detect-changes.outputs.backend_integration_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready, full-backend-typecheck, full-backend-unit-coverage, full-backend-integration-tests]
    steps:
      - name: Check backend lane result
        env:
          FULL_SCAN: ${{ needs.detect-changes.outputs.full_scan }}
          TEST_SUITE_CHANGED: ${{ needs.detect-changes.outputs.test_suite_changed }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          BACKEND_INTEGRATION_CHANGED: ${{ needs.detect-changes.outputs.backend_integration_changed }}
          BACKEND_TYPECHECK: ${{ needs.full-backend-typecheck.result }}
          BACKEND_UNIT_COVERAGE: ${{ needs.full-backend-unit-coverage.result }}
          BACKEND_INTEGRATION_TESTS: ${{ needs.full-backend-integration-tests.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"

            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          require_when_relevant() {
            name="$1"
            result="$2"
            relevant="$3"

            if [ "$relevant" = "true" ]; then
              require_success "$name" "$result"
            else
              allow_success_or_skipped "$name" "$result"
            fi
          }

          source_required=false
          integration_required=false

          if [ "$FULL_SCAN" = "true" ] || [ "$TEST_SUITE_CHANGED" = "true" ]; then
            source_required=true
            integration_required=true
          fi

          if [ "$BACKEND_CHANGED" = "true" ]; then
            source_required=true
          fi

          if [ "$BACKEND_INTEGRATION_CHANGED" = "true" ]; then
            integration_required=true
          fi

          require_when_relevant "Full Backend Typecheck" "$BACKEND_TYPECHECK" "$source_required"
          require_when_relevant "Full Backend Unit Coverage" "$BACKEND_UNIT_COVERAGE" "$source_required"
          require_when_relevant "Full Backend Integration Tests" "$BACKEND_INTEGRATION_TESTS" "$integration_required"

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  full-frontend-typechecks:
    name: Full Frontend Typecheck (${{ matrix.target }})
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.frontend_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/frontend-typecheck-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - app-typecheck
          - test-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend typecheck npm ci"
          scripts/ci/time-command.sh "frontend typecheck npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Run strict app typecheck
        if: matrix.target == 'app-typecheck'
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/app-typecheck.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend app typecheck"
          scripts/ci/time-command.sh "frontend app typecheck"
          npm run typecheck:app

      - name: Run strict test typecheck
        if: matrix.target == 'test-typecheck'
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/test-typecheck.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend test typecheck"
          scripts/ci/time-command.sh "frontend test typecheck"
          npm run typecheck:tests

      - name: Write frontend typecheck diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Frontend Typecheck (${{ matrix.target }})"

      - name: Upload frontend typecheck diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-frontend-typecheck-${{ matrix.target }}
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-frontend-coverage-shard-1:
    name: Full Frontend Coverage Shard 1/2
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/frontend-coverage-shard-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend coverage npm ci"
          scripts/ci/time-command.sh "frontend coverage npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Run frontend coverage shard 1
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-coverage-shard-1.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "frontend coverage shard 1/2"
          npm run test:coverage:shard -- 1 2

      - name: Upload frontend coverage blob 1
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: frontend-coverage-blob-1
          path: .vitest-reports/blob-1-2.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Write frontend coverage shard 1 diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Frontend Coverage Shard 1/2"

      - name: Upload frontend coverage shard 1 diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-frontend-coverage-shard-1
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-frontend-coverage-shard-2:
    name: Full Frontend Coverage Shard 2/2
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      needs.full-frontend-coverage-shard-1.result == 'success' &&
      needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready, full-frontend-coverage-shard-1]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/frontend-coverage-shard-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend coverage npm ci"
          scripts/ci/time-command.sh "frontend coverage npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Run frontend coverage shard 2
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-coverage-shard-2.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "frontend coverage shard 2/2"
          npm run test:coverage:shard -- 2 2

      - name: Upload frontend coverage blob 2
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: frontend-coverage-blob-2
          path: .vitest-reports/blob-2-2.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Write frontend coverage shard 2 diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Frontend Coverage Shard 2/2"

      - name: Upload frontend coverage shard 2 diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-frontend-coverage-shard-2
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-frontend-coverage-merge:
    name: Full Frontend Coverage Merge
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      needs.full-frontend-coverage-shard-1.result == 'success' &&
      needs.full-frontend-coverage-shard-2.result == 'success' &&
      needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready, full-frontend-coverage-shard-1, full-frontend-coverage-shard-2]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/frontend-coverage-merge

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend coverage merge npm ci"
          scripts/ci/time-command.sh "frontend coverage merge npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Download frontend coverage shard 1
        uses: ./.github/actions/download-artifact
        with:
          name: frontend-coverage-blob-1
          path: .vitest-reports/

      - name: Download frontend coverage shard 2
        uses: ./.github/actions/download-artifact
        with:
          name: frontend-coverage-blob-2
          path: .vitest-reports/

      - name: Merge frontend coverage (threshold-enforced)
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-coverage-merge.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-vitest-infrastructure-failure.sh "frontend coverage merge"
          scripts/ci/time-command.sh "frontend coverage merge"
          npm run test:coverage:merge -- .vitest-reports

      - name: Upload frontend coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write frontend coverage merge diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Frontend Coverage Merge"

      - name: Upload frontend coverage merge diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-frontend-coverage-merge
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-frontend-tests:
    name: Full Frontend Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.frontend_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready, full-frontend-typechecks, full-frontend-coverage-merge]

    steps:
      - name: Check frontend lane result
        env:
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
          FRONTEND_TYPECHECKS: ${{ needs.full-frontend-typechecks.result }}
          FRONTEND_COVERAGE: ${{ needs.full-frontend-coverage-merge.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"

            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          require_success "Full Frontend Typechecks" "$FRONTEND_TYPECHECKS"
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            require_success "Full Frontend Coverage Merge" "$FRONTEND_COVERAGE"
          else
            allow_success_or_skipped "Full Frontend Coverage Merge" "$FRONTEND_COVERAGE"
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  full-gateway-tests:
    name: Full Gateway Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
