        with:
          name: ci-diagnostics-ai-proxy
          path: .tmp/ci-diagnostics/ai-proxy/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-critical-mutation:
    name: Full Critical Mutation Gate
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.critical_mutation_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/critical-mutation
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      # Stryker's `incremental: true` only helps when the cache file persists
      # across CI runs. The cache key hashes the mutated source files plus the
      # Stryker config; restore-keys lets unrelated PRs reuse the most recent
      # cache as a starting point.
      - name: Restore Stryker incremental cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: server/.stryker-cache
          key: stryker-critical-${{ hashFiles('server/src/services/bitcoin/addressDerivation.ts', 'server/src/services/bitcoin/addressDerivation/**', 'server/src/services/bitcoin/psbtValidation.ts', 'server/src/services/bitcoin/psbtInfo.ts', 'server/src/services/bitcoin/validationEvidenceContracts.ts', 'server/src/services/bitcoin/transactions/broadcastContracts.ts', 'server/src/services/bitcoin/blockchain/broadcastPreflight.ts', 'server/src/api/transactions/broadcastIntent.ts', 'server/src/middleware/auth.ts', 'server/src/services/accessControl.ts', 'server/stryker.critical.config.mjs') }}
          restore-keys: |
            stryker-critical-

      - name: Run critical mutation gate
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/critical-mutation-gate.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/time-command.sh "critical mutation gate"
          npm run test:mutation:critical:gate

      - name: Upload critical mutation report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: critical-mutation-report
          path: server/reports/mutation/
          retention-days: 14

      - name: Write critical mutation diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Critical Mutation"

      - name: Upload critical mutation diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-critical-mutation
          path: .tmp/ci-diagnostics/critical-mutation/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-browser-e2e-tests:
    name: Full Browser E2E Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      needs.detect-changes.outputs.browser_smoke_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/browser-e2e

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install frontend dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-frontend-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "browser npm ci"
          scripts/ci/time-command.sh "browser npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Cache Playwright browsers
        continue-on-error: true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-playwright.log"
          scripts/ci/time-command.sh "browser playwright install"
          scripts/ci/install-playwright-chromium.sh

      - name: Reserve browser API port
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/reserve-api-port.log" bash -c '
            api_port="$(node <<'"'"'NODE'"'"'
            const net = require("net");
            const server = net.createServer();
            server.listen(0, "127.0.0.1", () => {
              const address = server.address();
              if (!address || typeof address === "string") {
                throw new Error("Failed to reserve a TCP port");
              }
              console.log(address.port);
              server.close();
            });
          NODE
            )"
            echo "BROWSER_E2E_API_PORT=${api_port}" >> "$GITHUB_ENV"
            echo "BROWSER_E2E_API_URL=http://localhost:${api_port}/api/v1" >> "$GITHUB_ENV"
          '

      - name: Build frontend
        run: |
          VITE_API_URL="${BROWSER_E2E_API_URL:?}" \
            scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-build.log" \
            scripts/ci/with-runner-lock.sh node-toolchain \
            scripts/ci/time-command.sh "browser frontend build" \
            scripts/ci/retry-command.sh "browser frontend build" \
            npm run build

      - name: Resolve service endpoints
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-service-endpoints.log" bash -c '
            if getent hosts postgres >/dev/null 2>&1; then
              database_host=postgres
              database_port=5432
            else
              database_host=localhost
              database_port="${POSTGRES_PORT:-5432}"
            fi

            if getent hosts redis >/dev/null 2>&1; then
              redis_host=redis
              redis_port=6379
            else
              redis_host=localhost
              redis_port="${REDIS_PORT:-6379}"
            fi

            echo "DATABASE_URL=postgresql://test:test@${database_host}:${database_port}/sanctuary_test?schema=public" >> "$GITHUB_ENV"
            echo "REDIS_URL=redis://${redis_host}:${redis_port}" >> "$GITHUB_ENV"
          '

      - name: Setup backend
        working-directory: server
        run: |
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/setup-server-dependencies.log" \
            "${{ github.workspace }}/scripts/ci/setup-server-dependencies.sh"
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/prisma-migrate.log" \
            "${{ github.workspace }}/scripts/ci/retry-command.sh" "browser prisma migrate" \
            "${{ github.workspace }}/scripts/ci/time-command.sh" "browser prisma migrate" \
            npx prisma migrate deploy

      - name: Build backend
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/backend-build.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-command.sh "browser backend build"
          ${{ github.workspace }}/scripts/ci/time-command.sh "browser backend build"
          npm --ignore-scripts run build

      - name: Run browser-flow E2E tests
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/browser-flow-e2e.log" scripts/ci/with-runner-lock.sh e2e bash -c '
            set -euo pipefail

            readonly api_port="${BROWSER_E2E_API_PORT:?}"
            BACKEND_PID=""

            cleanup_backend() {
              if [ -n "${BACKEND_PID:-}" ]; then
                kill -- "-${BACKEND_PID}" 2>/dev/null || kill "$BACKEND_PID" 2>/dev/null || true
                wait "$BACKEND_PID" 2>/dev/null || true
                BACKEND_PID=""
              fi
            }
            trap cleanup_backend EXIT

            backend_log=".tmp/browser-e2e-backend.log"
            mkdir -p "$(dirname "$backend_log")"
            setsid bash -c "cd server; PORT=\"\$1\" npm run start" _ "$api_port" >"$backend_log" 2>&1 &
            BACKEND_PID="$!"

            echo "Waiting for backend server..."
            for i in {1..60}; do
              if curl -s "http://localhost:${api_port}/health" > /dev/null 2>&1; then
                echo "Backend is ready!"
                break
              fi
              if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
                echo "Backend process exited before becoming ready"
                tail -200 "$backend_log" || true
                exit 1
              fi
              if [ "$i" -eq 60 ]; then
                echo "Backend failed to start"
                tail -200 "$backend_log" || true
                exit 1
              fi
              echo "Attempt $i: Backend not ready yet..."
              sleep 2
            done

            while IFS= read -r browser_group; do
              echo "::group::Browser E2E ${browser_group}"
              mapfile -t browser_specs < <(scripts/ci/browser-e2e-groups.sh "$browser_group")
              if [ "${#browser_specs[@]}" -eq 0 ]; then
                echo "No browser-flow E2E specs found for ${browser_group}."
                echo "::endgroup::"
                continue
              fi

              printf "Running browser-flow E2E group %s:\n" "$browser_group"
              printf "  %s\n" "${browser_specs[@]}"
              VITE_API_URL="${BROWSER_E2E_API_URL:?}" \
                scripts/ci/retry-playwright-infrastructure-failure.sh "browser-flow E2E ${browser_group}" \
                scripts/ci/time-command.sh "browser-flow E2E ${browser_group}" \
                npm run test:e2e -- --project=chromium "${browser_specs[@]}"

              echo "::endgroup::"
            done < <(scripts/ci/browser-e2e-groups.sh --groups)
          '
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          GATEWAY_SECRET: test-gateway-secret-for-ci-minimum-32-chars
          ENCRYPTION_SALT: test-encryption-salt-for-ci
          NODE_ENV: test
          CLIENT_URL: http://localhost:5173
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          ELECTRUM_HOST: 127.0.0.1
          ELECTRUM_PORT: '1'
          ELECTRUM_PROTOCOL: tcp
          ELECTRUM_CONNECTION_TIMEOUT_MS: '1000'
          ELECTRUM_REQUEST_TIMEOUT_MS: '1000'
          ELECTRUM_POOL_ENABLED: 'false'
          PRICE_PROVIDERS_ENABLED: mempool
          # E2E harness starts only the server, not the paired worker, so
          # disable the critical worker-heartbeat startup gate.
          WORKER_HEALTH_MONITOR_ENABLED: 'false'
          # Keep auth-dependent legacy specs skipped until seeded test auth users exist.
          SKIP_AUTH_TESTS: 'true'

      - name: Write browser E2E diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Browser E2E"

      - name: Upload browser E2E diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-browser-e2e
          path: .tmp/ci-diagnostics/browser-e2e/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-report-browser
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-results-browser
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  full-render-e2e-tests:
    name: Full Render E2E Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.full-browser-e2e-tests.result == 'success' ||
       (needs.full-browser-e2e-tests.result == 'skipped' &&
        needs.detect-changes.outputs.browser_smoke_changed != 'true')) &&
      needs.detect-changes.outputs.render_changed == 'true'
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready, full-browser-e2e-tests]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/render-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "render npm ci"
          scripts/ci/time-command.sh "render npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Cache Playwright browsers
        continue-on-error: true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-playwright.log"
          scripts/ci/time-command.sh "render playwright install"
          scripts/ci/install-playwright-chromium.sh

      - name: Build frontend
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-build.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "render frontend build"
          scripts/ci/retry-command.sh "render frontend build"
          npm run build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Run render regression E2E tests
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/render-regression-e2e.log"
          scripts/ci/with-runner-lock.sh e2e
          scripts/ci/retry-playwright-infrastructure-failure.sh "render regression E2E"
          scripts/ci/time-command.sh "render regression E2E"
          npm run test:e2e -- --project=chromium e2e/render-regression.spec.ts
        env:
          CI: 'true'
          NODE_ENV: test
          VITE_API_URL: http://localhost:3001

      - name: Write render E2E diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Render E2E"

      - name: Upload render E2E diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-render-e2e
          path: .tmp/ci-diagnostics/render-e2e/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-report-render
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-results-render
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  full-build-check:
    name: Full Build Check
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.build_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/build-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Build frontend
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-install-dependencies.log" \
            scripts/ci/with-runner-lock.sh node-toolchain \
            scripts/ci/retry-command.sh "build check frontend npm ci" \
            scripts/ci/time-command.sh "build check frontend npm ci" \
            npm ci --audit=false --fund=false --cache .tmp/npm-cache
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-build.log" \
            scripts/ci/with-runner-lock.sh node-toolchain \
            scripts/ci/retry-command.sh "build check frontend build" \
            scripts/ci/time-command.sh "build check frontend build" \
            npm run build

      - name: Build backend
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        working-directory: server
        run: |
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/setup-server-dependencies.log" \
            "${{ github.workspace }}/scripts/ci/setup-server-dependencies.sh"
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/backend-build.log" \
            "${{ github.workspace }}/scripts/ci/with-runner-lock.sh" node-toolchain \
            "${{ github.workspace }}/scripts/ci/retry-command.sh" "build check backend build" \
            "${{ github.workspace }}/scripts/ci/time-command.sh" "build check backend build" \
            npm --ignore-scripts run build

      - name: Write build-check diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Build Check"

      - name: Upload build-check diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-build-check
          path: .tmp/ci-diagnostics/build-check/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-test-summary:
    name: Full Test Summary
    if: always()
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready, full-backend-tests, full-frontend-tests, full-gateway-tests, full-ai-proxy-tests, full-critical-mutation, full-browser-e2e-tests, full-render-e2e-tests, full-build-check]

    steps:
      - name: Download backend coverage
        if: needs.full-backend-tests.result == 'success' || needs.full-backend-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: backend-coverage
          path: backend-results/

      - name: Download frontend coverage
        if: needs.full-frontend-tests.result == 'success' || needs.full-frontend-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: frontend-coverage
          path: frontend-results/

      - name: Download gateway coverage
        if: needs.full-gateway-tests.result == 'success' || needs.full-gateway-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: gateway-coverage
          path: gateway-results/

      - name: Download AI proxy coverage
        if: needs.full-ai-proxy-tests.result == 'success' || needs.full-ai-proxy-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: ai-proxy-coverage
          path: ai-proxy-results/

      - name: Download critical mutation report
        if: needs.full-critical-mutation.result == 'success' || needs.full-critical-mutation.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: critical-mutation-report
          path: mutation-results/

      - name: Generate summary
        run: |
          echo "## Full Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.full-backend-tests.result }}" = "success" ]; then
            echo "### Backend: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-backend-tests.result }}" = "skipped" ]; then
            echo "### Backend: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Backend: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f backend-results/coverage/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Backend Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' backend-results/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-frontend-tests.result }}" = "success" ]; then
            echo "### Frontend: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-frontend-tests.result }}" = "skipped" ]; then
            echo "### Frontend: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Frontend: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f frontend-results/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Frontend Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' frontend-results/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-gateway-tests.result }}" = "success" ]; then
            echo "### Gateway: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-gateway-tests.result }}" = "skipped" ]; then
            echo "### Gateway: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Gateway: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f gateway-results/coverage/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Gateway Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' gateway-results/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-ai-proxy-tests.result }}" = "success" ]; then
            echo "### AI Proxy: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-ai-proxy-tests.result }}" = "skipped" ]; then
            echo "### AI Proxy: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### AI Proxy: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f ai-proxy-results/coverage/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### AI Proxy Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' ai-proxy-results/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-build-check.result }}" = "success" ]; then
            echo "### Build Check: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-build-check.result }}" = "skipped" ]; then
            echo "### Build Check: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Build Check: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-browser-e2e-tests.result }}" = "success" ]; then
            echo "### Browser E2E: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-browser-e2e-tests.result }}" = "skipped" ]; then
            echo "### Browser E2E: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Browser E2E: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-render-e2e-tests.result }}" = "success" ]; then
            echo "### Render E2E: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-render-e2e-tests.result }}" = "skipped" ]; then
            echo "### Render E2E: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Render E2E: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-critical-mutation.result }}" = "success" ]; then
            echo "### Critical Mutation Gate: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-critical-mutation.result }}" = "skipped" ]; then
            echo "### Critical Mutation Gate: Skipped" >> $GITHUB_STEP_SUMMARY
            echo "No critical mutation paths changed for this merge candidate." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Critical Mutation Gate: Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check full lane result
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          FULL_LANE_READY: ${{ needs.full-lane-ready.result }}
          FULL_SCAN: ${{ needs.detect-changes.outputs.full_scan }}
          TEST_SUITE_CHANGED: ${{ needs.detect-changes.outputs.test_suite_changed }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          CRITICAL_MUTATION_CHANGED: ${{ needs.detect-changes.outputs.critical_mutation_changed }}
          GATEWAY_CHANGED: ${{ needs.detect-changes.outputs.gateway_changed }}
          AI_PROXY_CHANGED: ${{ needs.detect-changes.outputs.ai_proxy_changed }}
          BROWSER_SMOKE_CHANGED: ${{ needs.detect-changes.outputs.browser_smoke_changed }}
          RENDER_CHANGED: ${{ needs.detect-changes.outputs.render_changed }}
          BUILD_CHANGED: ${{ needs.detect-changes.outputs.build_changed }}
          FULL_BACKEND_TESTS: ${{ needs.full-backend-tests.result }}
          FULL_FRONTEND_TESTS: ${{ needs.full-frontend-tests.result }}
          FULL_GATEWAY_TESTS: ${{ needs.full-gateway-tests.result }}
          FULL_AI_PROXY_TESTS: ${{ needs.full-ai-proxy-tests.result }}
          FULL_CRITICAL_MUTATION: ${{ needs.full-critical-mutation.result }}
          FULL_BROWSER_E2E_TESTS: ${{ needs.full-browser-e2e-tests.result }}
          FULL_RENDER_E2E_TESTS: ${{ needs.full-render-e2e-tests.result }}
          FULL_BUILD_CHECK: ${{ needs.full-build-check.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          is_true() {
            [ "${1:-}" = "true" ]
          }

          require_when_relevant() {
            name="$1"
            result="$2"
            relevant="$3"

            if [ "$relevant" = "true" ]; then
              require_success "$name" "$result"
            else
              allow_success_or_skipped "$name" "$result"
            fi
          }

          backend_required=false
          frontend_required=false
          gateway_required=false
          ai_proxy_required=false
          critical_mutation_required=false
          browser_e2e_required=false
          render_e2e_required=false
          build_required=false

          if is_true "$FULL_SCAN"; then
            backend_required=true
            frontend_required=true
            gateway_required=true
            ai_proxy_required=true
            critical_mutation_required=true
            build_required=true
          fi

          if is_true "$TEST_SUITE_CHANGED"; then
            backend_required=true
            frontend_required=true
            gateway_required=true
            ai_proxy_required=true
            build_required=true
          fi

          if is_true "$BACKEND_CHANGED"; then
            backend_required=true
          fi

          if is_true "$FRONTEND_CHANGED"; then
            frontend_required=true
          fi

          if is_true "$GATEWAY_CHANGED"; then
            gateway_required=true
          fi

          if is_true "$AI_PROXY_CHANGED"; then
            ai_proxy_required=true
          fi

          if is_true "$CRITICAL_MUTATION_CHANGED"; then
            critical_mutation_required=true
          fi

          if is_true "$BROWSER_SMOKE_CHANGED"; then
            browser_e2e_required=true
          fi

          if is_true "$RENDER_CHANGED"; then
            render_e2e_required=true
          fi

          if is_true "$BUILD_CHANGED"; then
            build_required=true
          fi

          require_success "Detect Changed Files" "$DETECT_CHANGES"
          require_success "Full Lane Ready" "$FULL_LANE_READY"
          require_when_relevant "Full Backend Tests" "$FULL_BACKEND_TESTS" "$backend_required"
          require_when_relevant "Full Frontend Tests" "$FULL_FRONTEND_TESTS" "$frontend_required"
          require_when_relevant "Full Gateway Tests" "$FULL_GATEWAY_TESTS" "$gateway_required"
          require_when_relevant "Full AI Proxy Tests" "$FULL_AI_PROXY_TESTS" "$ai_proxy_required"
          require_when_relevant "Full Critical Mutation Gate" "$FULL_CRITICAL_MUTATION" "$critical_mutation_required"
          require_when_relevant "Full Browser E2E Tests" "$FULL_BROWSER_E2E_TESTS" "$browser_e2e_required"
          require_when_relevant "Full Render E2E Tests" "$FULL_RENDER_E2E_TESTS" "$render_e2e_required"
          require_when_relevant "Full Build Check" "$FULL_BUILD_CHECK" "$build_required"

          if [ "$failed" = "true" ]; then
            exit 1
          fi
