name: Test Suite

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'shared/**'
      - 'tests/**'
      - '!tests/*.md'
      - '!tests/**/*.md'
      - 'llm-egress-proxy/**'
      - '!llm-egress-proxy/*.md'
      - '!llm-egress-proxy/**/*.md'
      - '!llm-egress-proxy/*.mdx'
      - '!llm-egress-proxy/**/*.mdx'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
      - '!server/*.mdx'
      - '!server/**/*.mdx'
      - 'gateway/**'
      - '!gateway/*.md'
      - '!gateway/**/*.md'
      - '!gateway/*.mdx'
      - '!gateway/**/*.mdx'
      - 'scripts/**'
      - 'package*.json'
      - 'server/package*.json'
      - 'gateway/package*.json'
      - 'config/tooling/**'
      - 'server/tsconfig*.json'
      - 'server/vitest.config.ts'
      - 'gateway/vitest.config.ts'
      - 'docker/frontend/Dockerfile'
      - 'server/Dockerfile'
      - '.github/mutation-baseline.json'
      - '.github/actions/**'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_VERSION: '24.19.0'
  NPM_VERSION: '11.19.0'
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2

jobs:
  # ============================================
  # PR Quick Lane (changed-files based)
  # ============================================
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      full_scan: ${{ steps.classify.outputs.full_scan }}
      test_suite_changed: ${{ steps.classify.outputs.test_suite_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      frontend_files: ${{ steps.classify.outputs.frontend_files }}
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      backend_integration_changed: ${{ steps.classify.outputs.backend_integration_changed }}
      backend_files: ${{ steps.classify.outputs.backend_files }}
      critical_mutation_changed: ${{ steps.classify.outputs.critical_mutation_changed }}
      critical_mutation_files: ${{ steps.classify.outputs.critical_mutation_files }}
      gateway_changed: ${{ steps.classify.outputs.gateway_changed }}
      gateway_files: ${{ steps.classify.outputs.gateway_files }}
      llm_egress_proxy_changed: ${{ steps.classify.outputs.llm_egress_proxy_changed }}
      llm_egress_proxy_files: ${{ steps.classify.outputs.llm_egress_proxy_files }}
      e2e_changed: ${{ steps.classify.outputs.e2e_changed }}
      browser_smoke_changed: ${{ steps.classify.outputs.browser_smoke_changed }}
      render_changed: ${{ steps.classify.outputs.render_changed }}
      build_changed: ${{ steps.classify.outputs.build_changed }}
      test_files: ${{ steps.classify.outputs.test_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: scripts/ci/retry-command.sh "classify changed paths" bash scripts/ci/classify-test-changes.sh

  quick-test-hygiene:
    name: Quick Test Hygiene
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.test_files != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [detect-changes]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/quick-test-hygiene
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Run quick hygiene checks in isolated workspace
        env:
          CHANGED_TEST_FILES: ${{ needs.detect-changes.outputs.test_files }}
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/quick-hygiene.log" scripts/ci/run-in-isolated-workspace.sh quick-hygiene bash -c '
            set -euo pipefail
            for attempt in 1 2 3; do
              echo "npm ci (quick hygiene), attempt $attempt"
              if npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done

            if [ -z "${CHANGED_TEST_FILES:-}" ]; then
              echo "No changed test files."
              exit 0
            fi
            npm run test:hygiene -- $CHANGED_TEST_FILES
          '

      - name: Write quick hygiene diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Test Hygiene"

      - name: Upload quick hygiene diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-test-hygiene
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-frontend-tests:
    name: Quick Frontend Tests
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.full_scan != 'true' &&
      needs.detect-changes.outputs.test_suite_changed != 'true' &&
      needs.detect-changes.outputs.frontend_changed == 'true' &&
      (needs.quick-test-hygiene.result == 'success' ||
       needs.quick-test-hygiene.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [detect-changes, quick-test-hygiene]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/quick-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Run quick frontend checks in isolated workspace
        env:
          FRONTEND_FILES: ${{ needs.detect-changes.outputs.frontend_files }}
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/quick-frontend.log" scripts/ci/with-runner-lock.sh node-toolchain scripts/ci/retry-command.sh "quick frontend isolated checks" scripts/ci/run-in-isolated-workspace.sh --keep-on-failure quick-frontend bash -c '
            set -euo pipefail
            for attempt in 1 2 3; do
              echo "npm ci (quick frontend), attempt $attempt"
              if npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
            bash scripts/ci/setup-verifier-test-dependencies.sh
            related_files=()
            if [ -n "$FRONTEND_FILES" ]; then
              read -r -a related_files <<< "$FRONTEND_FILES"
            fi
            npx vitest related --config config/tooling/vitest.config.ts --run --passWithNoTests --pool threads --maxWorkers=2 --no-file-parallelism "${related_files[@]}"
          '

      - name: Write quick frontend diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Frontend"

      - name: Upload quick frontend diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-frontend
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-backend-tests:
    name: Quick Backend Tests
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [detect-changes]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quick-backend-tests
    defaults:
      run:
        working-directory: server

    # No `services: postgres`. This lane runs `vitest related` with
    # `--exclude tests/integration/**`, so only unit and contract tests can be
    # selected, and none of those open a database connection — they mock Prisma
    # or manipulate DATABASE_URL purely as a config-parsing input. Verified by
    # running the whole selectable superset with DATABASE_URL unset —
    # `vitest run --exclude tests/integration/**` — which passes 474 files /
    # 10757 tests. Probed specifically with src/utils/jwt.ts, which an
    # integration spec imports, to confirm the exclusion actually drops it.
    #
    # Removing the service is a #606 mitigation, not just tidiness. Idle
    # Postgres containers are live for the whole job across ALL in-flight runs
    # — `needs:` orders jobs only within one run — and that cross-run pressure
    # is what OOM-kills the integration lane's Postgres, which Docker then
    # recreates empty mid-run (schema survives, seeded rows do not, surfacing
    # as bulk 401s).
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Run related backend tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
          BACKEND_FILES: ${{ needs.detect-changes.outputs.backend_files }}
        run: |
          # BACKEND_FILES is repo-root-relative, but this step's cwd is
          # server/. Passing it through raw made vitest look for
          # server/server/src/... and exit 0 via --passWithNoTests, so this
          # REQUIRED check ran no tests at all. See tests/ci/related-test-args.test.sh.
          #
          # Redirect to a file rather than a process substitution: under
          # `bash -e` a failing process substitution would leave related_files
          # empty and the step would pass having run nothing, which is the very
          # failure mode being fixed. A plain redirect propagates the exit code.
          args_file="$(mktemp)"
          trap 'rm -f "$args_file"' EXIT
          RELATED_FILES="${BACKEND_FILES:-}" \
            "${{ github.workspace }}/scripts/ci/related-test-args.sh" server > "$args_file"

          related_files=()
          mapfile -t related_files < "$args_file"

          if [ "${#related_files[@]}" -eq 0 ]; then
            # This job only runs when backend_changed == 'true', and the same
            # classifier loop sets that flag and appends the file, so an empty
            # list means the classifier is broken, not that nothing changed.
            # Fail rather than warn: the point of this whole step is that a
            # required check must never report success having run no tests.
            echo "::error::backend_changed was true but no backend files were classified; refusing to report success without running tests."
            exit 1
          fi

          echo "Running related tests for ${#related_files[@]} changed backend file(s):"
          printf '  %s\n' "${related_files[@]}"

          # Signature-filtered retry, NOT retry-command.sh. retry-command.sh
          # retries any non-zero exit up to 3 times, which was inert while this
          # lane selected zero tests and always exited 0. Now that it runs real
          # tests on a REQUIRED check, a blanket retry would let a genuine
          # failure pass on attempt 2. This wrapper retries only native/worker
          # crashes (exit 139, EPIPE, closed IPC, segfault) and never an
          # assertion failure.
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/related-backend-tests.log" \
            ${{ github.workspace }}/scripts/ci/retry-vitest-infrastructure-failure.sh "quick backend related tests" \
            ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend related tests" \
            npx vitest related --run --passWithNoTests \
            --pool threads --maxWorkers=2 --no-file-parallelism \
            --exclude "tests/integration/**" --exclude "**/*.integration.test.*" \
            "${related_files[@]}"

      - name: Write quick backend test diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Backend Tests"

      - name: Upload quick backend test diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-backend-tests
          path: .tmp/ci-diagnostics/quick-backend-tests/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-backend-integration-smoke:
    name: Quick Backend Integration Smoke
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.backend_integration_changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [detect-changes]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quick-backend-integration-smoke
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: sanctuary-ci-${{ github.run_id }}-${{ github.run_attempt }}-quick-smoke
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --memory 1g
          --memory-reservation 256m
          --shm-size 256m

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Resolve Postgres service host
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          POSTGRES_PASSWORD: sanctuary-ci-${{ github.run_id }}-${{ github.run_attempt }}-quick-smoke
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-postgres.log"
          ${{ github.workspace }}/scripts/ci/resolve-postgres-service.sh

      - name: Run database migrations
        # See prepare-integration-db.sh — real readiness gate + post-migrate
        # schema assertion + bounded re-migrate, replacing the racy bare migrate.
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/prisma-migrate.log"
          ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend smoke prisma migrate"
          ${{ github.workspace }}/scripts/ci/prepare-integration-db.sh

      - name: Run integration smoke tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/integration-smoke.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "quick backend integration smoke"
          ${{ github.workspace }}/scripts/ci/time-command.sh "quick backend integration smoke"
          npm run test:run:ci --
          tests/integration/websocket/websocket.integration.test.ts
          tests/integration/flows/auth.integration.test.ts
          tests/integration/api/walletApprovalsAudit.test.ts

      - name: Write quick backend integration smoke diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Backend Integration Smoke"

      - name: Upload quick backend integration smoke diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-backend-integration-smoke
          path: .tmp/ci-diagnostics/quick-backend-integration-smoke/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  quick-critical-mutation:
    name: Quick Critical Mutation Configuration
    # The exhaustive full mutation gate is the single pre-merge execution.
    # This quick lane only proves that its shard/configuration contract loads,
    # avoiding a second three-runner Stryker pass for the same pull request.
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.full_scan != 'true' &&
      needs.detect-changes.outputs.test_suite_changed != 'true' &&
      needs.detect-changes.outputs.critical_mutation_changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [detect-changes]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate critical mutation shard contract
        run: node scripts/ci/check-critical-mutation-config.mjs

  pr-required-checks:
    name: PR Required Checks
    # Runs on pull_request and merge_group. It aggregates the quick lane
    # and requires the full-lane summary, so merge-queue eligibility cannot
    # be satisfied by a no-op required check.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs:
      - detect-changes
      - quick-test-hygiene
      - quick-frontend-tests
      - quick-backend-tests
      - quick-backend-integration-smoke
      - quick-critical-mutation
      - full-test-summary
    steps:
      - name: Check required lane results
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          QUICK_TEST_HYGIENE: ${{ needs.quick-test-hygiene.result }}
          QUICK_FRONTEND_TESTS: ${{ needs.quick-frontend-tests.result }}
          QUICK_BACKEND_TESTS: ${{ needs.quick-backend-tests.result }}
          QUICK_BACKEND_INTEGRATION_SMOKE: ${{ needs.quick-backend-integration-smoke.result }}
          QUICK_CRITICAL_MUTATION: ${{ needs.quick-critical-mutation.result }}
          FULL_TEST_SUMMARY: ${{ needs.full-test-summary.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          require_success "Detect Changed Files" "$DETECT_CHANGES"
          allow_success_or_skipped "Quick Test Hygiene" "$QUICK_TEST_HYGIENE"
          allow_success_or_skipped "Quick Frontend Tests" "$QUICK_FRONTEND_TESTS"
          allow_success_or_skipped "Quick Backend Tests" "$QUICK_BACKEND_TESTS"
          allow_success_or_skipped "Quick Backend Integration Smoke" "$QUICK_BACKEND_INTEGRATION_SMOKE"
          allow_success_or_skipped "Quick Critical Mutation Configuration" "$QUICK_CRITICAL_MUTATION"
          require_success "Full Test Summary" "$FULL_TEST_SUMMARY"

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  full-lane-ready:
    name: Full Lane Ready
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [detect-changes]
    steps:
      - name: Check full lane prerequisites
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
        run: |
          if [ "$DETECT_CHANGES" != "success" ]; then
            echo "::error::Detect Changed Files result was $DETECT_CHANGES; expected success"
            exit 1
          fi
          echo "Detect Changed Files: $DETECT_CHANGES"

  # ============================================
  # Full Lane (pull requests, merge queue, main, nightly, manual)
  # ============================================
  full-backend-typecheck:
    name: Full Backend Typecheck
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/backend-typecheck
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Run server test typecheck
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/server-test-typecheck.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-command.sh "server test typecheck"
          ${{ github.workspace }}/scripts/ci/time-command.sh "server test typecheck"
          npm run typecheck:tests

      - name: Write backend typecheck diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Backend Typecheck"

      - name: Upload backend typecheck diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-backend-typecheck
          path: .tmp/ci-diagnostics/backend-typecheck/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # Sharded backend unit coverage. Each shard runs vitest with --shard X/N
  # against tests/unit and writes a blob report; the aggregator merges blobs
  # via `vitest --mergeReports` and runs the coverage threshold once on the
  # combined report. Mirrors the frontend coverage-shard pattern.
  full-backend-unit-coverage-shards:
    name: Full Backend Unit Coverage (shard ${{ matrix.shard }}/2)
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      needs.full-backend-typecheck.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [detect-changes, full-lane-ready, full-backend-typecheck]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/backend-unit-coverage-shard-${{ matrix.shard }}
    defaults:
      run:
        working-directory: server

    # No `services: postgres`. backend-coverage-shard.sh passes `tests/unit` as
    # a positional filter, so integration tests cannot be selected, and no unit
    # test opens a database connection. The matrix meant this job alone
    # accounted for two of the six Postgres containers per run. See the
    # quick-backend-tests comment for why idle service containers matter to
    # #606.
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Run backend unit coverage shard ${{ matrix.shard }}
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
          SANCTUARY_BACKEND_COVERAGE_SEGFAULT_ATTEMPTS: '3'
          SANCTUARY_BACKEND_COVERAGE_LOG_DIR: ${{ github.workspace }}/.tmp/backend-coverage-shard-${{ matrix.shard }}
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/unit-coverage.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/time-command.sh "backend unit coverage shard ${{ matrix.shard }}"
          ${{ github.workspace }}/scripts/ci/backend-coverage-shard.sh ${{ matrix.shard }} 2

      - name: Upload backend coverage shard blob
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: backend-coverage-shard-${{ matrix.shard }}-blob
          path: server/.vitest-reports/blob-${{ matrix.shard }}-2.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Write backend unit coverage shard failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "backend-unit-coverage-shard-${{ matrix.shard }}-failure.log"
          "Backend Unit Coverage shard ${{ matrix.shard }}"

      - name: Write backend unit coverage shard diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Backend Unit Coverage shard ${{ matrix.shard }}"

      - name: Upload backend unit coverage shard diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-backend-unit-coverage-shard-${{ matrix.shard }}
          path: .tmp/ci-diagnostics/backend-unit-coverage-shard-${{ matrix.shard }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-backend-unit-coverage:
    name: Full Backend Unit Coverage
    # Runs whenever the shards finished (success OR failure). The first step
    # propagates a shard-level failure as a hard failure of the gate so a
    # broken shard cannot be silently observed as 'skipped' by the umbrella.
    # Pattern mirrors #391's mutation-gate fix.
    if: >-
      always() &&
      (needs.full-backend-unit-coverage-shards.result == 'success' ||
       needs.full-backend-unit-coverage-shards.result == 'failure')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [detect-changes, full-lane-ready, full-backend-typecheck, full-backend-unit-coverage-shards]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/backend-unit-coverage
    defaults:
      run:
        working-directory: server

    steps:
      - name: Fail fast if any shard failed
        if: needs.full-backend-unit-coverage-shards.result != 'success'
        run: |
          echo "::error::One or more Backend Unit Coverage shards failed (result: ${{ needs.full-backend-unit-coverage-shards.result }}). Refusing to run the merge step so the gate cannot be silently bypassed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Download shard 1 blob
        uses: ./.github/actions/download-artifact
        with:
          name: backend-coverage-shard-1-blob
          path: server/.vitest-reports/

      - name: Download shard 2 blob
        uses: ./.github/actions/download-artifact
        with:
          name: backend-coverage-shard-2-blob
          path: server/.vitest-reports/

      - name: Merge shard blobs and run coverage threshold
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/coverage-merge.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/time-command.sh "backend coverage merge"
          ${{ github.workspace }}/scripts/ci/backend-coverage-merge.sh

      - name: Upload merged backend coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: backend-coverage
          path: |
            server/coverage/
            server/junit.xml
          retention-days: 14

      - name: Write backend unit coverage merge diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Backend Unit Coverage Merge"

      - name: Upload backend unit coverage merge diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-backend-unit-coverage
          path: .tmp/ci-diagnostics/backend-unit-coverage/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-backend-integration-tests:
    name: Full Backend Integration Tests
    # Single job that loops every backend-integration group against ONE Postgres
    # service. The former 5-way matrix span up five concurrent Postgres
    # `services:` containers which, under shared-runner memory pressure, get
    # OOM-killed and recreated empty mid-run — the schema vanishes
    # ("table public.users does not exist") partway through a shard. Forgejo
    # runner v12.10.1 ignores matrix max-parallel, so the matrix bought no real
    # parallelism, only contention. This mirrors the already-sequential
    # full-browser-e2e-tests job. Group coverage stays guaranteed by
    # backend-integration-groups.sh --groups (and its --check completeness guard).
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_integration_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    # Serialized to run ALONE among the Postgres-holding full lanes. Root cause
    # of the recurring "table public.users does not exist": the Forgejo runner
    # v12.10.1 ignores job/matrix concurrency (only runner.capacity caps it), so
    # every full lane starts together at full-lane-ready, and the resulting
    # memory pressure OOM-killed this lane's `services: postgres`, which is
    # recreated empty mid-run (schema verified by prepare-integration-db.sh,
    # then gone).
    #
    # full-backend-unit-coverage-shards no longer holds a Postgres at all (its
    # tests never opened one), so of the full lanes only this one and
    # full-browser-e2e-tests still do. The dependency on the shards is retained
    # purely as ORDERING to keep the two heavy Node lanes off the runner
    # concurrently; it is no longer about Postgres.
    #
    # These needs add ORDERING ONLY — the always()-guarded `if:` above is
    # unchanged, so a skipped/failed upstream lane never skips or blocks this
    # one.
    needs: [detect-changes, full-lane-ready, full-backend-unit-coverage-shards, full-browser-e2e-tests]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/backend-integration
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: sanctuary-ci-${{ github.run_id }}-${{ github.run_attempt }}-full-integration
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --memory 1g
          --memory-reservation 256m
          --shm-size 256m

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      - name: Resolve Postgres service host
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          POSTGRES_PASSWORD: sanctuary-ci-${{ github.run_id }}-${{ github.run_attempt }}-full-integration
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-postgres.log"
          ${{ github.workspace }}/scripts/ci/resolve-postgres-service.sh

      - name: Run integration tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          NODE_ENV: test
          # Shared Forgejo runners can starve the Postgres service long enough
          # for Prisma's 5s interactive-transaction default to expire during
          # lock-heavy integration proofs. Raise only this CI job's default; the
          # application keeps Prisma defaults unless deployment env sets these.
          PRISMA_TRANSACTION_MAX_WAIT_MS: '10000'
          PRISMA_TRANSACTION_TIMEOUT_MS: '30000'
          SANCTUARY_VITEST_INFRA_ATTEMPTS: '5'
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/integration-tests.log" bash -c '
            set -uo pipefail
            groups_script="${{ github.workspace }}/scripts/ci/backend-integration-groups.sh"
            mapfile -t groups < <("$groups_script" --groups)
            if [ "${#groups[@]}" -eq 0 ]; then
              echo "::error::No backend integration groups found"
              exit 1
            fi

            # Collect every non-destructive group from
            # backend-integration-groups.sh --groups and run them in one Vitest
            # process against the single Postgres. The destructive operations
            # proof runs last in a separate process because it intentionally
            # drills full database restore behavior.
            specs=()
            destructive_specs=()
            destructive_group="ops-destructive"
            for group in "${groups[@]}"; do
              mapfile -t group_specs < <("$groups_script" "$group")
              if [ "${#group_specs[@]}" -eq 0 ]; then
                echo "::error::No backend integration specs found for group ${group}"
                exit 1
              fi
              if [ "$group" = "$destructive_group" ]; then
                destructive_specs+=("${group_specs[@]}")
              else
                specs+=("${group_specs[@]}")
              fi
            done
            if [ "${#specs[@]}" -eq 0 ]; then
              echo "::error::No non-destructive backend integration specs found"
              exit 1
            fi
            if [ "${#destructive_specs[@]}" -eq 0 ]; then
              echo "::error::No destructive backend integration specs found"
              exit 1
            fi

            printf "Running %s backend integration spec(s) in the main vitest:\n" "${#specs[@]}"
            printf "  %s\n" "${specs[@]}"
            printf "Running %s destructive backend integration spec(s) in a final vitest:\n" "${#destructive_specs[@]}"
            printf "  %s\n" "${destructive_specs[@]}"

            # Retry ONLY when the database vanished underneath the run. Each
            # attempt re-establishes the schema via prepare-integration-db.sh
            # (idempotent: readiness gate + migrate deploy + schema assertion)
            # before running; the inner retry-vitest-infrastructure-failure
            # handles native worker crashes.
            #
            # This used to retry on any non-zero exit, to self-heal a suspected
            # mid-run Postgres wipe. sanctuary#612 disproved that hypothesis —
            # the cause was Docker DNS rotating between several containers
            # sharing the `postgres` alias, fixed in ff05e575 — so the blanket
            # retry lost its stated reason while the side effect remained: a
            # spec failing 1-in-5 survives three blind attempts ~124 times in
            # 125, so real flakiness reads as green (sanctuary#713).
            #
            # NOTE: this whole step body is a single-quoted bash -c string, so
            # no apostrophe may appear anywhere below, comments included.
            # Shell quoting is resolved before comments are stripped, and one
            # stray apostrophe closes the string (SC1072).
            #
            # classify-integration-failure.sh decides, matching connection- and
            # schema-level signatures only. Assertion failures now fail fast.
            attempts="${SANCTUARY_INTEGRATION_GROUP_ATTEMPTS:-3}"
            classify="${{ github.workspace }}/scripts/ci/classify-integration-failure.sh"
            for attempt in $(seq 1 "$attempts"); do
              attempt_log="$DIAGNOSTIC_DIR/backend-integration-attempt-${attempt}.log"
              printf "\n::group::backend integration (attempt %s/%s)\n" "$attempt" "$attempts"
              if {
                   "${{ github.workspace }}/scripts/ci/prepare-integration-db.sh" \
                   && "${{ github.workspace }}/scripts/ci/with-runner-lock.sh" node-toolchain \
                        "${{ github.workspace }}/scripts/ci/retry-vitest-infrastructure-failure.sh" \
                        "backend integration" \
                        "${{ github.workspace }}/scripts/ci/time-command.sh" \
                        "backend integration" \
                        npm run test:run:ci -- "${specs[@]}" \
                   && "${{ github.workspace }}/scripts/ci/prepare-integration-db.sh" \
                   && "${{ github.workspace }}/scripts/ci/with-runner-lock.sh" node-toolchain \
                        "${{ github.workspace }}/scripts/ci/retry-vitest-infrastructure-failure.sh" \
                        "backend integration destructive" \
                        "${{ github.workspace }}/scripts/ci/time-command.sh" \
                        "backend integration destructive" \
                        npm run test:run:ci -- "${destructive_specs[@]}";
                 } 2>&1 | tee "$attempt_log"; then
                if [ "$attempt" -eq 1 ]; then
                  echo "backend integration first-attempt result: pass"
                else
                  printf "::warning::backend integration passed only on attempt %s/%s after a database-loss retry; the lane is not first-attempt green\n" "$attempt" "$attempts"
                fi
                printf "::endgroup::\n"
                exit 0
              fi

              if [ "$attempt" -eq 1 ]; then
                echo "backend integration first-attempt result: fail"
              fi

              if ! "$classify" "$attempt_log"; then
                printf "::error::backend integration failed on attempt %s without a database-loss signature; not retrying\n" "$attempt"
                printf "::endgroup::\n"
                exit 1
              fi

              printf "::warning::backend integration attempt %s/%s hit a database-loss signature; re-establishing schema and retrying\n" "$attempt" "$attempts"
              printf "::endgroup::\n"
            done

            echo "::error::backend integration failed after ${attempts} attempt(s) with a database-loss signature"
            exit 1
          '

      - name: Write backend integration diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Backend Integration"

      - name: Upload backend integration diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-backend-integration
          path: .tmp/ci-diagnostics/backend-integration/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-backend-tests:
    name: Full Backend Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.backend_changed == 'true' ||
       needs.detect-changes.outputs.backend_integration_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [detect-changes, full-lane-ready, full-backend-typecheck, full-backend-unit-coverage, full-backend-integration-tests]
    steps:
      - name: Check backend lane result
        env:
          FULL_SCAN: ${{ needs.detect-changes.outputs.full_scan }}
          TEST_SUITE_CHANGED: ${{ needs.detect-changes.outputs.test_suite_changed }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          BACKEND_INTEGRATION_CHANGED: ${{ needs.detect-changes.outputs.backend_integration_changed }}
          BACKEND_TYPECHECK: ${{ needs.full-backend-typecheck.result }}
          BACKEND_UNIT_COVERAGE: ${{ needs.full-backend-unit-coverage.result }}
          BACKEND_INTEGRATION_TESTS: ${{ needs.full-backend-integration-tests.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"

            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          require_when_relevant() {
            name="$1"
            result="$2"
            relevant="$3"

            if [ "$relevant" = "true" ]; then
              require_success "$name" "$result"
            else
              allow_success_or_skipped "$name" "$result"
            fi
          }

          source_required=false
          integration_required=false

          if [ "$FULL_SCAN" = "true" ] || [ "$TEST_SUITE_CHANGED" = "true" ]; then
            source_required=true
            integration_required=true
          fi

          if [ "$BACKEND_CHANGED" = "true" ]; then
            source_required=true
          fi

          if [ "$BACKEND_INTEGRATION_CHANGED" = "true" ]; then
            integration_required=true
          fi

          require_when_relevant "Full Backend Typecheck" "$BACKEND_TYPECHECK" "$source_required"
          require_when_relevant "Full Backend Unit Coverage" "$BACKEND_UNIT_COVERAGE" "$source_required"
          require_when_relevant "Full Backend Integration Tests" "$BACKEND_INTEGRATION_TESTS" "$integration_required"

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  full-frontend-typechecks:
    name: Full Frontend Typechecks
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.frontend_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/frontend-typechecks

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        id: install-dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend typecheck npm ci"
          scripts/ci/time-command.sh "frontend typecheck npm ci"
          npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache

      - name: Run strict app typecheck
        if: always() && steps.install-dependencies.outcome == 'success'
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/app-typecheck.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend app typecheck"
          scripts/ci/time-command.sh "frontend app typecheck"
          npm run typecheck:app

      - name: Run strict test typecheck
        if: always() && steps.install-dependencies.outcome == 'success'
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/test-typecheck.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend test typecheck"
          scripts/ci/time-command.sh "frontend test typecheck"
          npm run typecheck:tests

      - name: Run catch-all frontend workspace typecheck
        if: always() && steps.install-dependencies.outcome == 'success'
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/all-typecheck.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend catch-all typecheck"
          scripts/ci/time-command.sh "frontend catch-all typecheck"
          npm run typecheck:all

      - name: Write frontend typecheck diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Frontend Typechecks"

      - name: Upload frontend typecheck diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-frontend-typechecks
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-frontend-coverage-merge:
    name: Full Frontend Coverage Merge
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.frontend_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/frontend-coverage-merge

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend coverage npm ci"
          scripts/ci/time-command.sh "frontend coverage npm ci"
          npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache

      - name: Install verifier test dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-verifier-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "frontend coverage verifier npm ci"
          scripts/ci/time-command.sh "frontend coverage verifier npm ci"
          bash scripts/ci/setup-verifier-test-dependencies.sh

      # The two logical shards remain sequential and independently proven. A
      # single job avoids repeating checkout/install/artifact round trips; it
      # does not remove tests or weaken the merged 100% coverage threshold.
      - name: Run frontend coverage shard 1
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-coverage-shard-1.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "frontend coverage shard 1/2"
          npm run test:coverage:shard -- 1 2

      - name: Verify frontend coverage blob 1
        run: test -s .vitest-reports/blob-1-2.json

      - name: Run frontend coverage shard 2
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-coverage-shard-2.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "frontend coverage shard 2/2"
          npm run test:coverage:shard -- 2 2

      - name: Verify frontend coverage blob 2
        run: test -s .vitest-reports/blob-2-2.json

      - name: Upload frontend coverage shard evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: frontend-coverage-blobs
          path: .vitest-reports/blob-*-2.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Verify both frontend coverage shards are present
        run: |
          test -s .vitest-reports/blob-1-2.json
          test -s .vitest-reports/blob-2-2.json

      - name: Merge frontend coverage (threshold-enforced)
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-coverage-merge.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-vitest-infrastructure-failure.sh "frontend coverage merge"
          scripts/ci/time-command.sh "frontend coverage merge"
          npm run test:coverage:merge -- .vitest-reports

      - name: Upload frontend coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write frontend coverage merge diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Frontend Coverage Merge"

      - name: Upload frontend coverage merge diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-frontend-coverage-merge
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-frontend-tests:
    name: Full Frontend Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.frontend_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [detect-changes, full-lane-ready, full-frontend-typechecks, full-frontend-coverage-merge]

    steps:
      - name: Check frontend lane result
        env:
          FULL_SCAN: ${{ needs.detect-changes.outputs.full_scan }}
          TEST_SUITE_CHANGED: ${{ needs.detect-changes.outputs.test_suite_changed }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
          FRONTEND_TYPECHECKS: ${{ needs.full-frontend-typechecks.result }}
          FRONTEND_COVERAGE: ${{ needs.full-frontend-coverage-merge.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"

            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"

            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          require_success "Full Frontend Typechecks" "$FRONTEND_TYPECHECKS"
          if [ "$FULL_SCAN" = "true" ] || [ "$TEST_SUITE_CHANGED" = "true" ] || [ "$FRONTEND_CHANGED" = "true" ]; then
            require_success "Full Frontend Coverage Merge" "$FRONTEND_COVERAGE"
          else
            allow_success_or_skipped "Full Frontend Coverage Merge" "$FRONTEND_COVERAGE"
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi

  full-gateway-tests:
    name: Full Gateway Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.gateway_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/gateway
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-command.sh "gateway npm ci"
          ${{ github.workspace }}/scripts/ci/time-command.sh "gateway npm ci"
          npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache

      - name: Build shared and gateway production path
        working-directory: ${{ github.workspace }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/gateway-build.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain \
            bash -euo pipefail <<'GATEWAY_BUILD'
          npm --workspace shared run build
          npm --workspace gateway run build
          GATEWAY_BUILD

      - name: Run gateway coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/gateway-coverage.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/time-command.sh "gateway coverage"
          npm run test:coverage

      - name: Upload gateway coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: gateway-coverage
          path: gateway/coverage/
          retention-days: 14

      - name: Write gateway diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Gateway"

      - name: Upload gateway diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-gateway
          path: .tmp/ci-diagnostics/gateway/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-llm-egress-proxy-tests:
    name: Full LLM Egress Proxy Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.llm_egress_proxy_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/llm-egress-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install root test dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/root-install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "LLM egress proxy root npm ci"
          scripts/ci/time-command.sh "LLM egress proxy root npm ci"
          npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache

      - name: Install LLM egress proxy dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/llm-egress-proxy-install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "LLM egress proxy npm ci"
          scripts/ci/time-command.sh "LLM egress proxy npm ci"
          npm --prefix llm-egress-proxy ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache-llm-egress-proxy

      - name: Build LLM egress proxy
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/llm-egress-proxy-build.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "LLM egress proxy build"
          npm --prefix llm-egress-proxy run build

      - name: Run LLM egress proxy tests with coverage
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/llm-egress-proxy-coverage.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-vitest-infrastructure-failure.sh "LLM egress proxy coverage"
          scripts/ci/time-command.sh "LLM egress proxy coverage"
          npm --prefix llm-egress-proxy run test:coverage -- --pool threads --maxWorkers=1 --no-file-parallelism

      - name: Upload LLM egress proxy coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: llm-egress-proxy-coverage
          path: |
            llm-egress-proxy/coverage/
            llm-egress-proxy/junit.xml
          retention-days: 14

      - name: Write LLM egress proxy diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "LLM Egress Proxy"

      - name: Upload LLM egress proxy diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-llm-egress-proxy
          path: .tmp/ci-diagnostics/llm-egress-proxy/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # Sharded Stryker runs (full lane). Each shard mutates a disjoint subset of
  # files so they can run in parallel. Reports are merged + gated by
  # `full-critical-mutation` below, which downstream `needs:` keep referencing
  # so existing branch protection / status checks need no changes.
  full-critical-mutation-shards:
    name: Full Critical Mutation Gate (shard ${{ matrix.shard }})
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.critical_mutation_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [detect-changes, full-lane-ready]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/critical-mutation-shard-${{ matrix.shard }}
      MUTATION_SHARD: ${{ matrix.shard }}
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Setup server dependencies
        uses: ./.github/actions/setup-server-deps

      # Stryker's `incremental: true` only helps when the cache file persists
      # across CI runs. Each shard has its own incremental file
      # (`.stryker-cache/critical-incremental.shard-N.json`) and its own cache
      # key prefix so shards don't invalidate each other's caches.
      - name: Restore Stryker incremental cache (shard ${{ matrix.shard }})
        uses: ./.github/actions/cache
        with:
          path: server/.stryker-cache
          key: stryker-critical-shard-${{ matrix.shard }}-${{ hashFiles('server/src/services/bitcoin/addressDerivation.ts', 'server/src/services/bitcoin/addressDerivation/**', 'server/src/services/bitcoin/psbtValidation.ts', 'server/src/services/bitcoin/psbtInfo.ts', 'server/src/services/bitcoin/validationEvidenceContracts.ts', 'server/src/services/bitcoin/transactions/broadcastContracts.ts', 'server/src/services/bitcoin/transactions/broadcasting.ts', 'server/src/services/bitcoin/blockchain/broadcastPreflight.ts', 'server/src/services/bitcoin/signingIntent/**', 'server/src/repositories/transactionSigningIntentRepository.ts', 'server/src/api/transactions/broadcasting.ts', 'server/src/middleware/auth.ts', 'server/src/services/accessControl.ts', 'server/scripts/mutation/shards.mjs', 'server/stryker.critical.config.mjs') }}
          restore-keys: |
            stryker-critical-shard-${{ matrix.shard }}-

      - name: Run critical mutation shard ${{ matrix.shard }}
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/critical-mutation-gate.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/time-command.sh "critical mutation shard ${{ matrix.shard }}"
          npm run test:mutation:critical:shard

      - name: Upload critical mutation shard report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: critical-mutation-report-shard-${{ matrix.shard }}
          path: server/reports/mutation/
          retention-days: 14

      - name: Write critical mutation shard diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Critical Mutation shard ${{ matrix.shard }}"

      - name: Upload critical mutation shard diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-critical-mutation-shard-${{ matrix.shard }}
          path: .tmp/ci-diagnostics/critical-mutation-shard-${{ matrix.shard }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-critical-mutation:
    name: Full Critical Mutation Gate
    # Runs whenever the shards finished (success OR failure). The first step
    # propagates a shard-level failure as a hard failure of the gate so a
    # broken shard cannot be silently observed as 'skipped' by the umbrella.
    if: >-
      always() &&
      (needs.full-critical-mutation-shards.result == 'success' ||
       needs.full-critical-mutation-shards.result == 'failure')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [detect-changes, full-lane-ready, full-critical-mutation-shards]
    defaults:
      run:
        working-directory: server

    steps:
      - name: Fail fast if any shard failed
        if: needs.full-critical-mutation-shards.result != 'success'
        run: |
          echo "::error::One or more Full Critical Mutation shards failed (result: ${{ needs.full-critical-mutation-shards.result }}). Refusing to run the aggregator so the gate cannot be silently bypassed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Download shard 1 report
        uses: ./.github/actions/download-artifact
        with:
          name: critical-mutation-report-shard-1
          path: server/reports/mutation/

      - name: Download shard 2 report
        uses: ./.github/actions/download-artifact
        with:
          name: critical-mutation-report-shard-2
          path: server/reports/mutation/

      - name: Download shard 3 report
        uses: ./.github/actions/download-artifact
        with:
          name: critical-mutation-report-shard-3
          path: server/reports/mutation/

      - name: Merge shard reports and run gate
        run: |
          npm run mutation:merge-shards
          node scripts/mutation/check-critical-mutation-gate.mjs

      - name: Upload merged critical mutation report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: critical-mutation-report
          path: server/reports/mutation/critical-mutation-report.json
          retention-days: 14

  full-browser-e2e-tests:
    name: Full Browser E2E Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.browser_smoke_changed == 'true' ||
       needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Serialized after full-backend-unit-coverage-shards so the two heavy full
    # lanes do not co-reside on the shared DIND daemon (see the
    # full-backend-integration-tests needs: comment for the OOM root cause).
    # The shards no longer hold a Postgres, so this is now about general runner
    # load rather than database memory, but the ordering still earns its keep:
    # this lane boots the real backend and a browser.
    # Ordering only; the always()-guarded `if:` above is unchanged.
    needs: [detect-changes, full-lane-ready, full-backend-unit-coverage-shards]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/browser-e2e

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: sanctuary-ci-${{ github.run_id }}-${{ github.run_attempt }}-browser-e2e
          POSTGRES_DB: sanctuary_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --memory 1g
          --memory-reservation 256m
          --shm-size 256m

      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install frontend dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-frontend-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "browser npm ci"
          scripts/ci/time-command.sh "browser npm ci"
          npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache

      - name: Cache Playwright browsers
        continue-on-error: true
        uses: ./.github/actions/cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-playwright.log"
          scripts/ci/time-command.sh "browser playwright install"
          scripts/ci/install-playwright-chromium.sh

      - name: Reserve browser API port
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/reserve-api-port.log" bash -c '
            api_port="$(node <<'"'"'NODE'"'"'
            const net = require("net");
            const server = net.createServer();
            server.listen(0, "127.0.0.1", () => {
              const address = server.address();
              if (!address || typeof address === "string") {
                throw new Error("Failed to reserve a TCP port");
              }
              console.log(address.port);
              server.close();
            });
          NODE
            )"
            echo "BROWSER_E2E_API_PORT=${api_port}" >> "$GITHUB_ENV"
            echo "BROWSER_E2E_API_URL=http://localhost:${api_port}/api/v1" >> "$GITHUB_ENV"
          '

      - name: Build frontend
        run: |
          VITE_API_URL="${BROWSER_E2E_API_URL:?}" \
            scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-build.log" \
            scripts/ci/with-runner-lock.sh node-toolchain \
            scripts/ci/time-command.sh "browser frontend build" \
            scripts/ci/retry-command.sh "browser frontend build" \
            npm run build

      - name: Resolve service endpoints
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          POSTGRES_PASSWORD: sanctuary-ci-${{ github.run_id }}-${{ github.run_attempt }}-browser-e2e
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-postgres.log" \
            scripts/ci/resolve-postgres-service.sh
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/resolve-redis.log" bash -c '
            if getent hosts redis >/dev/null 2>&1; then
              redis_host=redis
              redis_port=6379
            else
              redis_host=localhost
              redis_port="${REDIS_PORT:-6379}"
            fi

            echo "REDIS_URL=redis://${redis_host}:${redis_port}" >> "$GITHUB_ENV"
          '

      - name: Setup backend
        working-directory: server
        run: |
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/setup-server-dependencies.log" \
            "${{ github.workspace }}/scripts/ci/setup-server-dependencies.sh"
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/prisma-migrate.log" \
            "${{ github.workspace }}/scripts/ci/retry-command.sh" "browser prisma migrate" \
            "${{ github.workspace }}/scripts/ci/time-command.sh" "browser prisma migrate" \
            npx prisma migrate deploy

      - name: Build backend
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/backend-build.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-command.sh "browser backend build"
          ${{ github.workspace }}/scripts/ci/time-command.sh "browser backend build"
          npm --ignore-scripts run build

      - name: Run browser-flow E2E tests
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/browser-flow-e2e.log" scripts/ci/with-runner-lock.sh e2e bash -c '
            set -euo pipefail

            readonly api_port="${BROWSER_E2E_API_PORT:?}"
            BACKEND_PID=""

            cleanup_backend() {
              if [ -n "${BACKEND_PID:-}" ]; then
                kill -- "-${BACKEND_PID}" 2>/dev/null || kill "$BACKEND_PID" 2>/dev/null || true
                wait "$BACKEND_PID" 2>/dev/null || true
                BACKEND_PID=""
              fi
            }
            trap cleanup_backend EXIT

            backend_log=".tmp/browser-e2e-backend.log"
            mkdir -p "$(dirname "$backend_log")"
            setsid bash -c "cd server; PORT=\"\$1\" npm run start" _ "$api_port" >"$backend_log" 2>&1 &
            BACKEND_PID="$!"

            echo "Waiting for backend server..."
            for i in {1..60}; do
              if curl -s "http://localhost:${api_port}/health" > /dev/null 2>&1; then
                echo "Backend is ready!"
                break
              fi
              if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
                echo "Backend process exited before becoming ready"
                tail -200 "$backend_log" || true
                exit 1
              fi
              if [ "$i" -eq 60 ]; then
                echo "Backend failed to start"
                tail -200 "$backend_log" || true
                exit 1
              fi
              echo "Attempt $i: Backend not ready yet..."
              sleep 2
            done

            while IFS= read -r browser_group; do
              echo "::group::Browser E2E ${browser_group}"
              mapfile -t browser_specs < <(scripts/ci/browser-e2e-groups.sh "$browser_group")
              if [ "${#browser_specs[@]}" -eq 0 ]; then
                echo "No browser-flow E2E specs found for ${browser_group}."
                echo "::endgroup::"
                continue
              fi

              printf "Running browser-flow E2E group %s:\n" "$browser_group"
              printf "  %s\n" "${browser_specs[@]}"
              VITE_API_URL="${BROWSER_E2E_API_URL:?}" \
                scripts/ci/retry-playwright-infrastructure-failure.sh "browser-flow E2E ${browser_group}" \
                scripts/ci/time-command.sh "browser-flow E2E ${browser_group}" \
                npm run test:e2e -- --project=chromium "${browser_specs[@]}"

              echo "::endgroup::"
            done < <(scripts/ci/browser-e2e-groups.sh --groups)
          '
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!
          GATEWAY_SECRET: test-gateway-secret-for-ci-minimum-32-chars
          ENCRYPTION_SALT: test-encryption-salt-for-ci
          NODE_ENV: test
          CLIENT_URL: http://localhost:5173
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          ELECTRUM_HOST: 127.0.0.1
          ELECTRUM_PORT: '1'
          ELECTRUM_PROTOCOL: tcp
          ELECTRUM_CONNECTION_TIMEOUT_MS: '1000'
          ELECTRUM_REQUEST_TIMEOUT_MS: '1000'
          ELECTRUM_POOL_ENABLED: 'false'
          PRICE_PROVIDERS_ENABLED: mempool
          # E2E harness starts only the server, not the paired worker, so
          # disable the critical worker-heartbeat startup gate.
          WORKER_HEALTH_MONITOR_ENABLED: 'false'
          # Keep auth-dependent legacy specs skipped until seeded test auth users exist.
          SKIP_AUTH_TESTS: 'true'

      - name: Write browser E2E diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Browser E2E"

      - name: Upload browser E2E diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-browser-e2e
          path: .tmp/ci-diagnostics/browser-e2e/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-report-browser
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-results-browser
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  full-render-e2e-tests:
    name: Full Render E2E Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.full-browser-e2e-tests.result == 'success' ||
       (needs.full-browser-e2e-tests.result == 'skipped' &&
        needs.detect-changes.outputs.browser_smoke_changed != 'true' &&
        needs.detect-changes.outputs.full_scan != 'true' &&
        needs.detect-changes.outputs.test_suite_changed != 'true')) &&
      (needs.detect-changes.outputs.render_changed == 'true' ||
       needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [detect-changes, full-lane-ready, full-browser-e2e-tests]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/render-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "render npm ci"
          scripts/ci/time-command.sh "render npm ci"
          npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache

      - name: Cache Playwright browsers
        continue-on-error: true
        uses: ./.github/actions/cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-playwright.log"
          scripts/ci/time-command.sh "render playwright install"
          scripts/ci/install-playwright-chromium.sh

      - name: Build frontend
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-build.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "render frontend build"
          scripts/ci/retry-command.sh "render frontend build"
          npm run build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Run render regression E2E tests
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/render-regression-e2e.log"
          scripts/ci/with-runner-lock.sh e2e
          scripts/ci/retry-playwright-infrastructure-failure.sh "render regression E2E"
          scripts/ci/time-command.sh "render regression E2E"
          npm run test:e2e -- --project=chromium tests/e2e/render-regression.spec.ts
        env:
          CI: 'true'
          NODE_ENV: test
          VITE_API_URL: http://localhost:3001

      - name: Write render E2E diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Render E2E"

      - name: Upload render E2E diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-render-e2e
          path: .tmp/ci-diagnostics/render-e2e/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-report-render
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-results-render
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  full-build-check:
    name: Full Build Check
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.build_changed == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/build-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Build frontend
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-install-dependencies.log" \
            scripts/ci/with-runner-lock.sh node-toolchain \
            scripts/ci/retry-command.sh "build check frontend npm ci" \
            scripts/ci/time-command.sh "build check frontend npm ci" \
            npm ci --strict-allow-scripts --audit=false --fund=false --cache .tmp/npm-cache
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/frontend-build.log" \
            scripts/ci/with-runner-lock.sh node-toolchain \
            scripts/ci/retry-command.sh "build check frontend build" \
            scripts/ci/time-command.sh "build check frontend build" \
            npm run build

      - name: Build backend
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        working-directory: server
        run: |
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/setup-server-dependencies.log" \
            "${{ github.workspace }}/scripts/ci/setup-server-dependencies.sh"
          "${{ github.workspace }}/scripts/ci/run-with-log.sh" "$DIAGNOSTIC_DIR/backend-build.log" \
            "${{ github.workspace }}/scripts/ci/with-runner-lock.sh" node-toolchain \
            "${{ github.workspace }}/scripts/ci/retry-command.sh" "build check backend build" \
            "${{ github.workspace }}/scripts/ci/time-command.sh" "build check backend build" \
            npm --ignore-scripts run build

      - name: Write build-check diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Build Check"

      - name: Upload build-check diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-build-check
          path: .tmp/ci-diagnostics/build-check/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-test-summary:
    name: Full Test Summary
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [detect-changes, full-lane-ready, full-backend-tests, full-frontend-tests, full-gateway-tests, full-llm-egress-proxy-tests, full-critical-mutation, full-browser-e2e-tests, full-render-e2e-tests, full-build-check]

    steps:
      - name: Download backend coverage
        if: needs.full-backend-tests.result == 'success' || needs.full-backend-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: backend-coverage
          path: backend-results/

      - name: Download frontend coverage
        if: needs.full-frontend-tests.result == 'success' || needs.full-frontend-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: frontend-coverage
          path: frontend-results/

      - name: Download gateway coverage
        if: needs.full-gateway-tests.result == 'success' || needs.full-gateway-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: gateway-coverage
          path: gateway-results/

      - name: Download LLM egress proxy coverage
        if: needs.full-llm-egress-proxy-tests.result == 'success' || needs.full-llm-egress-proxy-tests.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: llm-egress-proxy-coverage
          path: llm-egress-proxy-results/

      - name: Download critical mutation report
        if: needs.full-critical-mutation.result == 'success' || needs.full-critical-mutation.result == 'failure'
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: critical-mutation-report
          path: mutation-results/

      - name: Generate summary
        run: |
          echo "## Full Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.full-backend-tests.result }}" = "success" ]; then
            echo "### Backend: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-backend-tests.result }}" = "skipped" ]; then
            echo "### Backend: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Backend: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f backend-results/coverage/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Backend Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' backend-results/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-frontend-tests.result }}" = "success" ]; then
            echo "### Frontend: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-frontend-tests.result }}" = "skipped" ]; then
            echo "### Frontend: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Frontend: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f frontend-results/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Frontend Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' frontend-results/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-gateway-tests.result }}" = "success" ]; then
            echo "### Gateway: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-gateway-tests.result }}" = "skipped" ]; then
            echo "### Gateway: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Gateway: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f gateway-results/coverage/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Gateway Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' gateway-results/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-llm-egress-proxy-tests.result }}" = "success" ]; then
            echo "### LLM Egress Proxy: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-llm-egress-proxy-tests.result }}" = "skipped" ]; then
            echo "### LLM Egress Proxy: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### LLM Egress Proxy: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f llm-egress-proxy-results/coverage/coverage-summary.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### LLM Egress Proxy Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' llm-egress-proxy-results/coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-build-check.result }}" = "success" ]; then
            echo "### Build Check: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-build-check.result }}" = "skipped" ]; then
            echo "### Build Check: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Build Check: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-browser-e2e-tests.result }}" = "success" ]; then
            echo "### Browser E2E: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-browser-e2e-tests.result }}" = "skipped" ]; then
            echo "### Browser E2E: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Browser E2E: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-render-e2e-tests.result }}" = "success" ]; then
            echo "### Render E2E: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-render-e2e-tests.result }}" = "skipped" ]; then
            echo "### Render E2E: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Render E2E: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.full-critical-mutation.result }}" = "success" ]; then
            echo "### Critical Mutation Gate: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.full-critical-mutation.result }}" = "skipped" ]; then
            echo "### Critical Mutation Gate: Skipped" >> $GITHUB_STEP_SUMMARY
            echo "No critical mutation paths changed for this merge candidate." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Critical Mutation Gate: Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check full lane result
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          FULL_LANE_READY: ${{ needs.full-lane-ready.result }}
          FULL_SCAN: ${{ needs.detect-changes.outputs.full_scan }}
          TEST_SUITE_CHANGED: ${{ needs.detect-changes.outputs.test_suite_changed }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend_changed }}
          CRITICAL_MUTATION_CHANGED: ${{ needs.detect-changes.outputs.critical_mutation_changed }}
          GATEWAY_CHANGED: ${{ needs.detect-changes.outputs.gateway_changed }}
          LLM_EGRESS_PROXY_CHANGED: ${{ needs.detect-changes.outputs.llm_egress_proxy_changed }}
          BROWSER_SMOKE_CHANGED: ${{ needs.detect-changes.outputs.browser_smoke_changed }}
          RENDER_CHANGED: ${{ needs.detect-changes.outputs.render_changed }}
          BUILD_CHANGED: ${{ needs.detect-changes.outputs.build_changed }}
          FULL_BACKEND_TESTS: ${{ needs.full-backend-tests.result }}
          FULL_FRONTEND_TESTS: ${{ needs.full-frontend-tests.result }}
          FULL_GATEWAY_TESTS: ${{ needs.full-gateway-tests.result }}
          FULL_LLM_EGRESS_PROXY_TESTS: ${{ needs.full-llm-egress-proxy-tests.result }}
          FULL_CRITICAL_MUTATION: ${{ needs.full-critical-mutation.result }}
          FULL_BROWSER_E2E_TESTS: ${{ needs.full-browser-e2e-tests.result }}
          FULL_RENDER_E2E_TESTS: ${{ needs.full-render-e2e-tests.result }}
          FULL_BUILD_CHECK: ${{ needs.full-build-check.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          allow_success_or_skipped() {
            name="$1"
            result="$2"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name result was $result; expected success or skipped"
                failed=true
                ;;
            esac
          }

          is_true() {
            [ "${1:-}" = "true" ]
          }

          require_when_relevant() {
            name="$1"
            result="$2"
            relevant="$3"

            if [ "$relevant" = "true" ]; then
              require_success "$name" "$result"
            else
              allow_success_or_skipped "$name" "$result"
            fi
          }

          backend_required=false
          frontend_required=false
          gateway_required=false
          llm_egress_proxy_required=false
          critical_mutation_required=false
          browser_e2e_required=false
          render_e2e_required=false
          build_required=false

          if is_true "$FULL_SCAN"; then
            backend_required=true
            frontend_required=true
            gateway_required=true
            llm_egress_proxy_required=true
            critical_mutation_required=true
            browser_e2e_required=true
            render_e2e_required=true
            build_required=true
          fi

          if is_true "$TEST_SUITE_CHANGED"; then
            backend_required=true
            frontend_required=true
            gateway_required=true
            llm_egress_proxy_required=true
            browser_e2e_required=true
            render_e2e_required=true
            build_required=true
          fi

          if is_true "$BACKEND_CHANGED"; then
            backend_required=true
          fi

          if is_true "$FRONTEND_CHANGED"; then
            frontend_required=true
          fi

          if is_true "$GATEWAY_CHANGED"; then
            gateway_required=true
          fi

          if is_true "$LLM_EGRESS_PROXY_CHANGED"; then
            llm_egress_proxy_required=true
          fi

          if is_true "$CRITICAL_MUTATION_CHANGED"; then
            critical_mutation_required=true
          fi

          if is_true "$BROWSER_SMOKE_CHANGED"; then
            browser_e2e_required=true
          fi

          if is_true "$RENDER_CHANGED"; then
            render_e2e_required=true
          fi

          if is_true "$BUILD_CHANGED"; then
            build_required=true
          fi

          require_success "Detect Changed Files" "$DETECT_CHANGES"
          require_success "Full Lane Ready" "$FULL_LANE_READY"
          require_when_relevant "Full Backend Tests" "$FULL_BACKEND_TESTS" "$backend_required"
          require_when_relevant "Full Frontend Tests" "$FULL_FRONTEND_TESTS" "$frontend_required"
          require_when_relevant "Full Gateway Tests" "$FULL_GATEWAY_TESTS" "$gateway_required"
          require_when_relevant "Full LLM Egress Proxy Tests" "$FULL_LLM_EGRESS_PROXY_TESTS" "$llm_egress_proxy_required"
          require_when_relevant "Full Critical Mutation Gate" "$FULL_CRITICAL_MUTATION" "$critical_mutation_required"
          require_when_relevant "Full Browser E2E Tests" "$FULL_BROWSER_E2E_TESTS" "$browser_e2e_required"
          require_when_relevant "Full Render E2E Tests" "$FULL_RENDER_E2E_TESTS" "$render_e2e_required"
          require_when_relevant "Full Build Check" "$FULL_BUILD_CHECK" "$build_required"

          if [ "$failed" = "true" ]; then
            exit 1
          fi
