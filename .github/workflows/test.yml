          if-no-files-found: ignore
          retention-days: 7

      - name: Upload quick browser Playwright results
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-results-quick-browser
          path: .tmp/quick-browser-artifacts/${{ github.run_id }}/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup quick browser artifacts
        if: always()
        run: rm -rf ".tmp/quick-browser-artifacts/${{ github.run_id }}" || echo "::warning::Could not fully remove quick browser artifacts"

  quick-render-regression:
    name: Quick Render Regression
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.render_changed == 'true' &&
      (needs.quick-browser-smoke.result == 'success' ||
       needs.quick-browser-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [detect-changes, quick-browser-smoke]
    timeout-minutes: 30
    env:
      DIAGNOSTIC_DIR: .tmp/ci-diagnostics/quick-render

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Cache Playwright browsers
        continue-on-error: true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run quick render regression
        env:
          CI: 'true'
          NODE_ENV: test
          SANCTUARY_RUNNER_LOCK_TIMEOUT_SECONDS: '1200'
          VITE_API_URL: http://localhost:3001
        run: |
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/quick-render-regression.log" scripts/ci/with-runner-lock.sh e2e scripts/ci/run-in-isolated-workspace.sh --keep-on-failure quick-render bash -c '
            set -euo pipefail
            collect_artifacts() {
              scripts/ci/collect-playwright-artifacts.sh quick-render || echo "::warning::Could not collect quick render Playwright artifacts"
            }
            trap collect_artifacts EXIT
            scripts/ci/with-runner-lock.sh node-toolchain scripts/ci/retry-command.sh "quick render npm ci" scripts/ci/time-command.sh "quick render npm ci" npm ci --audit=false --fund=false --cache .tmp/npm-cache
            scripts/ci/time-command.sh "quick render playwright install" scripts/ci/install-playwright-chromium.sh
            scripts/ci/time-command.sh "quick render frontend build" scripts/ci/retry-command.sh "quick render frontend build" npm run build
            scripts/ci/retry-playwright-infrastructure-failure.sh "quick render regression" scripts/ci/time-command.sh "quick render regression" npm run test:e2e -- --project=chromium e2e/render-regression.spec.ts
          '

      - name: Write quick render diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quick Render"

      - name: Upload quick render diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quick-render
          path: ${{ env.DIAGNOSTIC_DIR }}/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Upload quick render Playwright report
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-report-quick-render
