        uses: ./.github/actions/setup-node-toolchain

      - name: Install dependencies
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/retry-command.sh "gateway npm ci"
          ${{ github.workspace }}/scripts/ci/time-command.sh "gateway npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Run gateway coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/gateway-coverage.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/time-command.sh "gateway coverage"
          npm run test:coverage

      - name: Upload gateway coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: gateway-coverage
          path: gateway/coverage/
          retention-days: 14

      - name: Write gateway diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Gateway"

      - name: Upload gateway diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-gateway
          path: .tmp/ci-diagnostics/gateway/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  full-ai-proxy-tests:
    name: Full AI Proxy Tests
    if: >-
      always() &&
      needs.full-lane-ready.result == 'success' &&
      (needs.detect-changes.outputs.full_scan == 'true' ||
       needs.detect-changes.outputs.test_suite_changed == 'true' ||
       needs.detect-changes.outputs.ai_proxy_changed == 'true')
    runs-on: ubuntu-latest
    needs: [detect-changes, full-lane-ready]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/ai-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Install root test dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/root-install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "AI proxy root npm ci"
          scripts/ci/time-command.sh "AI proxy root npm ci"
          npm ci --audit=false --fund=false --cache .tmp/npm-cache

      - name: Install AI proxy dependencies
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/ai-proxy-install-dependencies.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-command.sh "AI proxy npm ci"
          scripts/ci/time-command.sh "AI proxy npm ci"
          npm --prefix ai-proxy ci --audit=false --fund=false --cache .tmp/npm-cache-ai-proxy

      - name: Build AI proxy
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/ai-proxy-build.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/time-command.sh "AI proxy build"
          npm --prefix ai-proxy run build

      - name: Run AI proxy tests with coverage
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/ai-proxy-coverage.log"
          scripts/ci/with-runner-lock.sh node-toolchain
          scripts/ci/retry-vitest-infrastructure-failure.sh "AI proxy coverage"
          scripts/ci/time-command.sh "AI proxy coverage"
          npm --prefix ai-proxy run test:coverage -- --pool threads --maxWorkers=1 --no-file-parallelism

      - name: Upload AI proxy coverage
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: ai-proxy-coverage
          path: |
            ai-proxy/coverage/
            ai-proxy/junit.xml
