            set -euo pipefail
            collect_artifacts() {
              scripts/ci/collect-playwright-artifacts.sh quick-browser || echo "::warning::Could not collect quick browser Playwright artifacts"
            }
            trap collect_artifacts EXIT
            scripts/ci/with-runner-lock.sh node-toolchain scripts/ci/retry-command.sh "quick browser npm ci" scripts/ci/time-command.sh "quick browser npm ci" npm ci --audit=false --fund=false --cache .tmp/npm-cache
            scripts/ci/time-command.sh "quick browser playwright install" scripts/ci/install-playwright-chromium.sh
            scripts/ci/time-command.sh "quick browser frontend build" scripts/ci/retry-command.sh "quick browser frontend build" npm run build
            scripts/ci/retry-playwright-infrastructure-failure.sh "quick browser smoke" scripts/ci/time-command.sh "quick browser smoke" npm run test:e2e -- --project=chromium e2e/admin-drafts-smoke.spec.ts
