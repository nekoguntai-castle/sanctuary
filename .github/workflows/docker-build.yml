name: Validate Docker Images

# Builds the selected frontend and backend images without publishing them.
# Versioned release images are published only by the trusted operator command.

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'shared/**'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
      - '!server/*.mdx'
      - '!server/**/*.mdx'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'gateway/package.json'
      - 'package*.json'
      - 'config/tooling/**'
      - 'scripts/ci/classify-docker-build-images.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'scripts/ci/publish-failed-logs.sh'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'shared/**'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
      - '!server/*.mdx'
      - '!server/**/*.mdx'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'gateway/package.json'
      - 'package*.json'
      - 'config/tooling/**'
      - 'scripts/ci/classify-docker-build-images.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'scripts/ci/publish-failed-logs.sh'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  SANCTUARY_CI_LOG_SINK_URL: ${{ vars.SANCTUARY_CI_LOG_SINK_URL }}
  SANCTUARY_CI_LOG_SINK_TOKEN: ${{ secrets.SANCTUARY_CI_LOG_SINK_TOKEN }}

jobs:
  detect-image-scope:
    name: Detect Image Scope
    runs-on: ubuntu-latest
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/docker-build-detect-image-scope
    outputs:
      frontend_image: ${{ steps.classify.outputs.frontend_image }}
      backend_image: ${{ steps.classify.outputs.backend_image }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Classify image scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/classify-image-scope.log" bash scripts/ci/classify-docker-build-images.sh

      - name: Write image scope diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Docker Build Image Scope"

      - name: Upload image scope diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-docker-build-detect-image-scope
          path: .tmp/ci-diagnostics/docker-build-detect-image-scope/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  build-frontend:
    name: Validate frontend image
    if: needs.detect-image-scope.outputs.frontend_image == 'true'
    runs-on: ubuntu-22.04
    needs: [detect-image-scope]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/docker-build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate platform-specific README
        run: |
          chmod +x scripts/generate-readme.sh
          ./scripts/generate-readme.sh github

      - name: Resolve Docker host
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          scripts/ci/wait-for-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build frontend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: ./docker/frontend/Dockerfile
          push: false
          outputs: type=cacheonly
          tags: sanctuary-ci/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true

  build-backend:
    name: Validate backend image
    if: |
      always() &&
      needs.detect-image-scope.outputs.backend_image == 'true' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-22.04
    needs: [detect-image-scope, build-frontend]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/docker-build-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate platform-specific README
        run: |
          chmod +x scripts/generate-readme.sh
          ./scripts/generate-readme.sh github

      - name: Resolve Docker host
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          scripts/ci/wait-for-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build backend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          outputs: type=cacheonly
          tags: sanctuary-ci/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

  summary:
    name: Docker image validation summary
    runs-on: ubuntu-22.04
    needs: [detect-image-scope, build-frontend, build-backend]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Docker Image Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reason: ${{ needs.detect-image-scope.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "No image was pushed and no registry credentials were used." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend image: ${{ needs.build-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend image: ${{ needs.build-backend.result }}" >> $GITHUB_STEP_SUMMARY
