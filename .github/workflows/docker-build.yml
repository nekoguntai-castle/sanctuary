name: Validate Docker Images

# Builds and smoke-tests every selected shipped image without publishing it.
# Versioned release images are published only by the trusted operator command.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'shared/**'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
      - '!server/*.mdx'
      - '!server/**/*.mdx'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'gateway/package.json'
      - 'gateway/**'
      - 'llm-egress-proxy/**'
      - 'package*.json'
      - 'config/tooling/**'
      - 'config/container-image-lock.json'
      - 'config/resource-ownership-contract.json'
      - 'config/operator-recovery-contract.json'
      - 'config/operator-recovery-incident.json'
      - 'scripts/ci/build-runtime-image.sh'
      - 'scripts/ci/cleanup-ci-callsite.sh'
      - 'scripts/ci/write-runtime-image-evidence.mjs'
      - 'scripts/ci/classify-docker-build-images.sh'
      - 'scripts/ci/validate-docker-build-results.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'scripts/ownership/**'
      - 'scripts/ops/migrate-grafana-password.sh'
      - 'scripts/ops/run-grafana-password-migration.sh'
      - 'scripts/ops/grafana-quiescence-records.sh'
      - 'scripts/offline/bundle-common.sh'
      - 'scripts/offline/create-bundle.sh'
      - '.github/actions/verify-cleanup-receipt/**'
      - '.github/actions/upload-cleanup-evidence/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'shared/**'
      - 'server/**'
      - '!server/*.md'
      - '!server/**/*.md'
      - '!server/*.mdx'
      - '!server/**/*.mdx'
      - 'docker/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'gateway/package.json'
      - 'gateway/**'
      - 'llm-egress-proxy/**'
      - 'package*.json'
      - 'config/tooling/**'
      - 'config/container-image-lock.json'
      - 'config/resource-ownership-contract.json'
      - 'config/operator-recovery-contract.json'
      - 'config/operator-recovery-incident.json'
      - 'scripts/ci/build-runtime-image.sh'
      - 'scripts/ci/cleanup-ci-callsite.sh'
      - 'scripts/ci/write-runtime-image-evidence.mjs'
      - 'scripts/ci/classify-docker-build-images.sh'
      - 'scripts/ci/validate-docker-build-results.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'scripts/ownership/**'
      - 'scripts/ops/migrate-grafana-password.sh'
      - 'scripts/ops/run-grafana-password-migration.sh'
      - 'scripts/ops/grafana-quiescence-records.sh'
      - 'scripts/offline/bundle-common.sh'
      - 'scripts/offline/create-bundle.sh'
      - '.github/actions/verify-cleanup-receipt/**'
      - '.github/actions/upload-cleanup-evidence/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  detect-image-scope:
    name: Detect Image Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/docker-build-detect-image-scope
    outputs:
      frontend_image: ${{ steps.classify.outputs.frontend_image }}
      backend_image: ${{ steps.classify.outputs.backend_image }}
      gateway_image: ${{ steps.classify.outputs.gateway_image }}
      llm_egress_proxy_image: ${{ steps.classify.outputs.llm_egress_proxy_image }}
      grafana_migration_image: ${{ steps.classify.outputs.grafana_migration_image }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Classify image scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/classify-image-scope.log" bash scripts/ci/classify-docker-build-images.sh

      - name: Write image scope diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Docker Build Image Scope"

      - name: Upload image scope diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-docker-build-detect-image-scope
          path: .tmp/ci-diagnostics/docker-build-detect-image-scope/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  build-frontend:
    name: Validate frontend image
    if: needs.detect-image-scope.outputs.frontend_image == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [detect-image-scope]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/docker-build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate platform-specific README
        run: |
          chmod +x scripts/generate-readme.sh
          ./scripts/generate-readme.sh github

      - name: Resolve Docker host
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          scripts/ci/wait-for-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build, smoke, and attest frontend
        run: >
          scripts/ci/cleanup-ci-callsite.sh run
          --lane runtime-image-frontend
          --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/runtime-image-frontend"
          --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/runtime-image-frontend"
          -- scripts/ci/build-runtime-image.sh frontend docker/frontend/Dockerfile . sanctuary-ci/frontend

      - name: Upload frontend image evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: runtime-image-evidence-frontend
          path: .tmp/runtime-image-evidence/frontend/

      - name: Require frontend final cleanup evidence
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-frontend

      - name: Upload frontend cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-runtime-image-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-frontend/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-frontend
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  build-backend:
    name: Validate backend image
    if: |
      always() &&
      needs.detect-image-scope.outputs.backend_image == 'true' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [detect-image-scope, build-frontend]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/docker-build-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate platform-specific README
        run: |
          chmod +x scripts/generate-readme.sh
          ./scripts/generate-readme.sh github

      - name: Resolve Docker host
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          scripts/ci/wait-for-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build, smoke, and attest backend
        run: >
          scripts/ci/cleanup-ci-callsite.sh run
          --lane runtime-image-backend
          --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/runtime-image-backend"
          --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/runtime-image-backend"
          -- scripts/ci/build-runtime-image.sh backend server/Dockerfile . sanctuary-ci/backend

      - name: Upload backend image evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: runtime-image-evidence-backend
          path: .tmp/runtime-image-evidence/backend/

      - name: Require backend final cleanup evidence
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-backend

      - name: Upload backend cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-runtime-image-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-backend/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-backend
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  build-gateway:
    name: Validate gateway image
    if: needs.detect-image-scope.outputs.gateway_image == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-image-scope]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Resolve Docker host
        run: scripts/ci/wait-for-docker.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build, smoke, and attest gateway
        run: >
          scripts/ci/cleanup-ci-callsite.sh run
          --lane runtime-image-gateway
          --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/runtime-image-gateway"
          --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/runtime-image-gateway"
          -- scripts/ci/build-runtime-image.sh gateway gateway/Dockerfile . sanctuary-ci/gateway
      - name: Upload gateway image evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: runtime-image-evidence-gateway
          path: .tmp/runtime-image-evidence/gateway/
      - name: Require gateway final cleanup evidence
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-gateway
      - name: Upload gateway cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-runtime-image-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-gateway/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-gateway
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  build-llm-egress-proxy:
    name: Validate LLM egress proxy image
    if: needs.detect-image-scope.outputs.llm_egress_proxy_image == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-image-scope]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Resolve Docker host
        run: scripts/ci/wait-for-docker.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build, smoke, and attest LLM egress proxy
        run: >
          scripts/ci/cleanup-ci-callsite.sh run
          --lane runtime-image-llm-egress-proxy
          --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/runtime-image-llm-egress-proxy"
          --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/runtime-image-llm-egress-proxy"
          -- scripts/ci/build-runtime-image.sh llm-egress-proxy llm-egress-proxy/Dockerfile llm-egress-proxy sanctuary-ci/llm-egress-proxy
      - name: Upload LLM egress proxy image evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: runtime-image-evidence-llm-egress-proxy
          path: .tmp/runtime-image-evidence/llm-egress-proxy/
      - name: Require LLM egress proxy final cleanup evidence
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-llm-egress-proxy
      - name: Upload LLM egress proxy cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-runtime-image-llm-egress-proxy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-llm-egress-proxy/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-llm-egress-proxy
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  build-grafana-migration:
    name: Validate Grafana migration image
    if: |
      always() &&
      needs.detect-image-scope.result == 'success' &&
      needs.detect-image-scope.outputs.grafana_migration_image == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [detect-image-scope]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/docker-build-grafana-migration

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Resolve Docker host
        run: >
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          scripts/ci/wait-for-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build, smoke, and attest Grafana migration helper
        run: >
          scripts/ci/cleanup-ci-callsite.sh run
          --lane runtime-image-grafana-migration
          --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/runtime-image-grafana-migration"
          --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/runtime-image-grafana-migration"
          -- scripts/ci/build-runtime-image.sh grafana-migration docker/grafana-migration/Dockerfile . sanctuary-ci/grafana-migration

      - name: Upload Grafana migration image evidence
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: runtime-image-evidence-grafana-migration
          path: .tmp/runtime-image-evidence/grafana-migration/

      - name: Require Grafana migration final cleanup evidence
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-grafana-migration

      - name: Upload Grafana migration cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-runtime-image-grafana-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-grafana-migration/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/runtime-image-grafana-migration
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  summary:
    name: Docker image validation summary
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [detect-image-scope, build-frontend, build-backend, build-gateway, build-llm-egress-proxy, build-grafana-migration]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Summary
        env:
          DETECT_RESULT: ${{ needs.detect-image-scope.result }}
          FRONTEND_REQUESTED: ${{ needs.detect-image-scope.outputs.frontend_image }}
          BACKEND_REQUESTED: ${{ needs.detect-image-scope.outputs.backend_image }}
          GRAFANA_MIGRATION_REQUESTED: ${{ needs.detect-image-scope.outputs.grafana_migration_image }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          BACKEND_RESULT: ${{ needs.build-backend.result }}
          GATEWAY_REQUESTED: ${{ needs.detect-image-scope.outputs.gateway_image }}
          GATEWAY_RESULT: ${{ needs.build-gateway.result }}
          LLM_EGRESS_PROXY_REQUESTED: ${{ needs.detect-image-scope.outputs.llm_egress_proxy_image }}
          LLM_EGRESS_PROXY_RESULT: ${{ needs.build-llm-egress-proxy.result }}
          GRAFANA_MIGRATION_RESULT: ${{ needs.build-grafana-migration.result }}
        run: |
          echo "## Docker Image Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reason: ${{ needs.detect-image-scope.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "No image was pushed and no registry credentials were used." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend image: ${{ needs.build-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend image: ${{ needs.build-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gateway image: ${{ needs.build-gateway.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- LLM egress proxy image: ${{ needs.build-llm-egress-proxy.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Grafana migration image: ${{ needs.build-grafana-migration.result }}" >> "$GITHUB_STEP_SUMMARY"

          scripts/ci/validate-docker-build-results.sh \
            "$DETECT_RESULT" \
            "$FRONTEND_REQUESTED" "$FRONTEND_RESULT" \
            "$BACKEND_REQUESTED" "$BACKEND_RESULT" \
            "$GATEWAY_REQUESTED" "$GATEWAY_RESULT" \
            "$LLM_EGRESS_PROXY_REQUESTED" "$LLM_EGRESS_PROXY_RESULT" \
            "$GRAFANA_MIGRATION_REQUESTED" "$GRAFANA_MIGRATION_RESULT"
