name: Architecture

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/ARCHITECTURE.md'
      - 'README.md'
      - 'docs/**'
      - '.github/CONTRIBUTING.md'
      - 'config/tooling/dependency-cruiser.cjs'
      - 'server/.dependency-cruiser.cjs'
      - 'gateway/.dependency-cruiser.cjs'
      - 'config/tooling/tsconfig.app.json'
      - 'config/wallet-sync-lifecycle-contract.json'
      - 'config/wallet-sync-mutation-boundaries.json'
      - 'config/resource-ownership-contract.json'
      - 'config/resource-lifecycle-callsites.json'
      - 'config/application-lifecycle-authorities.json'
      - 'server/prisma/schema.prisma'
      - 'server/prisma/migrations/**'
      - 'server/tsconfig.json'
      - 'gateway/tsconfig.json'
      - 'scripts/architecture/**'
      - 'scripts/quality/architecture-boundary-exceptions.json'
      - 'scripts/quality/server-cycle-baseline.json'
      - 'scripts/check-wallet-sync-lifecycle-contract.mjs'
      - 'scripts/check-wallet-sync-mutation-boundaries.mjs'
      - 'scripts/ownership/**'
      - 'tests/ownership/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'scripts/ci/create-isolated-workspace.sh'
      - 'scripts/ci/classify-architecture-scope.sh'
      - 'scripts/ci/retry-command.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/time-command.sh'
      - 'scripts/ci/record-command-timing.mjs'
      - 'scripts/ci/with-runner-lock.sh'
      - 'scripts/ci/aggregate-runner-locks.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - '.github/ci-performance-budget.json'
      - '.github/workflows/architecture.yml'
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/ARCHITECTURE.md'
      - 'README.md'
      - 'docs/**'
      - '.github/CONTRIBUTING.md'
      - 'config/tooling/dependency-cruiser.cjs'
      - 'server/.dependency-cruiser.cjs'
      - 'gateway/.dependency-cruiser.cjs'
      - 'config/tooling/tsconfig.app.json'
      - 'config/wallet-sync-lifecycle-contract.json'
      - 'config/wallet-sync-mutation-boundaries.json'
      - 'config/resource-ownership-contract.json'
      - 'config/resource-lifecycle-callsites.json'
      - 'config/application-lifecycle-authorities.json'
      - 'server/prisma/schema.prisma'
      - 'server/prisma/migrations/**'
      - 'server/tsconfig.json'
      - 'gateway/tsconfig.json'
      - 'scripts/architecture/**'
      - 'scripts/quality/architecture-boundary-exceptions.json'
      - 'scripts/quality/server-cycle-baseline.json'
      - 'scripts/check-wallet-sync-lifecycle-contract.mjs'
      - 'scripts/check-wallet-sync-mutation-boundaries.mjs'
      - 'scripts/ownership/**'
      - 'tests/ownership/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'scripts/ci/create-isolated-workspace.sh'
      - 'scripts/ci/classify-architecture-scope.sh'
      - 'scripts/ci/retry-command.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/time-command.sh'
      - 'scripts/ci/record-command-timing.mjs'
      - 'scripts/ci/with-runner-lock.sh'
      - 'scripts/ci/aggregate-runner-locks.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - '.github/ci-performance-budget.json'
      - '.github/workflows/architecture.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_VERSION: '24.19.0'
  NPM_VERSION: '11.19.0'
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2

jobs:
  build:
    name: Architecture and docs validation
    runs-on: ubuntu-20.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Determine architecture validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "::warning::Could not resolve the event base commit; running both architecture scopes"
            printf 'core=true\ndocs=true\n' >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | \
              scripts/ci/classify-architecture-scope.sh >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare architecture workspace
        run: |
          ARCH_WORKDIR="$(scripts/ci/create-isolated-workspace.sh architecture)"
          ARCH_ROOT="$(dirname "$ARCH_WORKDIR")"
          echo "ARCH_WORKDIR=$ARCH_WORKDIR" >> "$GITHUB_ENV"
          echo "ARCH_ROOT=$ARCH_ROOT" >> "$GITHUB_ENV"

      - name: Install application workspace dependencies
        if: steps.scope.outputs.core == 'true'
        run: |
          DIAGNOSTIC_DIR=".tmp/ci-diagnostics/architecture"
          mkdir -p "$DIAGNOSTIC_DIR"
          # Use heredoc form (quoted delimiter, no inner-shell apostrophe risk)
          # instead of `bash -c '...'`. Phase G's apostrophe-in-comment bug was a
          # direct hit on this exact pattern; heredoc with 'EOF' eliminates the
          # entire class.
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash -euo pipefail <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          # Root npm ci installs all workspaces (shared, server, gateway).
          # Per-package npm ci is redundant and broken because workspace deps
          # don't publish to the npm registry.
          scripts/ci/retry-command.sh "root npm ci" npm ci --strict-allow-scripts --audit=false --fund=false --cache "$ARCH_WORKDIR/.npm-cache/root"
          INNER

      - name: Install docs-site dependencies
        if: steps.scope.outputs.docs == 'true'
        run: |
          DIAGNOSTIC_DIR=".tmp/ci-diagnostics/architecture"
          mkdir -p "$DIAGNOSTIC_DIR"
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-docs-dependencies.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash -euo pipefail <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "docs-site npm ci" npm --prefix docs/site ci --strict-allow-scripts --audit=false --fund=false --cache "$ARCH_WORKDIR/.npm-cache/docs-site"
          INNER

      - name: Lint diagram click hrefs
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/lint-diagrams.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          npm run arch:lint
          INNER

      - name: Enforce runtime architecture boundaries
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/runtime-boundaries.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          npm run check:architecture-boundaries
          INNER

      - name: Enforce wallet sync lifecycle contract
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/wallet-sync-lifecycle-contract.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          npm run check:wallet-sync-lifecycle-contract
          INNER

      - name: Enforce wallet sync mutation boundaries
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/wallet-sync-mutation-boundaries.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          npm run check:wallet-sync-mutation-boundaries
          node --test tests/ci/check-wallet-sync-mutation-boundaries.test.mjs
          INNER

      - name: Enforce resource ownership contract
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/resource-ownership-contract.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          npm run check:resource-ownership-contract
          npm run test:ownership
          INNER

      - name: Enforce repository-owned Prisma access
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/prisma-imports.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          npm --workspace server run check:prisma-imports
          INNER

      - name: Enforce server dependency cycle baseline
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/server-cycle-baseline.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          npm run check:server-cycle-baseline
          INNER

      - name: Warn on diagram drift (changed files referenced by C4 diagrams)
        if: github.event_name == 'pull_request' && steps.scope.outputs.core == 'true'
        # Non-blocking — surfaces a job-summary warning when a PR touches a
        # file referenced by a hand-authored diagram without also updating
        # the diagram. Author confirms the diagram is still accurate or
        # amends it; not every code change to a diagrammed file requires a
        # diagram update (refactors, bug fixes, test additions).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cd "$ARCH_WORKDIR"
          node scripts/architecture/detect-drift.mjs "$BASE_SHA"

      - name: Regenerate dependency graphs
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/dependency-graphs.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash -euo pipefail <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "architecture dependency graphs" npm run arch:graphs
          INNER

      - name: Regenerate function-level call graphs
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/call-graphs.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash -euo pipefail <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "architecture call graphs" npm run arch:calls
          INNER

      - name: Detect stale generated graphs
        if: steps.scope.outputs.core == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/stale-generated-graphs.log" \
            bash -euo pipefail <<'INNER'
          cd "$ARCH_WORKDIR"
          if ! git diff --exit-code -- docs/architecture/generated; then
            echo "::error::Generated architecture graphs are stale. Run 'npm run arch:graphs && npm run arch:calls' locally and commit the result."
            echo "--- BEGIN DIFF ---"
            git diff -- docs/architecture/generated/ | head -300
            echo "--- END DIFF ---"
            exit 1
          fi
          INNER

      - name: Collect architecture diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          diagnostic_dir="$GITHUB_WORKSPACE/.tmp/ci-diagnostics/architecture"
          mkdir -p "$diagnostic_dir"

          if [ -z "${ARCH_WORKDIR:-}" ] || [ ! -d "$ARCH_WORKDIR" ]; then
            {
              echo "BREADCRUMB: the isolated architecture workspace was not created."
              echo "Inspect checkout and workspace-preparation output in the native job log."
            } > "$diagnostic_dir/BREADCRUMB-UPSTREAM-FAILURE.txt"
            exit 0
          fi

          cd "$ARCH_WORKDIR"
          shopt -s nullglob
          log_files=("$diagnostic_dir"/*.log)
          shopt -u nullglob
          if [ ${#log_files[@]} -eq 0 ]; then
            {
              echo "BREADCRUMB: no run-with-log.sh wrapper produced a log file."
              echo "The failure occurred before a wrapped command; inspect the native job log."
              echo "ARCH_WORKDIR=$ARCH_WORKDIR"
              echo "pwd=$(pwd)"
            } > "$diagnostic_dir/BREADCRUMB-UPSTREAM-FAILURE.txt"
          fi

          git diff -- docs/architecture/generated > "$diagnostic_dir/full-diff.txt" 2>&1 || true
          for graph in frontend server gateway; do
            source="docs/architecture/generated/${graph}.md"
            if [ -f "$source" ]; then
              cp "$source" "$diagnostic_dir/${graph}.regenerated.md"
            fi
          done
          {
            ls -la "$diagnostic_dir" 2>&1
            echo "---"
            node --version
            npm --version
            uname -a
            pwd
          } > "$diagnostic_dir/env.txt" 2>&1

      - name: Typecheck Docusaurus site
        if: steps.scope.outputs.docs == 'true'
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/docs-typecheck.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash -euo pipefail <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "docs typecheck" scripts/ci/time-command.sh "docs typecheck" npm --prefix docs/site run typecheck
          INNER

      - name: Build Docusaurus site
        if: steps.scope.outputs.docs == 'true'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/docs-build.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash -euo pipefail <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "docs build" npm --prefix docs/site run build
          INNER

      - name: Write architecture diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh ".tmp/ci-diagnostics/architecture" "Architecture"

      - name: Upload architecture diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-architecture
          path: .tmp/ci-diagnostics/architecture/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Clean architecture workspace
        if: always()
        run: |
          if [ -n "${ARCH_ROOT:-}" ] && [ -d "$ARCH_ROOT" ]; then
            rm -rf "$ARCH_ROOT" || echo "::warning::Could not fully remove architecture temp workspace"
          fi
