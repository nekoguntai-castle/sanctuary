name: Architecture

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/ARCHITECTURE.md'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'config/tooling/dependency-cruiser.cjs'
      - 'server/.dependency-cruiser.cjs'
      - 'gateway/.dependency-cruiser.cjs'
      - 'scripts/architecture/**'
      - 'scripts/ci/create-isolated-workspace.sh'
      - 'scripts/ci/retry-command.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'website/**'
      - '.github/workflows/architecture.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_VERSION: '24'
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2
  SANCTUARY_CI_LOG_SINK_URL: ${{ vars.SANCTUARY_CI_LOG_SINK_URL }}
  SANCTUARY_CI_LOG_SINK_TOKEN: ${{ secrets.SANCTUARY_CI_LOG_SINK_TOKEN }}

jobs:
  build:
    name: Lint diagrams, regenerate graphs, build site
    runs-on: ubuntu-20.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Check Node.js
        run: |
          node --version
          npm --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== Number(process.env.NODE_VERSION)) { throw new Error(`Expected Node ${process.env.NODE_VERSION}, got ${process.version}`); }'

      - name: Prepare architecture workspace
        run: |
          ARCH_WORKDIR="$(scripts/ci/create-isolated-workspace.sh architecture)"
          ARCH_ROOT="$(dirname "$ARCH_WORKDIR")"
          echo "ARCH_WORKDIR=$ARCH_WORKDIR" >> "$GITHUB_ENV"
          echo "ARCH_ROOT=$ARCH_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies (root, server, gateway, website)
        run: |
          DIAGNOSTIC_DIR=".tmp/ci-diagnostics/architecture"
          mkdir -p "$DIAGNOSTIC_DIR"
          # Use heredoc form (quoted delimiter, no inner-shell apostrophe risk)
          # instead of `bash -c '...'`. Phase G's apostrophe-in-comment bug was a
          # direct hit on this exact pattern; heredoc with 'EOF' eliminates the
          # entire class.
          scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-dependencies.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          # Phase B: root npm ci installs all workspaces (shared, server, gateway).
          # Per-package npm ci is redundant and broken because workspace deps
          # don't publish to the npm registry. website remains standalone.
          scripts/ci/retry-command.sh "root npm ci" npm ci --audit=false --fund=false --cache "$ARCH_WORKDIR/.npm-cache/root"
          scripts/ci/retry-command.sh "website npm ci" npm --prefix website ci --audit=false --fund=false --cache "$ARCH_WORKDIR/.npm-cache/website"
          INNER

      - name: Lint diagram click hrefs
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/lint-diagrams.log" \
            bash <<'INNER'
          cd "$ARCH_WORKDIR"
          npm run arch:lint
          INNER

      - name: Warn on diagram drift (changed files referenced by C4 diagrams)
        if: github.event_name == 'pull_request'
        # Non-blocking — surfaces a job-summary warning when a PR touches a
        # file referenced by a hand-authored diagram without also updating
        # the diagram. Author confirms the diagram is still accurate or
        # amends it; not every code change to a diagrammed file requires a
        # diagram update (refactors, bug fixes, test additions).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cd "$ARCH_WORKDIR"
          node scripts/architecture/detect-drift.mjs "$BASE_SHA"

      - name: Regenerate dependency graphs
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/dependency-graphs.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "architecture dependency graphs" npm run arch:graphs
          INNER

      - name: Regenerate function-level call graphs
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/call-graphs.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "architecture call graphs" npm run arch:calls
          INNER

      - name: Detect stale generated graphs
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/stale-generated-graphs.log" \
            bash <<'INNER'
          cd "$ARCH_WORKDIR"
          if ! git diff --exit-code -- docs/architecture/generated; then
            echo "::error::Generated architecture graphs are stale. Run 'npm run arch:graphs && npm run arch:calls' locally and commit the result."
            echo "--- BEGIN DIFF ---"
            git diff -- docs/architecture/generated/ | head -300
            echo "--- END DIFF ---"
            exit 1
          fi
          INNER

      - name: Publish stale-graph snapshot to LAN sink on failure
        if: failure() && env.SANCTUARY_CI_LOG_SINK_URL != ''
        run: |
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          run_id="${GITHUB_RUN_ID:-unknown}"
          base="${SANCTUARY_CI_LOG_SINK_URL%/}/runs/${run_id}/architecture"
          auth_tmp="$(mktemp)"
          trap 'rm -f "$auth_tmp"' EXIT
          if [ -n "${SANCTUARY_CI_LOG_SINK_TOKEN:-}" ]; then
            printf 'Authorization: Bearer %s\n' "$SANCTUARY_CI_LOG_SINK_TOKEN" > "$auth_tmp"
            CURL_AUTH=(-H @"$auth_tmp")
          else
            CURL_AUTH=()
          fi
          # Bundle every diagnostic file the run produced
          shopt -s nullglob
          log_files=(.tmp/ci-diagnostics/architecture/*.log)
          shopt -u nullglob
          if [ ${#log_files[@]} -eq 0 ]; then
            # BREADCRUMB: no run-with-log.sh wrappers produced output. That means
            # the failure was UPSTREAM of any wrapped step — typically a workflow
            # shell parse error or a step that crashed before `run-with-log.sh`
            # could open its log file. DO NOT chase test/build-output theories;
            # check the actionlint shellcheck output and the previous step's raw
            # YAML for unmatched quotes, missing heredoc delimiters, etc.
            {
              echo "BREADCRUMB: .tmp/ci-diagnostics/architecture/ contains zero *.log files."
              echo "Cause: the run-with-log.sh wrapper never executed — failure"
              echo "is upstream of any wrapped step. Inspect the workflow YAML"
              echo "and the runner step output for shell parse errors."
              echo "ARCH_WORKDIR=$ARCH_WORKDIR"
              echo "pwd=$(pwd)"
              ls -la .tmp/ci-diagnostics/architecture/ 2>&1 || true
            } > /tmp/BREADCRUMB-UPSTREAM-FAILURE.txt
            curl -fsS -X PUT --data-binary @/tmp/BREADCRUMB-UPSTREAM-FAILURE.txt "${CURL_AUTH[@]}" "${base}/BREADCRUMB-UPSTREAM-FAILURE.txt" || true
          else
            for log in "${log_files[@]}"; do
              name=$(basename "$log")
              curl -fsS -X PUT --data-binary @"$log" "${CURL_AUTH[@]}" "${base}/${name}" || true
            done
          fi
          # Full git diff + regenerated artifacts
          git diff -- docs/architecture/generated > /tmp/full-diff.txt 2>&1 || true
          curl -fsS -X PUT --data-binary @/tmp/full-diff.txt "${CURL_AUTH[@]}" "${base}/full-diff.txt" || true
          if [ -f docs/architecture/generated/frontend.md ]; then
            curl -fsS -X PUT --data-binary @docs/architecture/generated/frontend.md "${CURL_AUTH[@]}" "${base}/frontend.regenerated.md" || true
          fi
          if [ -f docs/architecture/generated/server.md ]; then
            curl -fsS -X PUT --data-binary @docs/architecture/generated/server.md "${CURL_AUTH[@]}" "${base}/server.regenerated.md" || true
          fi
          if [ -f docs/architecture/generated/gateway.md ]; then
            curl -fsS -X PUT --data-binary @docs/architecture/generated/gateway.md "${CURL_AUTH[@]}" "${base}/gateway.regenerated.md" || true
          fi
          # Workspace ls + env
          { ls -la .tmp/ci-diagnostics/architecture/ 2>&1; echo "---"; node --version; npm --version; uname -a; pwd; } > /tmp/env.txt 2>&1
          curl -fsS -X PUT --data-binary @/tmp/env.txt "${CURL_AUTH[@]}" "${base}/env.txt" || true
          echo "Published architecture diagnostics to ${base}/"

      - name: Typecheck Docusaurus site
        env:
          SANCTUARY_RETRY_ATTEMPTS: '5'
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/docs-typecheck.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "docs typecheck" scripts/ci/time-command.sh "docs typecheck" npm --prefix website run typecheck
          INNER

      - name: Build Docusaurus site
        run: |
          scripts/ci/run-with-log.sh ".tmp/ci-diagnostics/architecture/docs-build.log" \
            scripts/ci/with-runner-lock.sh node-toolchain bash <<'INNER'
          set -euo pipefail
          cd "$ARCH_WORKDIR"
          scripts/ci/retry-command.sh "docs build" npm run docs:build
          INNER

      - name: Write architecture diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh ".tmp/ci-diagnostics/architecture" "Architecture"

      - name: Upload architecture diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-architecture
          path: .tmp/ci-diagnostics/architecture/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Clean architecture workspace
        if: always()
        run: |
          if [ -n "${ARCH_ROOT:-}" ] && [ -d "$ARCH_ROOT" ]; then
            rm -rf "$ARCH_ROOT" || echo "::warning::Could not fully remove architecture temp workspace"
          fi
