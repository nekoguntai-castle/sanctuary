name: Install Tests

on:
  push:
    branches:
      - main
    tags:
      # The accepted RC is the canonical install/upgrade evidence for the exact
      # commit promoted to stable. Do not rerun the identical two-hour matrix
      # after the immutable stable tag is pushed.
      - 'v*.*.*-rc*'
      - 'v*.*.*-alpha*'
      - 'v*.*.*-beta*'
      - 'v*.*.*-dev*'
    paths:
      - 'install.sh'
      - 'start.sh'
      - 'docker-compose.yml'
      - 'docker/compose/**'
      - 'server/Dockerfile'
      - 'server/prisma/**'
      - 'docker/**'
      - 'scripts/setup.sh'
      - 'scripts/ops/migrate-grafana-password.sh'
      - 'scripts/ops/run-grafana-password-migration.sh'
      - 'scripts/ops/grafana-quiescence-records.sh'
      - 'scripts/offline/**'
      - 'scripts/reset-user-2fa.sh'
      - 'scripts/ci/create-isolated-workspace.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/cleanup-docker-resources.sh'
      - 'scripts/ci/cleanup-ci-callsite.sh'
      - 'scripts/ci/run-compose-e2e-subject.sh'
      - 'scripts/ownership/**'
      - 'tests/ownership/**'
      - 'config/resource-ownership-contract.json'
      - 'config/operator-recovery-contract.json'
      - 'config/operator-recovery-incident.json'
      - 'config/resource-lifecycle-callsites.json'
      - 'scripts/ci/install-test-ports.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/run-in-isolated-workspace.sh'
      - 'scripts/ci/run-extended-upgrade-fixtures.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/time-command.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/with-runner-lock.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'scripts/ci/run-install-unit-tests.sh'
      - 'scripts/ci/retry-command.sh'
      - '.github/actions/setup-node-toolchain/**'
      - '.github/actions/verify-cleanup-receipt/**'
      - '.github/actions/upload-cleanup-evidence/**'
      - 'tests/ci/lib/**'
      - 'tests/ci/check-workflow-composition.test.sh'
      - 'tests/install/**'
      - '!tests/install/*.md'
      - '!tests/install/**/*.md'
      - '!tests/install/*.mdx'
      - '!tests/install/**/*.mdx'
      - '.github/workflows/install-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'install.sh'
      - 'start.sh'
      - 'docker-compose.yml'
      - 'docker/compose/**'
      - 'server/Dockerfile'
      - 'server/prisma/**'
      - 'docker/**'
      - 'scripts/setup.sh'
      - 'scripts/ops/migrate-grafana-password.sh'
      - 'scripts/ops/run-grafana-password-migration.sh'
      - 'scripts/ops/grafana-quiescence-records.sh'
      - 'scripts/offline/**'
      - 'scripts/reset-user-2fa.sh'
      - 'scripts/ci/create-isolated-workspace.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/cleanup-docker-resources.sh'
      - 'scripts/ci/cleanup-ci-callsite.sh'
      - 'scripts/ci/run-compose-e2e-subject.sh'
      - 'scripts/ownership/**'
      - 'tests/ownership/**'
      - 'config/resource-ownership-contract.json'
      - 'config/operator-recovery-contract.json'
      - 'config/operator-recovery-incident.json'
      - 'config/resource-lifecycle-callsites.json'
      - 'scripts/ci/install-test-ports.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/run-in-isolated-workspace.sh'
      - 'scripts/ci/run-extended-upgrade-fixtures.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/time-command.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/with-runner-lock.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'scripts/ci/run-install-unit-tests.sh'
      - 'scripts/ci/retry-command.sh'
      - '.github/actions/setup-node-toolchain/**'
      - '.github/actions/verify-cleanup-receipt/**'
      - '.github/actions/upload-cleanup-evidence/**'
      - 'tests/ci/lib/**'
      - 'tests/ci/check-workflow-composition.test.sh'
      - 'tests/install/**'
      - '!tests/install/*.md'
      - '!tests/install/**/*.md'
      - '!tests/install/*.mdx'
      - '!tests/install/**/*.mdx'
      - '.github/workflows/install-test.yml'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - fresh-install
          - install-script
          - upgrade
          - container-health
          - auth-flow
          - release-critical
      upgrade_source_ref:
        description: 'Optional older git ref or tag to install before upgrading to the checked-out ref'
        required: false
        type: string
      upgrade_fixture:
        description: 'Upgrade fixture selection for workflow_dispatch upgrade debugging'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - baseline
          - browser-origin-ip
          - legacy-runtime-env
          - notification-delivery
          - optional-profiles
          - wallet-sync-retirement

concurrency:
  # PRs keep the branch-scoped cancel behavior because Docker-backed jobs
  # do not run there. Release tags get their own pending slot so an unrelated
  # main, schedule, or release-candidate run cannot replace a required tag gate.
  # Other non-PR runs retain the global group. Release jobs use run-scoped
  # projects/ports on the DIND runner so the distinct groups can coexist.
  group: >-
    ${{ github.event_name == 'pull_request' &&
        format('{0}-{1}-{2}', github.workflow, github.event_name, github.event.pull_request.head.ref || github.ref_name || github.ref) ||
        startsWith(github.ref, 'refs/tags/v') &&
        format('sanctuary-install-release-{0}', github.ref) ||
        'sanctuary-runner-e2e-workflow' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.19.0'
  NPM_VERSION: '11.19.0'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HTTPS_PORT: 8443
  HTTP_PORT: 8080
  COMPOSE_BAKE: 'false'
  # Interrupted CI projects must stay stopped across DIND/runner restarts.
  SANCTUARY_RESTART_POLICY: 'no'
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2

jobs:
  # ============================================
  # Determine Test Scope
  # ============================================
  determine-scope:
    name: Determine Test Scope
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      test_suite: ${{ steps.check.outputs.test_suite }}
      run_upgrade: ${{ steps.check.outputs.run_upgrade }}
      should_run: ${{ steps.check.outputs.should_run }}
      run_unit: ${{ steps.check.outputs.run_unit }}
      run_fresh_install: ${{ steps.check.outputs.run_fresh_install }}
      run_install_script: ${{ steps.check.outputs.run_install_script }}
      run_container_health: ${{ steps.check.outputs.run_container_health }}
      run_auth_flow: ${{ steps.check.outputs.run_auth_flow }}
      run_reuse_stack: ${{ steps.check.outputs.run_reuse_stack }}
      run_ownership_cleanup: ${{ steps.check.outputs.run_ownership_cleanup }}
      run_upgrade_baseline: ${{ steps.check.outputs.run_upgrade_baseline }}
      run_upgrade_extended: ${{ steps.check.outputs.run_upgrade_extended }}
      upgrade_baseline_refs: ${{ steps.check.outputs.upgrade_baseline_refs }}
      upgrade_extended_fixtures: ${{ steps.check.outputs.upgrade_extended_fixtures }}
      scope: ${{ steps.check.outputs.scope }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout for path filtering
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Classify install test scope
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          WORKFLOW_INPUT_TEST_SUITE: ${{ github.event.inputs.test_suite }}
          WORKFLOW_INPUT_UPGRADE_FIXTURE: ${{ github.event.inputs.upgrade_fixture }}
          WORKFLOW_INPUT_UPGRADE_SOURCE_REF: ${{ github.event.inputs.upgrade_source_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: bash tests/install/utils/classify-install-scope.sh

  # ============================================
  # Unit Tests for install.sh
  # ============================================
  unit-tests:
    name: Install Script Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: determine-scope
    if: |
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_unit == 'true'
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/install-unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Run unit tests
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-unit-tests.log" scripts/ci/run-in-isolated-workspace.sh install-unit scripts/ci/run-install-unit-tests.sh

      - name: Write install unit diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Unit Tests"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-install-unit-tests-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  ownership-cleanup-acceptance:
    name: Ownership Cleanup Real Docker Acceptance
    runs-on: [ubuntu-22.04, docker-socket]
    timeout-minutes: 15
    needs: determine-scope
    if: |
      github.event_name == 'pull_request' &&
      needs.determine-scope.outputs.run_ownership_cleanup == 'true'
    env:
      SANCTUARY_RUN_DOCKER_ACCEPTANCE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Check Docker
        run: scripts/ci/wait-for-docker.sh

      - name: Run real-resource cleanup and interruption proof
        env:
          SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/sanctuary-cleanup-acceptance
        run: node --test tests/ownership/cleanup-docker-real.test.mjs

      - name: Verify projected acceptance receipts
        if: always()
        env:
          SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/sanctuary-cleanup-acceptance
        run: |
          test -s "$SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR/recovered-upload.json"
          test -s "$SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR/recovered-upload.json.sig"
          test -s "$SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR/recovered-upload.sha256"
          test -s "$SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR/second-run-upload.json"
          test -s "$SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR/evidence-public.pem"
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { verifySignedArtifact } from './scripts/ownership/cleanup-evidence.mjs';
          import { publicKeyFingerprint } from './scripts/ownership/crypto.mjs';
          import { readFileSync } from 'node:fs';
          const root = process.env.SANCTUARY_CLEANUP_ACCEPTANCE_ARTIFACT_DIR;
          const publicKeyPath = path.join(root, 'evidence-public.pem');
          const expectedFingerprint = publicKeyFingerprint(readFileSync(publicKeyPath));
          for (const name of ['recovered-upload', 'second-run-upload']) {
            verifySignedArtifact({
              inputPath: path.join(root, `${name}.json`), publicKeyPath,
              expectedFingerprint, checkoutRoot: process.cwd(),
            });
          }
          NODE

      - name: Upload cleanup acceptance receipts
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: cleanup-real-docker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-acceptance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # ============================================
  # Fresh Install E2E Test
  # ============================================
  fresh-install-test:
    name: Fresh Install E2E Test
    # Requires the organization's DIND-capable runner because the production
    # compose stack mounts the Docker daemon socket into docker-proxy.
    runs-on: [ubuntu-22.04, docker-socket]
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [determine-scope, unit-tests]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      (needs.determine-scope.outputs.run_fresh_install == 'true' ||
       needs.determine-scope.outputs.run_install_script == 'true') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-fresh-${{ github.run_id }}
      HTTPS_PORT: '15443'
      HTTP_PORT: '15080'
      GATEWAY_PORT: '15000'
      PORT_OFFSET: '0'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/install-fresh-install
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Note PR install E2E coverage
        if: github.event_name == 'pull_request'
        run: |
          echo "Docker-backed install E2E suites run outside pull_request CI."
          echo "PR coverage uses install unit tests and local runner-shaped E2E verification."

      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Pre-flight diagnostics
        if: always() && github.event_name != 'pull_request'
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Check Docker
        if: github.event_name != 'pull_request'
        run: |
          chmod +x scripts/ci/run-with-log.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Run requested install tests in one signed isolated workspace
        if: github.event_name != 'pull_request'
        env:
          SANCTUARY_INSTALL_SUBJECT_MODE: fresh-install
          SANCTUARY_RUN_FRESH_INSTALL: ${{ needs.determine-scope.outputs.run_fresh_install }}
          SANCTUARY_RUN_INSTALL_SCRIPT: ${{ needs.determine-scope.outputs.run_install_script }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" \
            scripts/ci/run-in-isolated-workspace.sh --docker-visible fresh-install \
              scripts/ci/run-install-e2e-isolated-subject.sh

      - name: Write install diagnostic summary
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Fresh Install"

      - name: Upload diagnostic logs
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-install-fresh-install-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify install cleanup receipts
        id: verify_cleanup_receipt
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'

      - name: Upload install cleanup evidence
        if: always() && github.event_name != 'pull_request' && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # ============================================
  # Install Script E2E Test
  # ============================================
  # This test actually runs install.sh to verify the complete
  # installation flow works, catching issues like:
  #   - .env file not created before docker compose
  #   - Missing --pull never flag for local builds
  #   - Secret generation issues
  # ============================================
  install-script-test:
    name: Install Script E2E Test
    runs-on: [ubuntu-22.04, docker-socket]
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_install_script == 'true'
    timeout-minutes: 5

    steps:
      # This lane runs no tests of its own: it relays the combined install job's
      # status. Say so in the failure text and name the upstream result, because
      # a bare "Install Script E2E Test: failure" reads like an E2E regression
      # and sends the reader looking for diagnostics this job never produces.
      - name: Verify combined install script result
        env:
          EVENT_NAME: ${{ github.event_name }}
          FRESH_INSTALL_RESULT: ${{ needs.fresh-install-test.result }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Install script E2E runs outside pull_request CI."
            exit 0
          fi
          case "$FRESH_INSTALL_RESULT" in
            success)
              echo "Install script E2E passed in the combined install job."
              ;;
            skipped|cancelled)
              echo "::error::Install script E2E did not run: the combined install job was ${FRESH_INSTALL_RESULT}. This lane relays that job and runs no tests itself, so there is nothing to diagnose here — look at Fresh Install E2E Test and whatever caused it to be ${FRESH_INSTALL_RESULT}."
              exit 1
              ;;
            *)
              echo "::error::Install script E2E failed in the combined install job (result: ${FRESH_INSTALL_RESULT}). Diagnostics are attached to the Fresh Install E2E Test job, not this one."
              exit 1
              ;;
          esac

  # ============================================
  # Reusable Stack Smoke Test
  # ============================================
  install-stack-smoke:
    name: Install Stack Smoke
    runs-on: [ubuntu-22.04, docker-socket]
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test, install-script-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.determine-scope.outputs.should_run == 'true' &&
      (needs.fresh-install-test.result == 'success' ||
       (needs.fresh-install-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_fresh_install != 'true')) &&
      (needs.install-script-test.result == 'success' ||
       (needs.install-script-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_install_script != 'true')) &&
      needs.determine-scope.outputs.run_reuse_stack == 'true' &&
      (needs.determine-scope.outputs.run_container_health == 'true' ||
       needs.determine-scope.outputs.run_auth_flow == 'true')
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-stack-${{ github.run_id }}
      HTTPS_PORT: '15445'
      HTTP_PORT: '15082'
      GATEWAY_PORT: '15002'
      PORT_OFFSET: '6'
      USE_FRESH_INSTALL_STACK_COVERAGE: ${{ needs.determine-scope.outputs.test_suite == 'all' || contains(needs.determine-scope.outputs.scope, 'workflow') }}
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/install-stack-smoke

    steps:
      - name: Use fresh install stack coverage
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE == 'true'
        run: |
          echo "Fresh Install E2E already verified stack startup, container health, login, password change, API health, gateway API, and cleanup."
          echo "Skipping the duplicate reusable stack build for this broad workflow run."

      - name: Checkout repository
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Check Docker
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Run reusable stack in one signed isolated workspace
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        env:
          SANCTUARY_INSTALL_SUBJECT_MODE: install-stack
          RUN_HEALTH: ${{ needs.determine-scope.outputs.run_container_health }}
          RUN_AUTH: ${{ needs.determine-scope.outputs.run_auth_flow }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" \
            scripts/ci/run-in-isolated-workspace.sh --docker-visible install-stack \
              scripts/ci/run-install-e2e-isolated-subject.sh

      - name: Write install stack diagnostic summary
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Stack Smoke"

      - name: Upload diagnostic logs
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-install-stack-smoke-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify install stack cleanup receipt
        id: verify_cleanup_receipt
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'

      - name: Upload install stack cleanup evidence
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true' && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-install-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # ============================================
  # Container Health Test
  # ============================================
  container-health-test:
    name: Container Health Test
    runs-on: [ubuntu-22.04, docker-socket]
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test, install-script-test]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.fresh-install-test.result == 'success' &&
      (needs.install-script-test.result == 'success' || needs.install-script-test.result == 'skipped') &&
      needs.determine-scope.outputs.run_container_health == 'true' &&
      needs.determine-scope.outputs.run_reuse_stack != 'true'
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-health-${{ github.run_id }}
      HTTPS_PORT: '15446'
      HTTP_PORT: '15083'
      GATEWAY_PORT: '15003'
      PORT_OFFSET: '9'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/container-health

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Run container health in one signed isolated workspace
        env:
          SANCTUARY_INSTALL_SUBJECT_MODE: container-health
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" \
            scripts/ci/run-in-isolated-workspace.sh --docker-visible container-health \
              scripts/ci/run-install-e2e-isolated-subject.sh

      - name: Write container health diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Container Health"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-container-health-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify container health cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'

      - name: Upload container health cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-container-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # ============================================
  # Authentication Flow Test
  # ============================================
  auth-flow-test:
    name: Authentication Flow Test
    runs-on: [ubuntu-22.04, docker-socket]
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test, install-script-test, container-health-test]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.fresh-install-test.result == 'success' &&
      (needs.install-script-test.result == 'success' || needs.install-script-test.result == 'skipped') &&
      (needs.container-health-test.result == 'success' || needs.container-health-test.result == 'skipped') &&
      needs.determine-scope.outputs.run_auth_flow == 'true' &&
      needs.determine-scope.outputs.run_reuse_stack != 'true'
    # 25min: frontend npm ci inside docker build can push total runtime past 15min on slow npm mirror days (see v0.8.40 release).
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-auth-${{ github.run_id }}
      HTTPS_PORT: '15447'
      HTTP_PORT: '15084'
      GATEWAY_PORT: '15004'
      PORT_OFFSET: '12'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/auth-flow

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Run auth flow in one signed isolated workspace
        env:
          SANCTUARY_INSTALL_SUBJECT_MODE: auth-flow
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" \
            scripts/ci/run-in-isolated-workspace.sh --docker-visible auth-flow \
              scripts/ci/run-install-e2e-isolated-subject.sh

      - name: Write auth flow diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Auth Flow"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-auth-flow-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify auth flow cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'

      - name: Upload auth flow cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-auth-flow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # ============================================
  # Upgrade Test Matrix (Long Running)
  # ============================================
  upgrade-baseline-test:
    name: Upgrade Baseline
    runs-on: [ubuntu-22.04, docker-socket]
    needs: [determine-scope, fresh-install-test, install-script-test, install-stack-smoke, auth-flow-test]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_upgrade_baseline == 'true' &&
      (needs.fresh-install-test.result == 'success' ||
       (needs.fresh-install-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_fresh_install != 'true')) &&
      (needs.install-script-test.result == 'success' ||
       (needs.install-script-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_install_script != 'true')) &&
      (needs.install-stack-smoke.result == 'success' || needs.install-stack-smoke.result == 'skipped' || needs.install-stack-smoke.result == 'failure') &&
      (needs.auth-flow-test.result == 'success' || needs.auth-flow-test.result == 'skipped')
    timeout-minutes: 120
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/upgrade-baseline
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Run baseline upgrades in one signed isolated workspace
        timeout-minutes: 100
        env:
          UPGRADE_BASELINE_REFS: ${{ needs.determine-scope.outputs.upgrade_baseline_refs }}
          UPGRADE_EXTENDED_SOURCE_REF: ${{ github.event.inputs.upgrade_source_ref }}
          UPGRADE_EXTENDED_FIXTURES: ${{ needs.determine-scope.outputs.upgrade_extended_fixtures }}
          IS_RELEASE: ${{ needs.determine-scope.outputs.is_release }}
          RUN_ID: ${{ github.run_id }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" \
            scripts/ci/run-in-isolated-workspace.sh --docker-visible upgrade-baseline \
              scripts/ci/run-upgrade-baseline-isolated-subject.sh

      - name: Post-upgrade DIND diagnostics
        if: always()
        continue-on-error: true
        env:
          SANCTUARY_CI_PROJECT_PREFIXES: sanctuary-ci-upgrade-${{ github.run_id }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/post-upgrade-dind.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Verify upgrade baseline cleanup receipts
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'

      - name: Upload upgrade baseline cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-upgrade-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts
          recursive: 'true'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Write upgrade baseline timing summary
        if: always()
        continue-on-error: true
        run: |
          combined="$JOB_LOG_DIR/upgrade-baseline-timing-input.txt"
          : > "$combined"
          for log in "$JOB_LOG_DIR"/upgrade-baseline-*.log; do
            [ -f "$log" ] && cat "$log" >> "$combined"
          done
          if [ -s "$combined" ]; then
            scripts/ci/report-timing-notices.sh --log-file "$combined" > "$JOB_LOG_DIR/upgrade-baseline-timing.md" || \
              echo "::warning::Could not write upgrade baseline timing summary"
          else
            echo "No upgrade baseline logs found for timing summary" > "$JOB_LOG_DIR/upgrade-baseline-timing.md"
          fi

      - name: Upload baseline upgrade artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: upgrade-baseline-${{ github.run_id }}
          path: .tmp/upgrade-artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Write upgrade baseline diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Upgrade Baseline"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-upgrade-baseline-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  upgrade-extended-fixture-test:
    name: Upgrade Extended Fixtures
    runs-on: [ubuntu-22.04, docker-socket]
    needs: [determine-scope, fresh-install-test, install-script-test, install-stack-smoke, auth-flow-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_upgrade_extended == 'true' &&
      (needs.fresh-install-test.result == 'success' ||
       (needs.fresh-install-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_fresh_install != 'true')) &&
      (needs.install-script-test.result == 'success' ||
       (needs.install-script-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_install_script != 'true')) &&
      (needs.install-stack-smoke.result == 'success' || needs.install-stack-smoke.result == 'skipped' || needs.install-stack-smoke.result == 'failure') &&
      (needs.auth-flow-test.result == 'success' || needs.auth-flow-test.result == 'skipped')
    timeout-minutes: 180
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/upgrade-extended-fixtures

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Run extended upgrade fixtures sequentially
        timeout-minutes: 150
        env:
          SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE: ${{ github.event.inputs.upgrade_source_ref }}
          SANCTUARY_UPGRADE_BASELINE_REFS: ${{ needs.determine-scope.outputs.upgrade_baseline_refs }}
          SANCTUARY_UPGRADE_EXTENDED_FIXTURES: ${{ needs.determine-scope.outputs.upgrade_extended_fixtures }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/upgrade-extended-fixtures.log" \
            scripts/ci/run-extended-upgrade-fixtures.sh \
              --fixtures "$SANCTUARY_UPGRADE_EXTENDED_FIXTURES" \
              --source-ref "${SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE:-latest-stable}"

      - name: Post-upgrade DIND diagnostics
        if: always()
        continue-on-error: true
        env:
          SANCTUARY_CI_PROJECT_PREFIXES: sanctuary-ci-upgrade-${{ github.run_id }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/post-upgrade-dind.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Write extended upgrade timing summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$JOB_LOG_DIR/upgrade-extended-fixtures.log" ]; then
            scripts/ci/report-timing-notices.sh --log-file "$JOB_LOG_DIR/upgrade-extended-fixtures.log" > "$JOB_LOG_DIR/upgrade-extended-timing.md" || \
              echo "::warning::Could not write extended upgrade timing summary"
          else
            echo "No extended upgrade log found for timing summary" > "$JOB_LOG_DIR/upgrade-extended-timing.md"
          fi

      - name: Upload extended upgrade artifacts
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: upgrade-extended-fixtures
          path: .tmp/upgrade-artifacts/
          if-no-files-found: ignore

      - name: Verify extended upgrade cleanup receipts
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/upgrade-extended
          recursive: 'true'

      - name: Upload extended upgrade cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-upgrade-extended-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/upgrade-extended/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/upgrade-extended
          recursive: 'true'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Write extended upgrade diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Upgrade Extended Fixtures"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-upgrade-extended-fixtures-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  upgrade-extended-test:
    name: Upgrade Extended
    runs-on: [ubuntu-22.04, docker-socket]
    timeout-minutes: 5
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [determine-scope, upgrade-baseline-test, upgrade-extended-fixture-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_upgrade_extended == 'true' &&
      (needs.upgrade-baseline-test.result == 'success' ||
       (needs.upgrade-baseline-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_upgrade_baseline != 'true'))
    steps:
      - name: Check extended upgrade fixtures
        env:
          EXTENDED_FIXTURES: ${{ needs.upgrade-extended-fixture-test.result }}
          SELECTED_EXTENDED_FIXTURES: ${{ needs.determine-scope.outputs.upgrade_extended_fixtures }}
        run: |
          if [ "$EXTENDED_FIXTURES" != "success" ]; then
            echo "::error::Selected extended upgrade fixtures did not pass: ${SELECTED_EXTENDED_FIXTURES:-none} (job result: $EXTENDED_FIXTURES)"
            exit 1
          fi
          echo "Extended upgrade fixtures passed: ${SELECTED_EXTENDED_FIXTURES:-none}."

  # ============================================
  # Test Summary
  # ============================================
  test-summary:
    name: Install Test Summary
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [determine-scope, unit-tests, fresh-install-test, install-script-test, install-stack-smoke, container-health-test, auth-flow-test, upgrade-baseline-test, upgrade-extended-test]
    if: always()

    steps:
      - name: Generate summary
        env:
          AUTH_FLOW: ${{ needs.auth-flow-test.result }}
          CONTAINER_HEALTH: ${{ needs.container-health-test.result }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FRESH_INSTALL: ${{ needs.fresh-install-test.result }}
          INSTALL_SCRIPT: ${{ needs.install-script-test.result }}
          INSTALL_STACK_SMOKE: ${{ needs.install-stack-smoke.result }}
          IS_RELEASE: ${{ needs.determine-scope.outputs.is_release }}
          REASON: ${{ needs.determine-scope.outputs.reason }}
          REF_NAME: ${{ github.ref_name }}
          RUN_UPGRADE_BASELINE: ${{ needs.determine-scope.outputs.run_upgrade_baseline }}
          RUN_UPGRADE_EXTENDED: ${{ needs.determine-scope.outputs.run_upgrade_extended }}
          RUN_UNIT: ${{ needs.determine-scope.outputs.run_unit }}
          SCOPE: ${{ needs.determine-scope.outputs.scope }}
          SHOULD_RUN: ${{ needs.determine-scope.outputs.should_run }}
          TEST_SUITE: ${{ needs.determine-scope.outputs.test_suite }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          UPGRADE_BASELINE: ${{ needs.upgrade-baseline-test.result }}
          UPGRADE_BASELINE_REFS: ${{ needs.determine-scope.outputs.upgrade_baseline_refs }}
          UPGRADE_EXTENDED: ${{ needs.upgrade-extended-test.result }}
          UPGRADE_EXTENDED_FIXTURES: ${{ needs.determine-scope.outputs.upgrade_extended_fixtures }}
        run: |
          summary="$GITHUB_STEP_SUMMARY"

          append_status() {
            label="$1"
            result="$2"

            if [ "$result" = "success" ]; then
              echo "- $label: :white_check_mark: Passed" >> "$summary"
            elif [ "$result" = "skipped" ]; then
              echo "- $label: :arrow_right: Skipped" >> "$summary"
            else
              echo "- $label: :x: Failed" >> "$summary"
            fi
          }

          echo "## Install Test Results" >> "$summary"
          echo "" >> "$summary"
          echo "Workflow commit: \`$COMMIT_SHA\`" >> "$summary"
          echo "" >> "$summary"

          # Check if tests were skipped due to no relevant changes
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "### Tests Skipped" >> "$summary"
            echo "" >> "$summary"
            echo "> No install-relevant files changed. Tests were skipped." >> "$summary"
            echo "" >> "$summary"
            echo "Install tests run when these files change:" >> "$summary"
            echo "- \`install.sh\`, \`scripts/setup.sh\`, \`scripts/reset-user-2fa.sh\`" >> "$summary"
            echo "- \`docker-compose*.yml\`, \`server/Dockerfile\`, \`docker/**\`" >> "$summary"
            echo "- \`server/prisma/**\`, \`tests/install/**\`" >> "$summary"
            echo "- \`.github/workflows/install-test.yml\`" >> "$summary"
            exit 0
          fi

          # Show test context
          if [ "$IS_RELEASE" = "true" ]; then
            echo "### Release Validation: $REF_NAME" >> "$summary"
            echo "" >> "$summary"
            echo "> Running release-critical tests to validate installation before release." >> "$summary"
          else
            echo "### Test Suite: $TEST_SUITE" >> "$summary"
          fi
          echo "" >> "$summary"
          echo "- Scope: \`$SCOPE\`" >> "$summary"
          echo "- Reason: $REASON" >> "$summary"
          echo "- Upgrade baseline refs: \`${UPGRADE_BASELINE_REFS:-none}\`" >> "$summary"
          echo "- Upgrade extended fixtures: \`${UPGRADE_EXTENDED_FIXTURES:-none}\`" >> "$summary"
          echo "" >> "$summary"

          # Unit tests
          if [ "$UNIT_TESTS" = "success" ]; then
            echo "- Unit Tests: :white_check_mark: Passed" >> "$summary"
          elif [ "$UNIT_TESTS" = "skipped" ] && \
               [ "$EVENT_NAME" = "workflow_dispatch" ] && \
               [ "$RUN_UNIT" == "true" ] && \
               [ "$TEST_SUITE" != "unit" ]; then
            echo "- Unit Tests: :white_check_mark: Passed in Fresh Install E2E job" >> "$summary"
          elif [ "$UNIT_TESTS" = "skipped" ]; then
            echo "- Unit Tests: :arrow_right: Skipped" >> "$summary"
          else
            echo "- Unit Tests: :x: Failed" >> "$summary"
          fi

          append_status "Fresh Install E2E" "$FRESH_INSTALL"
          append_status "Install Script E2E" "$INSTALL_SCRIPT"
          append_status "Install Stack Smoke" "$INSTALL_STACK_SMOKE"
          append_status "Container Health" "$CONTAINER_HEALTH"
          append_status "Auth Flow" "$AUTH_FLOW"
          append_status "Baseline Upgrade Install" "$UPGRADE_BASELINE"
          append_status "Extended Upgrade Fixtures" "$UPGRADE_EXTENDED"

          SELECTED_UPGRADE_FAILED=false
          if [ "$RUN_UPGRADE_BASELINE" = "true" ] && [ "$UPGRADE_BASELINE" != "success" ]; then
            echo "::error::Selected baseline upgrade refs did not pass: ${UPGRADE_BASELINE_REFS:-none} (job result: $UPGRADE_BASELINE)"
            SELECTED_UPGRADE_FAILED=true
          fi
          if [ "$RUN_UPGRADE_EXTENDED" = "true" ] && [ "$UPGRADE_EXTENDED" != "success" ]; then
            echo "::error::Selected extended upgrade fixtures did not pass: ${UPGRADE_EXTENDED_FIXTURES:-none} (job result: $UPGRADE_EXTENDED)"
            SELECTED_UPGRADE_FAILED=true
          fi

          echo "" >> "$summary"
          echo "### Test Configuration" >> "$summary"
          echo "- HTTPS Port: $HTTPS_PORT" >> "$summary"
          echo "- HTTP Port: $HTTP_PORT" >> "$summary"

          # Release gate warning
          if [ "$IS_RELEASE" = "true" ]; then
            echo "" >> "$summary"
            echo "---" >> "$summary"
            echo "" >> "$summary"
            STACK_OK=false
            if [ "$INSTALL_STACK_SMOKE" = "success" ] || \
               { [ "$CONTAINER_HEALTH" = "success" ] && [ "$AUTH_FLOW" = "success" ]; }; then
              STACK_OK=true
            fi
            if [ "$UNIT_TESTS" = "success" ] && \
               [ "$FRESH_INSTALL" = "success" ] && \
               [ "$INSTALL_SCRIPT" = "success" ] && \
               [ "$STACK_OK" = "true" ] && \
               [ "$UPGRADE_BASELINE" = "success" ] && \
               [ "$UPGRADE_EXTENDED" = "success" ]; then
              echo ":rocket: **Release validation passed!** Installation has been verified." >> "$summary"
            else
              echo ":stop_sign: **Release validation FAILED!** Do not proceed with release until issues are resolved." >> "$summary"
            fi
          fi

          if [ "$SELECTED_UPGRADE_FAILED" = "true" ]; then
            exit 1
          fi

      - name: Check release gate
        if: needs.determine-scope.outputs.is_release == 'true'
        env:
          AUTH_FLOW: ${{ needs.auth-flow-test.result }}
          CONTAINER_HEALTH: ${{ needs.container-health-test.result }}
          FRESH_INSTALL: ${{ needs.fresh-install-test.result }}
          INSTALL_SCRIPT: ${{ needs.install-script-test.result }}
          INSTALL_STACK_SMOKE: ${{ needs.install-stack-smoke.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          UPGRADE_BASELINE: ${{ needs.upgrade-baseline-test.result }}
          UPGRADE_EXTENDED: ${{ needs.upgrade-extended-test.result }}
        run: |
          echo "Checking release gate..."

          FAILED=false

          if [ "$UNIT_TESTS" != "success" ] && [ "$UNIT_TESTS" != "skipped" ]; then
            echo "::error::Unit tests failed - release blocked"
            FAILED=true
          fi

          if [ "$FRESH_INSTALL" != "success" ]; then
            echo "::error::Fresh install test failed - release blocked"
            FAILED=true
          fi

          if [ "$INSTALL_SCRIPT" != "success" ]; then
            echo "::error::Install script test failed - release blocked"
            FAILED=true
          fi

          if [ "$INSTALL_STACK_SMOKE" != "success" ] && [ "$INSTALL_STACK_SMOKE" != "skipped" ]; then
            echo "::warning::Install stack smoke failed (non-blocking) - fresh-install-test + install-script-test + upgrade-* are the canonical install gates"
          fi

          if [ "$CONTAINER_HEALTH" != "success" ] && [ "$CONTAINER_HEALTH" != "skipped" ]; then
            echo "::error::Container health test failed - release blocked"
            FAILED=true
          fi

          if [ "$AUTH_FLOW" != "success" ] && [ "$AUTH_FLOW" != "skipped" ]; then
            echo "::error::Auth flow test failed - release blocked"
            FAILED=true
          fi

          if [ "$UPGRADE_BASELINE" != "success" ]; then
            echo "::error::Baseline upgrade matrix failed - release blocked"
            FAILED=true
          fi

          if [ "$UPGRADE_EXTENDED" != "success" ]; then
            echo "::error::Extended upgrade fixtures failed - release blocked"
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            echo "::error::Release validation failed! Install tests must pass before releasing."
            exit 1
          fi

          echo "Release validation passed!"
