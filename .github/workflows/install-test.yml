name: Install Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'install.sh'
      - 'docker-compose.yml'
      - 'docker-compose.*.yml'
      - 'Dockerfile'
      - 'server/Dockerfile'
      - 'server/prisma/**'
      - 'docker/**'
      - 'scripts/setup.sh'
      - 'scripts/reset-user-2fa.sh'
      - 'scripts/ci/create-isolated-workspace.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/cleanup-docker-resources.sh'
      - 'scripts/ci/install-test-ports.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/publish-failed-logs.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/run-in-isolated-workspace.sh'
      - 'scripts/ci/run-extended-upgrade-fixtures.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/time-command.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/with-runner-lock.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'tests/install/**'
      - '!tests/install/*.md'
      - '!tests/install/**/*.md'
      - '!tests/install/*.mdx'
      - '!tests/install/**/*.mdx'
      - '.github/workflows/install-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'install.sh'
      - 'docker-compose.yml'
      - 'docker-compose.*.yml'
      - 'Dockerfile'
      - 'server/Dockerfile'
      - 'server/prisma/**'
      - 'docker/**'
      - 'scripts/setup.sh'
      - 'scripts/reset-user-2fa.sh'
      - 'scripts/ci/create-isolated-workspace.sh'
      - 'scripts/ci/docker-endpoint-lib.sh'
      - 'scripts/ci/cleanup-docker-resources.sh'
      - 'scripts/ci/install-test-ports.sh'
      - 'scripts/ci/provider-context.sh'
      - 'scripts/ci/publish-failed-logs.sh'
      - 'scripts/ci/redactor.sh'
      - 'scripts/ci/run-in-isolated-workspace.sh'
      - 'scripts/ci/run-extended-upgrade-fixtures.sh'
      - 'scripts/ci/run-with-log.sh'
      - 'scripts/ci/time-command.sh'
      - 'scripts/ci/wait-for-docker.sh'
      - 'scripts/ci/with-runner-lock.sh'
      - 'scripts/ci/write-diagnostic-summary.sh'
      - 'tests/install/**'
      - '!tests/install/*.md'
      - '!tests/install/**/*.md'
      - '!tests/install/*.mdx'
      - '!tests/install/**/*.mdx'
      - '.github/workflows/install-test.yml'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - fresh-install
          - install-script
          - upgrade
          - container-health
          - auth-flow
          - release-critical
      keep_containers:
        description: 'Keep containers after test for debugging'
        required: false
        default: false
        type: boolean
      upgrade_source_ref:
        description: 'Optional older git ref or tag to install before upgrading to the checked-out ref'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # On tag pushes share a key with release-candidate.yml so the two
  # workflows queue instead of racing on the self-hosted runner's dind.
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/v') &&
        format('sanctuary-rc-{0}', github.ref_name) ||
        format('{0}-{1}-{2}', github.workflow, github.event_name, github.event.pull_request.head.ref || github.ref_name || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HTTPS_PORT: 8443
  HTTP_PORT: 8080
  COMPOSE_BAKE: 'false'
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2
  SANCTUARY_CI_LOG_SINK_URL: ${{ vars.SANCTUARY_CI_LOG_SINK_URL }}
  SANCTUARY_CI_LOG_SINK_TOKEN: ${{ secrets.SANCTUARY_CI_LOG_SINK_TOKEN }}

jobs:
  # ============================================
  # Determine Test Scope
  # ============================================
  determine-scope:
    name: Determine Test Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      test_suite: ${{ steps.check.outputs.test_suite }}
      run_upgrade: ${{ steps.check.outputs.run_upgrade }}
      should_run: ${{ steps.check.outputs.should_run }}
      run_unit: ${{ steps.check.outputs.run_unit }}
      run_fresh_install: ${{ steps.check.outputs.run_fresh_install }}
      run_install_script: ${{ steps.check.outputs.run_install_script }}
      run_container_health: ${{ steps.check.outputs.run_container_health }}
      run_auth_flow: ${{ steps.check.outputs.run_auth_flow }}
      run_reuse_stack: ${{ steps.check.outputs.run_reuse_stack }}
      run_upgrade_baseline: ${{ steps.check.outputs.run_upgrade_baseline }}
      run_upgrade_extended: ${{ steps.check.outputs.run_upgrade_extended }}
      scope: ${{ steps.check.outputs.scope }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout for path filtering
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Classify install test scope
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          WORKFLOW_INPUT_TEST_SUITE: ${{ github.event.inputs.test_suite }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: bash tests/install/utils/classify-install-scope.sh

  # ============================================
  # Unit Tests for install.sh
  # ============================================
  unit-tests:
    name: Install Script Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: determine-scope
    if: |
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_unit == 'true'
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/install-unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Run unit tests
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-unit-tests.log" scripts/ci/run-in-isolated-workspace.sh install-unit bash <<'INNER'
          ./tests/install/unit/install-script.test.sh
          ./tests/install/unit/reset-user-2fa-script.test.sh
          ./tests/install/unit/upgrade-helpers.test.sh
          ./tests/install/unit/install-scope.test.sh
          ./tests/install/unit/cleanup-containers-guard.test.sh
          INNER

      - name: Write install unit diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Unit Tests"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-install-unit-tests-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  # ============================================
  # Fresh Install E2E Test
  # ============================================
  fresh-install-test:
    name: Fresh Install E2E Test
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, unit-tests]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      (needs.determine-scope.outputs.run_fresh_install == 'true' ||
       needs.determine-scope.outputs.run_install_script == 'true') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-fresh-${{ github.run_id }}
      HTTPS_PORT: '15443'
      HTTP_PORT: '15080'
      GATEWAY_PORT: '15000'
      PORT_OFFSET: '0'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/install-fresh-install
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Note PR install E2E coverage
        if: github.event_name == 'pull_request'
        run: |
          echo "Docker-backed install E2E suites run outside pull_request CI."
          echo "PR coverage uses install unit tests and local runner-shaped E2E verification."

      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Pre-flight diagnostics
        if: always() && github.event_name != 'pull_request'
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Check Docker
        if: github.event_name != 'pull_request'
        run: |
          chmod +x scripts/ci/run-with-log.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        if: github.event_name != 'pull_request'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash <<'INNER'
          workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible fresh-install)"
          echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          INNER

      - name: Assign run-specific ports
        if: github.event_name != 'pull_request'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash <<'INNER'
          cd "$SANCTUARY_INSTALL_WORKSPACE"
          bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          INNER

      - name: Run fresh install test
        if: github.event_name != 'pull_request'
        env:
          KEEP_CONTAINERS: ${{ github.event.inputs.keep_containers }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/fresh-install.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "fresh install e2e" \
            bash -c "
              cd \"$SANCTUARY_INSTALL_WORKSPACE\"
              if [ \"\${KEEP_CONTAINERS:-false}\" = \"true\" ]; then
                ./tests/install/e2e/fresh-install.test.sh --keep-containers --verbose
              else
                ./tests/install/e2e/fresh-install.test.sh --verbose
              fi
            "

      - name: Run install script test
        if: github.event_name != 'pull_request'
        env:
          KEEP_CONTAINERS: ${{ github.event.inputs.keep_containers }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-script.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "install script e2e" \
            bash -c "
              cd \"$SANCTUARY_INSTALL_WORKSPACE\"
              if [ \"\${KEEP_CONTAINERS:-false}\" = \"true\" ]; then
                ./tests/install/e2e/install-script.test.sh --keep-containers --verbose
              else
                ./tests/install/e2e/install-script.test.sh --verbose
              fi
            "

      - name: Show container logs on failure
        if: failure() && github.event_name != 'pull_request'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/container-logs.log" bash <<'INNER' || true
          if [ -d "${SANCTUARY_INSTALL_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_INSTALL_WORKSPACE"
          fi
          echo "=== Container Status ==="
          docker compose ps || true
          echo ""
          echo "=== Database Logs ==="
          docker compose logs --tail 100 postgres 2>&1 || true
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs --tail 100 backend 2>&1 || true
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs --tail 100 frontend 2>&1 || true
          echo ""
          echo "=== Gateway Logs ==="
          docker compose logs --tail 100 gateway 2>&1 || true
          echo ""
          echo "=== Migration Logs ==="
          docker compose logs migrate 2>&1 || true
          exit 1
          INNER

      - name: Write install diagnostic summary
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Fresh Install"

      - name: Upload diagnostic logs
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-install-fresh-install-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always() && github.event_name != 'pull_request' && github.event.inputs.keep_containers != 'true'
        run: |
          project="${COMPOSE_PROJECT_NAME:-}"
          if [ -d "${SANCTUARY_INSTALL_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_INSTALL_WORKSPACE"
          fi
          docker compose down -v --remove-orphans || true
          if [ -n "$project" ]; then
            bash scripts/ci/cleanup-docker-resources.sh --project "$project" || true
          fi

      - name: Cleanup isolated install workspace
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -n "${SANCTUARY_INSTALL_WORKSPACE:-}" ]; then
            rm -rf "$(dirname "$SANCTUARY_INSTALL_WORKSPACE")" || echo "::warning::Could not fully remove isolated install workspace"
          fi

  # ============================================
  # Install Script E2E Test
  # ============================================
  # This test actually runs install.sh to verify the complete
  # installation flow works, catching issues like:
  #   - .env file not created before docker compose
  #   - Missing --pull never flag for local builds
  #   - Secret generation issues
  # ============================================
  install-script-test:
    name: Install Script E2E Test
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_install_script == 'true'
    timeout-minutes: 30

    steps:
      - name: Verify combined install script result
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Install script E2E runs outside pull_request CI."
            exit 0
          fi
          if [ "${{ needs.fresh-install-test.result }}" != "success" ]; then
            echo "::error::Install script E2E failed in the combined install job"
            exit 1
          fi
          echo "Install script E2E passed in the combined install job."

  # ============================================
  # Reusable Stack Smoke Test
  # ============================================
  install-stack-smoke:
    name: Install Stack Smoke
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test, install-script-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.determine-scope.outputs.should_run == 'true' &&
      (needs.fresh-install-test.result == 'success' ||
       (needs.fresh-install-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_fresh_install != 'true')) &&
      (needs.install-script-test.result == 'success' ||
       (needs.install-script-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_install_script != 'true')) &&
      needs.determine-scope.outputs.run_reuse_stack == 'true' &&
      (needs.determine-scope.outputs.run_container_health == 'true' ||
       needs.determine-scope.outputs.run_auth_flow == 'true')
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-stack-${{ github.run_id }}
      HTTPS_PORT: '15445'
      HTTP_PORT: '15082'
      GATEWAY_PORT: '15002'
      PORT_OFFSET: '6'
      USE_FRESH_INSTALL_STACK_COVERAGE: ${{ needs.determine-scope.outputs.test_suite == 'all' || contains(needs.determine-scope.outputs.scope, 'workflow') }}
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/install-stack-smoke

    steps:
      - name: Use fresh install stack coverage
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE == 'true'
        run: |
          echo "Fresh Install E2E already verified stack startup, container health, login, password change, API health, gateway API, and cleanup."
          echo "Skipping the duplicate reusable stack build for this broad workflow run."

      - name: Checkout repository
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Check Docker
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Prepare isolated stack workspace
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash <<'INNER'
          workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible install-stack)"
          echo "SANCTUARY_STACK_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          INNER

      - name: Assign run-specific ports
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash <<'INNER'
          cd "$SANCTUARY_STACK_WORKSPACE"
          bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          INNER

      - name: Start reusable stack
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/start-stack.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "install stack startup" \
            bash -c '
            cd "$SANCTUARY_STACK_WORKSPACE"
            JWT_SECRET=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)
            ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)

            ENCRYPTION_SALT=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)
            GATEWAY_SECRET=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)
            POSTGRES_PASSWORD=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)
            AI_CONFIG_SECRET=$(openssl rand -hex 32)
            REDIS_PASSWORD=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)

            source tests/install/utils/helpers.sh
            SANCTUARY_SSL_DIR="$(default_install_test_root "$PWD")/ssl-${COMPOSE_PROJECT_NAME}"
            mkdir -p "$SANCTUARY_SSL_DIR"
            SANCTUARY_COMPOSE_SSL_DIR="$(docker_visible_path "$SANCTUARY_SSL_DIR")"
            export SANCTUARY_SSL_DIR SANCTUARY_COMPOSE_SSL_DIR
            bash docker/nginx/ssl/generate-certs.sh localhost

            JWT_SECRET="$JWT_SECRET" ENCRYPTION_KEY="$ENCRYPTION_KEY" ENCRYPTION_SALT="$ENCRYPTION_SALT" \
              GATEWAY_SECRET="$GATEWAY_SECRET" POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              AI_CONFIG_SECRET="$AI_CONFIG_SECRET" REDIS_PASSWORD="$REDIS_PASSWORD" \
              SANCTUARY_SSL_DIR="$SANCTUARY_SSL_DIR" SANCTUARY_COMPOSE_SSL_DIR="$SANCTUARY_COMPOSE_SSL_DIR" \
              HTTPS_PORT=$HTTPS_PORT HTTP_PORT=$HTTP_PORT \
              RATE_LIMIT_LOGIN=100 RATE_LIMIT_PASSWORD_CHANGE=100 \
              docker compose up -d --build

            timeout 120 bash -c "until docker compose ps migrate --format \"{{.Status}}\" 2>/dev/null | grep -q \"Exited\"; do sleep 5; done" || true
            sleep 30
          '

      - name: Run container health tests
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true' && needs.determine-scope.outputs.run_container_health == 'true'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/container-health.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "install stack container health" \
            bash -c 'cd "$SANCTUARY_STACK_WORKSPACE" && ./tests/install/e2e/container-health.test.sh --verbose'

      - name: Run auth flow tests
        if: env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true' && needs.determine-scope.outputs.run_auth_flow == 'true'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/auth-flow.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "install stack auth flow" \
            bash -c 'cd "$SANCTUARY_STACK_WORKSPACE" && ./tests/install/e2e/auth-flow.test.sh --verbose'

      - name: Show container logs on failure
        if: failure() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/container-logs.log" bash <<'INNER' || true
          if [ -d "${SANCTUARY_STACK_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_STACK_WORKSPACE"
          fi
          docker compose ps || true
          docker compose logs --tail 100 postgres 2>&1 || true
          docker compose logs --tail 100 backend 2>&1 || true
          docker compose logs --tail 100 frontend 2>&1 || true
          exit 1
          INNER

      - name: Write install stack diagnostic summary
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Stack Smoke"

      - name: Upload diagnostic logs
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-install-stack-smoke-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true' && github.event.inputs.keep_containers != 'true'
        run: |
          project="${COMPOSE_PROJECT_NAME:-}"
          if [ -d "${SANCTUARY_STACK_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_STACK_WORKSPACE"
          fi
          docker compose down -v --remove-orphans || true
          if [ -n "$project" ]; then
            bash scripts/ci/cleanup-docker-resources.sh --project "$project" || true
          fi

      - name: Cleanup isolated stack workspace
        if: always() && env.USE_FRESH_INSTALL_STACK_COVERAGE != 'true'
        run: |
          if [ -n "${SANCTUARY_STACK_WORKSPACE:-}" ]; then
            rm -rf "$(dirname "$SANCTUARY_STACK_WORKSPACE")" || echo "::warning::Could not fully remove isolated stack workspace"
          fi

  # ============================================
  # Container Health Test
  # ============================================
  container-health-test:
    name: Container Health Test
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test, install-script-test]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.fresh-install-test.result == 'success' &&
      (needs.install-script-test.result == 'success' || needs.install-script-test.result == 'skipped') &&
      needs.determine-scope.outputs.run_container_health == 'true' &&
      needs.determine-scope.outputs.run_reuse_stack != 'true'
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-health-${{ github.run_id }}
      HTTPS_PORT: '15446'
      HTTP_PORT: '15083'
      GATEWAY_PORT: '15003'
      PORT_OFFSET: '9'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/container-health

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Prepare isolated health workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash <<'INNER'
          workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible container-health)"
          echo "SANCTUARY_HEALTH_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          INNER

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash <<'INNER'
          cd "$SANCTUARY_HEALTH_WORKSPACE"
          bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          INNER

      - name: Start containers
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/start-containers.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "container health start" \
            bash -c '
            cd "$SANCTUARY_HEALTH_WORKSPACE"
            # Generate all required secrets
            JWT_SECRET=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)
            ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)

            ENCRYPTION_SALT=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)
            GATEWAY_SECRET=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)
            POSTGRES_PASSWORD=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)
            AI_CONFIG_SECRET=$(openssl rand -hex 32)
            REDIS_PASSWORD=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)

            # Generate SSL certs
            source tests/install/utils/helpers.sh
            SANCTUARY_SSL_DIR="$(default_install_test_root "$PWD")/ssl-${COMPOSE_PROJECT_NAME}"
            mkdir -p "$SANCTUARY_SSL_DIR"
            SANCTUARY_COMPOSE_SSL_DIR="$(docker_visible_path "$SANCTUARY_SSL_DIR")"
            export SANCTUARY_SSL_DIR SANCTUARY_COMPOSE_SSL_DIR
            bash docker/nginx/ssl/generate-certs.sh localhost

            # Start containers
            JWT_SECRET="$JWT_SECRET" ENCRYPTION_KEY="$ENCRYPTION_KEY" ENCRYPTION_SALT="$ENCRYPTION_SALT" \
              GATEWAY_SECRET="$GATEWAY_SECRET" POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              AI_CONFIG_SECRET="$AI_CONFIG_SECRET" REDIS_PASSWORD="$REDIS_PASSWORD" \
              SANCTUARY_SSL_DIR="$SANCTUARY_SSL_DIR" SANCTUARY_COMPOSE_SSL_DIR="$SANCTUARY_COMPOSE_SSL_DIR" \
              HTTPS_PORT=$HTTPS_PORT HTTP_PORT=$HTTP_PORT \
              docker compose up -d --build

            # Wait for startup
            sleep 30
          '

      - name: Run container health tests
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/container-health.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "container health e2e" \
            bash -c 'cd "$SANCTUARY_HEALTH_WORKSPACE" && ./tests/install/e2e/container-health.test.sh --verbose'

      - name: Show container logs on failure
        if: failure()
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/container-logs.log" bash <<'INNER' || true
          if [ -d "${SANCTUARY_HEALTH_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_HEALTH_WORKSPACE"
          fi
          docker compose ps || true
          docker compose logs --tail 50 postgres 2>&1 || true
          docker compose logs --tail 50 backend 2>&1 || true
          docker compose logs --tail 50 frontend 2>&1 || true
          exit 1
          INNER

      - name: Write container health diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Container Health"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-container-health-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          project="${COMPOSE_PROJECT_NAME:-}"
          if [ -d "${SANCTUARY_HEALTH_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_HEALTH_WORKSPACE"
          fi
          docker compose down -v --remove-orphans || true
          if [ -n "$project" ]; then
            bash scripts/ci/cleanup-docker-resources.sh --project "$project" || true
          fi

      - name: Cleanup isolated health workspace
        if: always()
        run: |
          if [ -n "${SANCTUARY_HEALTH_WORKSPACE:-}" ]; then
            rm -rf "$(dirname "$SANCTUARY_HEALTH_WORKSPACE")" || echo "::warning::Could not fully remove isolated health workspace"
          fi

  # ============================================
  # Authentication Flow Test
  # ============================================
  auth-flow-test:
    name: Authentication Flow Test
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test, install-script-test, container-health-test]
    if: |
      always() &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.fresh-install-test.result == 'success' &&
      (needs.install-script-test.result == 'success' || needs.install-script-test.result == 'skipped') &&
      (needs.container-health-test.result == 'success' || needs.container-health-test.result == 'skipped') &&
      needs.determine-scope.outputs.run_auth_flow == 'true' &&
      needs.determine-scope.outputs.run_reuse_stack != 'true'
    # 25min: frontend npm ci inside docker build can push total runtime past 15min on slow npm mirror days (see v0.8.40 release).
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: sanctuary-ci-auth-${{ github.run_id }}
      HTTPS_PORT: '15447'
      HTTP_PORT: '15084'
      GATEWAY_PORT: '15004'
      PORT_OFFSET: '12'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/auth-flow

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Prepare isolated auth workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash <<'INNER'
          workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible auth-flow)"
          echo "SANCTUARY_AUTH_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          INNER

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash <<'INNER'
          cd "$SANCTUARY_AUTH_WORKSPACE"
          bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          INNER

      - name: Start containers
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/start-containers.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "auth flow start" \
            bash -c '
            cd "$SANCTUARY_AUTH_WORKSPACE"
            # Generate all required secrets
            JWT_SECRET=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)
            ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)

            ENCRYPTION_SALT=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)
            GATEWAY_SECRET=$(openssl rand -base64 32 | tr -d "=/+" | head -c 48)
            POSTGRES_PASSWORD=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)
            AI_CONFIG_SECRET=$(openssl rand -hex 32)
            REDIS_PASSWORD=$(openssl rand -base64 16 | tr -d "=/+" | head -c 24)

            # Generate SSL certs
            source tests/install/utils/helpers.sh
            SANCTUARY_SSL_DIR="$(default_install_test_root "$PWD")/ssl-${COMPOSE_PROJECT_NAME}"
            mkdir -p "$SANCTUARY_SSL_DIR"
            SANCTUARY_COMPOSE_SSL_DIR="$(docker_visible_path "$SANCTUARY_SSL_DIR")"
            export SANCTUARY_SSL_DIR SANCTUARY_COMPOSE_SSL_DIR
            bash docker/nginx/ssl/generate-certs.sh localhost

            # Start containers with higher rate limits for testing
            JWT_SECRET="$JWT_SECRET" ENCRYPTION_KEY="$ENCRYPTION_KEY" ENCRYPTION_SALT="$ENCRYPTION_SALT" \
              GATEWAY_SECRET="$GATEWAY_SECRET" POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              AI_CONFIG_SECRET="$AI_CONFIG_SECRET" REDIS_PASSWORD="$REDIS_PASSWORD" \
              SANCTUARY_SSL_DIR="$SANCTUARY_SSL_DIR" SANCTUARY_COMPOSE_SSL_DIR="$SANCTUARY_COMPOSE_SSL_DIR" \
              HTTPS_PORT=$HTTPS_PORT HTTP_PORT=$HTTP_PORT \
              RATE_LIMIT_LOGIN=100 RATE_LIMIT_PASSWORD_CHANGE=100 \
              docker compose up -d --build

            # Wait for migration to complete
            timeout 120 bash -c "until docker compose ps migrate --format \"{{.Status}}\" 2>/dev/null | grep -q \"Exited\"; do sleep 5; done" || true

            # Wait for services
            sleep 30
          '

      - name: Run auth flow tests
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/auth-flow.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "auth flow e2e" \
            bash -c 'cd "$SANCTUARY_AUTH_WORKSPACE" && ./tests/install/e2e/auth-flow.test.sh --verbose'

      - name: Show container logs on failure
        if: failure()
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/container-logs.log" bash <<'INNER' || true
          if [ -d "${SANCTUARY_AUTH_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_AUTH_WORKSPACE"
          fi
          docker compose ps || true
          docker compose logs --tail 100 backend 2>&1 || true
          exit 1
          INNER

      - name: Write auth flow diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Install Auth Flow"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-auth-flow-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          project="${COMPOSE_PROJECT_NAME:-}"
          if [ -d "${SANCTUARY_AUTH_WORKSPACE:-}" ]; then
            cd "$SANCTUARY_AUTH_WORKSPACE"
          fi
          docker compose down -v --remove-orphans || true
          if [ -n "$project" ]; then
            bash scripts/ci/cleanup-docker-resources.sh --project "$project" || true
          fi

      - name: Cleanup isolated auth workspace
        if: always()
        run: |
          if [ -n "${SANCTUARY_AUTH_WORKSPACE:-}" ]; then
            rm -rf "$(dirname "$SANCTUARY_AUTH_WORKSPACE")" || echo "::warning::Could not fully remove isolated auth workspace"
          fi

  # ============================================
  # Upgrade Test Matrix (Long Running)
  # ============================================
  upgrade-baseline-test:
    name: Upgrade Baseline
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, fresh-install-test, install-script-test, install-stack-smoke, auth-flow-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_upgrade_baseline == 'true' &&
      (needs.fresh-install-test.result == 'success' ||
       (needs.fresh-install-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_fresh_install != 'true')) &&
      (needs.install-script-test.result == 'success' ||
       (needs.install-script-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_install_script != 'true')) &&
      (needs.install-stack-smoke.result == 'success' || needs.install-stack-smoke.result == 'skipped') &&
      (needs.auth-flow-test.result == 'success' || needs.auth-flow-test.result == 'skipped')
    timeout-minutes: 120
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/upgrade-baseline
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated upgrade workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible upgrade-baseline)"
            echo "SANCTUARY_UPGRADE_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Run baseline upgrades sequentially
        env:
          SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE: ${{ github.event.inputs.upgrade_source_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$SANCTUARY_UPGRADE_WORKSPACE"
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected workflow run id"
            exit 1
          fi
          if [[ -n "${SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE:-}" && ! "$SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE" =~ ^[A-Za-z0-9._/@-]+$ ]]; then
            echo "::error::upgrade_source_ref contains unsupported characters"
            exit 1
          fi

          run_upgrade() {
            local source_ref="$1"
            local port_offset="$2"
            local port_env
            case "$source_ref" in
              latest-stable|n-2) ;;
              *)
                echo "::error::Unexpected upgrade source ref: $source_ref"
                return 1
                ;;
            esac

            export COMPOSE_PROJECT_NAME="sanctuary-ci-upgrade-${RUN_ID}-${source_ref}-baseline"
            export SANCTUARY_UPGRADE_SOURCE_REF="${SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE:-$source_ref}"
            export SANCTUARY_UPGRADE_FIXTURE="baseline"
            export SANCTUARY_UPGRADE_ARTIFACT_DIR="${SANCTUARY_CI_ORIGINAL_WORKSPACE:-${GITHUB_WORKSPACE}}/.tmp/upgrade-artifacts/${source_ref}-baseline"

            port_env="$(mktemp)"
            GITHUB_ENV="$port_env" bash scripts/ci/install-test-ports.sh "$port_offset"
            set -a
            . "$port_env"
            set +a
            rm -f "$port_env"

            cleanup() {
              docker compose down -v --remove-orphans || true
              bash scripts/ci/cleanup-docker-resources.sh --project "$COMPOSE_PROJECT_NAME" || true
            }
            trap cleanup EXIT

            local log_path="${JOB_LOG_DIR}/upgrade-baseline-${source_ref}.log"
            if "${SANCTUARY_CI_ORIGINAL_WORKSPACE:-${GITHUB_WORKSPACE}}/scripts/ci/run-with-log.sh" "$log_path" \
                 scripts/ci/with-runner-lock.sh e2e \
                 scripts/ci/time-command.sh "upgrade baseline ${source_ref} baseline" \
                 ./tests/install/e2e/upgrade-install.test.sh --mode core --fixture baseline --verbose; then
              cleanup
              trap - EXIT
              return 0
            fi

            docker compose ps || true
            docker compose logs --tail 50 postgres 2>&1 || true
            docker compose logs --tail 100 backend 2>&1 || true
            cleanup
            trap - EXIT
            return 1
          }

          run_upgrade latest-stable 15
          run_upgrade n-2 18

      - name: Upload baseline upgrade artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: upgrade-baseline-${{ github.run_id }}
          path: |
            .tmp/upgrade-artifacts/latest-stable-baseline
            .tmp/upgrade-artifacts/n-2-baseline
          retention-days: 14
          if-no-files-found: ignore

      - name: Write upgrade baseline diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Upgrade Baseline"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-upgrade-baseline-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup isolated upgrade workspace
        if: always()
        run: |
          if [ -n "${SANCTUARY_UPGRADE_WORKSPACE:-}" ]; then
            rm -rf "$(dirname "$SANCTUARY_UPGRADE_WORKSPACE")" || echo "::warning::Could not fully remove isolated upgrade workspace"
          fi

  upgrade-extended-fixture-test:
    name: Upgrade Extended Fixtures
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, upgrade-baseline-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_upgrade_extended == 'true' &&
      (needs.upgrade-baseline-test.result == 'success' ||
       (needs.upgrade-baseline-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_upgrade_baseline != 'true'))
    timeout-minutes: 120
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/upgrade-extended-fixtures

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Run extended upgrade fixtures sequentially
        env:
          SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE: ${{ github.event.inputs.upgrade_source_ref }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/upgrade-extended-fixtures.log" \
            scripts/ci/run-extended-upgrade-fixtures.sh

      - name: Upload extended upgrade artifacts
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: upgrade-extended-fixtures
          path: .tmp/upgrade-artifacts/
          if-no-files-found: ignore

      - name: Write extended upgrade diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Upgrade Extended Fixtures"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-upgrade-extended-fixtures-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  upgrade-extended-test:
    name: Upgrade Extended
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [determine-scope, upgrade-baseline-test, upgrade-extended-fixture-test]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.determine-scope.outputs.should_run == 'true' &&
      needs.determine-scope.outputs.run_upgrade_extended == 'true' &&
      (needs.upgrade-baseline-test.result == 'success' ||
       (needs.upgrade-baseline-test.result == 'skipped' &&
        needs.determine-scope.outputs.run_upgrade_baseline != 'true'))
    steps:
      - name: Check extended upgrade fixtures
        env:
          EXTENDED_FIXTURES: ${{ needs.upgrade-extended-fixture-test.result }}
        run: |
          if [ "$EXTENDED_FIXTURES" != "success" ]; then
            echo "::error::One or more extended upgrade fixtures failed"
            exit 1
          fi
          echo "Extended upgrade fixtures passed."

  docker-resource-cleanup:
    name: Docker Resource Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [determine-scope, fresh-install-test, install-stack-smoke, container-health-test, auth-flow-test, upgrade-baseline-test, upgrade-extended-test]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Sweep runner leftovers
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::warning::Docker is not available; skipping runner leftover cleanup"
            exit 0
          fi
          bash scripts/ci/cleanup-docker-resources.sh --runner-leftovers || \
            echo "::warning::Runner leftover cleanup did not complete"

  # ============================================
  # Test Summary
  # ============================================
  test-summary:
    name: Install Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [determine-scope, unit-tests, fresh-install-test, install-script-test, install-stack-smoke, container-health-test, auth-flow-test, upgrade-baseline-test, upgrade-extended-test, docker-resource-cleanup]
    if: always()

    steps:
      - name: Generate summary
        env:
          AUTH_FLOW: ${{ needs.auth-flow-test.result }}
          CONTAINER_HEALTH: ${{ needs.container-health-test.result }}
          EVENT_NAME: ${{ github.event_name }}
          FRESH_INSTALL: ${{ needs.fresh-install-test.result }}
          INSTALL_SCRIPT: ${{ needs.install-script-test.result }}
          INSTALL_STACK_SMOKE: ${{ needs.install-stack-smoke.result }}
          IS_RELEASE: ${{ needs.determine-scope.outputs.is_release }}
          REASON: ${{ needs.determine-scope.outputs.reason }}
          REF_NAME: ${{ github.ref_name }}
          RUN_UNIT: ${{ needs.determine-scope.outputs.run_unit }}
          SCOPE: ${{ needs.determine-scope.outputs.scope }}
          SHOULD_RUN: ${{ needs.determine-scope.outputs.should_run }}
          TEST_SUITE: ${{ needs.determine-scope.outputs.test_suite }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          UPGRADE_BASELINE: ${{ needs.upgrade-baseline-test.result }}
          UPGRADE_EXTENDED: ${{ needs.upgrade-extended-test.result }}
        run: |
          summary="$GITHUB_STEP_SUMMARY"

          append_status() {
            label="$1"
            result="$2"

            if [ "$result" = "success" ]; then
              echo "- $label: :white_check_mark: Passed" >> "$summary"
            elif [ "$result" = "skipped" ]; then
              echo "- $label: :arrow_right: Skipped" >> "$summary"
            else
              echo "- $label: :x: Failed" >> "$summary"
            fi
          }

          echo "## Install Test Results" >> "$summary"
          echo "" >> "$summary"

          # Check if tests were skipped due to no relevant changes
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "### Tests Skipped" >> "$summary"
            echo "" >> "$summary"
            echo "> No install-relevant files changed. Tests were skipped." >> "$summary"
            echo "" >> "$summary"
            echo "Install tests run when these files change:" >> "$summary"
            echo "- \`install.sh\`, \`scripts/setup.sh\`, \`scripts/reset-user-2fa.sh\`" >> "$summary"
            echo "- \`docker-compose*.yml\`, \`Dockerfile\`, \`server/Dockerfile\`, \`docker/**\`" >> "$summary"
            echo "- \`server/prisma/**\`, \`tests/install/**\`" >> "$summary"
            echo "- \`.github/workflows/install-test.yml\`" >> "$summary"
            exit 0
          fi

          # Show test context
          if [ "$IS_RELEASE" = "true" ]; then
            echo "### Release Validation: $REF_NAME" >> "$summary"
            echo "" >> "$summary"
            echo "> Running release-critical tests to validate installation before release." >> "$summary"
          else
            echo "### Test Suite: $TEST_SUITE" >> "$summary"
          fi
          echo "" >> "$summary"
          echo "- Scope: \`$SCOPE\`" >> "$summary"
          echo "- Reason: $REASON" >> "$summary"
          echo "" >> "$summary"

          # Unit tests
          if [ "$UNIT_TESTS" = "success" ]; then
            echo "- Unit Tests: :white_check_mark: Passed" >> "$summary"
          elif [ "$UNIT_TESTS" = "skipped" ] && \
               [ "$EVENT_NAME" = "workflow_dispatch" ] && \
               [ "$RUN_UNIT" == "true" ] && \
               [ "$TEST_SUITE" != "unit" ]; then
            echo "- Unit Tests: :white_check_mark: Passed in Fresh Install E2E job" >> "$summary"
          elif [ "$UNIT_TESTS" = "skipped" ]; then
            echo "- Unit Tests: :arrow_right: Skipped" >> "$summary"
          else
            echo "- Unit Tests: :x: Failed" >> "$summary"
          fi

          append_status "Fresh Install E2E" "$FRESH_INSTALL"
          append_status "Install Script E2E" "$INSTALL_SCRIPT"
          append_status "Install Stack Smoke" "$INSTALL_STACK_SMOKE"
          append_status "Container Health" "$CONTAINER_HEALTH"
          append_status "Auth Flow" "$AUTH_FLOW"
          append_status "Baseline Upgrade Install" "$UPGRADE_BASELINE"
          append_status "Extended Upgrade Fixtures" "$UPGRADE_EXTENDED"

          echo "" >> "$summary"
          echo "### Test Configuration" >> "$summary"
          echo "- HTTPS Port: $HTTPS_PORT" >> "$summary"
          echo "- HTTP Port: $HTTP_PORT" >> "$summary"

          # Release gate warning
          if [ "$IS_RELEASE" = "true" ]; then
            echo "" >> "$summary"
            echo "---" >> "$summary"
            echo "" >> "$summary"
            STACK_OK=false
            if [ "$INSTALL_STACK_SMOKE" = "success" ] || \
               { [ "$CONTAINER_HEALTH" = "success" ] && [ "$AUTH_FLOW" = "success" ]; }; then
              STACK_OK=true
            fi
            if [ "$UNIT_TESTS" = "success" ] && \
               [ "$FRESH_INSTALL" = "success" ] && \
               [ "$INSTALL_SCRIPT" = "success" ] && \
               [ "$STACK_OK" = "true" ] && \
               [ "$UPGRADE_BASELINE" = "success" ] && \
               [ "$UPGRADE_EXTENDED" = "success" ]; then
              echo ":rocket: **Release validation passed!** Installation has been verified." >> "$summary"
            else
              echo ":stop_sign: **Release validation FAILED!** Do not proceed with release until issues are resolved." >> "$summary"
            fi
          fi

      - name: Check release gate
        if: needs.determine-scope.outputs.is_release == 'true'
        env:
          AUTH_FLOW: ${{ needs.auth-flow-test.result }}
          CONTAINER_HEALTH: ${{ needs.container-health-test.result }}
          FRESH_INSTALL: ${{ needs.fresh-install-test.result }}
          INSTALL_SCRIPT: ${{ needs.install-script-test.result }}
          INSTALL_STACK_SMOKE: ${{ needs.install-stack-smoke.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          UPGRADE_BASELINE: ${{ needs.upgrade-baseline-test.result }}
          UPGRADE_EXTENDED: ${{ needs.upgrade-extended-test.result }}
        run: |
          echo "Checking release gate..."

          FAILED=false

          if [ "$UNIT_TESTS" != "success" ] && [ "$UNIT_TESTS" != "skipped" ]; then
            echo "::error::Unit tests failed - release blocked"
            FAILED=true
          fi

          if [ "$FRESH_INSTALL" != "success" ]; then
            echo "::error::Fresh install test failed - release blocked"
            FAILED=true
          fi

          if [ "$INSTALL_SCRIPT" != "success" ]; then
            echo "::error::Install script test failed - release blocked"
            FAILED=true
          fi

          if [ "$INSTALL_STACK_SMOKE" != "success" ] && \
             { [ "$CONTAINER_HEALTH" != "success" ] || [ "$AUTH_FLOW" != "success" ]; }; then
            echo "::error::Install stack smoke failed - release blocked"
            FAILED=true
          fi

          if [ "$CONTAINER_HEALTH" != "success" ] && [ "$CONTAINER_HEALTH" != "skipped" ]; then
            echo "::error::Container health test failed - release blocked"
            FAILED=true
          fi

          if [ "$AUTH_FLOW" != "success" ] && [ "$AUTH_FLOW" != "skipped" ]; then
            echo "::error::Auth flow test failed - release blocked"
            FAILED=true
          fi

          if [ "$UPGRADE_BASELINE" != "success" ]; then
            echo "::error::Baseline upgrade matrix failed - release blocked"
            FAILED=true
          fi

          if [ "$UPGRADE_EXTENDED" != "success" ]; then
            echo "::error::Extended upgrade fixtures failed - release blocked"
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            echo "::error::Release validation failed! Install tests must pass before releasing."
            exit 1
          fi

          echo "Release validation passed!"

  # ============================================
  # Publish images to Codeberg Packages
  # ============================================
  # Multi-arch (linux/amd64 + linux/arm64) build + push for stable
  # release tags only. Lives in install-test.yml because release-
  # candidate.yml only fires on RC/alpha/beta/dev tag patterns —
  # stable tags route through this workflow.
  #
  # Runs after test-summary (the canonical release gate that exits 1
  # on any install/upgrade lane failure when is_release == 'true').
  # Pre-release tags (-rc/-alpha/-beta/-dev) bypass the publish step
  # via the if: condition below; operators only consume immutable
  # stable images on Codeberg.
  #
  # Single sequential bash loop (NOT a matrix) — Forgejo's act_runner
  # ignores strategy.max-parallel and job-level concurrency, so the
  # only reliable serialization is one job that loops over images.
  # See memory: feedback_forgejo_runner_concurrency.md.
  publish-images:
    name: Publish images to Codeberg Packages
    runs-on: ubuntu-latest
    needs: test-summary
    if: |
      always()
      && needs.test-summary.result == 'success'
      && github.event_name == 'push'
      && github.ref_type == 'tag'
      && !contains(github.ref_name, '-rc')
      && !contains(github.ref_name, '-alpha')
      && !contains(github.ref_name, '-beta')
      && !contains(github.ref_name, '-dev')
    timeout-minutes: 90  # arm64 cross-build via QEMU is ~3-5x slower than amd64-only
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          clean: false

      - name: Reclaim disk space before multi-arch build
        run: |
          # arm64 cross-builds via QEMU pile up large intermediate
          # layers. Prune anything stale before we start.
          docker system prune -f || true
          df -h | head -5

      - name: Bootstrap multi-arch buildx + QEMU
        # docker/setup-qemu-action's pinned versions use node20 (banned
        # by scripts/ci/check-github-action-runtimes.mjs); inline the
        # tonistiigi/binfmt invocation it uses internally.
        # docker/setup-buildx-action stays unused too (consistent with
        # the rest of release-candidate / install-test which avoid it
        # for diagnostic reasons).
        # Builder name is run-scoped so a previous run's leftover (or a
        # concurrent run) cannot collide with us. Cleanup is in a later
        # if: always() step so the host's docker daemon doesn't leak
        # buildkit containers across runs on the self-hosted runner.
        env:
          BUILDX_NAME: sanctuary-multiarch-${{ github.run_id }}
        run: |
          echo "BUILDX_NAME=$BUILDX_NAME" >> "$GITHUB_ENV"
          docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
          docker buildx create --name "$BUILDX_NAME" \
            --driver docker-container \
            --platform linux/amd64,linux/arm64 \
            --use
          docker buildx inspect --bootstrap

      - name: Log in to Codeberg Packages
        env:
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CODEBERG_PACKAGE_TOKEN: ${{ secrets.CODEBERG_PACKAGE_TOKEN }}
        run: |
          echo "$CODEBERG_PACKAGE_TOKEN" \
            | docker login codeberg.org -u "$CODEBERG_USER" --password-stdin

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: bash scripts/ci/build-and-push-images.sh

      - name: Upload digest manifest
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: image-digests-${{ github.ref_name }}
          path: |
            dist/image-digests-*.json
            dist/image-build-summary-*.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Tear down buildx builder
        # Always remove the run-scoped buildx builder so the dind host
        # doesn't accumulate buildkit containers across runs on the
        # self-hosted runner.
        if: always()
        run: |
          if [ -n "${BUILDX_NAME:-}" ]; then
            docker buildx rm "$BUILDX_NAME" 2>/dev/null || true
          fi

      - name: Logout
        if: always()
        run: docker logout codeberg.org || true

  # ============================================
  # Notify sanctuary-umbrel of new digests
  # ============================================
  # After publish-images succeeds on a stable tag, fire a
  # workflow_dispatch on sanctuary-umbrel/.github/workflows/
  # update-on-dispatch.yml so its bot can rewrite the umbrel-app.yml
  # version + the docker-compose.yml `image:` digests, then commit
  # and tag a new release on sanctuary-umbrel.
  #
  # Forgejo notes:
  #   * `repository_dispatch` is not exposed by Forgejo's API; we use
  #     workflow_dispatch with the receiving workflow's input shape.
  #   * Receiving workflow is sanctuary-umbrel's update-on-dispatch.yml
  #     (PR #3 in that repo, merged 2026-05-12) — it accepts
  #     {version, frontend_digest, backend_digest}.
  notify-umbrel:
    name: Notify sanctuary-umbrel of new image digests
    runs-on: ubuntu-latest
    needs: publish-images
    if: |
      always()
      && needs.publish-images.result == 'success'
      && github.event_name == 'push'
      && github.ref_type == 'tag'
      && !contains(github.ref_name, '-rc')
      && !contains(github.ref_name, '-alpha')
      && !contains(github.ref_name, '-beta')
      && !contains(github.ref_name, '-dev')
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # Required so `uses: ./.github/actions/download-artifact`
        # below can resolve the local composite action. Without a
        # checkout, the path does not exist on the runner.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}

      - name: Download digest manifest
        uses: ./.github/actions/download-artifact
        with:
          name: image-digests-${{ github.ref_name }}
          path: dist

      - name: Fire workflow_dispatch on sanctuary-umbrel
        env:
          UMBREL_DISPATCH_TOKEN: ${{ secrets.UMBREL_DISPATCH_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$UMBREL_DISPATCH_TOKEN" ]; then
            echo "::error::UMBREL_DISPATCH_TOKEN secret missing — set it on this repo (write:repository scope on sanctuary-umbrel)."
            exit 1
          fi

          DIGEST_FILE="$(ls dist/image-digests-*.json | head -n1)"
          if [ -z "$DIGEST_FILE" ] || [ ! -s "$DIGEST_FILE" ]; then
            echo "::error::digest manifest missing or empty under dist/"
            ls -la dist/ || true
            exit 1
          fi

          VERSION="${TAG#v}"
          FRONTEND_DIGEST=$(jq -r '.frontend // empty' "$DIGEST_FILE")
          BACKEND_DIGEST=$(jq -r '.backend // empty' "$DIGEST_FILE")

          if [ -z "$FRONTEND_DIGEST" ] || [ -z "$BACKEND_DIGEST" ]; then
            echo "::error::digest manifest is missing one of {frontend, backend}: $(cat "$DIGEST_FILE")"
            exit 1
          fi
          for d in "$FRONTEND_DIGEST" "$BACKEND_DIGEST"; do
            if [[ ! "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::digest '$d' is not a sha256:<64hex> value"
              exit 1
            fi
          done

          BODY=$(jq -n \
            --arg ver "$VERSION" \
            --arg fe "$FRONTEND_DIGEST" \
            --arg be "$BACKEND_DIGEST" \
            '{ref: "main", inputs: {version: $ver, frontend_digest: $fe, backend_digest: $be}}')

          # Forgejo dispatch endpoint for workflow_dispatch.
          ENDPOINT="$FORGEJO_URL/api/v1/repos/nekoguntai-castle/sanctuary-umbrel/actions/workflows/update-on-dispatch.yml/dispatches"

          HTTP=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $UMBREL_DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            "$ENDPOINT" \
            -d "$BODY")

          if [ "$HTTP" = "204" ] || [ "$HTTP" = "200" ]; then
            echo "✓ Dispatched to sanctuary-umbrel: v$VERSION"
            echo "  frontend_digest=$FRONTEND_DIGEST"
            echo "  backend_digest=$BACKEND_DIGEST"
          else
            echo "::error::dispatch failed: HTTP $HTTP"
            cat /tmp/dispatch-response.txt
            exit 1
          fi
