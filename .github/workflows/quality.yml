  lizard:
    name: Cyclomatic complexity (lizard)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_repo_quality == 'true'
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-lizard
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Python toolchain
        uses: ./.github/actions/setup-python-toolchain

      - name: Run lizard
        # McCabe / NIST / SonarQube: warn on CCN > 15. The current measured
        # CI-scope baseline is 9 warnings; fail the job if that count grows.
        env:
          QUALITY_BOOTSTRAP_TOOLS: '1'
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/lizard.log"
          bash ${{ github.workspace }}/scripts/quality/lizard-only.sh

      - name: Write lizard failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-lizard-failure.log"
          "Quality Lizard"

      - name: Write lizard diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Lizard"

      - name: Upload lizard diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-lizard
          path: .tmp/ci-diagnostics/quality-lizard/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  jscpd:
    name: Duplication (jscpd)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_repo_quality == 'true'
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-jscpd
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Run jscpd
        # Uses config/tooling/jscpd.json. Config owns threshold and
        # exclusions. Installing via npx keeps the repo devDependencies
        # lean; pin to a known-good major version to avoid drift.
        env:
          JSCPD_REPORT_DIR: /tmp/sanctuary-jscpd-${{ github.run_id }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/jscpd.log" bash -euo pipefail <<'QUALITY_JSCPD'
          rm -rf "$JSCPD_REPORT_DIR"
          QUALITY_JSCPD_OUTPUT_DIR="$JSCPD_REPORT_DIR" \
            scripts/ci/run-in-isolated-workspace.sh --keep-on-failure jscpd \
              scripts/ci/retry-command.sh "quality jscpd" scripts/quality/jscpd-only.sh
          QUALITY_JSCPD

      - name: Upload jscpd report
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: jscpd-report
          path: /tmp/sanctuary-jscpd-${{ github.run_id }}/
          if-no-files-found: ignore

      - name: Clean jscpd report
        if: always()
        run: rm -rf "/tmp/sanctuary-jscpd-${{ github.run_id }}"

      - name: Write jscpd failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-jscpd-failure.log"
          "Quality JSCPD"

      - name: Write jscpd diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality JSCPD"

      - name: Upload jscpd diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-jscpd
          path: .tmp/ci-diagnostics/quality-jscpd/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  large-file-classification:
    name: Large-file classification
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_repo_quality == 'true'
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-large-file-classification
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Check large-file classification
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/large-file-classification.log"
          node scripts/quality/check-large-files.mjs

      - name: Write large-file classification failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-large-file-classification-failure.log"
          "Quality Large File Classification"

      - name: Write large-file classification diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Large File Classification"

      - name: Upload large-file classification diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-large-file-classification
          path: .tmp/ci-diagnostics/quality-large-file-classification/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  quality-required-checks:
    name: Code Quality Required Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: always()
    needs: [determine-scope, lint, lockfile-peer-resolution, dependency-audit, gitleaks, semgrep-sast, workflow-lint, workflow-action-runtime-guard, ci-classifier-tests, lizard, jscpd, large-file-classification]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-required-checks
    steps:
      - name: Checkout (for diagnostic publish)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
      - name: Check quality job results
        env:
          RUN_REPO_QUALITY: ${{ needs.determine-scope.outputs.run_repo_quality }}
          RUN_WORKFLOW_QUALITY: ${{ needs.determine-scope.outputs.run_workflow_quality }}
          RUN_CI_CLASSIFIER_TESTS: ${{ needs.determine-scope.outputs.run_ci_classifier_tests }}
          DETERMINE_SCOPE: ${{ needs.determine-scope.result }}
          LINT: ${{ needs.lint.result }}
          LOCKFILE_PEER_RESOLUTION: ${{ needs.lockfile-peer-resolution.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP_SAST: ${{ needs.semgrep-sast.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          WORKFLOW_ACTION_RUNTIME_GUARD: ${{ needs.workflow-action-runtime-guard.result }}
          CI_CLASSIFIER_TESTS: ${{ needs.ci-classifier-tests.result }}
          LIZARD: ${{ needs.lizard.result }}
          JSCPD: ${{ needs.jscpd.result }}
          LARGE_FILE_CLASSIFICATION: ${{ needs.large-file-classification.result }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/quality-required-checks.log" bash -euo pipefail <<'QUALITY_REQUIRED_CHECKS'
          echo "=== quality-required-checks scope inputs ==="
          echo "RUN_REPO_QUALITY=$RUN_REPO_QUALITY"
          echo "RUN_WORKFLOW_QUALITY=$RUN_WORKFLOW_QUALITY"
          echo "RUN_CI_CLASSIFIER_TESTS=$RUN_CI_CLASSIFIER_TESTS"
          echo "=== sub-job results ==="
          echo "DETERMINE_SCOPE=$DETERMINE_SCOPE"
          echo "LINT=$LINT"
          echo "LOCKFILE_PEER_RESOLUTION=$LOCKFILE_PEER_RESOLUTION"
          echo "DEPENDENCY_AUDIT=$DEPENDENCY_AUDIT"
          echo "GITLEAKS=$GITLEAKS"
          echo "SEMGREP_SAST=$SEMGREP_SAST"
          echo "WORKFLOW_LINT=$WORKFLOW_LINT"
          echo "WORKFLOW_ACTION_RUNTIME_GUARD=$WORKFLOW_ACTION_RUNTIME_GUARD"
          echo "CI_CLASSIFIER_TESTS=$CI_CLASSIFIER_TESTS"
          echo "LIZARD=$LIZARD"
          echo "JSCPD=$JSCPD"
          echo "LARGE_FILE_CLASSIFICATION=$LARGE_FILE_CLASSIFICATION"

          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          require_success "Determine Quality Scope" "$DETERMINE_SCOPE"
          require_success "Secret scan (gitleaks)" "$GITLEAKS"

          allow_success_or_skipped() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name result was $result; expected success or skipped"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          if [ "$RUN_REPO_QUALITY" = "true" ]; then
            require_success "Lint" "$LINT"
            require_success "Lockfile peer resolution" "$LOCKFILE_PEER_RESOLUTION"
            require_success "Dependency audit (npm)" "$DEPENDENCY_AUDIT"
            require_success "Cyclomatic complexity (lizard)" "$LIZARD"
            require_success "Duplication (jscpd)" "$JSCPD"
            require_success "Large-file classification" "$LARGE_FILE_CLASSIFICATION"
          else
            allow_success_or_skipped "Lint" "$LINT"
            allow_success_or_skipped "Lockfile peer resolution" "$LOCKFILE_PEER_RESOLUTION"
            allow_success_or_skipped "Dependency audit (npm)" "$DEPENDENCY_AUDIT"
            allow_success_or_skipped "Cyclomatic complexity (lizard)" "$LIZARD"
            allow_success_or_skipped "Duplication (jscpd)" "$JSCPD"
            allow_success_or_skipped "Large-file classification" "$LARGE_FILE_CLASSIFICATION"
          fi

          if [ "$RUN_REPO_QUALITY" = "true" ] || [ "$RUN_WORKFLOW_QUALITY" = "true" ]; then
            require_success "SAST (Semgrep)" "$SEMGREP_SAST"
          else
            allow_success_or_skipped "SAST (Semgrep)" "$SEMGREP_SAST"
          fi

          if [ "$RUN_WORKFLOW_QUALITY" = "true" ]; then
            require_success "Workflow lint (actionlint)" "$WORKFLOW_LINT"
            require_success "Workflow action runtime guard" "$WORKFLOW_ACTION_RUNTIME_GUARD"
          else
            allow_success_or_skipped "Workflow lint (actionlint)" "$WORKFLOW_LINT"
            allow_success_or_skipped "Workflow action runtime guard" "$WORKFLOW_ACTION_RUNTIME_GUARD"
          fi

          if [ "$RUN_CI_CLASSIFIER_TESTS" = "true" ]; then
            require_success "CI classifier tests" "$CI_CLASSIFIER_TESTS"
          else
            allow_success_or_skipped "CI classifier tests" "$CI_CLASSIFIER_TESTS"
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi
          QUALITY_REQUIRED_CHECKS

      - name: Write quality required checks failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-required-checks-failure.log"
          "Quality Required Checks"

      - name: Write quality required checks diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Required Checks"

      - name: Upload quality required checks diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-required-checks
          path: .tmp/ci-diagnostics/quality-required-checks/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
