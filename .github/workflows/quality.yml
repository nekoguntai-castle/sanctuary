  quality-required-checks:
    name: Code Quality Required Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: always()
    needs: [determine-scope, lint, lockfile-peer-resolution, dependency-audit, gitleaks, semgrep-sast, workflow-action-runtime-guard, ci-classifier-tests, lizard, jscpd, large-file-classification]
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-required-checks
    steps:
      - name: Checkout (for diagnostic publish)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
      - name: Check quality job results
        env:
          RUN_REPO_QUALITY: ${{ needs.determine-scope.outputs.run_repo_quality }}
          RUN_SOURCE_QUALITY: ${{ needs.determine-scope.outputs.run_source_quality }}
          RUN_DEPENDENCY_AUDIT: ${{ needs.determine-scope.outputs.run_dependency_audit }}
          RUN_WORKFLOW_QUALITY: ${{ needs.determine-scope.outputs.run_workflow_quality }}
          RUN_CI_CLASSIFIER_TESTS: ${{ needs.determine-scope.outputs.run_ci_classifier_tests }}
          DETERMINE_SCOPE: ${{ needs.determine-scope.result }}
          LINT: ${{ needs.lint.result }}
          LOCKFILE_PEER_RESOLUTION: ${{ needs.lockfile-peer-resolution.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP_SAST: ${{ needs.semgrep-sast.result }}
          WORKFLOW_ACTION_RUNTIME_GUARD: ${{ needs.workflow-action-runtime-guard.result }}
          CI_CLASSIFIER_TESTS: ${{ needs.ci-classifier-tests.result }}
          LIZARD: ${{ needs.lizard.result }}
          JSCPD: ${{ needs.jscpd.result }}
          LARGE_FILE_CLASSIFICATION: ${{ needs.large-file-classification.result }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/quality-required-checks.log" bash -euo pipefail <<'QUALITY_REQUIRED_CHECKS'
          echo "=== quality-required-checks scope inputs ==="
          echo "RUN_REPO_QUALITY=$RUN_REPO_QUALITY"
          echo "RUN_SOURCE_QUALITY=$RUN_SOURCE_QUALITY"
          echo "RUN_DEPENDENCY_AUDIT=$RUN_DEPENDENCY_AUDIT"
          echo "RUN_WORKFLOW_QUALITY=$RUN_WORKFLOW_QUALITY"
          echo "RUN_CI_CLASSIFIER_TESTS=$RUN_CI_CLASSIFIER_TESTS"
          echo "=== sub-job results ==="
          echo "DETERMINE_SCOPE=$DETERMINE_SCOPE"
          echo "LINT=$LINT"
          echo "LOCKFILE_PEER_RESOLUTION=$LOCKFILE_PEER_RESOLUTION"
          echo "DEPENDENCY_AUDIT=$DEPENDENCY_AUDIT"
          echo "GITLEAKS=$GITLEAKS"
          echo "SEMGREP_SAST=$SEMGREP_SAST"
          echo "WORKFLOW_ACTION_RUNTIME_GUARD=$WORKFLOW_ACTION_RUNTIME_GUARD"
          echo "CI_CLASSIFIER_TESTS=$CI_CLASSIFIER_TESTS"
          echo "LIZARD=$LIZARD"
          echo "JSCPD=$JSCPD"
          echo "LARGE_FILE_CLASSIFICATION=$LARGE_FILE_CLASSIFICATION"

          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          require_success "Determine Quality Scope" "$DETERMINE_SCOPE"
          require_success "Secret scan (gitleaks)" "$GITLEAKS"

          allow_success_or_skipped() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name result was $result; expected success or skipped"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          if [ "$RUN_SOURCE_QUALITY" = "true" ]; then
            require_success "Lint" "$LINT"
            require_success "Cyclomatic complexity (lizard)" "$LIZARD"
            require_success "Duplication (jscpd)" "$JSCPD"
          else
            allow_success_or_skipped "Lint" "$LINT"
            allow_success_or_skipped "Cyclomatic complexity (lizard)" "$LIZARD"
            allow_success_or_skipped "Duplication (jscpd)" "$JSCPD"
          fi

          if [ "$RUN_DEPENDENCY_AUDIT" = "true" ]; then
            require_success "Lockfile peer resolution" "$LOCKFILE_PEER_RESOLUTION"
            require_success "Dependency audit (npm)" "$DEPENDENCY_AUDIT"
          else
            allow_success_or_skipped "Lockfile peer resolution" "$LOCKFILE_PEER_RESOLUTION"
            allow_success_or_skipped "Dependency audit (npm)" "$DEPENDENCY_AUDIT"
          fi

          if [ "$RUN_REPO_QUALITY" = "true" ]; then
            require_success "Large-file classification" "$LARGE_FILE_CLASSIFICATION"
          else
            allow_success_or_skipped "Large-file classification" "$LARGE_FILE_CLASSIFICATION"
          fi

          if [ "$RUN_SOURCE_QUALITY" = "true" ] || [ "$RUN_REPO_QUALITY" = "true" ] || [ "$RUN_WORKFLOW_QUALITY" = "true" ]; then
            require_success "SAST (Semgrep)" "$SEMGREP_SAST"
          else
            allow_success_or_skipped "SAST (Semgrep)" "$SEMGREP_SAST"
          fi

          if [ "$RUN_WORKFLOW_QUALITY" = "true" ]; then
            require_success "Workflow policy guards" "$WORKFLOW_ACTION_RUNTIME_GUARD"
          else
            allow_success_or_skipped "Workflow policy guards" "$WORKFLOW_ACTION_RUNTIME_GUARD"
          fi

          if [ "$RUN_CI_CLASSIFIER_TESTS" = "true" ]; then
            require_success "CI classifier tests" "$CI_CLASSIFIER_TESTS"
          else
            allow_success_or_skipped "CI classifier tests" "$CI_CLASSIFIER_TESTS"
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi
          QUALITY_REQUIRED_CHECKS

      - name: Write quality required checks failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-required-checks-failure.log"
          "Quality Required Checks"

      - name: Write quality required checks diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Required Checks"

      - name: Upload quality required checks diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-required-checks
          path: .tmp/ci-diagnostics/quality-required-checks/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # Observability only: this job is deliberately independent from the required
  # quality aggregate and never runs in an untrusted pull-request context.
  ci-performance-report:
    name: CI Performance Report
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    env:
      FORGEJO_API_URL: ${{ github.api_url }}
      FORGEJO_REPOSITORY: ${{ github.repository }}
      FORGEJO_TOKEN: ${{ github.token }}
      REPORT_DIR: .tmp/ci-performance-report
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Collect event-separated workflow trends
        run: |
          set +e
          mkdir -p "$REPORT_DIR"
          cohorts='[]'

          collect_cohort() {
            slug="$1"
            workflow="$2"
            event="$3"
            branch="$4"
            markdown_file="$REPORT_DIR/$slug.md"
            json_file="$REPORT_DIR/$slug.json"
            error_file="$REPORT_DIR/$slug.error.log"
            args=(--workflow "$workflow" --event "$event" --limit 20 --json-out "$json_file")
            if [ -n "$branch" ]; then
              args+=(--branch "$branch")
            fi

            if bash scripts/ci/report-workflow-trends.sh "${args[@]}" >"$markdown_file" 2>"$error_file"; then
              status='success'
            else
              status='error'
              echo "::warning::Could not collect CI performance cohort $slug; see artifact diagnostics"
              {
                echo "Workflow Duration Trend"
                echo "Cohort | $slug"
                echo "Status | collection error"
              } > "$markdown_file"
              jq -n \
                --arg workflow "$workflow" \
                --arg event "$event" \
                --arg branch "$branch" \
                '{schema_version: 1, workflow: $workflow, event_filter: $event, branch_filter: (if $branch == "" then null else $branch end), sample_count: 0, collection_error: true, metrics: {wall_seconds: {p50: null, p90: null}, runner_seconds: {p50: null, p90: null, available: false}}, runs: []}' \
                > "$json_file"
            fi

            cohorts="$(jq -c \
              --arg slug "$slug" \
              --arg status "$status" \
              --slurpfile report "$json_file" \
              '. + [{slug: $slug, status: $status, report: $report[0]}]' \
              <<<"$cohorts")"
          }

          collect_cohort test-pr test.yml pull_request ''
          collect_cohort test-main test.yml push main
          collect_cohort test-schedule test.yml schedule main
          collect_cohort vectors-pr verify-vectors.yml pull_request ''
          collect_cohort install-pr install-test.yml pull_request ''
          collect_cohort install-main install-test.yml push main
          collect_cohort install-schedule install-test.yml schedule main
          collect_cohort release-tag release-candidate.yml push ''
          collect_cohort release-manual release-candidate.yml workflow_dispatch ''
          collect_cohort release-call release-candidate.yml workflow_call ''

          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repository "$FORGEJO_REPOSITORY" \
            --argjson cohorts "$cohorts" \
            '{schema_version: 1, generated_at: $generated_at, repository: $repository, cohorts: $cohorts}' \
            > "$REPORT_DIR/manifest.json"

          exit 0

      - name: Upload CI performance report
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-performance-report
          path: .tmp/ci-performance-report/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
