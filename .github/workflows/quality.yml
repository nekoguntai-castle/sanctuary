name: Code Quality

# Universal quality signals that aren't covered by the main test workflow:
# - lint:     repo-owned TypeScript policy gate for production source
# - audit:    high/critical npm advisory gate across every package lockfile
# - deprecations: exact, expiring inventory for npm's lockfile-backed warnings
# - root layout: exhaustive tracked-root classification and non-increasing ceiling
# - gitleaks: secret scanning (layered over config/tooling/gitleaks.toml allowlist)
# - semgrep:  Forgejo-compatible SAST gate for new Semgrep ERROR findings
# - actionlint: workflow syntax/expression validation with Forgejo action URL allowlist
# - lizard:   cyclomatic complexity (McCabe, NIST SP 500-235 thresholds)
# - jscpd:    duplicate-block detection (SonarQube 3% default)
# - large files: file-size guardrail for production source and tests
#
# These jobs are blocking. gitleaks gates new commit ranges plus the tracked
# tree, while lizard enforces a zero-warning baseline. Scheduled
# weekly so baseline drift is visible even on quiet weeks; runs on every PR
# for per-change feedback.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_VERSION: '24.19.0'
  NPM_VERSION: '11.19.0'
  # Lizard is the only host-Python consumer; pin the runtime baked into the
  # Ubuntu 22.04 job image instead of claiming a different unavailable patch.
  PYTHON_VERSION: '3.10.12'
  GITLEAKS_VERSION: '8.30.1'
  SEMGREP_VERSION: '1.161.0'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_LINUX_AMD64_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  LIZARD_WARNING_BASELINE: '9'
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2

jobs:
  determine-scope:
    name: Determine Quality Scope
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-determine-scope
    outputs:
      run_repo_quality: ${{ steps.classify.outputs.run_repo_quality }}
      run_source_quality: ${{ steps.classify.outputs.run_source_quality }}
      run_dependency_audit: ${{ steps.classify.outputs.run_dependency_audit }}
      run_workflow_quality: ${{ steps.classify.outputs.run_workflow_quality }}
      run_ci_classifier_tests: ${{ steps.classify.outputs.run_ci_classifier_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Check tracked root layout
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/root-layout-classification.log"
          node ${{ github.workspace }}/scripts/quality/check-root-layout.mjs

      - name: Classify quality scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/classify-quality-scope.log"
          ${{ github.workspace }}/scripts/ci/retry-command.sh "classify quality scope"
          bash ${{ github.workspace }}/scripts/ci/classify-quality-scope.sh

      - name: Write quality scope failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-determine-scope-failure.log"
          "Quality Determine Scope"

      - name: Write quality scope diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Determine Scope"

      - name: Upload quality scope diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-determine-scope
          path: .tmp/ci-diagnostics/quality-determine-scope/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_source_quality == 'true'
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-lint
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Restore npm cache
        uses: ./.github/actions/cache-npm
        with:
          lockfile-glob: package-lock.json

      - name: Run lint in clean workspace
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/lint.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          bash ${{ github.workspace }}/scripts/ci/run-quality-lint.sh

      - name: Write lint failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-lint-failure.log"
          "Quality Lint"

      - name: Write lint diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Lint"

      - name: Upload lint diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-lint
          path: .tmp/ci-diagnostics/quality-lint/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  lockfile-peer-resolution:
    name: Lockfile peer resolution
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_dependency_audit == 'true'
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-lockfile-peer-resolution
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Check lockfile peer resolution
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/lockfile-peer-resolution.log" bash -euo pipefail <<'QUALITY_LOCKFILE_PEER'
          scripts/ci/run-in-isolated-workspace.sh lockfile-peer-resolution bash -euo pipefail <<'PEER_SUBJECT'
          mkdir -p .tmp/npm-cache
          npm_config_cache="$PWD/.tmp/npm-cache" bash scripts/quality/check-lockfile-peer-resolution.sh
          PEER_SUBJECT
          QUALITY_LOCKFILE_PEER

      - name: Write lockfile peer failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-lockfile-peer-resolution-failure.log"
          "Quality Lockfile Peer Resolution"

      - name: Write lockfile peer diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Lockfile Peer Resolution"

      - name: Upload lockfile peer diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-lockfile-peer-resolution
          path: .tmp/ci-diagnostics/quality-lockfile-peer-resolution/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_dependency_audit == 'true'
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-dependency-audit
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Check npm deprecation inventory
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/npm-deprecations.log" bash -euo pipefail <<'QUALITY_NPM_DEPRECATIONS'
          scripts/ci/run-in-isolated-workspace.sh npm-deprecations bash -euo pipefail <<'DEPRECATION_SUBJECT'
          source scripts/ci/redactor.sh
          mkdir -p .tmp/npm-cache
          install_log="$PWD/.tmp/npm-ci.log"
          for attempt in 1 2 3; do
            echo "npm deprecation clean install, attempt $attempt"
            if npm ci --strict-allow-scripts --ignore-scripts --audit=false --fund=false --cache "$PWD/.tmp/npm-cache" >"$install_log" 2>&1; then
              break
            else
              install_status="$?"
            fi
            cat "$install_log"
            if [ "$attempt" -eq 3 ]; then
              exit "$install_status"
            fi
            sleep $((attempt * 10))
          done
          redact_file "$install_log" "$DIAGNOSTIC_DIR/npm-deprecation-install.log"
          node scripts/ci/check-npm-install-scripts.mjs --verify-installed
          node scripts/ci/check-npm-deprecations.mjs --install-log "$install_log"
          DEPRECATION_SUBJECT
          QUALITY_NPM_DEPRECATIONS

      - name: Run npm audit
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/npm-audit.log" bash -euo pipefail <<'QUALITY_NPM_AUDIT'
          scripts/ci/run-in-isolated-workspace.sh npm-audit bash -euo pipefail <<'AUDIT_SUBJECT'
          # One fail-closed policy owns every workspace and standalone lockfile.
          # Retrying the complete aggregate preserves global exception accounting.
          for attempt in 1 2 3; do
            echo "npm audit aggregate gate, attempt $attempt"
            if node scripts/ci/npm-audit-gate.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          AUDIT_SUBJECT
          QUALITY_NPM_AUDIT

      - name: Write dependency audit failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-dependency-audit-failure.log"
          "Quality Dependency Audit"

      - name: Write dependency audit diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Dependency Audit"

      - name: Upload dependency audit diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-dependency-audit
          path: .tmp/ci-diagnostics/quality-dependency-audit/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [determine-scope]
    if: always()
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-gitleaks
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-gitleaks.log" bash -euo pipefail <<'QUALITY_INSTALL_GITLEAKS'
          curl -sSL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          QUALITY_INSTALL_GITLEAKS

      - name: Run gitleaks
        # The repository has older test-fixture/history false positives, so
        # this job gates new PR commits and the latest scheduled/dispatch
        # commit. The tracked-tree scan covers the full checked-out source
        # while excluding ignored local artifacts such as .env, coverage,
        # dist, and generated SSL keys.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/gitleaks.log" bash -euo pipefail <<'QUALITY_GITLEAKS'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            /tmp/gitleaks git . \
              --config config/tooling/gitleaks.toml \
              --gitleaks-ignore-path config/tooling/gitleaksignore \
              --redact \
              --no-banner \
              --log-opts "--no-merges --first-parent ${BASE_SHA}^..${HEAD_SHA}"
          else
            /tmp/gitleaks git . \
              --config config/tooling/gitleaks.toml \
              --gitleaks-ignore-path config/tooling/gitleaksignore \
              --redact \
              --no-banner \
              --log-opts -1
          fi
          export GITLEAKS_BIN=/tmp/gitleaks
          bash scripts/gitleaks-tracked-tree.sh
          QUALITY_GITLEAKS

      - name: Write gitleaks failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-gitleaks-failure.log"
          "Quality Gitleaks"

      - name: Write gitleaks diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Gitleaks"

      - name: Upload gitleaks diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-gitleaks
          path: .tmp/ci-diagnostics/quality-gitleaks/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  semgrep-sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [determine-scope]
    if: |
      always() &&
      (needs.determine-scope.outputs.run_source_quality == 'true' ||
       needs.determine-scope.outputs.run_repo_quality == 'true' ||
       needs.determine-scope.outputs.run_workflow_quality == 'true')
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Run Semgrep baseline gate
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/semgrep-baseline.log" bash -euo pipefail <<'QUALITY_SEMGREP'
          scripts/ci/run-in-isolated-workspace.sh semgrep bash -euo pipefail <<'SEMGREP_SUBJECT'
          export SANCTUARY_CI_TEMP_DIR_OVERRIDE="$PWD/.tmp/semgrep-tools"
          mkdir -p "$SANCTUARY_CI_TEMP_DIR_OVERRIDE"
          semgrep_env="$PWD/.tmp/semgrep.env"
          : > "$semgrep_env"
          GITHUB_ENV="$semgrep_env" scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-semgrep.log" \
            bash "$GITHUB_WORKSPACE/scripts/ci/install-semgrep.sh"
          set -a
          source "$semgrep_env"
          set +a
          SEMGREP_REPORT_DIR="reports/semgrep"
          mkdir -p "$SEMGREP_REPORT_DIR"

          semgrep_status=0
          for attempt in 1 2 3; do
            echo "semgrep scan, attempt $attempt"
            set +e
            "$SEMGREP_BIN" scan \
              --config p/default \
              --severity ERROR \
              --error \
              --json \
              --output "$SEMGREP_REPORT_DIR/semgrep.json" \
              --exclude node_modules \
              --exclude dist \
              --exclude build \
              --exclude coverage \
              --exclude reports \
              --exclude playwright-report \
              --exclude test-results \
              --exclude .tmp \
              --exclude .tmp-gh \
              --exclude server/src/generated \
              .
            semgrep_status="$?"
            set -e

            if [ "$semgrep_status" -le 1 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep $((attempt * 10))
          done

          baseline_status=0
          if [ "$semgrep_status" -gt 1 ]; then
            baseline_status="$semgrep_status"
          else
            node scripts/quality/check-semgrep-baseline.mjs \
              "$SEMGREP_REPORT_DIR/semgrep.json" scripts/quality/semgrep-baseline.json || baseline_status="$?"
          fi

          upload_status=0
          scripts/ci/upload-artifact-from-subject.sh semgrep-report \
            "$SEMGREP_REPORT_DIR" || upload_status="$?"
          [ "$baseline_status" -ne 0 ] && exit "$baseline_status"
          exit "$upload_status"
          SEMGREP_SUBJECT
          QUALITY_SEMGREP

      - name: Write Semgrep failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "quality-semgrep-failure.log"
          "Quality Semgrep"

      - name: Write Semgrep diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Quality Semgrep"

      - name: Upload Semgrep diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-semgrep
          path: .tmp/ci-diagnostics/quality-semgrep/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  workflow-action-runtime-guard:
    name: Workflow policy guards
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_workflow_quality == 'true'
    env:
      ACTIONLINT_DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-workflow-lint
      RUNTIME_DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-workflow-action-runtime-guard
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Install actionlint + shellcheck
        timeout-minutes: 4
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$ACTIONLINT_DIAGNOSTIC_DIR/install-actionlint-shellcheck.log" bash -euo pipefail <<'QUALITY_INSTALL_ACTIONLINT'
          curl -sSL \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  /tmp/actionlint.tar.gz\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" > /tmp/actionlint.sha256
          sha256sum -c /tmp/actionlint.sha256
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          sudo apt-get -qq update
          sudo apt-get -qq install -y shellcheck
          shellcheck --version
          QUALITY_INSTALL_ACTIONLINT

      - name: Run actionlint
        id: actionlint
        timeout-minutes: 3
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$ACTIONLINT_DIAGNOSTIC_DIR/actionlint.log" bash -euo pipefail <<'QUALITY_ACTIONLINT'
          # Keep ShellCheck error-level analysis while serializing actionlint's
          # stdin consumers for the pinned Forgejo Podman runner.
          /tmp/actionlint -color \
            -shellcheck='scripts/ci/actionlint-shellcheck.sh --severity=error' \
            -ignore 'specifying action "https://data\.forgejo\.org/forgejo/(upload|download)-artifact@v4" in invalid format'
          QUALITY_ACTIONLINT

      - name: Write workflow lint failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$ACTIONLINT_DIAGNOSTIC_DIR"
          "quality-workflow-lint-failure.log"
          "Quality Workflow Lint"

      - name: Write workflow lint diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$ACTIONLINT_DIAGNOSTIC_DIR" "Quality Workflow Lint"

      - name: Upload workflow lint diagnostics
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-workflow-lint
          path: .tmp/ci-diagnostics/quality-workflow-lint/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Verify Node.js toolchain
        id: node_toolchain
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/setup-node-toolchain

      - name: Check action runtimes
        id: action_runtime
        if: always() && steps.node_toolchain.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$RUNTIME_DIAGNOSTIC_DIR/action-runtime-guard.log"
          npm run check:github-action-runtimes

      - name: Write workflow action runtime guard failure breadcrumb
        if: failure() && steps.checkout.outcome == 'success' && (steps.node_toolchain.outcome == 'failure' || steps.action_runtime.outcome == 'failure')
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$RUNTIME_DIAGNOSTIC_DIR"
          "quality-workflow-action-runtime-guard-failure.log"
          "Quality Workflow Action Runtime Guard"

      - name: Write workflow action runtime guard diagnostic summary
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$RUNTIME_DIAGNOSTIC_DIR" "Quality Workflow Action Runtime Guard"

      - name: Upload workflow action runtime guard diagnostics
        if: failure() && steps.checkout.outcome == 'success' && (steps.node_toolchain.outcome == 'failure' || steps.action_runtime.outcome == 'failure')
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-quality-workflow-action-runtime-guard
          path: .tmp/ci-diagnostics/quality-workflow-action-runtime-guard/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  ci-classifier-tests:
    name: CI classifier tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [determine-scope]
    if: always() && needs.determine-scope.outputs.run_ci_classifier_tests == 'true'
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/quality-ci-classifier-tests
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false
          fetch-depth: 0

      - name: Verify Node.js toolchain
