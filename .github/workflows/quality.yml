name: Code Quality

# Universal quality signals that aren't covered by the main test workflow:
# - lint:     repo-owned TypeScript policy gate for production source
# - audit:    high/critical npm advisory gate across every package lockfile
# - gitleaks: secret scanning (layered over .gitleaks.toml allowlist)
# - semgrep:  Forgejo-compatible SAST gate for new Semgrep ERROR findings
# - actionlint: workflow syntax/expression validation with Forgejo action URL allowlist
# - lizard:   cyclomatic complexity (McCabe, NIST SP 500-235 thresholds)
# - jscpd:    duplicate-block detection (SonarQube 3% default)
# - large files: file-size guardrail for production source and tests
#
# These jobs are blocking. gitleaks gates new commit ranges plus the tracked
# tree, while lizard enforces a zero-warning baseline. Scheduled
# weekly so baseline drift is visible even on quiet weeks; runs on every PR
# for per-change feedback.

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.number || github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' && github.event_name == 'merge_group' }}

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  GITLEAKS_VERSION: '8.30.1'
  SEMGREP_VERSION: '1.161.0'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_LINUX_AMD64_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  LIZARD_WARNING_BASELINE: '9'

jobs:
  determine-scope:
    name: Determine Quality Scope
    runs-on: ubuntu-latest
    outputs:
      run_repo_quality: ${{ steps.classify.outputs.run_repo_quality }}
      run_workflow_quality: ${{ steps.classify.outputs.run_workflow_quality }}
      run_ci_classifier_tests: ${{ steps.classify.outputs.run_ci_classifier_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Classify quality scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: bash scripts/ci/classify-quality-scope.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_repo_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  lockfile-peer-resolution:
    name: Lockfile peer resolution
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_repo_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check lockfile peer resolution
        run: bash scripts/quality/check-lockfile-peer-resolution.sh

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_repo_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: |
          package_dirs=(
            .
            server
            gateway
            ai-proxy
            website
            scripts/verify-addresses
            scripts/verify-psbt
          )

          for package_dir in "${package_dirs[@]}"; do
            if [ "$package_dir" = "." ]; then
              npm audit --audit-level=high
            else
              npm --prefix "$package_dir" audit --audit-level=high
            fi
          done

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    needs: [determine-scope]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Run gitleaks
        # The repository has older test-fixture/history false positives, so
        # this job gates new PR commits and the latest scheduled/dispatch
        # commit. The tracked-tree scan covers the full checked-out source
        # while excluding ignored local artifacts such as .env, coverage,
        # dist, and generated SSL keys.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            /tmp/gitleaks git . \
              --config .gitleaks.toml \
              --redact \
              --no-banner \
              --log-opts "--no-merges --first-parent ${BASE_SHA}^..${HEAD_SHA}"
          else
            /tmp/gitleaks git . \
              --config .gitleaks.toml \
              --redact \
              --no-banner \
              --log-opts -1
          fi
          export GITLEAKS_BIN=/tmp/gitleaks
          bash scripts/gitleaks-tracked-tree.sh

  semgrep-sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_repo_quality == 'true' || needs.determine-scope.outputs.run_workflow_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: |
          python -m venv .tmp/semgrep-venv
          .tmp/semgrep-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .tmp/semgrep-venv/bin/python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
          .tmp/semgrep-venv/bin/semgrep --version

      - name: Run Semgrep baseline gate
        run: |
          mkdir -p reports/semgrep
          set +e
          .tmp/semgrep-venv/bin/semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            --json \
            --output reports/semgrep/semgrep.json \
            --exclude node_modules \
            --exclude dist \
            --exclude build \
            --exclude coverage \
            --exclude reports \
            --exclude playwright-report \
            --exclude test-results \
            --exclude .tmp \
            --exclude .tmp-gh \
            --exclude server/src/generated \
            .
          semgrep_status="$?"
          set -e

          if [ "$semgrep_status" -gt 1 ]; then
            exit "$semgrep_status"
          fi

          npm run check:semgrep-baseline

      - name: Upload Semgrep report
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep/
          if-no-files-found: ignore

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_workflow_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install actionlint
        run: |
          curl -sSL \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  /tmp/actionlint.tar.gz\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" > /tmp/actionlint.sha256
          sha256sum -c /tmp/actionlint.sha256
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version

      - name: Run actionlint
        run: >
          /tmp/actionlint -color -shellcheck=
          -ignore 'specifying action "https://data\.forgejo\.org/forgejo/(upload|download)-artifact@v4" in invalid format'

  workflow-action-runtime-guard:
    name: Workflow action runtime guard
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_workflow_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check action runtimes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:github-action-runtimes

  ci-classifier-tests:
    name: CI classifier tests
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_ci_classifier_tests == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run CI classifier tests
        run: |
          bash -n scripts/ci/classify-test-changes.sh
          bash -n scripts/ci/classify-docker-build-images.sh
          bash -n scripts/ci/classify-quality-scope.sh
          bash -n scripts/ci/browser-e2e-groups.sh
          bash -n scripts/ci/backend-integration-groups.sh
          bash -n scripts/ci/frontend-coverage-shard.sh
          bash -n scripts/ci/frontend-coverage-merge.sh
          bash -n scripts/ci/install-test-ports.sh
          bash -n scripts/ci/time-command.sh
          bash -n scripts/ci/report-workflow-durations.sh
          bash -n scripts/ci/report-workflow-trends.sh
          bash -n scripts/ci/report-timing-notices.sh
          bash -n tests/ci/playwright-timing-reporter.test.sh
          bash -n tests/ci/classify-test-changes.test.sh
          bash -n tests/ci/classify-docker-build-images.test.sh
          bash -n tests/ci/classify-quality-scope.test.sh
          bash -n tests/ci/browser-e2e-groups.test.sh
          bash -n tests/ci/backend-integration-groups.test.sh
          bash -n tests/ci/frontend-coverage-scripts.test.sh
          bash -n tests/ci/install-test-ports.test.sh
          bash -n tests/ci/report-workflow-trends.test.sh
          bash -n tests/ci/report-timing-notices.test.sh
          node tests/ci/check-github-action-runtimes.test.mjs
          bash tests/ci/playwright-timing-reporter.test.sh
          bash tests/ci/classify-test-changes.test.sh
          bash tests/ci/classify-docker-build-images.test.sh
          bash tests/ci/classify-quality-scope.test.sh
          bash tests/ci/browser-e2e-groups.test.sh
          bash tests/ci/backend-integration-groups.test.sh
          bash tests/ci/frontend-coverage-scripts.test.sh
          bash tests/ci/install-test-ports.test.sh
          bash tests/ci/report-workflow-trends.test.sh
          bash tests/ci/report-timing-notices.test.sh

  lizard:
    name: Cyclomatic complexity (lizard)
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_repo_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lizard
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement scripts/quality/lizard-requirements.txt

      - name: Run lizard
        # McCabe / NIST / SonarQube: warn on CCN > 15. The current measured
        # CI-scope baseline is 9 warnings; fail the job if that count grows.
        # -l filters by language; `-x` excludes generated, vendored, and
        # test-fixture paths that skew the signal.
        run: |
          lizard \
            -w \
            -i "${LIZARD_WARNING_BASELINE}" \
            -l javascript \
            -l typescript \
            -C 15 \
            -T nloc=200 \
            -x './node_modules/*' \
            -x './*/node_modules/*' \
            -x './dist/*' \
            -x './*/dist/*' \
            -x './build/*' \
            -x './coverage/*' \
            -x './*/coverage/*' \
            -x './server/src/generated/*' \
            -x './server/tests/fixtures/*' \
            -x './scripts/verify-addresses/output/*' \
            -x './*.min.js' \
            -x './reports/*' \
            -x './playwright-report/*' \
            -x './test-results/*' \
            -x './.tmp/*' \
            -x './.tmp-gh/*' \
            .

  jscpd:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_repo_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run jscpd
        # Uses .jscpd.json at the repo root. Config owns threshold and
        # exclusions. Installing via npx keeps the repo devDependencies
        # lean; pin to a known-good major version to avoid drift.
        run: npx --yes jscpd@4 .

      - name: Upload jscpd report
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: jscpd-report
          path: reports/jscpd/
          if-no-files-found: ignore

  large-file-classification:
    name: Large-file classification
    runs-on: ubuntu-latest
    needs: [determine-scope]
    if: needs.determine-scope.outputs.run_repo_quality == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check large-file classification
        run: node scripts/quality/check-large-files.mjs

  quality-required-checks:
    name: Code Quality Required Checks
    runs-on: ubuntu-latest
    if: always()
    needs: [determine-scope, lint, lockfile-peer-resolution, dependency-audit, gitleaks, semgrep-sast, workflow-lint, workflow-action-runtime-guard, ci-classifier-tests, lizard, jscpd, large-file-classification]
    steps:
      - name: Check quality job results
        env:
          RUN_REPO_QUALITY: ${{ needs.determine-scope.outputs.run_repo_quality }}
          RUN_WORKFLOW_QUALITY: ${{ needs.determine-scope.outputs.run_workflow_quality }}
          RUN_CI_CLASSIFIER_TESTS: ${{ needs.determine-scope.outputs.run_ci_classifier_tests }}
          LINT: ${{ needs.lint.result }}
          LOCKFILE_PEER_RESOLUTION: ${{ needs.lockfile-peer-resolution.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP_SAST: ${{ needs.semgrep-sast.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          WORKFLOW_ACTION_RUNTIME_GUARD: ${{ needs.workflow-action-runtime-guard.result }}
          CI_CLASSIFIER_TESTS: ${{ needs.ci-classifier-tests.result }}
          LIZARD: ${{ needs.lizard.result }}
          JSCPD: ${{ needs.jscpd.result }}
          LARGE_FILE_CLASSIFICATION: ${{ needs.large-file-classification.result }}
        run: |
          failed=false

          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name result was $result; expected success"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          require_success "Secret scan (gitleaks)" "$GITLEAKS"

          allow_success_or_skipped() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name result was $result; expected success or skipped"
              failed=true
            else
              echo "$name: $result"
            fi
          }

          if [ "$RUN_REPO_QUALITY" = "true" ]; then
            require_success "Lint" "$LINT"
            require_success "Lockfile peer resolution" "$LOCKFILE_PEER_RESOLUTION"
            require_success "Dependency audit (npm)" "$DEPENDENCY_AUDIT"
            require_success "Cyclomatic complexity (lizard)" "$LIZARD"
            require_success "Duplication (jscpd)" "$JSCPD"
            require_success "Large-file classification" "$LARGE_FILE_CLASSIFICATION"
          else
            allow_success_or_skipped "Lint" "$LINT"
            allow_success_or_skipped "Lockfile peer resolution" "$LOCKFILE_PEER_RESOLUTION"
            allow_success_or_skipped "Dependency audit (npm)" "$DEPENDENCY_AUDIT"
            allow_success_or_skipped "Cyclomatic complexity (lizard)" "$LIZARD"
            allow_success_or_skipped "Duplication (jscpd)" "$JSCPD"
            allow_success_or_skipped "Large-file classification" "$LARGE_FILE_CLASSIFICATION"
          fi

          if [ "$RUN_REPO_QUALITY" = "true" ] || [ "$RUN_WORKFLOW_QUALITY" = "true" ]; then
            require_success "SAST (Semgrep)" "$SEMGREP_SAST"
          else
            allow_success_or_skipped "SAST (Semgrep)" "$SEMGREP_SAST"
          fi

          if [ "$RUN_WORKFLOW_QUALITY" = "true" ]; then
            require_success "Workflow lint (actionlint)" "$WORKFLOW_LINT"
            require_success "Workflow action runtime guard" "$WORKFLOW_ACTION_RUNTIME_GUARD"
          else
            allow_success_or_skipped "Workflow lint (actionlint)" "$WORKFLOW_LINT"
            allow_success_or_skipped "Workflow action runtime guard" "$WORKFLOW_ACTION_RUNTIME_GUARD"
          fi

          if [ "$RUN_CI_CLASSIFIER_TESTS" = "true" ]; then
            require_success "CI classifier tests" "$CI_CLASSIFIER_TESTS"
          else
            allow_success_or_skipped "CI classifier tests" "$CI_CLASSIFIER_TESTS"
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi
