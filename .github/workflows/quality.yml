          bash tests/ci/workflows-test-only.test.sh
          QUALITY_CI_CLASSIFIER_TESTS

      - name: Write CI classifier failure breadcrumb
        if: failure()
        continue-on-error: true
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
