name: Verify Bitcoin Vectors

on:
  # Run weekly to catch any regressions
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      regenerate_psbt:
        description: 'Regenerate PSBT vectors with Bitcoin Core'
        required: false
        default: false
        type: boolean

  # Run on PRs that touch address derivation or PSBT code
  pull_request:
    paths:
      - 'server/src/services/bitcoin/addressDerivation.ts'
      - 'server/src/services/bitcoin/addressDerivation/**'
      - 'server/src/services/bitcoin/descriptorParser.ts'
      - 'server/src/services/bitcoin/descriptorParser/**'
      - 'server/src/services/bitcoin/transactions/**'
      - 'server/src/services/bitcoin/psbtBuilder/**'
      - 'services/hardwareWallet/**'
      - 'tests/services/hardwareWallet**'
      - 'tests/services/hardwareWallet/**'
      - 'tests/services/hardwareWalletBitbox/**'
      - 'hooks/send/useQrSigning.ts'
      - 'hooks/send/useUsbSigning.ts'
      - 'hooks/send/useSendTransactionActions.ts'
      - 'tests/hooks/useQrSigning.test.tsx'
      - 'tests/hooks/useUsbSigning.test.tsx'
      - 'tests/hooks/useSendTransactionActions.test.tsx'
      - 'tests/hooks/useSendTransactionActions/**'
      - 'server/src/services/scriptTypes/**'
      - 'server/tests/fixtures/verified-address-vectors.ts'
      - 'server/tests/fixtures/bip174-test-vectors.ts'
      - 'scripts/verify-addresses/**'
      - 'scripts/verify-psbt/**'
      - '.github/workflows/verify-vectors.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Start Bitcoin Core
        run: |
          docker run -d --name bitcoin-core \
            -p 18443:18443 \
            bitcoin/bitcoin:27.0 \
            -regtest=1 \
            -server=1 \
            -rpcuser=verify \
            -rpcpassword=verify \
            -rpcallowip=0.0.0.0/0 \
            -rpcbind=0.0.0.0 \
            -fallbackfee=0.0001 \
            -txindex=1 \
            -printtoconsole=1

      - name: Wait for Bitcoin Core
        run: |
          echo "Waiting for Bitcoin Core to be ready..."
          for i in {1..30}; do
            if curl -s --user verify:verify --data-binary '{"jsonrpc":"1.0","method":"getblockchaininfo","params":[]}' http://localhost:18443/ > /dev/null 2>&1; then
              echo "Bitcoin Core is ready"
              exit 0
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 2
          done
          docker logs bitcoin-core
          exit 1

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install address verification dependencies
        working-directory: scripts/verify-addresses
        run: npm ci

      - name: Install Python address verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install bip_utils

      - name: Run cross-implementation address verifier
        working-directory: scripts/verify-addresses
        env:
          BITCOIN_RPC_URL: http://127.0.0.1:18443
          BITCOIN_RPC_USER: verify
          BITCOIN_RPC_PASS: verify
        run: npm run verify

      - name: Run address derivation tests
        working-directory: server
        run: npm run test -- tests/unit/services/bitcoin/addressDerivation.verified.test.ts

      - name: Run derivation path tests
        working-directory: server
        run: npm run test -- tests/unit/services/scriptTypes/derivationPaths.test.ts

      - name: Run multisig key ordering tests
        working-directory: server
        run: npm run test -- tests/unit/services/bitcoin/multisigKeyOrdering.test.ts

      - name: Run xpub validation tests
        working-directory: server
        run: npm run test -- tests/unit/services/bitcoin/xpubValidation.test.ts

      - name: Run property-based tests
        working-directory: server
        run: npm run test -- tests/unit/services/bitcoin/propertyBased.test.ts

      - name: Run descriptor checksum tests
        working-directory: server
        run: npm run test -- tests/unit/services/bitcoin/descriptorChecksum.test.ts

      - name: Run PSBT BIP-174 verification tests
        working-directory: server
        run: npm run test -- tests/unit/services/bitcoin/psbt.verified.test.ts

      - name: Run PSBT property-based tests
        working-directory: server
        run: npm run test -- tests/unit/services/bitcoin/psbt.property.test.ts

  # Optional: Regenerate vectors with Bitcoin Core
  # This job runs only on manual trigger and requires Docker
  regenerate-vectors:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Install verification script dependencies
        working-directory: scripts/verify-addresses
        run: npm ci
        continue-on-error: true # May not exist yet

      - name: Generate vectors with Bitcoin Core
        working-directory: scripts/verify-addresses
        run: |
          echo "Vector generation would run here"
          echo "This requires the verify-addresses infrastructure to be set up"
        continue-on-error: true

      - name: Check for vector changes
        run: |
          if git diff --quiet server/tests/fixtures/verified-address-vectors.ts; then
            echo "✅ Vectors unchanged - all implementations agree"
          else
            echo "⚠️ Vectors changed - review needed"
            git diff server/tests/fixtures/verified-address-vectors.ts
            exit 1
          fi
        continue-on-error: true

  # Optional: Regenerate PSBT vectors with Bitcoin Core
  regenerate-psbt-vectors:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_psbt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'

      - name: Start Bitcoin Core
        run: |
          docker run -d --name bitcoin-core \
            -p 18443:18443 \
            bitcoin/bitcoin:27.0 \
            -regtest=1 \
            -server=1 \
            -rpcuser=sanctuary \
            -rpcpassword=sanctuary-verify \
            -rpcallowip=0.0.0.0/0 \
            -rpcbind=0.0.0.0 \
            -fallbackfee=0.00001 \
            -txindex=1 \
            -printtoconsole=1

      - name: Wait for Bitcoin Core
        run: |
          echo "Waiting for Bitcoin Core to be ready..."
          for i in {1..30}; do
            if curl -s --user sanctuary:sanctuary-verify --data-binary '{"jsonrpc":"1.0","method":"getblockchaininfo","params":[]}' http://localhost:18443/ > /dev/null 2>&1; then
              echo "Bitcoin Core is ready"
              exit 0
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 2
          done
          docker logs bitcoin-core
          exit 1

      - name: Install PSBT verification dependencies
        working-directory: scripts/verify-psbt
        run: npm install

      - name: Generate PSBT vectors
        working-directory: scripts/verify-psbt
        env:
          BITCOIN_RPC_USER: sanctuary
          BITCOIN_RPC_PASS: sanctuary-verify
        run: npx tsx generate-vectors.ts

      - name: Generate signed PSBT vectors
        working-directory: scripts/verify-psbt
        env:
          BITCOIN_RPC_USER: sanctuary
          BITCOIN_RPC_PASS: sanctuary-verify
        run: npx tsx generate-signed-vectors.ts

      - name: Verify generated PSBT vectors are non-empty
        working-directory: scripts/verify-psbt
        run: npm run verify

      - name: Check for PSBT vector changes
        run: |
          if git diff --quiet server/tests/fixtures/generated-psbt-vectors.ts 2>/dev/null; then
            echo "✅ PSBT vectors unchanged"
          else
            echo "📝 PSBT vectors updated"
            git diff server/tests/fixtures/generated-psbt-vectors.ts || true
          fi

      - name: Check for signed PSBT vector changes
        run: |
          if git diff --quiet server/tests/fixtures/generated-signed-psbt-vectors.ts 2>/dev/null; then
            echo "✅ Signed PSBT vectors unchanged"
          else
            echo "📝 Signed PSBT vectors updated"
            git diff server/tests/fixtures/generated-signed-psbt-vectors.ts || true
          fi

      - name: Run PSBT tests with new vectors
        working-directory: server
        run: |
          npm ci
          npm run test -- tests/unit/services/bitcoin/psbt.verified.test.ts tests/unit/services/bitcoin/psbt.signed-vectors.test.ts

  # Summary job
  summary:
    needs: [verify-vectors]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.verify-vectors.result }}" == "success" ]; then
            echo "✅ All address verification tests passed"
          else
            echo "❌ Address verification tests failed"
            exit 1
          fi
