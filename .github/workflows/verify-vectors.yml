  # Optional: Regenerate vectors with Bitcoin Core
  # This job runs only on manual trigger and requires Docker
  regenerate-vectors:
    if: github.event_name == 'workflow_dispatch'
    runs-on: docker-socket
    container:
      image: nexus.tabineko.dev/nekoguntai-castle/sanctuary-ci-go@sha256:c8562e65bcdd3c5b7f72412107d5b1e9b2e0351f05ed2897690fd12b86948d0a
    timeout-minutes: 60
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/regenerate-vectors

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain
        with:
          install-npm: 'false'

      - name: Verify Go toolchain
        uses: ./.github/actions/setup-go-toolchain

      - name: Wait for Docker
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          ${{ github.workspace }}/scripts/ci/wait-for-docker.sh

      - name: Generate address vectors with pinned verifier stack
        working-directory: scripts/verify-addresses
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/generate-address-vectors.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          ${{ github.workspace }}/scripts/ci/cleanup-ci-callsite.sh run
          --lane address-generate
          --runtime "${RUNNER_TEMP}/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/address-generate"
          --artifact-dir "${RUNNER_TEMP}/sanctuary-cleanup-artifacts/address-generate"
          --checkout-root "${GITHUB_WORKSPACE}"
          --
          npm run generate:repeatable

      - name: Verify generated address cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/address-generate

      - name: Upload generated address verifier cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-address-generate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/address-generate/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/address-generate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Check for vector changes
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/check-address-vector-changes.log" bash <<'INNER'
          set -euo pipefail
          if git diff --quiet scripts/verify-addresses/output/verified-vectors.ts server/tests/fixtures/verified-address-vectors.ts; then
            echo "Vectors unchanged - all implementations agree"
          else
            echo "Vectors changed - review needed"
            git diff scripts/verify-addresses/output/verified-vectors.ts server/tests/fixtures/verified-address-vectors.ts
            exit 1
          fi
          INNER

      - name: Write regenerate vector diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Regenerate Address Vectors"

      - name: Upload regenerate vector diagnostics
        if: always()
        continue-on-error: true
