          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
            set -euo pipefail
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector root npm ci" npm ci --strict-allow-scripts --ignore-scripts
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector shared workspace build" npm --workspace shared run build
            cd server
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector prisma generate" npx prisma generate
          '

      - name: Install PSBT verification dependencies
        working-directory: scripts/verify-psbt
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-psbt-dependencies.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm ci --strict-allow-scripts

      - name: Run receipt-bound regenerated Bitcoin Core PSBT proof
        timeout-minutes: 25
        run: |
          scripts/ci/cleanup-ci-callsite.sh run --lane regenerate-psbt \
            --checkout-root "$GITHUB_WORKSPACE" \
            --runtime "$RUNNER_TEMP/sanctuary-cleanup/regenerate-psbt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/regenerate-psbt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -- scripts/ci/run-psbt-core-subject.sh regenerate

      - name: Verify regenerated PSBT cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/regenerate-psbt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload regenerated PSBT cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: regenerate-psbt-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/regenerate-psbt-${{ github.run_id }}-${{ github.run_attempt }}/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/regenerate-psbt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Write regenerate PSBT vector diagnostic summary
        if: always()
