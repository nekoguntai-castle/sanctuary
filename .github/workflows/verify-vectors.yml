        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Regenerate PSBT Vectors"

      - name: Upload regenerate PSBT vector diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-regenerate-psbt-vectors
          path: .tmp/ci-diagnostics/regenerate-psbt-vectors/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # Summary job
  summary:
    needs: [determine-verify-scope, verify-vectors, verify-trezor-emulator, verify-ledger-emulator, verify-jade-emulator]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: always()

    steps:
      - name: Check results
        env:
          RUN_VERIFY_VECTORS: ${{ needs.determine-verify-scope.outputs.run_verify_vectors }}
          DETERMINE_VERIFY_SCOPE: ${{ needs.determine-verify-scope.result }}
          VERIFY_VECTORS: ${{ needs.verify-vectors.result }}
          VERIFY_TREZOR_EMULATOR: ${{ needs.verify-trezor-emulator.result }}
          VERIFY_LEDGER_EMULATOR: ${{ needs.verify-ledger-emulator.result }}
          VERIFY_JADE_EMULATOR: ${{ needs.verify-jade-emulator.result }}
        run: |
          echo "RUN_VERIFY_VECTORS=$RUN_VERIFY_VECTORS"
          echo "DETERMINE_VERIFY_SCOPE=$DETERMINE_VERIFY_SCOPE"
          echo "VERIFY_VECTORS=$VERIFY_VECTORS"
          echo "VERIFY_TREZOR_EMULATOR=$VERIFY_TREZOR_EMULATOR"
          echo "VERIFY_LEDGER_EMULATOR=$VERIFY_LEDGER_EMULATOR"
          echo "VERIFY_JADE_EMULATOR=$VERIFY_JADE_EMULATOR"

          if [ "$DETERMINE_VERIFY_SCOPE" != "success" ]; then
            echo "::error::Determine Verify Vectors Scope result was $DETERMINE_VERIFY_SCOPE; expected success"
            exit 1
          fi

          if [ "$VERIFY_VECTORS" == "success" ] && \
             [ "$VERIFY_TREZOR_EMULATOR" == "success" ] && \
             [ "$VERIFY_LEDGER_EMULATOR" == "success" ] && \
             [ "$VERIFY_JADE_EMULATOR" == "success" ]; then
            echo "✅ All address verification tests passed"
            exit 0
          fi

          if [ "$RUN_VERIFY_VECTORS" == "false" ] && \
             [ "$VERIFY_VECTORS" == "skipped" ] && \
             [ "$VERIFY_TREZOR_EMULATOR" == "skipped" ] && \
             [ "$VERIFY_LEDGER_EMULATOR" == "skipped" ] && \
             [ "$VERIFY_JADE_EMULATOR" == "skipped" ]; then
            echo "documentation-only change; funds-safety proofs intentionally skipped"
            exit 0
          fi

          echo "❌ Address verification tests failed"
          exit 1
