name: Verify Bitcoin Vectors

on:
  # Run weekly to catch any regressions
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      regenerate_psbt:
        description: 'Regenerate PSBT vectors with Bitcoin Core'
        required: false
        default: false
        type: boolean

  # Funds-safety evidence must be present for every proposed or landed change.
  # Do not add path filters here: a filter can silently omit a newly introduced
  # address, wallet-policy, or hardware integration boundary. In particular,
  # shared/constants/walletPolicy.ts is verifier input and must always trigger
  # this workflow on PRs, merge queues, and landed main-branch commits.
  pull_request:
    branches: [main]

  merge_group:
    types: [checks_requested]

  push:
    branches: [main]

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Funds-safety proof runtime. This must match .nvmrc exactly; the runner image
  # supplies it and setup-node-toolchain fails closed on image drift.
  NODE_VERSION: '24.19.0'
  NPM_VERSION: '11.19.0'
  VERIFY_PSBT_CORE_IMAGE: bitcoin/bitcoin:29.0@sha256:a6aa8a9e349b4108d13c558dbe43064057bd7b6474b858966884f9cb95b7ed78
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2
  # Must stay below the smallest timeout-minutes of any step that takes the
  # lock (5m today), or the step kills the wait before with-runner-lock.sh can
  # report the contention. tests/ci/with-runner-lock.test.sh enforces this.
  SANCTUARY_RUNNER_LOCK_TIMEOUT_SECONDS: '120'
  # Emulator startup includes an image pull, firmware boot, and Bridge startup.
  # Give its dedicated device lock a measured wait budget within the step limit.
  TREZOR_EMULATOR_LOCK_TIMEOUT_SECONDS: '600'
  LEDGER_EMULATOR_LOCK_TIMEOUT_SECONDS: '300'
  JADE_EMULATOR_LOCK_TIMEOUT_SECONDS: '2700'
  # The proof resolver may infer a private daemon-host bind from the runner's
  # job-container gateway, but a public interface always remains opt-in.
  SANCTUARY_TREZOR_ALLOW_PUBLIC_BIND: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-vectors:
    runs-on: docker-socket
    container:
      image: nexus.tabineko.dev/nekoguntai-castle/sanctuary-ci-go@sha256:8b50f6c8ccb016b042c7125a637b068a49c856a76e543365044b36a593edd81e
    timeout-minutes: 60
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/verify-vectors
      SANCTUARY_CI_RUN_ATTEMPT_OVERRIDE: ${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain
        with:
          install-npm: 'false'

      - name: Verify wallet-safety classifier completeness
        run: node scripts/ci/check-wallet-safety-classifier.mjs

      - name: Verify Go toolchain
        uses: ./.github/actions/setup-go-toolchain

      - name: Wait for Docker
        timeout-minutes: 4
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          ${{ github.workspace }}/scripts/ci/wait-for-docker.sh

      - name: Run pinned Jade vendor protocol harness
        timeout-minutes: 5
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/jade-protocol-harness.log"
          npm run test:jade-protocol-harness

      - name: Upload current Jade protocol proof
        if: success() && env.JADE_PROTOCOL_PROOF_DIR != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: jade-protocol-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.JADE_PROTOCOL_PROOF_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Install server dependencies
        timeout-minutes: 10
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-server-dependencies.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
            set -euo pipefail
            ${{ github.workspace }}/scripts/ci/retry-command.sh "vector root npm ci" npm ci --strict-allow-scripts --ignore-scripts
            ${{ github.workspace }}/scripts/ci/retry-command.sh "vector shared workspace build" npm --workspace shared run build
            cd server
            ${{ github.workspace }}/scripts/ci/retry-command.sh "vector prisma generate" npx prisma generate
          '

      - name: Prove PSBT account-binding invariants by mutation
        timeout-minutes: 8
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/psbt-account-binding-mutation.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
              set -euo pipefail
              npm run test:mutation:wallet-policy
              npm run test:mutation:psbt-account-binding:browser
              npm --prefix server run test:mutation:psbt-account-binding
              npm --prefix server run test:mutation:taproot-construction
              npm --prefix server run test:mutation:taproot-artifact-finalization
            '

      - name: Prove exact transaction fee invariants by mutation
        timeout-minutes: 8
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/fee-policy-mutation.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
              set -euo pipefail
              npm --prefix server run test:mutation:fee-policy
              node scripts/ci/check-wallet-safety-mutation-map.mjs
            '

      - name: Upload PSBT account-binding mutation reports
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: psbt-account-binding-mutation-reports
          path: |
            reports/mutation/psbt-account-binding-browser.json
            reports/mutation/wallet-policy.json
            server/reports/mutation/psbt-account-binding-server.json
            server/reports/mutation/taproot-construction.json
            server/reports/mutation/taproot-artifact-finalization.json
            server/reports/mutation/fee-policy.json
          if-no-files-found: error
          retention-days: 14

      - name: Run cross-implementation address verifier
        timeout-minutes: 15
        working-directory: scripts/verify-addresses
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/address-verifier.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run verify:repeatable

      - name: Run address verifier contract tests
        timeout-minutes: 5
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/address-verifier-contract-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm exec -- vitest run --config config/tooling/vitest.config.ts
          --pool threads --maxWorkers=1 --no-file-parallelism
          tests/scripts/verifyAddresses

      - name: Verify pinned address/key corpus projection
        timeout-minutes: 2
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/address-key-corpus.log"
          node scripts/generate-address-key-corpora.mjs --check

      - name: Run address derivation tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/address-derivation-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci --
          tests/unit/services/bitcoin/addressDerivation.parse.test.ts
          tests/unit/services/bitcoin/addressDerivation.verified.test.ts
          tests/unit/services/bitcoin/canonicalDescriptorSemantics.test.ts

      - name: Run derivation path tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/derivation-path-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci -- tests/unit/services/scriptTypes/derivationPaths.test.ts

      - name: Run multisig key ordering tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/multisig-key-ordering-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci -- tests/unit/services/bitcoin/multisigKeyOrdering.test.ts

      - name: Run xpub validation tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/xpub-validation-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci -- tests/unit/services/bitcoin/xpubValidation.test.ts

      - name: Run hardware capability truthfulness tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/hardware-capability-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci --
          tests/unit/services/bitcoin/hardwareWalletCompatibility.test.ts
          tests/unit/services/hardwareWalletCapabilities.test.ts

      - name: Replay hardware-signed fixture contracts
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/hardware-signed-fixture-replay.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci --
          tests/unit/services/bitcoin/psbt.hardware-signed-vectors.test.ts

      - name: Run property-based tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/property-based-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci -- tests/unit/services/bitcoin/propertyBased.test.ts

      - name: Run descriptor checksum tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/descriptor-checksum-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci -- tests/unit/services/bitcoin/descriptorChecksum.test.ts

      - name: Run PSBT BIP-174 verification tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/psbt-bip174-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci --
          tests/unit/services/bitcoin/psbt.verified.test.ts
          tests/unit/services/bitcoin/psbt.signed-vectors.test.ts

      - name: Install PSBT proof verifier dependencies
        timeout-minutes: 5
        working-directory: scripts/verify-psbt
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-psbt-verifier-dependencies.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm ci --strict-allow-scripts

      - name: Verify pinned Bitcoin Core PSBT proof
        timeout-minutes: 5
        working-directory: scripts/verify-psbt
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/pinned-psbt-proof.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run verify

      - name: Start isolated pinned Bitcoin Core for live PSBT proof
        timeout-minutes: 5
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/start-live-psbt-core.log" bash <<'INNER'
          set -euo pipefail
          container_name="sanctuary-psbt-core-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          echo "VERIFY_PSBT_CORE_CONTAINER=$container_name" >> "$GITHUB_ENV"
          docker pull "$VERIFY_PSBT_CORE_IMAGE"
          docker run -d --name "$container_name" -p 18443/tcp \
            "$VERIFY_PSBT_CORE_IMAGE" \
            -regtest=1 \
            -server=1 \
            -rpcuser=sanctuary \
            -rpcpassword=sanctuary-verify \
            -rpcallowip=0.0.0.0/0 \
            -rpcbind=0.0.0.0 \
            -fallbackfee=0.00001 \
            -txindex=1 \
            -printtoconsole=1

          expected_image_id="$(docker image inspect "$VERIFY_PSBT_CORE_IMAGE" --format '{{.Id}}')"
          actual_image_id="$(docker inspect "$container_name" --format '{{.Image}}')"
          if [ "$actual_image_id" != "$expected_image_id" ]; then
            echo "Bitcoin Core image drift: expected ID $expected_image_id, received $actual_image_id" >&2
            exit 1
          fi
          expected_digest="${VERIFY_PSBT_CORE_IMAGE##*@}"
          if ! docker image inspect "$VERIFY_PSBT_CORE_IMAGE" --format '{{join .RepoDigests "\n"}}' \
            | grep -Fq "@$expected_digest"; then
            echo "Pulled Bitcoin Core image does not attest expected digest $expected_digest" >&2
            exit 1
          fi

          rpc_port="$(docker inspect "$container_name" \
            --format '{{(index (index .NetworkSettings.Ports "18443/tcp") 0).HostPort}}')"
          case "$rpc_port" in
            ''|*[!0-9]*) echo "Invalid Bitcoin Core RPC port: $rpc_port" >&2; exit 1 ;;
          esac
          {
            echo "VERIFY_PSBT_CORE_PROVENANCE_MODE=pinned-container"
            echo "BITCOIN_RPC_HOST=${SANCTUARY_DOCKER_PUBLISHED_HOST:-127.0.0.1}"
            echo "BITCOIN_RPC_PORT=$rpc_port"
            echo "BITCOIN_RPC_USER=sanctuary"
            echo "BITCOIN_RPC_PASS=sanctuary-verify"
          } >> "$GITHUB_ENV"
          INNER

      - name: Wait for live Bitcoin Core RPC
        timeout-minutes: 3
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-live-psbt-core.log" bash <<'INNER'
          set -euo pipefail
          rpc_url="http://${BITCOIN_RPC_HOST}:${BITCOIN_RPC_PORT}/"
          for attempt in $(seq 1 60); do
            if curl -fsS --user "$BITCOIN_RPC_USER:$BITCOIN_RPC_PASS" \
              --data-binary '{"jsonrpc":"1.0","id":"readiness","method":"getnetworkinfo","params":[]}' \
              "$rpc_url" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Pinned Bitcoin Core did not become ready" >&2
          docker logs "$VERIFY_PSBT_CORE_CONTAINER" >&2 || true
          exit 1
          INNER

      - name: Regenerate and verify live Bitcoin Core PSBT proof
        timeout-minutes: 12
        working-directory: scripts/verify-psbt
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/live-psbt-proof.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
              set -euo pipefail
              npm run generate
              npm run generate:signed
              npm run verify
              git -C "$GITHUB_WORKSPACE" diff --exit-code -- \
                server/tests/fixtures/generated-psbt-vectors.ts \
                server/tests/fixtures/generated-signed-psbt-vectors.ts
            '

      - name: Replay live Bitcoin Core PSBT vectors
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/live-psbt-replay-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci --
          tests/unit/services/bitcoin/psbt.verified.test.ts
          tests/unit/services/bitcoin/psbt.signed-vectors.test.ts

      - name: Stop isolated Bitcoin Core
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [ -n "${VERIFY_PSBT_CORE_CONTAINER:-}" ]; then
            docker rm -f "$VERIFY_PSBT_CORE_CONTAINER"
          fi

      - name: Run PSBT property-based tests
        timeout-minutes: 5
        working-directory: server
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/psbt-property-tests.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run test:run:ci -- tests/unit/services/bitcoin/psbt.property.test.ts

      # A failure outside a wrapped command (setup, an action, a step killed by
      # its own timeout) leaves no run-with-log.sh sidecar, so the summary below
      # would report an empty directory. This leaves a publishable breadcrumb
      # instead -- the same shape quality.yml and test.yml already use.
      - name: Write vector failure breadcrumb
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "verify-vectors-failure.log"
          "Verify Bitcoin Vectors"

      - name: Write vector diagnostic summary
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Verify Bitcoin Vectors"

      - name: Upload vector diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-verify-vectors
          path: .tmp/ci-diagnostics/verify-vectors/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  verify-trezor-emulator:
    # Kumo's rootless Podman archive endpoint is known to wedge while its
    # runner remains eligible. Keep the proof on the alternate socket-capable
    # host until the fleet archive-health recovery unit is deployed.
    runs-on: [docker-socket, playwright-x300-canary]
    # Do not unpack/start the 3.3 GiB emulator image while this workflow's
    # Bitcoin Core vector lane is concurrently churning the rootless daemon.
    needs: [verify-vectors]
    container:
      image: nexus.tabineko.dev/nekoguntai-castle/sanctuary-ci-go@sha256:8b50f6c8ccb016b042c7125a637b068a49c856a76e543365044b36a593edd81e
    # The isolated lane begins as soon as the roughly five-minute vector proof
    # completes. Its cold-cache fallback remains below the runner deadline.
    timeout-minutes: 48
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/verify-trezor-emulator
      SANCTUARY_CI_RUN_ATTEMPT_OVERRIDE: ${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain
        with:
          install-npm: 'false'

      - name: Wait for Docker
        timeout-minutes: 4
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          ${{ github.workspace }}/scripts/ci/wait-for-docker.sh

      - name: Install Trezor proof dependencies
        timeout-minutes: 10
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-trezor-proof-dependencies.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
            set -euo pipefail
            ${{ github.workspace }}/scripts/ci/retry-command.sh "Trezor proof root npm ci" npm ci --strict-allow-scripts --ignore-scripts
            ${{ github.workspace }}/scripts/ci/retry-command.sh "Trezor proof shared workspace build" npm --workspace shared run build
          '

      - name: Run pinned Trezor emulator proof
        # Prefer the exact preloaded image. A cold digest-pinned TUE pull has
        # taken up to 35 minutes on the rootless runner fleet, so retain enough
        # bounded fallback time for proof execution after a verified cold pull.
        timeout-minutes: 40
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/trezor-emulator-proof.log"
          env SANCTUARY_RUNNER_LOCK_TIMEOUT_SECONDS="$TREZOR_EMULATOR_LOCK_TIMEOUT_SECONDS"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh trezor-emulator
          npm run test:trezor-emulator-proof

      - name: Upload current Trezor emulator proof
        if: success() && env.TREZOR_EMULATOR_PROOF_DIR != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: trezor-emulator-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TREZOR_EMULATOR_PROOF_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload current Trezor emulator diagnostics
        if: always() && env.TREZOR_EMULATOR_DIAGNOSTICS_DIR != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: trezor-emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TREZOR_EMULATOR_DIAGNOSTICS_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Write Trezor emulator failure breadcrumb
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "verify-trezor-emulator-failure.log"
          "Verify Trezor Emulator"

      - name: Write Trezor emulator diagnostic summary
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Verify Trezor Emulator"

      - name: Upload Trezor emulator diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-verify-trezor-emulator
          path: .tmp/ci-diagnostics/verify-trezor-emulator/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  verify-ledger-emulator:
    runs-on: docker-socket
    needs: [verify-vectors]
    container:
      image: nexus.tabineko.dev/nekoguntai-castle/sanctuary-ci-go@sha256:8b50f6c8ccb016b042c7125a637b068a49c856a76e543365044b36a593edd81e
    timeout-minutes: 20
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/verify-ledger-emulator
      SANCTUARY_CI_RUN_ATTEMPT_OVERRIDE: ${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain
        with:
          install-npm: 'false'

      - name: Wait for Docker
        timeout-minutes: 4
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          ${{ github.workspace }}/scripts/ci/wait-for-docker.sh

      - name: Install Ledger proof dependencies
        timeout-minutes: 10
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-ledger-proof-dependencies.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
            set -euo pipefail
            ${{ github.workspace }}/scripts/ci/retry-command.sh "Ledger proof root npm ci" npm ci --strict-allow-scripts --ignore-scripts
            ${{ github.workspace }}/scripts/ci/retry-command.sh "Ledger proof shared workspace build" npm --workspace shared run build
          '

      - name: Run pinned Ledger emulator proof
        timeout-minutes: 10
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/ledger-emulator-proof.log"
          env SANCTUARY_RUNNER_LOCK_TIMEOUT_SECONDS="$LEDGER_EMULATOR_LOCK_TIMEOUT_SECONDS"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh ledger-emulator
          npm run test:ledger-emulator-proof

      - name: Upload current Ledger emulator proof
        if: success() && env.LEDGER_EMULATOR_PROOF_DIR != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: ledger-emulator-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LEDGER_EMULATOR_PROOF_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload current Ledger emulator diagnostics
        if: always() && env.LEDGER_EMULATOR_DIAGNOSTICS_DIR != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: ledger-emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LEDGER_EMULATOR_DIAGNOSTICS_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Write Ledger emulator failure breadcrumb
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "verify-ledger-emulator-failure.log"
          "Verify Ledger Emulator"

      - name: Write Ledger emulator diagnostic summary
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Verify Ledger Emulator"

      - name: Upload Ledger emulator diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-verify-ledger-emulator
          path: .tmp/ci-diagnostics/verify-ledger-emulator/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  verify-jade-emulator:
    runs-on: docker-socket
    needs: [verify-vectors]
    container:
      image: nexus.tabineko.dev/nekoguntai-castle/sanctuary-ci-go@sha256:8b50f6c8ccb016b042c7125a637b068a49c856a76e543365044b36a593edd81e
    timeout-minutes: 70
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/verify-jade-emulator
      SANCTUARY_CI_RUN_ATTEMPT_OVERRIDE: ${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain
        with:
          install-npm: 'false'

      - name: Wait for Docker
        timeout-minutes: 4
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          ${{ github.workspace }}/scripts/ci/wait-for-docker.sh

      - name: Install Jade proof dependencies
        timeout-minutes: 10
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-jade-proof-dependencies.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
            set -euo pipefail
            ${{ github.workspace }}/scripts/ci/retry-command.sh "Jade proof root npm ci" npm ci --strict-allow-scripts --ignore-scripts
            ${{ github.workspace }}/scripts/ci/retry-command.sh "Jade proof shared workspace build" npm --workspace shared run build
          '

      - name: Run pinned Jade QEMU proof
        timeout-minutes: 55
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/jade-emulator-proof.log"
          env SANCTUARY_RUNNER_LOCK_TIMEOUT_SECONDS="$JADE_EMULATOR_LOCK_TIMEOUT_SECONDS"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh jade-emulator
          npm run test:jade-emulator-proof

      - name: Upload current Jade QEMU proof
        if: success() && env.JADE_EMULATOR_PROOF_DIR != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: jade-emulator-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.JADE_EMULATOR_PROOF_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload current Jade QEMU diagnostics
        if: always() && env.JADE_EMULATOR_DIAGNOSTICS_DIR != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: jade-emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.JADE_EMULATOR_DIAGNOSTICS_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Write Jade QEMU failure breadcrumb
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: >
          ${{ github.workspace }}/scripts/ci/write-empty-diagnostic-breadcrumb.sh
          "$DIAGNOSTIC_DIR"
          "verify-jade-emulator-failure.log"
          "Verify Jade QEMU"

      - name: Write Jade QEMU diagnostic summary
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Verify Jade QEMU"

      - name: Upload Jade QEMU diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-verify-jade-emulator
          path: .tmp/ci-diagnostics/verify-jade-emulator/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # Optional: Regenerate vectors with Bitcoin Core
  # This job runs only on manual trigger and requires Docker
  regenerate-vectors:
    if: github.event_name == 'workflow_dispatch'
    runs-on: docker-socket
    container:
      image: nexus.tabineko.dev/nekoguntai-castle/sanctuary-ci-go@sha256:8b50f6c8ccb016b042c7125a637b068a49c856a76e543365044b36a593edd81e
    timeout-minutes: 60
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/regenerate-vectors

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain
        with:
          install-npm: 'false'

      - name: Verify Go toolchain
        uses: ./.github/actions/setup-go-toolchain

      - name: Wait for Docker
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          ${{ github.workspace }}/scripts/ci/wait-for-docker.sh

      - name: Generate address vectors with pinned verifier stack
        working-directory: scripts/verify-addresses
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/generate-address-vectors.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run generate:repeatable

      - name: Check for vector changes
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/check-address-vector-changes.log" bash <<'INNER'
          set -euo pipefail
          if git diff --quiet scripts/verify-addresses/output/verified-vectors.ts server/tests/fixtures/verified-address-vectors.ts; then
            echo "Vectors unchanged - all implementations agree"
          else
            echo "Vectors changed - review needed"
            git diff scripts/verify-addresses/output/verified-vectors.ts server/tests/fixtures/verified-address-vectors.ts
            exit 1
          fi
          INNER

      - name: Write regenerate vector diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Regenerate Address Vectors"

      - name: Upload regenerate vector diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-regenerate-vectors
          path: .tmp/ci-diagnostics/regenerate-vectors/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # Optional: Regenerate PSBT vectors with Bitcoin Core
  regenerate-psbt-vectors:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_psbt == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.tmp/ci-diagnostics/regenerate-psbt-vectors
      VERIFY_PSBT_CORE_PROVENANCE_MODE: pinned-container

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Wait for Docker
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-docker.log"
          ${{ github.workspace }}/scripts/ci/wait-for-docker.sh

      - name: Start Bitcoin Core
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/start-bitcoin-core.log" bash <<'INNER'
          set -euo pipefail
          docker run --pull=always -d --name bitcoin-core \
            -p 18443:18443 \
            "${VERIFY_PSBT_CORE_IMAGE}" \
            -regtest=1 \
            -server=1 \
            -rpcuser=sanctuary \
            -rpcpassword=sanctuary-verify \
            -rpcallowip=0.0.0.0/0 \
            -rpcbind=0.0.0.0 \
            -fallbackfee=0.00001 \
            -txindex=1 \
            -printtoconsole=1
          INNER

      - name: Attest Bitcoin Core image
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/attest-bitcoin-core-image.log" bash <<'INNER'
          set -euo pipefail
          expected_image_id="$(docker image inspect "$VERIFY_PSBT_CORE_IMAGE" --format '{{.Id}}')"
          actual_image_id="$(docker inspect bitcoin-core --format '{{.Image}}')"
          if [ "$actual_image_id" != "$expected_image_id" ]; then
            echo "Bitcoin Core image drift: expected ID $expected_image_id, received $actual_image_id" >&2
            exit 1
          fi
          expected_digest="${VERIFY_PSBT_CORE_IMAGE##*@}"
          if ! docker image inspect "$VERIFY_PSBT_CORE_IMAGE" --format '{{join .RepoDigests "\n"}}' \
            | grep -Fq "@$expected_digest"; then
            echo "Pulled Bitcoin Core image does not attest expected digest $expected_digest" >&2
            exit 1
          fi
          INNER

      - name: Wait for Bitcoin Core
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/wait-for-bitcoin-core.log" bash <<'INNER'
          set -euo pipefail
          rpc_url="http://${SANCTUARY_DOCKER_PUBLISHED_HOST:-127.0.0.1}:18443/"
          echo "Waiting for Bitcoin Core to be ready..."
          for i in {1..30}; do
            if curl -s --user sanctuary:sanctuary-verify --data-binary '{"jsonrpc":"1.0","method":"getblockchaininfo","params":[]}' "$rpc_url" > /dev/null 2>&1; then
              echo "Bitcoin Core is ready"
              exit 0
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 2
          done
          docker logs bitcoin-core
          exit 1
          INNER

      - name: Install server dependencies
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-server-dependencies.log" \
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
            set -euo pipefail
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector root npm ci" npm ci --strict-allow-scripts --ignore-scripts
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector shared workspace build" npm --workspace shared run build
            cd server
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector prisma generate" npx prisma generate
          '

      - name: Install PSBT verification dependencies
        working-directory: scripts/verify-psbt
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/install-psbt-dependencies.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm ci --strict-allow-scripts

      - name: Generate PSBT vectors
        working-directory: scripts/verify-psbt
        run: |
          BITCOIN_RPC_HOST="${SANCTUARY_DOCKER_PUBLISHED_HOST:-127.0.0.1}" \
            BITCOIN_RPC_USER=sanctuary \
            BITCOIN_RPC_PASS=sanctuary-verify \
            ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/generate-psbt-vectors.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain npm run generate

      - name: Generate signed PSBT vectors
        working-directory: scripts/verify-psbt
        run: |
          BITCOIN_RPC_HOST="${SANCTUARY_DOCKER_PUBLISHED_HOST:-127.0.0.1}" \
            BITCOIN_RPC_USER=sanctuary \
            BITCOIN_RPC_PASS=sanctuary-verify \
            ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/generate-signed-psbt-vectors.log" \
            ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain npm run generate:signed

      - name: Verify generated PSBT vectors are non-empty
        working-directory: scripts/verify-psbt
        run: >
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/verify-generated-psbt-vectors.log"
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain
          npm run verify

      - name: Check for PSBT vector changes
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/check-psbt-vector-changes.log" bash <<'INNER'
          set -euo pipefail
          if git diff --quiet server/tests/fixtures/generated-psbt-vectors.ts 2>/dev/null; then
            echo "PSBT vectors unchanged"
          else
            echo "PSBT vectors updated"
            git diff server/tests/fixtures/generated-psbt-vectors.ts || true
          fi
          INNER

      - name: Check for signed PSBT vector changes
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/check-signed-psbt-vector-changes.log" bash <<'INNER'
          set -euo pipefail
          if git diff --quiet server/tests/fixtures/generated-signed-psbt-vectors.ts 2>/dev/null; then
            echo "Signed PSBT vectors unchanged"
          else
            echo "Signed PSBT vectors updated"
            git diff server/tests/fixtures/generated-signed-psbt-vectors.ts || true
          fi
          INNER

      - name: Run PSBT tests with new vectors
        run: |
          ${{ github.workspace }}/scripts/ci/run-with-log.sh "$DIAGNOSTIC_DIR/run-psbt-vector-tests.log" \
          ${{ github.workspace }}/scripts/ci/with-runner-lock.sh node-toolchain bash -c '
            set -euo pipefail
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector root npm ci" npm ci --strict-allow-scripts --ignore-scripts
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector shared workspace build" npm --workspace shared run build
            cd server
            ${{ github.workspace }}/scripts/ci/retry-command.sh "psbt vector prisma generate" npx prisma generate
            npm run test:run:ci -- tests/unit/services/bitcoin/psbt.verified.test.ts tests/unit/services/bitcoin/psbt.signed-vectors.test.ts
          '

      - name: Write regenerate PSBT vector diagnostic summary
        if: always()
        continue-on-error: true
        run: ${{ github.workspace }}/scripts/ci/write-diagnostic-summary.sh "$DIAGNOSTIC_DIR" "Regenerate PSBT Vectors"

      - name: Upload regenerate PSBT vector diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: ci-diagnostics-regenerate-psbt-vectors
          path: .tmp/ci-diagnostics/regenerate-psbt-vectors/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  # Summary job
  summary:
    needs: [verify-vectors, verify-trezor-emulator, verify-ledger-emulator, verify-jade-emulator]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.verify-vectors.result }}" == "success" ] && \
             [ "${{ needs.verify-trezor-emulator.result }}" == "success" ] && \
             [ "${{ needs.verify-ledger-emulator.result }}" == "success" ] && \
             [ "${{ needs.verify-jade-emulator.result }}" == "success" ]; then
            echo "✅ All address verification tests passed"
          else
            echo "❌ Address verification tests failed"
            exit 1
          fi
