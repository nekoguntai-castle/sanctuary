name: Release Candidate Validation

# This workflow runs the FULL install test suite including upgrade tests.
# Use this before cutting a release to thoroughly validate the installation process.
#
# Recommended workflow:
# 1. Run this workflow manually on the commit you plan to release
# 2. Wait for all tests to pass (including upgrade tests)
# 3. Create the release tag
# 4. The regular install-test workflow will run release-critical tests on the tag
#
# Total runtime: ~25-35 minutes

on:
  # Fire automatically on RC / pre-release tag pushes so RC validation
  # happens BEFORE the operator promotes to a final tag. Final stable tags
  # (e.g. v0.8.50) are validated by install-test.yml, not this workflow.
  # Forgejo Actions doesn't honor negative `!` globs, so use positive-only
  # patterns covering the prerelease shapes used in this repo
  # (-rc1, -rc.1, -alpha1, -beta.1, -dev*).
  push:
    tags:
      - 'v*-rc*'
      - 'v*-alpha*'
      - 'v*-beta*'
      - 'v*-dev*'
  workflow_call:
    inputs:
      ref:
        description: 'Trusted git ref to test (main, release/*, or v* tag)'
        required: false
        default: 'main'
        type: string
      version:
        description: 'Version being validated'
        required: false
        type: string
      upgrade_source_ref:
        description: 'Optional older git ref or tag to install before upgrading to the candidate ref'
        required: false
        type: string
      include_full_upgrade_recovery:
        description: 'Run one full-mode baseline upgrade recovery lane in addition to the core matrix'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: 'Trusted git ref to test (main, release/*, or v* tag)'
        required: false
        default: 'main'
        type: string
      version:
        description: 'Version being validated (for logging only)'
        required: false
        type: string
      upgrade_source_ref:
        description: 'Optional older git ref or tag to install before upgrading to the candidate ref'
        required: false
        type: string
      include_full_upgrade_recovery:
        description: 'Run one full-mode baseline upgrade recovery lane in addition to the core matrix'
        required: false
        default: false
        type: boolean

concurrency:
  # Keep each candidate out of install-test.yml's concurrency group. GitHub-style
  # concurrency retains only one pending run per group, so the two workflows
  # triggered by the same RC tag otherwise cancel one another before jobs start.
  # Docker-backed jobs use run-scoped projects/ports on the DIND runner so the
  # workflows can coexist without coupling their pending slots.
  group: sanctuary-release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HTTPS_PORT: 8443
  HTTP_PORT: 8080
  # Interrupted CI projects must stay stopped across DIND/runner restarts.
  SANCTUARY_RESTART_POLICY: 'no'
  # Share the runner-lock namespace with test.yml / install-test.yml so the
  # node-toolchain (cleanup) and e2e locks here actually serialize against
  # those workflows' lock-takers on the shared self-hosted runner.
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2

jobs:
  # ============================================
  # Validation Info
  # ============================================
  validation-info:
    name: Validation Info
    runs-on: ubuntu-22.04
    outputs:
      candidate_ref: ${{ steps.candidate.outputs.candidate_ref }}
    steps:
      - name: Resolve trusted candidate ref
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          CALL_REF: ${{ inputs.ref }}
        run: |
          case "$EVENT_NAME" in
            push)
              candidate_ref="${GITHUB_REF:?}"
              ;;
            workflow_dispatch|workflow_call)
              raw_ref="${INPUT_REF:-${CALL_REF:-main}}"
              case "$raw_ref" in
                main|refs/heads/main|release/*|refs/heads/release/*|v[0-9]*|refs/tags/v[0-9]*)
                  candidate_ref="$raw_ref"
                  ;;
                *)
                  echo "::error::Release candidate ref must be main, release/*, or a v* tag. Received: $raw_ref"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Unsupported release-candidate event: $EVENT_NAME"
              exit 1
              ;;
          esac

          echo "candidate_ref=$candidate_ref" >> "$GITHUB_OUTPUT"

      - name: Display validation context
        env:
          VALIDATION_REF: ${{ steps.candidate.outputs.candidate_ref }}
          VALIDATION_VERSION: ${{ github.event.inputs.version || inputs.version || 'N/A' }}
          FULL_UPGRADE_RECOVERY: ${{ github.event.inputs.include_full_upgrade_recovery || inputs.include_full_upgrade_recovery || false }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          {
            echo "## Release Candidate Validation"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Git Ref | \`${VALIDATION_REF}\` |"
            echo "| Version | ${VALIDATION_VERSION} |"
            echo "| Full Upgrade Recovery | ${FULL_UPGRADE_RECOVERY} |"
            echo "| Triggered By | ${TRIGGERED_BY} |"
            echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo ""
            echo "This workflow runs the **full** install test suite including upgrade tests."
            echo ""
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: validation-info

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_ref }}
          fetch-depth: 0

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh

      - name: Run unit tests
        run: |
          ./tests/install/unit/install-script.test.sh
          ./tests/install/unit/reset-user-2fa-script.test.sh
          ./tests/install/unit/upgrade-helpers.test.sh
          ./tests/install/unit/purge-image-scope.test.sh
          ./tests/install/unit/offline-bundle-script.test.sh
          ./tests/install/unit/upgrade-backup-script.test.sh
          ./tests/install/unit/upgrade-staleness.test.sh
          ./tests/install/unit/install-scope.test.sh
          ./tests/install/unit/cleanup-containers-guard.test.sh
          ./tests/install/unit/image-tag-isolation.test.sh

  # ============================================
  # Fresh Install E2E Test
  # ============================================
  fresh-install-test:
    name: Fresh Install E2E
    # Requires a Docker-in-Docker runner: the stack mounts the daemon socket
    # into docker-proxy, which rootless Podman runners cannot provide.
    runs-on: [ubuntu-22.04, docker-socket]
    needs: validation-info
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-rc-fresh-${{ github.run_id }}
      HTTPS_PORT: '15543'
      HTTP_PORT: '15180'
      GATEWAY_PORT: '15100'
      PORT_OFFSET: '0'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/fresh-install
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_ref }}
          clean: false

      # docker/setup-buildx-action intentionally removed: install E2E disables
      # Compose Bake and the dedicated Docker Build workflow owns Buildx
      # coverage. Removing the action shrinks the action-internal blind
      # spot that diagnostic artifacts cannot reach.

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible fresh-install)"
            for relative_path in docker-compose.yml docker-compose.ghcr.yml docker-compose.monitoring.yml docker-compose.tor.yml docker/compose/monitoring.yml docker/compose/tor.yml; do
              compose_file="$workspace/$relative_path"
              [ -f "$compose_file" ] || continue
              sed -i -E '\''s/^([[:space:]]*restart:).*/\1 "no"/'\'' "$compose_file"
            done
            echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          '

      - name: Run fresh install test
        run: |
          # Composition: run-with-log → with-runner-lock → time-command → command
          # Logger outermost so lock wait line, time-command output, and
          # wrapped-command output all land in $JOB_LOG_DIR/fresh-install.log.
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/fresh-install.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "fresh install e2e" \
            bash -c "cd \"$SANCTUARY_INSTALL_WORKSPACE\" && ./tests/install/e2e/fresh-install.test.sh --verbose"

      - name: Show container logs on failure
        if: failure()
        run: |
          cd "${SANCTUARY_INSTALL_WORKSPACE:-.}" || true
          echo "=== Container Status ==="
          docker compose ps || true
          echo ""
          echo "=== Database Logs ==="
          docker compose logs --tail 100 postgres 2>&1 || true
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs --tail 100 backend 2>&1 || true
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs --tail 100 frontend 2>&1 || true
          echo ""
          echo "=== Gateway Logs ==="
          docker compose logs --tail 100 gateway 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          project="${COMPOSE_PROJECT_NAME:-}"
          if [ -z "$project" ]; then
            echo "::error::COMPOSE_PROJECT_NAME is required for release-candidate cleanup"
            exit 1
          fi
          # Do NOT use `docker system prune`: it sweeps STOPPED containers on the
          # shared daemon and can delete a concurrent job's Postgres `services:`
          # container (e.g. test.yml's backend-integration lane), which Forgejo
          # recreates empty — that job's schema then vanishes mid-run
          # ("table public.users does not exist"). `builder prune` only touches
          # buildkit cache, never containers/networks/volumes. Exact project-label
          # cleanup below reclaims this RC stack without reparsing a deleted
          # runtime environment. Mirrors install-test.yml.
          SANCTUARY_RUNNER_LOCK_TIMEOUT_SECONDS=120 \
            "${{ github.workspace }}/scripts/ci/with-runner-lock.sh" node-toolchain \
            docker builder prune -f || true
          bash "${{ github.workspace }}/scripts/ci/cleanup-docker-resources.sh" --project "$project" --verify-empty

      - name: Post-cleanup diagnostics
        if: always()
        continue-on-error: true
        env:
          SANCTUARY_CI_PROJECT_PREFIXES: sanctuary-rc-fresh-${{ github.run_id }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/post-cleanup.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Write fresh install diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Release Candidate Fresh Install"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-fresh-install-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  # ============================================
  # Container Health Test (non-blocking)
  # ============================================
  container-health-test:
    name: Container Health
    runs-on: [ubuntu-22.04, docker-socket]
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [validation-info, fresh-install-test]
    continue-on-error: true  # Non-blocking - failures are warnings
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-rc-health-${{ github.run_id }}
      HTTPS_PORT: '15643'
      HTTP_PORT: '15280'
      GATEWAY_PORT: '15200'
      PORT_OFFSET: '1'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/container-health
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_ref }}
          clean: false

      # docker/setup-buildx-action removed (see fresh-install-test rationale).

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible container-health)"
            for relative_path in docker-compose.yml docker-compose.ghcr.yml docker-compose.monitoring.yml docker-compose.tor.yml docker/compose/monitoring.yml docker/compose/tor.yml; do
              compose_file="$workspace/$relative_path"
              [ -f "$compose_file" ] || continue
              sed -i -E '\''s/^([[:space:]]*restart:).*/\1 "no"/'\'' "$compose_file"
            done
            echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          '

      - name: Start containers
        run: |
          # Generate all required secrets
          JWT_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)

          ENCRYPTION_SALT=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          GATEWAY_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          WORKER_DIAGNOSTICS_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          LLM_EGRESS_PROXY_SECRET=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          cd "$SANCTUARY_INSTALL_WORKSPACE"
          # Generate SSL certs to a dind-visible path. Without
          # SANCTUARY_COMPOSE_SSL_DIR set to the docker-visible
          # translation, the frontend container's bind mount points
          # at a path the docker daemon (dind) can't see, so it
          # serves HTTP and the healthcheck on :443 fails.
          # shellcheck disable=SC1091
          source tests/install/utils/helpers.sh
          export SANCTUARY_SSL_DIR="$SANCTUARY_INSTALL_WORKSPACE/docker/nginx/ssl"
          SANCTUARY_COMPOSE_SSL_DIR="$(docker_visible_path "$SANCTUARY_SSL_DIR")"
          export SANCTUARY_COMPOSE_SSL_DIR
          mkdir -p "$SANCTUARY_SSL_DIR"
          ./docker/nginx/ssl/generate-certs.sh localhost
          export JWT_SECRET ENCRYPTION_KEY ENCRYPTION_SALT GATEWAY_SECRET WORKER_DIAGNOSTICS_SECRET POSTGRES_PASSWORD LLM_EGRESS_PROXY_SECRET REDIS_PASSWORD
          cd "${{ github.workspace }}"
          # One lock for the whole lifetime of the stack. Taking it per step left
          # a live stack unprotected between locked sections, which is where
          # v0.8.60-rc2 lost its backend and migrate containers (#719).
          scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/run-e2e-lane-phases.sh \
              "$SANCTUARY_INSTALL_WORKSPACE" "$JOB_LOG_DIR" container-health \
              ./tests/install/e2e/container-health.test.sh --verbose

      - name: Cleanup
        if: always()
        run: |
          project="${COMPOSE_PROJECT_NAME:-}"
          if [ -z "$project" ]; then
            echo "::error::COMPOSE_PROJECT_NAME is required for container-health cleanup"
            exit 1
          fi
          bash "${{ github.workspace }}/scripts/ci/cleanup-docker-resources.sh" --project "$project" --verify-empty

      - name: Post-cleanup diagnostics
        if: always()
        continue-on-error: true
        env:
          SANCTUARY_CI_PROJECT_PREFIXES: sanctuary-rc-health-${{ github.run_id }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/post-cleanup.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Write container health diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Release Candidate Container Health"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-container-health-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  # ============================================
  # Authentication Flow Test (non-blocking)
  # ============================================
  auth-flow-test:
    name: Auth Flow
    runs-on: [ubuntu-22.04, docker-socket]
    concurrency:
      group: sanctuary-runner-e2e
      cancel-in-progress: false
    needs: [validation-info, fresh-install-test, container-health-test]
    if: always() && needs.fresh-install-test.result == 'success'
    continue-on-error: true  # Non-blocking - failures are warnings
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-rc-auth-${{ github.run_id }}
      HTTPS_PORT: '15743'
      HTTP_PORT: '15380'
      GATEWAY_PORT: '15300'
      PORT_OFFSET: '2'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/auth-flow
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_ref }}
          clean: false

      # docker/setup-buildx-action removed (see fresh-install-test rationale).

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible auth-flow)"
            for relative_path in docker-compose.yml docker-compose.ghcr.yml docker-compose.monitoring.yml docker-compose.tor.yml docker/compose/monitoring.yml docker/compose/tor.yml; do
              compose_file="$workspace/$relative_path"
              [ -f "$compose_file" ] || continue
              sed -i -E '\''s/^([[:space:]]*restart:).*/\1 "no"/'\'' "$compose_file"
            done
            echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          '

      - name: Start containers
        run: |
          # Generate required secrets
          JWT_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)

          ENCRYPTION_SALT=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          GATEWAY_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          WORKER_DIAGNOSTICS_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          LLM_EGRESS_PROXY_SECRET=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          cd "$SANCTUARY_INSTALL_WORKSPACE"
          # Generate SSL certs to a dind-visible path. Without
          # SANCTUARY_COMPOSE_SSL_DIR set to the docker-visible
          # translation, the frontend container's bind mount points
          # at a path the docker daemon (dind) can't see, so it
          # serves HTTP and the healthcheck on :443 fails.
          # shellcheck disable=SC1091
          source tests/install/utils/helpers.sh
          export SANCTUARY_SSL_DIR="$SANCTUARY_INSTALL_WORKSPACE/docker/nginx/ssl"
          SANCTUARY_COMPOSE_SSL_DIR="$(docker_visible_path "$SANCTUARY_SSL_DIR")"
          export SANCTUARY_COMPOSE_SSL_DIR
          mkdir -p "$SANCTUARY_SSL_DIR"
          ./docker/nginx/ssl/generate-certs.sh localhost
          # Raise auth rate limits for stressy auth-flow test sequences
          export JWT_SECRET ENCRYPTION_KEY ENCRYPTION_SALT GATEWAY_SECRET WORKER_DIAGNOSTICS_SECRET POSTGRES_PASSWORD LLM_EGRESS_PROXY_SECRET REDIS_PASSWORD
          export RATE_LIMIT_LOGIN=100 RATE_LIMIT_PASSWORD_CHANGE=100
          cd "${{ github.workspace }}"
          # One lock for the whole lifetime of the stack. Taking it per step left
          # a live stack unprotected between locked sections, which is where
          # v0.8.60-rc2 lost its backend and migrate containers (#719).
          scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/run-e2e-lane-phases.sh \
              "$SANCTUARY_INSTALL_WORKSPACE" "$JOB_LOG_DIR" auth-flow \
              ./tests/install/e2e/auth-flow.test.sh --verbose

      - name: Cleanup
        if: always()
        run: |
          project="${COMPOSE_PROJECT_NAME:-}"
          if [ -z "$project" ]; then
            echo "::error::COMPOSE_PROJECT_NAME is required for auth-flow cleanup"
            exit 1
          fi
          bash "${{ github.workspace }}/scripts/ci/cleanup-docker-resources.sh" --project "$project" --verify-empty

      - name: Post-cleanup diagnostics
        if: always()
        continue-on-error: true
        env:
          SANCTUARY_CI_PROJECT_PREFIXES: sanctuary-rc-auth-${{ github.run_id }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/post-cleanup.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Write auth flow diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Release Candidate Auth Flow"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-auth-flow-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  # ============================================
  # Upgrade coverage note
  # ============================================
  # release-candidate.yml deliberately does NOT run an upgrade matrix.
  # install-test.yml's serialized chain (Upgrade Baseline + Upgrade
  # Extended + Upgrade Extended Fixtures) is the canonical upgrade
  # gate — it fires on the same tag push, runs all six fixtures
  # sequentially against the same self-hosted runner, and has a
  # decade of stability behind it. Duplicating that coverage here
  # produced a long history of false reds (see commits leading up to
  # v0.8.52) because Forgejo's act_runner does not honor matrix
  # max-parallel or job-level concurrency, so a parallel matrix in
  # this workflow saturated the dind docker daemon every run.

  # Release distribution is intentionally outside Forgejo Actions. After these
  # validation gates pass, the trusted operator command creates matching
  # Forgejo/GitHub Release objects as documented in
  # docs/reference/release-distribution.md.

  # ============================================
  # Validation Summary
  # ============================================
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-22.04
    needs: [validation-info, unit-tests, fresh-install-test, container-health-test, auth-flow-test]
    if: always()

    steps:
      - name: Generate validation report
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          ALL_PASSED=true

          echo "| Test Suite | Result | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|" >> $GITHUB_STEP_SUMMARY

          # Unit tests
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "| Unit Tests | :white_check_mark: Passed | ~5s |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Fresh install
          if [ "${{ needs.fresh-install-test.result }}" == "success" ]; then
            echo "| Fresh Install E2E | :white_check_mark: Passed | ~5-10m |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Fresh Install E2E | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Container health
          if [ "${{ needs.container-health-test.result }}" == "success" ]; then
            echo "| Container Health | :white_check_mark: Passed | ~2m |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Container Health | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Auth flow
          if [ "${{ needs.auth-flow-test.result }}" == "success" ]; then
            echo "| Auth Flow | :white_check_mark: Passed | ~2m |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Auth Flow | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Upgrade coverage lives in install-test.yml (Upgrade Baseline +
          # Upgrade Extended + Upgrade Extended Fixtures). It fires on the
          # same tag push and is the canonical upgrade gate — see comment
          # above where the duplicate matrix used to live.
          echo "| Upgrade Suite | :information_source: See install-test.yml | covers all 6 fixtures |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Core tests determine release approval here.
          CORE_PASSED=true
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.fresh-install-test.result }}" != "success" ]; then
            CORE_PASSED=false
          fi

          if [ "$CORE_PASSED" == "true" ]; then
            if [ "$ALL_PASSED" == "true" ]; then
              echo "## :rocket: Release Candidate APPROVED" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "All install tests passed. This commit is ready for release." >> $GITHUB_STEP_SUMMARY
            else
              echo "## :rocket: Release Candidate APPROVED (with warnings)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Core tests (Unit + Fresh Install + Upgrade Matrix) passed. Extended tests have non-blocking failures." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> **Note:** Extended test failures may indicate upgrade-specific or environment-specific risk." >> $GITHUB_STEP_SUMMARY
              echo "> Review failed tests before release even though they do not yet hard-block this workflow." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Create a release tag on this commit" >> $GITHUB_STEP_SUMMARY
            echo "2. Wait for stable-tag install-test.yml validation" >> $GITHUB_STEP_SUMMARY
            echo "3. Run npm run release:publish -- <tag> from a trusted operator checkout" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :stop_sign: Release Candidate REJECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Core install tests failed. **Do not release this commit.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review the failed tests and fix issues before attempting release." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check validation result
        run: |
          # Core tests that MUST pass for release. Upgrade gates live in
          # install-test.yml's Install Test Summary — see comment near the
          # removed upgrade-test job for rationale.
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.fresh-install-test.result }}" != "success" ]; then
            echo "::error::Release candidate validation FAILED - core tests did not pass."
            exit 1
          fi

          # Extended tests - warn but don't block release
          WARNINGS=0
          if [ "${{ needs.container-health-test.result }}" != "success" ]; then
            echo "::warning::Container Health test failed (non-blocking)"
            WARNINGS=$((WARNINGS + 1))
          fi
          if [ "${{ needs.auth-flow-test.result }}" != "success" ]; then
            echo "::warning::Auth Flow test failed (non-blocking)"
            WARNINGS=$((WARNINGS + 1))
          fi
          if [ $WARNINGS -gt 0 ]; then
            echo "Release candidate validation PASSED with $WARNINGS warning(s)"
          else
            echo "Release candidate validation PASSED!"
          fi
