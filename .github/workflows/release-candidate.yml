name: Release Candidate Validation

# This workflow runs the FULL install test suite including upgrade tests.
# Use this before cutting a release to thoroughly validate the installation process.
#
# Recommended workflow:
# 1. Run this workflow manually on the commit you plan to release
# 2. Wait for all tests to pass (including upgrade tests)
# 3. Create the release tag
# 4. The regular install-test workflow will run release-critical tests on the tag
#
# Total runtime: ~25-35 minutes

on:
  # Fire automatically on RC / pre-release tag pushes so RC validation
  # happens BEFORE the operator promotes to a final tag. Final stable tags
  # (e.g. v0.8.50) are matched by release.yml's pattern, not this one.
  # Forgejo Actions doesn't honor negative `!` globs, so use positive-only
  # patterns covering the prerelease shapes used in this repo
  # (-rc1, -rc.1, -alpha1, -beta.1, -dev*).
  push:
    tags:
      - 'v*-rc*'
      - 'v*-alpha*'
      - 'v*-beta*'
      - 'v*-dev*'
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test'
        required: false
        default: 'main'
        type: string
      version:
        description: 'Version being validated'
        required: false
        type: string
      upgrade_source_ref:
        description: 'Optional older git ref or tag to install before upgrading to the candidate ref'
        required: false
        type: string
      include_full_upgrade_recovery:
        description: 'Run one full-mode baseline upgrade recovery lane in addition to the core matrix'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (branch, tag, or SHA)'
        required: false
        default: 'main'
        type: string
      version:
        description: 'Version being validated (for logging only)'
        required: false
        type: string
      upgrade_source_ref:
        description: 'Optional older git ref or tag to install before upgrading to the candidate ref'
        required: false
        type: string
      include_full_upgrade_recovery:
        description: 'Run one full-mode baseline upgrade recovery lane in addition to the core matrix'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # On tag pushes, share a key with install-test.yml so the two workflows
  # queue against each other on the self-hosted runner instead of racing
  # for the dind daemon. Manual / workflow_dispatch runs keep the original
  # cancel-in-progress shape.
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/v') &&
        format('sanctuary-rc-{0}', github.ref_name) ||
        format('{0}-{1}', github.workflow, inputs.ref || github.event.inputs.ref || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  HTTPS_PORT: 8443
  HTTP_PORT: 8080

jobs:
  # ============================================
  # Validation Info
  # ============================================
  validation-info:
    name: Validation Info
    runs-on: ubuntu-latest
    steps:
      - name: Display validation context
        run: |
          echo "## Release Candidate Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Git Ref | \`${{ github.event.inputs.ref || inputs.ref || 'main' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ github.event.inputs.version || inputs.version || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full Upgrade Recovery | ${{ github.event.inputs.include_full_upgrade_recovery || inputs.include_full_upgrade_recovery || false }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow runs the **full** install test suite including upgrade tests." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.inputs.ref || inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh

      - name: Run unit tests
        run: |
          ./tests/install/unit/install-script.test.sh
          ./tests/install/unit/reset-user-2fa-script.test.sh
          ./tests/install/unit/upgrade-helpers.test.sh
          ./tests/install/unit/install-scope.test.sh
          ./tests/install/unit/cleanup-containers-guard.test.sh

  # ============================================
  # Fresh Install E2E Test
  # ============================================
  fresh-install-test:
    name: Fresh Install E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-rc-fresh-${{ github.run_id }}
      HTTPS_PORT: '15543'
      HTTP_PORT: '15180'
      GATEWAY_PORT: '15100'
      PORT_OFFSET: '0'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/fresh-install
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.inputs.ref || inputs.ref || 'main' }}
          clean: false

      # docker/setup-buildx-action intentionally removed: install E2E disables
      # Compose Bake and the dedicated Docker Build workflow owns Buildx
      # coverage. Removing the action shrinks the action-internal blind
      # spot that diagnostic artifacts cannot reach.

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible fresh-install)"
            echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          '

      - name: Run fresh install test
        run: |
          # Composition: run-with-log → with-runner-lock → time-command → command
          # Logger outermost so lock wait line, time-command output, and
          # wrapped-command output all land in $JOB_LOG_DIR/fresh-install.log.
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/fresh-install.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "fresh install e2e" \
            bash -c "cd \"$SANCTUARY_INSTALL_WORKSPACE\" && ./tests/install/e2e/fresh-install.test.sh --verbose"

      - name: Show container logs on failure
        if: failure()
        run: |
          cd "${SANCTUARY_INSTALL_WORKSPACE:-.}" || true
          echo "=== Container Status ==="
          docker compose ps || true
          echo ""
          echo "=== Database Logs ==="
          docker compose logs --tail 100 postgres 2>&1 || true
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs --tail 100 backend 2>&1 || true
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs --tail 100 frontend 2>&1 || true
          echo ""
          echo "=== Gateway Logs ==="
          docker compose logs --tail 100 gateway 2>&1 || true

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-fresh-install-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          cd "${SANCTUARY_INSTALL_WORKSPACE:-.}" || true
          docker compose down -v --remove-orphans || true
          docker system prune -f || true

  # ============================================
  # Container Health Test (non-blocking)
  # ============================================
  container-health-test:
    name: Container Health
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: fresh-install-test
    continue-on-error: true  # Non-blocking - failures are warnings
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: sanctuary-rc-health-${{ github.run_id }}
      HTTPS_PORT: '15643'
      HTTP_PORT: '15280'
      GATEWAY_PORT: '15200'
      PORT_OFFSET: '1'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/container-health
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.inputs.ref || inputs.ref || 'main' }}
          clean: false

      # docker/setup-buildx-action removed (see fresh-install-test rationale).

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible container-health)"
            echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          '

      - name: Start containers
        run: |
          # Generate all required secrets
          JWT_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          GATEWAY_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          POSTGRES_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          AI_CONFIG_SECRET=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          cd "$SANCTUARY_INSTALL_WORKSPACE"
          ( cd docker/nginx/ssl && ./generate-certs.sh localhost )
          export JWT_SECRET ENCRYPTION_KEY GATEWAY_SECRET POSTGRES_PASSWORD AI_CONFIG_SECRET REDIS_PASSWORD
          cd "${{ github.workspace }}"
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/start-containers.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "container-health start" \
            bash -c "cd \"$SANCTUARY_INSTALL_WORKSPACE\" && docker compose build && docker compose up -d"

      - name: Wait for migration to complete
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/wait-migration.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            echo "Waiting for migration container to finish..."
            for i in {1..60}; do
              STATUS=$(docker compose ps migrate --format "{{.Status}}" 2>/dev/null | grep -oE "^[A-Za-z]+" || echo "not_found")
              if [ "$STATUS" = "Exited" ]; then
                EXIT_STATUS=$(docker compose ps migrate --format "{{.Status}}" 2>/dev/null)
                if echo "$EXIT_STATUS" | grep -q "(0)"; then
                  echo "Migration completed successfully"
                  break
                else
                  echo "Migration failed: $EXIT_STATUS"
                  docker compose logs --tail 50 migrate
                  exit 1
                fi
              fi
              echo "Waiting for migration... (attempt $i/60, status: $STATUS)"
              sleep 5
            done
            echo "Waiting for backend to be healthy..."
            for i in {1..30}; do
              if docker compose exec backend wget -q -O - http://localhost:3001/health >/dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi
              echo "Waiting for backend... (attempt $i/30)"
              sleep 2
            done
          '

      - name: Run container health tests
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/container-health.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "container-health e2e" \
            bash -c "cd \"$SANCTUARY_INSTALL_WORKSPACE\" && ./tests/install/e2e/container-health.test.sh --verbose"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-container-health-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          cd "${SANCTUARY_INSTALL_WORKSPACE:-.}" || true
          docker compose down -v --remove-orphans || true

  # ============================================
  # Authentication Flow Test (non-blocking)
  # ============================================
  auth-flow-test:
    name: Auth Flow
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [fresh-install-test, container-health-test]
    if: always() && needs.fresh-install-test.result == 'success'
    continue-on-error: true  # Non-blocking - failures are warnings
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: sanctuary-rc-auth-${{ github.run_id }}
      HTTPS_PORT: '15743'
      HTTP_PORT: '15380'
      GATEWAY_PORT: '15300'
      PORT_OFFSET: '2'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/auth-flow
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.inputs.ref || inputs.ref || 'main' }}
          clean: false

      # docker/setup-buildx-action removed (see fresh-install-test rationale).

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible auth-flow)"
            echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          '

      - name: Start containers
        run: |
          # Generate required secrets
          JWT_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          GATEWAY_SECRET=$(openssl rand -base64 32 | tr -d '=/+' | head -c 48)
          POSTGRES_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          AI_CONFIG_SECRET=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -base64 16 | tr -d '=/+' | head -c 24)
          cd "$SANCTUARY_INSTALL_WORKSPACE"
          ( cd docker/nginx/ssl && ./generate-certs.sh localhost )
          # Raise auth rate limits for stressy auth-flow test sequences
          export JWT_SECRET ENCRYPTION_KEY GATEWAY_SECRET POSTGRES_PASSWORD AI_CONFIG_SECRET REDIS_PASSWORD
          export RATE_LIMIT_LOGIN=100 RATE_LIMIT_PASSWORD_CHANGE=100
          cd "${{ github.workspace }}"
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/start-containers.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "auth-flow start" \
            bash -c "cd \"$SANCTUARY_INSTALL_WORKSPACE\" && docker compose build && docker compose up -d"

      - name: Wait for migration to complete
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/wait-migration.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            echo "Waiting for migration container to finish..."
            for i in {1..60}; do
              STATUS=$(docker compose ps migrate --format "{{.Status}}" 2>/dev/null | grep -oE "^[A-Za-z]+" || echo "not_found")
              if [ "$STATUS" = "Exited" ]; then
                EXIT_STATUS=$(docker compose ps migrate --format "{{.Status}}" 2>/dev/null)
                if echo "$EXIT_STATUS" | grep -q "(0)"; then
                  echo "Migration completed successfully"
                  break
                else
                  echo "Migration failed: $EXIT_STATUS"
                  docker compose logs --tail 50 migrate
                  exit 1
                fi
              fi
              echo "Waiting for migration... (attempt $i/60, status: $STATUS)"
              sleep 5
            done
            echo "Waiting for backend to be healthy..."
            for i in {1..30}; do
              if docker compose exec backend wget -q -O - http://localhost:3001/health >/dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi
              echo "Waiting for backend... (attempt $i/30)"
              sleep 2
            done
          '

      - name: Run auth flow tests
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/auth-flow.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "auth-flow e2e" \
            bash -c "cd \"$SANCTUARY_INSTALL_WORKSPACE\" && ./tests/install/e2e/auth-flow.test.sh --verbose"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-auth-flow-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          cd "${SANCTUARY_INSTALL_WORKSPACE:-.}" || true
          docker compose down -v --remove-orphans || true

  # ============================================
  # Upgrade Suite (release blocking)
  # ============================================
  # Single sequential job that runs every fixture in turn. The previous
  # 6-lane matrix shape fan-outed onto the self-hosted Forgejo runner
  # (runner.capacity=4) and concurrently saturated the dind docker daemon.
  # Forgejo v12.10.1 honors neither strategy.max-parallel nor job-level
  # concurrency, so the only reliable serialization is to keep everything
  # in one job.
  upgrade-test:
    name: Upgrade Suite
    runs-on: ubuntu-latest
    needs: [fresh-install-test, container-health-test, auth-flow-test]
    if: always() && needs.fresh-install-test.result == 'success'
    timeout-minutes: 360
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/upgrade-rc
      SANCTUARY_CI_DEBUG_TRACE: '1'
      SANCTUARY_UPGRADE_SOURCE_REF_OVERRIDE: ${{ github.event.inputs.upgrade_source_ref || inputs.upgrade_source_ref || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.inputs.ref || inputs.ref || 'main' }}
          fetch-depth: 0
          clean: false

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Run upgrade fixtures sequentially
        run: scripts/ci/run-rc-upgrade-fixtures.sh

      - name: Upload upgrade artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: upgrade-rc-suite-${{ github.run_id }}
          path: .tmp/upgrade-artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-upgrade-rc-suite-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  upgrade-full-recovery-test:
    name: Upgrade Full Recovery
    runs-on: ubuntu-latest
    concurrency:
      group: sanctuary-runner-e2e-${{ github.ref }}
      cancel-in-progress: false
    needs: [fresh-install-test, upgrade-test]
    if: |
      always() && needs.fresh-install-test.result == 'success' &&
      (github.event.inputs.include_full_upgrade_recovery == 'true' ||
       inputs.include_full_upgrade_recovery == true)
    timeout-minutes: 90
    env:
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/upgrade-full-recovery
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.inputs.ref || inputs.ref || 'main' }}
          fetch-depth: 0

      # docker/setup-buildx-action removed (see fresh-install-test rationale).

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Run full recovery upgrade test
        env:
          HTTPS_PORT: ${{ env.HTTPS_PORT }}
          HTTP_PORT: ${{ env.HTTP_PORT }}
          SANCTUARY_UPGRADE_SOURCE_REF: ${{ github.event.inputs.upgrade_source_ref || inputs.upgrade_source_ref || 'latest-stable' }}
          SANCTUARY_UPGRADE_FIXTURE: baseline
          SANCTUARY_UPGRADE_ARTIFACT_DIR: .tmp/upgrade-artifacts/full-recovery
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/upgrade-full-recovery.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "upgrade full recovery" \
            ./tests/install/e2e/upgrade-install.test.sh --mode full --fixture baseline --verbose

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail 50 postgres 2>&1 || true
          docker compose logs --tail 100 backend 2>&1 || true

      - name: Upload upgrade artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: upgrade-full-recovery-${{ github.run_id }}
          path: .tmp/upgrade-artifacts/full-recovery
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-upgrade-full-recovery-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true

  # ============================================
  # Validation Summary
  # ============================================
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, fresh-install-test, container-health-test, auth-flow-test, upgrade-test, upgrade-full-recovery-test]
    if: always()

    steps:
      - name: Generate validation report
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          ALL_PASSED=true

          echo "| Test Suite | Result | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|" >> $GITHUB_STEP_SUMMARY

          # Unit tests
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "| Unit Tests | :white_check_mark: Passed | ~5s |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Fresh install
          if [ "${{ needs.fresh-install-test.result }}" == "success" ]; then
            echo "| Fresh Install E2E | :white_check_mark: Passed | ~5-10m |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Fresh Install E2E | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Container health
          if [ "${{ needs.container-health-test.result }}" == "success" ]; then
            echo "| Container Health | :white_check_mark: Passed | ~2m |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Container Health | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Auth flow
          if [ "${{ needs.auth-flow-test.result }}" == "success" ]; then
            echo "| Auth Flow | :white_check_mark: Passed | ~2m |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Auth Flow | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Upgrade matrix
          if [ "${{ needs.upgrade-test.result }}" == "success" ]; then
            echo "| Upgrade Matrix | :white_check_mark: Passed | ~10-20m per lane |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Upgrade Matrix | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          # Full recovery upgrade lane
          if [ "${{ needs.upgrade-full-recovery-test.result }}" == "success" ]; then
            echo "| Upgrade Full Recovery | :white_check_mark: Passed | ~20-35m |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.upgrade-full-recovery-test.result }}" == "skipped" ]; then
            echo "| Upgrade Full Recovery | :arrow_right: Skipped | enable include_full_upgrade_recovery to run |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Upgrade Full Recovery | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
            ALL_PASSED=false
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Core tests determine release approval. Upgrade matrix is now a
          # release-blocking core lane because upgrade regressions can lock
          # operators out of existing nodes.
          CORE_PASSED=true
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.fresh-install-test.result }}" != "success" ] || \
             [ "${{ needs.upgrade-test.result }}" != "success" ] || \
             { [ "${{ needs.upgrade-full-recovery-test.result }}" != "success" ] && \
               [ "${{ needs.upgrade-full-recovery-test.result }}" != "skipped" ]; }; then
            CORE_PASSED=false
          fi

          if [ "$CORE_PASSED" == "true" ]; then
            if [ "$ALL_PASSED" == "true" ]; then
              echo "## :rocket: Release Candidate APPROVED" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "All install tests passed. This commit is ready for release." >> $GITHUB_STEP_SUMMARY
            else
              echo "## :rocket: Release Candidate APPROVED (with warnings)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Core tests (Unit + Fresh Install + Upgrade Matrix) passed. Extended tests have non-blocking failures." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> **Note:** Extended test failures may indicate upgrade-specific or environment-specific risk." >> $GITHUB_STEP_SUMMARY
              echo "> Review failed tests before release even though they do not yet hard-block this workflow." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Create a release tag on this commit" >> $GITHUB_STEP_SUMMARY
            echo "2. The release workflow will run additional validation" >> $GITHUB_STEP_SUMMARY
            echo "3. Docker images will be built and pushed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :stop_sign: Release Candidate REJECTED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Core install tests failed. **Do not release this commit.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review the failed tests and fix issues before attempting release." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check validation result
        run: |
          # Core tests that MUST pass for release
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.fresh-install-test.result }}" != "success" ] || \
             [ "${{ needs.upgrade-test.result }}" != "success" ] || \
             { [ "${{ needs.upgrade-full-recovery-test.result }}" != "success" ] && \
               [ "${{ needs.upgrade-full-recovery-test.result }}" != "skipped" ]; }; then
            echo "::error::Release candidate validation FAILED - core tests did not pass."
            exit 1
          fi

          # Extended tests - warn but don't block release
          WARNINGS=0
          if [ "${{ needs.container-health-test.result }}" != "success" ]; then
            echo "::warning::Container Health test failed (non-blocking)"
            WARNINGS=$((WARNINGS + 1))
          fi
          if [ "${{ needs.auth-flow-test.result }}" != "success" ]; then
            echo "::warning::Auth Flow test failed (non-blocking)"
            WARNINGS=$((WARNINGS + 1))
          fi
          if [ $WARNINGS -gt 0 ]; then
            echo "Release candidate validation PASSED with $WARNINGS warning(s)"
          else
            echo "Release candidate validation PASSED!"
          fi
