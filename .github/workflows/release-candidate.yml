name: Release Candidate Validation

# This workflow runs a SHA-bound preflight before canonical release validation.
# The same-commit install, health, auth, and upgrade gate lives in install-test.yml.
#
# Recommended workflow:
# 1. Run this workflow manually on the commit you plan to release
# 2. Wait for this preflight to pass
# 3. Create the release tag
# 4. Wait for install-test.yml to pass on the exact release commit
#
# Runtime is dominated by the retained fresh-install preflight; the canonical
# health, auth, and upgrade evidence runs once in install-test.yml.

on:
  # Fire automatically on RC / pre-release tag pushes so RC validation
  # happens BEFORE the operator promotes to a final tag. Final stable tags reuse
  # the accepted RC's exact same-commit Install Tests evidence through the
  # fail-closed promotion and publication commands.
  # Forgejo Actions doesn't honor negative `!` globs, so use positive-only
  # patterns covering the prerelease shapes used in this repo
  # (-rc1, -rc.1, -alpha1, -beta.1, -dev*).
  push:
    tags:
      - 'v*-rc*'
      - 'v*-alpha*'
      - 'v*-beta*'
      - 'v*-dev*'
  workflow_call:
    inputs:
      ref:
        description: 'Trusted git ref to test (main, release/*, or v* tag)'
        required: false
        default: 'main'
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Trusted git ref to test (main, release/*, or v* tag)'
        required: false
        default: 'main'
        type: string

concurrency:
  # Keep each candidate out of install-test.yml's concurrency group. GitHub-style
  # concurrency retains only one pending run per group, so the two workflows
  # triggered by the same RC tag otherwise cancel one another before jobs start.
  # Docker-backed jobs use run-scoped projects/ports on the DIND runner so the
  # workflows can coexist without coupling their pending slots.
  group: sanctuary-release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.19.0'
  NPM_VERSION: '11.19.0'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  HTTPS_PORT: 8443
  HTTP_PORT: 8080
  # Interrupted CI projects must stay stopped across DIND/runner restarts.
  SANCTUARY_RESTART_POLICY: 'no'
  # Share the runner-lock namespace with test.yml / install-test.yml so the
  # node-toolchain (cleanup) and e2e locks here actually serialize against
  # those workflows' lock-takers on the shared self-hosted runner.
  SANCTUARY_RUNNER_LOCK_DIR: ${{ github.workspace }}/.tmp/runner-locks-v2

jobs:
  # ============================================
  # Validation Info
  # ============================================
  validation-info:
    name: Validation Info
    runs-on: ubuntu-22.04
    outputs:
      candidate_sha: ${{ steps.candidate-commit.outputs.candidate_sha }}
    steps:
      - name: Resolve trusted candidate ref
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          CALL_REF: ${{ inputs.ref }}
        run: |
          case "$EVENT_NAME" in
            push)
              candidate_ref="${GITHUB_REF:?}"
              ;;
            workflow_dispatch|workflow_call)
              raw_ref="${INPUT_REF:-${CALL_REF:-main}}"
              case "$raw_ref" in
                main|refs/heads/main|release/*|refs/heads/release/*|v[0-9]*|refs/tags/v[0-9]*)
                  candidate_ref="$raw_ref"
                  ;;
                *)
                  echo "::error::Release candidate ref must be main, release/*, or a v* tag. Received: $raw_ref"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Unsupported release-candidate event: $EVENT_NAME"
              exit 1
              ;;
          esac

          echo "candidate_ref=$candidate_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout resolved candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.candidate.outputs.candidate_ref }}
          fetch-depth: 0

      - name: Lock immutable candidate commit
        id: candidate-commit
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved candidate commit is not a full SHA: $candidate_sha"
            exit 1
          fi
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Display validation context
        env:
          VALIDATION_REF: ${{ steps.candidate.outputs.candidate_ref }}
          VALIDATION_SHA: ${{ steps.candidate-commit.outputs.candidate_sha }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          {
            echo "## Release Candidate Validation"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Git Ref | \`${VALIDATION_REF}\` |"
            echo "| Commit | \`${VALIDATION_SHA}\` |"
            echo "| Triggered By | ${TRIGGERED_BY} |"
            echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo ""
            echo "This workflow is a preflight. Release approval remains pending the canonical same-commit Install Tests gate."
            echo ""
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"

  hardware-compatibility-evidence:
    name: Hardware Compatibility Evidence
    runs-on: ubuntu-22.04
    needs: validation-info
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain
      - name: Install locked report dependencies
        run: |
          npm ci --ignore-scripts
          npm --workspace shared run build
          npm --workspace server run prisma:generate
      - name: Generate revision-bound compatibility evidence
        env:
          # This repository variable is protected outside the candidate tree.
          # It is required as soon as any physical fixture is committed.
          HARDWARE_EVIDENCE_TRUST_SHA256: ${{ vars.HARDWARE_EVIDENCE_TRUST_SHA256 }}
        run: |
          mkdir -p release-evidence
          revision="$(git rev-parse HEAD)"
          as_of="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx --no-install tsx scripts/ci/hardware-compatibility-report.ts \
            --as-of "$as_of" \
            --revision "$revision" \
            --json release-evidence/hardware-wallet-compatibility.json \
            --markdown release-evidence/hardware-wallet-compatibility.md
          node -e '
            const report = require("./release-evidence/hardware-wallet-compatibility.json");
            if (report.revision !== process.env.GITHUB_SHA && report.revision !== require("node:child_process").execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim()) process.exit(1);
            if (!["safe-fail-closed", "enabled-rows-verified"].includes(report.releaseDecision.status)) process.exit(1);
            if (report.releaseDecision.skippedRequiredCaseCount !== 0 || report.releaseDecision.validationIssues.length !== 0) process.exit(1);
            if (report.proofTiers.tier3.validatedPhysicalFixtureCount !== report.proofTiers.tier3.physicalFixtureCount) process.exit(1);
          '
      - name: Upload hardware compatibility evidence
        uses: ./.github/actions/upload-artifact
        with:
          name: hardware-compatibility-evidence-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: validation-info

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh

      - name: Run unit tests
        run: scripts/ci/run-install-unit-tests.sh

  # ============================================
  # Wallet-sync persistence replay images
  # ============================================
  wallet-sync-replay-images:
    name: Build Wallet Sync Replay Images
    runs-on: [ubuntu-22.04, docker-socket]
    needs: validation-info
    timeout-minutes: 90
    env:
      RC10_REVISION: 5c1d1909f177b7bbd7c8f470da375b2de6bd0de3
      RC10_IMAGE: sanctuary-wallet-sync-replay:rc10-5c1d1909f177
      RC11_IMAGE: sanctuary-wallet-sync-replay:rc11-${{ needs.validation-info.outputs.candidate_sha }}
      IMAGE_DIR: ${{ github.workspace }}/.tmp/wallet-sync-replay/images
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/wallet-sync-replay-images
      SANCTUARY_PROJECT: wallet-sync-replay
      SANCTUARY_DEPLOYMENT_ID: replay-${{ github.run_id }}-${{ github.run_attempt }}
      SANCTUARY_OWNER_ID: release-candidate
      SANCTUARY_OPERATION_RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}-images
      SANCTUARY_RELEASE: unreleased
      SANCTUARY_COMMIT: ${{ needs.validation-info.outputs.candidate_sha }}
      SANCTUARY_OWNERSHIP_ROOT: ${{ github.workspace }}/../sanctuary-ownership/${{ github.run_id }}-${{ github.run_attempt }}-images

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify Node.js toolchain
        uses: ./.github/actions/setup-node-toolchain

      - name: Check replay host capacity
        run: |
          mkdir -p "$JOB_LOG_DIR"
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/host-capacity.log" \
            scripts/ci/check-wallet-sync-replay-host.sh

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build each immutable replay image once
        env:
          RC11_REVISION: ${{ needs.validation-info.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$JOB_LOG_DIR" "$IMAGE_DIR" .tmp/wallet-sync-replay/rc10-source
          git archive "$RC10_REVISION" | tar -x -C .tmp/wallet-sync-replay/rc10-source
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/build-images.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "wallet sync replay image build" \
            scripts/ci/cleanup-ci-callsite.sh run \
              --lane replay-images \
              --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/replay-images" \
              --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/replay-images" \
              -- \
            bash -c '
              set -euo pipefail
              scripts/ci/wallet-sync-replay-image.sh build \
                .tmp/wallet-sync-replay/rc10-source "$RC10_REVISION" "$RC10_IMAGE" "$IMAGE_DIR/rc10"
              scripts/ci/wallet-sync-replay-image.sh build \
                . "$RC11_REVISION" "$RC11_IMAGE" "$IMAGE_DIR/rc11"
            '

      - name: Upload digest-addressed replay images
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: wallet-sync-replay-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/wallet-sync-replay/images/
          if-no-files-found: error
          retention-days: 7

      - name: Verify replay image cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-images

      - name: Upload replay image cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-wallet-sync-replay-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-images/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-images
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Upload replay image diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-wallet-sync-replay-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.JOB_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 14

  # This exact-production-shape job owns both the immutable RC10 negative
  # control and the RC11 100/69/no-op proof. The external controller creates a
  # fresh PostgreSQL database for each subject and stages its sealed driver
  # through the daemon API.
  wallet-sync-live-shape:
    name: Wallet Sync Live Shape Replay
    runs-on: [ubuntu-22.04, docker-socket]
    needs: [validation-info, wallet-sync-replay-images]
    timeout-minutes: 120
    env:
      RC10_REVISION: 5c1d1909f177b7bbd7c8f470da375b2de6bd0de3
      RC10_IMAGE: sanctuary-wallet-sync-replay:rc10-5c1d1909f177
      RC11_IMAGE: sanctuary-wallet-sync-replay:rc11-${{ needs.validation-info.outputs.candidate_sha }}
      IMAGE_DIR: ${{ github.workspace }}/.tmp/wallet-sync-replay/images
      EVIDENCE_DIR: ${{ github.workspace }}/.tmp/wallet-sync-replay/evidence-live
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/wallet-sync-live-shape
      SANCTUARY_PROJECT: wallet-sync-replay
      SANCTUARY_DEPLOYMENT_ID: replay-${{ github.run_id }}-${{ github.run_attempt }}
      SANCTUARY_OWNER_ID: release-candidate
      SANCTUARY_OPERATION_RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}-live
      SANCTUARY_RELEASE: unreleased
      SANCTUARY_COMMIT: ${{ needs.validation-info.outputs.candidate_sha }}
      SANCTUARY_OWNERSHIP_ROOT: ${{ github.workspace }}/../sanctuary-ownership/${{ github.run_id }}-${{ github.run_attempt }}-live

    steps:
      - name: Checkout exact candidate controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Check replay host capacity
        run: |
          mkdir -p "$JOB_LOG_DIR"
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/host-capacity.log" \
            scripts/ci/check-wallet-sync-replay-host.sh

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Download build-once replay images
        uses: ./.github/actions/download-artifact
        with:
          name: wallet-sync-replay-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/wallet-sync-replay/images

      - name: Run live-shape replay and RC10 negative control
        env:
          RC11_REVISION: ${{ needs.validation-info.outputs.candidate_sha }}
        run: |
          mkdir -p "$(dirname "$EVIDENCE_DIR")"
          scripts/ci/run-with-log.sh "${EVIDENCE_DIR}.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "wallet sync live-shape replay" \
            scripts/ci/cleanup-ci-callsite.sh run \
              --lane replay-live \
              --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/replay-live" \
              --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/replay-live" \
              -- bash -c '
                set -euo pipefail
                scripts/ci/wallet-sync-replay-image.sh load \
                  "$IMAGE_DIR/rc10/image-receipt.json" "$RC10_IMAGE" "$RC10_REVISION"
                scripts/ci/wallet-sync-replay-image.sh load \
                  "$IMAGE_DIR/rc11/image-receipt.json" "$RC11_IMAGE" "$RC11_REVISION"
                timeout --foreground --signal=TERM --kill-after=60s 6000s \
                  node scripts/perf/wallet-sync-high-fanout-replay.mjs \
                    --mode live \
                    --rc10-image "$RC10_IMAGE" \
                    --rc10-revision "$RC10_REVISION" \
                    --rc11-image "$RC11_IMAGE" \
                    --rc11-revision "$RC11_REVISION" \
                    --fixture-manifest scripts/perf/wallet-sync-persistence-manifest.json \
                    --evidence-dir "$EVIDENCE_DIR"
              '

      - name: Verify live-shape cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-live

      - name: Upload live-shape replay evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: wallet-sync-live-shape-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/wallet-sync-replay/evidence-live/
            .tmp/wallet-sync-replay/evidence-live.log
            .tmp/job-logs/wallet-sync-live-shape/
            ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-live/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-live
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # Depend on the live-shape gate to serialize these high-load jobs on the
  # shared runner. The controller stops at the first failed boundary case.
  wallet-sync-maximum-shapes:
    name: Wallet Sync Maximum Shape Replay
    runs-on: [ubuntu-22.04, docker-socket]
    needs: [validation-info, wallet-sync-replay-images, wallet-sync-live-shape]
    timeout-minutes: 100
    env:
      RC11_IMAGE: sanctuary-wallet-sync-replay:rc11-${{ needs.validation-info.outputs.candidate_sha }}
      IMAGE_DIR: ${{ github.workspace }}/.tmp/wallet-sync-replay/images
      EVIDENCE_DIR: ${{ github.workspace }}/.tmp/wallet-sync-replay/evidence-max
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/wallet-sync-maximum-shapes
      SANCTUARY_PROJECT: wallet-sync-replay
      SANCTUARY_DEPLOYMENT_ID: replay-${{ github.run_id }}-${{ github.run_attempt }}
      SANCTUARY_OWNER_ID: release-candidate
      SANCTUARY_OPERATION_RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}-max
      SANCTUARY_RELEASE: unreleased
      SANCTUARY_COMMIT: ${{ needs.validation-info.outputs.candidate_sha }}
      SANCTUARY_OWNERSHIP_ROOT: ${{ github.workspace }}/../sanctuary-ownership/${{ github.run_id }}-${{ github.run_attempt }}-max

    steps:
      - name: Checkout exact candidate controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Check replay host capacity
        run: |
          mkdir -p "$JOB_LOG_DIR"
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/host-capacity.log" \
            scripts/ci/check-wallet-sync-replay-host.sh

      - name: Check Docker
        run: scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" scripts/ci/wait-for-docker.sh

      - name: Download build-once replay images
        uses: ./.github/actions/download-artifact
        with:
          name: wallet-sync-replay-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/wallet-sync-replay/images

      - name: Run maximum-shape boundary cases
        env:
          RC11_REVISION: ${{ needs.validation-info.outputs.candidate_sha }}
        run: |
          mkdir -p "$(dirname "$EVIDENCE_DIR")"
          scripts/ci/run-with-log.sh "${EVIDENCE_DIR}.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "wallet sync maximum-shape replay" \
            scripts/ci/cleanup-ci-callsite.sh run \
              --lane replay-max \
              --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/replay-max" \
              --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/replay-max" \
              -- bash -c '
                set -euo pipefail
                scripts/ci/wallet-sync-replay-image.sh load \
                  "$IMAGE_DIR/rc11/image-receipt.json" "$RC11_IMAGE" "$RC11_REVISION"
                timeout --foreground --signal=TERM --kill-after=60s 5100s \
                  node scripts/perf/wallet-sync-high-fanout-replay.mjs \
                    --mode max \
                    --rc11-image "$RC11_IMAGE" \
                    --rc11-revision "$RC11_REVISION" \
                    --fixture-manifest scripts/perf/wallet-sync-persistence-manifest.json \
                    --evidence-dir "$EVIDENCE_DIR"
              '

      - name: Verify maximum-shape cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-max

      - name: Upload maximum-shape replay evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: wallet-sync-maximum-shape-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/wallet-sync-replay/evidence-max/
            .tmp/wallet-sync-replay/evidence-max.log
            .tmp/job-logs/wallet-sync-maximum-shapes/
            ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-max/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/replay-max
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  # ============================================
  # Fresh Install E2E Test
  # ============================================
  fresh-install-test:
    name: Fresh Install E2E
    # Requires a Docker-in-Docker runner: the stack mounts the daemon socket
    # into docker-proxy, which rootless Podman runners cannot provide.
    runs-on: [ubuntu-22.04, docker-socket]
    needs: validation-info
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sanctuary-rc-fresh-${{ github.run_id }}
      HTTPS_PORT: '15543'
      HTTP_PORT: '15180'
      GATEWAY_PORT: '15100'
      PORT_OFFSET: '0'
      JOB_LOG_DIR: ${{ github.workspace }}/.tmp/job-logs/fresh-install
      IMAGE_CVE_REPORT_DIR: ${{ github.workspace }}/.tmp/ci-evidence/runtime-image-cves
      SANCTUARY_CI_DEBUG_TRACE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validation-info.outputs.candidate_sha }}
          clean: false

      # docker/setup-buildx-action intentionally removed: install E2E disables
      # Compose Bake and the dedicated Docker Build workflow owns Buildx
      # coverage. Removing the action shrinks the action-internal blind
      # spot that diagnostic artifacts cannot reach.

      - name: Pre-flight diagnostics
        if: always()
        run: |
          chmod +x scripts/ci/run-with-log.sh scripts/ci/write-preflight-diagnostics.sh
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/preflight.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Make test scripts executable
        run: chmod +x tests/install/unit/*.sh tests/install/e2e/*.sh tests/install/utils/*.sh scripts/ci/*.sh

      - name: Check Docker
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/check-docker.log" \
            scripts/ci/wait-for-docker.sh

      - name: Prepare isolated install workspace
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/isolated-workspace.log" bash -c '
            workspace="$(scripts/ci/create-isolated-workspace.sh --docker-visible fresh-install)"
            for relative_path in docker-compose.yml docker-compose.ghcr.yml docker-compose.monitoring.yml docker-compose.tor.yml docker/compose/monitoring.yml docker/compose/tor.yml; do
              compose_file="$workspace/$relative_path"
              [ -f "$compose_file" ] || continue
              sed -i -E '\''s/^([[:space:]]*restart:).*/\1 "no"/'\'' "$compose_file"
            done
            echo "SANCTUARY_INSTALL_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          '

      - name: Assign run-specific ports
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/install-ports.log" bash -c '
            cd "$SANCTUARY_INSTALL_WORKSPACE"
            bash scripts/ci/install-test-ports.sh "$PORT_OFFSET"
          '

      - name: Bind runtime images to candidate
        env:
          CANDIDATE_SHA: ${{ needs.validation-info.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          image_lock_sha="$(sha256sum config/container-image-lock.json | cut -d ' ' -f 1)"
          if [[ ! "$image_lock_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Container image lock did not produce a SHA-256 digest"
            exit 1
          fi
          echo "SANCTUARY_SOURCE_COMMIT=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "SANCTUARY_IMAGE_LOCK_SHA256=$image_lock_sha" >> "$GITHUB_ENV"

      - name: Run fresh install test
        run: |
          # Composition: run-with-log → with-runner-lock → time-command → command
          # Logger outermost so lock wait line, time-command output, and
          # wrapped-command output all land in $JOB_LOG_DIR/fresh-install.log.
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/fresh-install.log" \
            scripts/ci/with-runner-lock.sh e2e \
            scripts/ci/time-command.sh "fresh install e2e" \
            scripts/ci/cleanup-ci-callsite.sh run \
              --authority-mode deployment_managed_by_subject \
              --lane rc-fresh-install \
              --checkout-root "$SANCTUARY_INSTALL_WORKSPACE" \
              --runtime "$RUNNER_TEMP/sanctuary-cleanup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/rc-fresh-install" \
              --artifact-dir "$RUNNER_TEMP/sanctuary-cleanup-artifacts/rc-fresh-install" \
              -- bash -c 'cd "$SANCTUARY_INSTALL_WORKSPACE" && ./tests/install/e2e/fresh-install.test.sh --verbose'

      - name: Show container logs on failure
        if: failure()
        run: |
          cd "${SANCTUARY_INSTALL_WORKSPACE:-.}" || true
          echo "=== Container Status ==="
          docker compose ps || true
          echo ""
          echo "=== Database Logs ==="
          docker compose logs --tail 100 postgres 2>&1 || true
          echo ""
          echo "=== Backend Logs ==="
          docker compose logs --tail 100 backend 2>&1 || true
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs --tail 100 frontend 2>&1 || true
          echo ""
          echo "=== Gateway Logs ==="
          docker compose logs --tail 100 gateway 2>&1 || true

      - name: Observe candidate image CVEs
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          CANDIDATE_SHA: ${{ needs.validation-info.outputs.candidate_sha }}
        run: |
          scripts/ci/observe-runtime-image-cves.sh \
            --project "$COMPOSE_PROJECT_NAME" \
            --candidate "$CANDIDATE_SHA" \
            --image-lock config/container-image-lock.json \
            --output "$IMAGE_CVE_REPORT_DIR"

      - name: Enforce candidate image CVE cache cleanup
        if: always()
        run: |
          cleanup_evidence="$IMAGE_CVE_REPORT_DIR/cache-volume-cleanup.json"
          # Socket discovery can fail before a cache volume is attempted; CVE
          # observation remains nonblocking in that case, but it must emit a
          # strict categorical no-attempt result. Missing evidence is ambiguous.
          if [ ! -e "$cleanup_evidence" ]; then
            echo "Runtime image CVE cache cleanup evidence is missing" >&2
            exit 1
          fi
          if ! jq -e '
            type == "object" and
            (keys == ["failureClass", "immutableIdentity", "postcondition", "resourceClass", "result"]) and
            .resourceClass == "compose_volume" and
            (.immutableIdentity | type == "string" and length > 0) and
            .failureClass == "none" and
            ((.result == "absent" and .postcondition == "absent") or
             (.result == "not_attempted" and .immutableIdentity == "unavailable" and
              .postcondition == "not_attempted"))
          ' "$cleanup_evidence" >/dev/null; then
            echo "Runtime image CVE cache cleanup was not proven safe" >&2
            exit 1
          fi

      - name: Post-cleanup diagnostics
        if: always()
        continue-on-error: true
        env:
          SANCTUARY_CI_PROJECT_PREFIXES: sanctuary-rc-fresh-${{ github.run_id }}
        run: |
          scripts/ci/run-with-log.sh "$JOB_LOG_DIR/post-cleanup.log" \
            scripts/ci/write-preflight-diagnostics.sh

      - name: Upload candidate image CVE observation
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: runtime-image-cves-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-evidence/runtime-image-cves/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Verify RC fresh install cleanup receipt
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/rc-fresh-install

      - name: Upload receipt-bound cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: cleanup-rc-fresh-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/rc-fresh-install/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/rc-fresh-install
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Write fresh install diagnostic summary
        if: always()
        continue-on-error: true
        run: scripts/ci/write-diagnostic-summary.sh "$JOB_LOG_DIR" "Release Candidate Fresh Install"

      - name: Upload diagnostic logs
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: diag-fresh-install-${{ github.run_id }}
          path: ${{ env.JOB_LOG_DIR }}
          retention-days: 14
          if-no-files-found: ignore

  # Canonical release evidence note
  # ============================================
  # release-candidate.yml deliberately does NOT duplicate container-health,
  # auth-flow, or upgrade jobs. On prerelease tag pushes, install-test.yml owns those
  # blocking checks and the trusted publisher requires its successful push run
  # at the exact release commit. Manual RC runs are preflight evidence only.

  # Release distribution is intentionally outside Forgejo Actions. After these
  # validation gates pass, the trusted operator command creates matching
  # Forgejo/GitHub Release objects as documented in
  # docs/reference/release-distribution.md.

  # ============================================
  # Validation Summary
  # ============================================
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-22.04
    needs: [validation-info, hardware-compatibility-evidence, unit-tests, fresh-install-test, wallet-sync-replay-images, wallet-sync-live-shape, wallet-sync-maximum-shapes]
    if: always()

    steps:
      - name: Generate validation report
        env:
          CANDIDATE_SHA: ${{ needs.validation-info.outputs.candidate_sha }}
          FRESH_INSTALL_RESULT: ${{ needs.fresh-install-test.result }}
          HARDWARE_EVIDENCE_RESULT: ${{ needs.hardware-compatibility-evidence.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-tests.result }}
          WALLET_SYNC_IMAGE_RESULT: ${{ needs.wallet-sync-replay-images.result }}
          WALLET_SYNC_LIVE_RESULT: ${{ needs.wallet-sync-live-shape.result }}
          WALLET_SYNC_MAX_RESULT: ${{ needs.wallet-sync-maximum-shapes.result }}
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Candidate commit: \`$CANDIDATE_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Test Suite | Result | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|" >> $GITHUB_STEP_SUMMARY

          if [ "$UNIT_TEST_RESULT" = "success" ]; then
            echo "| Unit Tests | :white_check_mark: Passed | ~5s |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FRESH_INSTALL_RESULT" = "success" ]; then
            echo "| Fresh Install E2E | :white_check_mark: Passed | ~5-10m |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Fresh Install E2E | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$HARDWARE_EVIDENCE_RESULT" = "success" ]; then
            echo "| Hardware Compatibility Evidence | :white_check_mark: Passed | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Hardware Compatibility Evidence | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$WALLET_SYNC_IMAGE_RESULT" = "success" ]; then
            echo "| Wallet Sync Build-once OCI Images | :white_check_mark: Passed | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Wallet Sync Build-once OCI Images | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$WALLET_SYNC_LIVE_RESULT" = "success" ]; then
            echo "| Wallet Sync Live Shape + RC10 Control | :white_check_mark: Passed | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Wallet Sync Live Shape + RC10 Control | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$WALLET_SYNC_MAX_RESULT" = "success" ]; then
            echo "| Wallet Sync Maximum Shapes | :white_check_mark: Passed | - |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Wallet Sync Maximum Shapes | :x: Failed | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| Canonical Install/Health/Auth/Upgrade Gate | :hourglass_flowing_sand: Pending same-commit Install Tests | - |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PREFLIGHT_PASSED=true
          if [ "$UNIT_TEST_RESULT" != "success" ] || \
             [ "$FRESH_INSTALL_RESULT" != "success" ] || \
             [ "$HARDWARE_EVIDENCE_RESULT" != "success" ] || \
             [ "$WALLET_SYNC_IMAGE_RESULT" != "success" ] || \
             [ "$WALLET_SYNC_LIVE_RESULT" != "success" ] || \
             [ "$WALLET_SYNC_MAX_RESULT" != "success" ]; then
            PREFLIGHT_PASSED=false
          fi

          if [ "$PREFLIGHT_PASSED" = "true" ]; then
            echo "## :white_check_mark: Release Candidate Preflight Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The retained preflight checks passed for \`$CANDIDATE_SHA\`. This is not release approval." >> $GITHUB_STEP_SUMMARY
            echo "Release remains pending a successful install-test.yml push run for the exact same commit and the trusted publication gate." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Create an RC tag on this exact commit" >> $GITHUB_STEP_SUMMARY
            echo "2. Wait for its release-candidate.yml and install-test.yml push runs" >> $GITHUB_STEP_SUMMARY
            echo "3. Capture and validate the production canary evidence" >> $GITHUB_STEP_SUMMARY
            echo "4. Run npm run release:promote -- --rc-tag <rc> --stable-tag <stable> --receipt <abs> --evidence <abs> --output-dir <abs> --signing-key <abs> --public-key <abs>" >> $GITHUB_STEP_SUMMARY
            echo "5. Run npm run release:publish -- <stable> --candidate <rc> --receipt <abs> --evidence <abs> --rehearsal-manifest <abs> --public-key <abs>" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :stop_sign: Release Candidate Preflight Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Preflight checks failed for \`$CANDIDATE_SHA\`. **Do not release this commit.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review the failed tests and fix issues before attempting release." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check validation result
        env:
          CANDIDATE_SHA: ${{ needs.validation-info.outputs.candidate_sha }}
          FRESH_INSTALL_RESULT: ${{ needs.fresh-install-test.result }}
          HARDWARE_EVIDENCE_RESULT: ${{ needs.hardware-compatibility-evidence.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-tests.result }}
          WALLET_SYNC_IMAGE_RESULT: ${{ needs.wallet-sync-replay-images.result }}
          WALLET_SYNC_LIVE_RESULT: ${{ needs.wallet-sync-live-shape.result }}
          WALLET_SYNC_MAX_RESULT: ${{ needs.wallet-sync-maximum-shapes.result }}
        run: |
          if [ "$UNIT_TEST_RESULT" != "success" ] || \
             [ "$FRESH_INSTALL_RESULT" != "success" ] || \
             [ "$HARDWARE_EVIDENCE_RESULT" != "success" ] || \
             [ "$WALLET_SYNC_IMAGE_RESULT" != "success" ] || \
             [ "$WALLET_SYNC_LIVE_RESULT" != "success" ] || \
             [ "$WALLET_SYNC_MAX_RESULT" != "success" ]; then
            echo "::error::Release candidate preflight failed for $CANDIDATE_SHA."
            exit 1
          fi
          echo "Release candidate preflight passed for $CANDIDATE_SHA; release approval remains pending same-commit Install Tests."
