name: Podman Socket Canary

# Regression canary for the compose/Podman contract the Docker-backed install and
# upgrade lanes depend on: a mountable daemon socket, a working docker-proxy
# against the compat API, reachable published ports, volume uid mapping, and
# healthchecks that survive compose.
#
# Written for #667 to decide whether those lanes could run on rootless Podman at
# all. They can, and #668 converged the whole fleet — so this now guards against
# regression rather than answering an open question.
#
# It runs on whichever runner is free: every runner is rootless Podman and
# carries both `docker` and `docker-socket`, so there is no engine difference
# left to select between. Pass `runner_label` to pin a specific host. There is no
# longer a Docker-in-Docker runner to compare against; the informational
# cmd-array result in probe 6 is what a Docker baseline used to provide.
#
# Every probe is non-fatal and records a diagnostic verdict; the summary decides
# pass/fail, while the coordinator independently gates cleanup success.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label to pin a specific host (default: any Podman runner)'
        required: false
        default: 'docker'
        type: string
      socket_path_override:
        description: 'Try this daemon socket path first (host-side path, resolved by the daemon)'
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/workflows/podman-socket-canary.yml'
      - '.github/actions/upload-cleanup-evidence/**'
      - '.github/actions/verify-cleanup-receipt/**'

# No `permissions:` block: Forgejo Actions does not support it, and
# tests/ci/check-workflow-composition.test.sh enforces its absence. Repository
# workflow permissions are already read-only by policy.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: podman-socket-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket-canary:
    name: Podman socket contract canary
    runs-on: ${{ inputs.runner_label || 'docker' }}
    timeout-minutes: 20
    env:
      PROXY_NAME: podman-canary-proxy-${{ github.run_id }}-${{ github.run_attempt }}
      PG_NAME: podman-canary-pg-${{ github.run_id }}-${{ github.run_attempt }}
      PUB_NAME: podman-canary-pub-${{ github.run_id }}-${{ github.run_attempt }}
      RESULTS: ${{ github.workspace }}/.tmp/canary-results
      SOCKET_PATH_OVERRIDE: ${{ inputs.socket_path_override }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: false

      - name: Initialise result log
        run: |
          mkdir -p "$RESULTS"
          : > "$RESULTS/verdicts.tsv"
          echo "CLEANUP_RUNTIME_ROOT=$RUNNER_TEMP/sanctuary-cleanup/podman-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "CLEANUP_ARTIFACT_ROOT=$RUNNER_TEMP/sanctuary-cleanup-artifacts/podman-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "Recording probe verdicts to $RESULTS/verdicts.tsv"

      # ---------------------------------------------------------------
      # Probe 1 — engine identity
      # Establishes which engine is actually serving the API. Under Podman
      # the server component reports "Podman Engine"; under DIND it reports
      # "Docker Engine". Nothing here should fail on either engine.
      # ---------------------------------------------------------------
      - name: 'Probe 1: engine identity'
        id: identity
        continue-on-error: true
        run: |
          set -x
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          docker version || true
          docker info --format '{{json .}}' 2>/dev/null | head -c 4000 || docker info || true

          server="$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unknown)"
          engine="$(docker version --format '{{.Server.Platform.Name}}' 2>/dev/null || echo unknown)"
          echo "server_version=$server" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          printf 'identity\tpass\t%s / %s\n' "$engine" "$server" >> "$RESULTS/verdicts.tsv"

      # ---------------------------------------------------------------
      # Probe 2 — can the daemon socket be bind-mounted into a container?
      # Resolve the daemon-side socket path and prove it is mountable.
      # ---------------------------------------------------------------
      - name: 'Probe 2: socket bind-mount into a container'
        id: mount
        continue-on-error: true
        run: |
          scripts/ci/cleanup-ci-callsite.sh run --engine docker --lane podman-canary-mount \
            --checkout-root "$GITHUB_WORKSPACE" --runtime "$CLEANUP_RUNTIME_ROOT/mount" \
            --artifact-dir "$CLEANUP_ARTIFACT_ROOT/mount" \
            -- bash -euo pipefail <<'SUBJECT'
          set -x
          source scripts/ownership/producer-hooks.sh
          ownership_label_args compose_container exact_delete
          container_labels=("${OWNERSHIP_LABEL_ARGS[@]}")
          # The daemon resolves -v sources on the host, so try the known rootless
          # Podman path before the Docker default and report which one worked.
          candidates="${SOCKET_PATH_OVERRIDE:-} /run/user/1001/podman/podman.sock /var/run/docker.sock"
          echo "DOCKER_HOST as seen from the job: ${DOCKER_HOST:-<unset>}"

          found=""
          for sock in $candidates; do
            [ -n "$sock" ] || continue
            echo "--- trying $sock"
            if docker run --rm "${container_labels[@]}" -v "$sock:/var/run/docker.sock:ro" \
                docker.io/library/alpine:3.20 test -S /var/run/docker.sock; then
              found="$sock"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "socket_path=$found" >> "$GITHUB_OUTPUT"
            printf 'socket-mount\tpass\tmountable at %s\n' "$found" >> "$RESULTS/verdicts.tsv"
          else
            echo "socket_path=" >> "$GITHUB_OUTPUT"
            printf 'socket-mount\tFAIL\tnone of [%s] mountable — check valid_volumes\n' \
              "$candidates" >> "$RESULTS/verdicts.tsv"
            exit 1
          fi
          SUBJECT

      # ---------------------------------------------------------------
      # Probe 3 — docker-socket-proxy against the compat API
      # The decisive probe. Mirrors the exact permission set from
      # docker-compose.yml:756-777 and exercises the endpoints the stack
      # relies on. tecnativa/docker-socket-proxy is HAProxy filtering Docker
      # API paths; Podman implements most Docker REST endpoints but not all.
      # Expected: /containers/json and /images/json return 200,
      # /volumes and /info return 403 (denied by policy, not missing).
      # ---------------------------------------------------------------
      - name: 'Probe 3: docker-socket-proxy against compat API'
        id: proxy
        continue-on-error: true
        env:
          CANARY_SOCKET_PATH: ${{ steps.mount.outputs.socket_path }}
        run: |
          scripts/ci/cleanup-ci-callsite.sh run --engine docker --lane podman-canary-proxy \
            --checkout-root "$GITHUB_WORKSPACE" --runtime "$CLEANUP_RUNTIME_ROOT/proxy" \
            --artifact-dir "$CLEANUP_ARTIFACT_ROOT/proxy" \
            -- bash -euo pipefail <<'SUBJECT'
          set -x
          source scripts/ownership/producer-hooks.sh
          ownership_label_args compose_container exact_delete
          container_labels=("${OWNERSHIP_LABEL_ARGS[@]}")
          sock="${CANARY_SOCKET_PATH}"
          # Guard: without a mountable socket this probe cannot run at all, and
          # an empty -v source produces a confusing docker error instead of a
          # verdict (run 8602 produced no proxy line for exactly this reason).
          if [ -z "$sock" ]; then
            printf 'proxy-start\tSKIP\tno mountable socket from probe 2\n' >> "$RESULTS/verdicts.tsv"
            exit 0
          fi
          docker run -d "${container_labels[@]}" --name "$PROXY_NAME" \
            -e CONTAINERS=1 -e POST=1 -e IMAGES=1 -e NETWORKS=1 \
            -e VOLUMES=0 -e EXEC=0 -e SWARM=0 -e NODES=0 -e SERVICES=0 \
            -e TASKS=0 -e SECRETS=0 -e CONFIGS=0 -e PLUGINS=0 -e SYSTEM=0 \
            -e DISTRIBUTION=0 -e AUTH=0 -e BUILD=0 -e COMMIT=0 -e EVENTS=0 \
            -e INFO=0 -e VERSION=0 \
            -v "$sock:/var/run/docker.sock:ro" \
            docker.io/tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459

          # Give HAProxy a moment, then confirm it stayed up.
          for _ in $(seq 1 15); do
            state="$(docker inspect -f '{{.State.Running}}' "$PROXY_NAME" 2>/dev/null || echo false)"
            [ "$state" = "true" ] && break
            sleep 1
          done
          docker logs "$PROXY_NAME" 2>&1 | tail -30 || true

          if [ "$(docker inspect -f '{{.State.Running}}' "$PROXY_NAME" 2>/dev/null)" != "true" ]; then
            printf 'proxy-start\tFAIL\tproxy container did not stay running\n' >> "$RESULTS/verdicts.tsv"
            exit 1
          fi
          printf 'proxy-start\tpass\t\n' >> "$RESULTS/verdicts.tsv"

          probe() {
            name="$1"; path="$2"; want="$3"
            code="$(docker run --rm "${container_labels[@]}" --network "container:$PROXY_NAME" docker.io/curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b \
              -s -o /dev/null -w '%{http_code}' --max-time 15 \
              "http://127.0.0.1:2375${path}" || echo 000)"
            echo "$name -> $code (want $want)"
            if [ "$code" = "$want" ]; then
              printf 'api%s\tpass\t%s returned %s\n' "$name" "$path" "$code" >> "$RESULTS/verdicts.tsv"
            else
              printf 'api%s\tFAIL\t%s returned %s, wanted %s\n' \
                "$name" "$path" "$code" "$want" >> "$RESULTS/verdicts.tsv"
            fi
          }

          # Allowed by the permission set above.
          probe '-containers' '/v1.41/containers/json' 200
          probe '-images'     '/v1.41/images/json'     200
          probe '-networks'   '/v1.41/networks'        200
          # Denied by policy — a 403 proves the filter works rather than the
          # endpoint being absent. A 404 here means Podman lacks the endpoint.
          probe '-volumes'    '/v1.41/volumes'         403
          probe '-info'       '/v1.41/info'            403
          SUBJECT

      # ---------------------------------------------------------------
      # Probe 4 — port publishing
      # Rootless publishing differs from rootful; counting-cats needed
      # COUNTING_CATS_DOCKER_PUBLISHED_HOST_OVERRIDE with
      # host.containers.internal for exactly this. The install lanes assign
      # per-workspace port offsets and then reach the stack over them.
      # ---------------------------------------------------------------
      - name: 'Probe 4: published port reachable from the job'
        continue-on-error: true
        run: |
          scripts/ci/cleanup-ci-callsite.sh run --engine docker --lane podman-canary-publish \
            --checkout-root "$GITHUB_WORKSPACE" --runtime "$CLEANUP_RUNTIME_ROOT/publish" \
            --artifact-dir "$CLEANUP_ARTIFACT_ROOT/publish" \
            -- bash -euo pipefail <<'SUBJECT'
          set -x
          source scripts/ownership/producer-hooks.sh
          ownership_label_args compose_container exact_delete
          pub_port="$((20000 + (GITHUB_RUN_ID % 20000)))"
          docker run -d "${OWNERSHIP_LABEL_ARGS[@]}" --name "$PUB_NAME" -p "${pub_port}:80" docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ok=false
          for host in 127.0.0.1 host.containers.internal host.docker.internal; do
            for _ in $(seq 1 10); do
              if curl -fsS --max-time 3 "http://${host}:${pub_port}/" >/dev/null 2>&1; then
                echo "reachable via $host"
                printf 'port-publish\tpass\treachable via %s\n' "$host" >> "$RESULTS/verdicts.tsv"
                ok=true
                break 2
              fi
              sleep 2
            done
          done
          if [ "$ok" != true ]; then
            printf 'port-publish\tFAIL\tpublished port not reachable on any candidate host\n' \
              >> "$RESULTS/verdicts.tsv"
            exit 1
          fi
          SUBJECT

      # ---------------------------------------------------------------
      # Probe 5 — volume uid mapping
      # Postgres is the classic rootless biter: the entrypoint chowns its data
      # directory, which fails under an unexpected userns mapping. The stack
      # runs postgres:16-alpine, so test that exact image.
      # ---------------------------------------------------------------
      - name: 'Probe 5: postgres on a named volume (uid mapping)'
        continue-on-error: true
        run: |
          scripts/ci/cleanup-ci-callsite.sh run --engine docker --lane podman-canary-volume \
            --checkout-root "$GITHUB_WORKSPACE" --runtime "$CLEANUP_RUNTIME_ROOT/volume" \
            --artifact-dir "$CLEANUP_ARTIFACT_ROOT/volume" \
            -- bash -euo pipefail <<'SUBJECT'
          set -x
          source scripts/ownership/producer-hooks.sh
          ownership_label_args compose_volume exact_delete
          create_and_register_owned_volume "$PG_NAME" "${OWNERSHIP_LABEL_ARGS[@]}"
          ownership_label_args compose_container exact_delete
          docker run --rm -d "${OWNERSHIP_LABEL_ARGS[@]}" --name "$PG_NAME" \
            -e POSTGRES_PASSWORD=canary \
            -e POSTGRES_USER=canary \
            -e POSTGRES_DB=canary \
            -v "$PG_NAME:/var/lib/postgresql/data" \
            docker.io/library/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777

          stop_postgres() {
            docker exec -u postgres "$PG_NAME" \
              pg_ctl -D /var/lib/postgresql/data -m fast stop >/dev/null 2>&1 || true
            for _ in $(seq 1 30); do
              docker inspect "$PG_NAME" >/dev/null 2>&1 || return 0
              sleep 0.2
            done
          }
          trap stop_postgres EXIT

          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$PG_NAME" pg_isready -U canary >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          docker logs "$PG_NAME" 2>&1 | tail -30 || true

          if [ "$ready" = true ]; then
            printf 'pg-volume\tpass\tpostgres reached ready on a named volume\n' >> "$RESULTS/verdicts.tsv"
          else
            printf 'pg-volume\tFAIL\tpostgres never became ready — check userns/uid mapping\n' \
              >> "$RESULTS/verdicts.tsv"
            exit 1
          fi
          SUBJECT

      # ---------------------------------------------------------------
      # Probe 6 — compose healthcheck shell form
      # CMD-SHELL is the production contract and is gating. CMD+sh -c remains
      # informational because Podman's compat path may truncate shell syntax.
      # ---------------------------------------------------------------
      - name: 'Probe 6: compose healthcheck shell form'
        continue-on-error: true
        run: |
          scripts/ci/cleanup-ci-callsite.sh run --engine docker --lane podman-canary-health \
            --checkout-root "$GITHUB_WORKSPACE" --runtime "$CLEANUP_RUNTIME_ROOT/health" \
            --artifact-dir "$CLEANUP_ARTIFACT_ROOT/health" \
            -- bash -euo pipefail <<'SUBJECT'
          set -x
          cat > /tmp/hc-canary.yml <<'COMPOSE'
          x-container-ownership: &container-ownership
            io.sanctuary.project: "${SANCTUARY_PROJECT}"
            io.sanctuary.deployment-id: "${SANCTUARY_DEPLOYMENT_ID}"
            io.sanctuary.owner-id: "${SANCTUARY_OWNER_ID}"
            io.sanctuary.resource-class: compose_container
            io.sanctuary.lifecycle: "${SANCTUARY_RESOURCE_LIFECYCLE}"
            io.sanctuary.cleanup-policy: exact_delete
            io.sanctuary.created-at: "${SANCTUARY_CLEANUP_CREATED_AT}"
            io.sanctuary.created-by-release: "${SANCTUARY_RELEASE}"
            io.sanctuary.created-by-commit: "${SANCTUARY_COMMIT}"
            io.sanctuary.creation-run-id: "${SANCTUARY_OPERATION_RUN_ID}"
          services:
            hcshell:
              image: docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
              environment:
                TLS_ENABLED: "true"
              command: ["sleep", "180"]
              network_mode: none
              labels: *container-ownership
              healthcheck:
                test: ["CMD-SHELL", 'if [ "$$TLS_ENABLED" = "true" ]; then exit 0; else exit 1; fi']
                interval: 5s
                timeout: 5s
                retries: 3
                start_period: 2s
            hcarray:
              image: docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
              environment:
                TLS_ENABLED: "true"
              command: ["sleep", "180"]
              network_mode: none
              labels: *container-ownership
              healthcheck:
                test: ["CMD", "sh", "-c", 'if [ "$$TLS_ENABLED" = "true" ]; then exit 0; else exit 1; fi']
                interval: 5s
                timeout: 5s
                retries: 3
                start_period: 2s
          COMPOSE

          docker compose -f /tmp/hc-canary.yml -p "$COMPOSE_PROJECT_NAME" up -d

          # Poll for up to 60s; a healthcheck needs several intervals to settle.
          settle() {
            svc="$1"
            for _ in $(seq 1 12); do
              st="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                    "${COMPOSE_PROJECT_NAME}-${svc}-1" 2>/dev/null || echo missing)"
              [ "$st" = "healthy" ] && break
              sleep 5
            done
            echo "$st"
          }

          shell_state="$(settle hcshell)"
          array_state="$(settle hcarray)"
          docker inspect -f '{{range .State.Health.Log}}exit={{.ExitCode}} out={{.Output}}{{end}}' \
            "${COMPOSE_PROJECT_NAME}-hcarray-1" 2>/dev/null | head -c 300 || true

          if [ "$shell_state" = "healthy" ]; then
            printf 'healthcheck-cmd-shell\tpass\tconditional survived, container healthy\n' >> "$RESULTS/verdicts.tsv"
          else
            printf 'healthcheck-cmd-shell\tFAIL\tCMD-SHELL conditional did not go healthy (state: %s) — docker-compose.yml depends on this form\n' \
              "$shell_state" >> "$RESULTS/verdicts.tsv"
          fi

          # Informational only: never fails the canary.
          printf 'healthcheck-cmd-array\tinfo\tCMD+sh -c conditional state: %s (unhealthy here means this engine has the truncation quirk)\n' \
            "$array_state" >> "$RESULTS/verdicts.tsv"
          SUBJECT

      # ---------------------------------------------------------------
      # Verdict
      # ---------------------------------------------------------------
      - name: Canary verdict
        if: always()
        env:
          # Never interpolate ${{ }} directly into run: — runner_label is a
          # dispatch input and would be a shell-injection vector.
          CANARY_RUNNER_LABEL: ${{ inputs.runner_label || 'docker' }}
          CANARY_ENGINE: ${{ steps.identity.outputs.engine }}
          CANARY_SERVER_VERSION: ${{ steps.identity.outputs.server_version }}
        run: |
          {
            echo "## Podman socket canary"
            echo
            echo "- runner label: \`${CANARY_RUNNER_LABEL}\`"
            echo "- engine: \`${CANARY_ENGINE}\`"
            echo "- server version: \`${CANARY_SERVER_VERSION}\`"
            echo
            echo "| probe | verdict | detail |"
            echo "|---|---|---|"
            if [ -s "$RESULTS/verdicts.tsv" ]; then
              while IFS=$'\t' read -r probe verdict detail; do
                echo "| \`$probe\` | $verdict | ${detail:-—} |"
              done < "$RESULTS/verdicts.tsv"
            else
              echo "| — | no probes recorded | canary aborted before probe 1 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$RESULTS/verdicts.tsv" || true
          if grep -q 'FAIL' "$RESULTS/verdicts.tsv" 2>/dev/null; then
            echo "::error::One or more probes failed — see the summary table. This is a"
            echo "::error::diagnosis, not a build break: record the failing probes on issue #667."
            exit 1
          fi
          echo "All probes passed. The compose socket contract is satisfiable on this runner."

      - name: Upload canary results
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact
        with:
          name: podman-socket-canary-${{ github.run_id }}
          path: .tmp/canary-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify signed cleanup evidence
        id: verify_cleanup_receipt
        if: always()
        uses: ./.github/actions/verify-cleanup-receipt
        with:
          root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/podman-canary-${{ github.run_id }}-${{ github.run_attempt }}
          children: 'true'

      - name: Upload signed cleanup evidence
        if: always() && steps.verify_cleanup_receipt.outcome == 'success'
        uses: ./.github/actions/upload-cleanup-evidence
        with:
          name: podman-canary-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sanctuary-cleanup-artifacts/podman-canary-${{ github.run_id }}-${{ github.run_attempt }}/
          cleanup-root: ${{ runner.temp }}/sanctuary-cleanup-artifacts/podman-canary-${{ github.run_id }}-${{ github.run_attempt }}
          children: 'true'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
