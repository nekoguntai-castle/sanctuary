name: Browser toolchain freshness

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  freshness:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
      - name: Verify freshness checker behavior
        run: bash tests/ci/browser-toolchain-freshness.test.sh
      - name: Compare pinned versions with upstream stable feeds
        env:
          FORGEJO_API_URL: ${{ github.server_url }}/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-browser-toolchain-freshness.mjs .
